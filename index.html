<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stanga">
<meta name="theme-color" content="#0E0F12">
<script>try{var t=localStorage.getItem('stanga.theme');if(t&&t!=='kveld')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stanga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Treningsboka: programmet står trykt på et ark over treningsrommet.
   Blyant (ink) = planlagt, blå penn (pen) = det du har gjort, rød penn (red) = avvik: bom, hoppet over, tiden er ute.
   Skivefargene brukes bare i skivetegningen. Én skriftfamilie, hierarki med størrelse og bredde.
   Utenfor arket (bildet, fanelinja, pausen) gjelder de mørke verdiene. Inne i arket byttes de samme navnene til papirets. */
/* Temaer (Innstillinger → Utseende). Kveldsark er standard. Hvert tema setter de samme navnene:
   edge = kanten på settrutene (minst 3:1 mot arket), kond = kondisjon, rekord = ringen rundt en rekord.
   All tekst har minst 4,5:1 mot arket. */
:root{
  --iron:#0E0F12; --iron-2:#17191D; --iron-3:#24272D; --line:rgba(236,235,230,.16);
  --chalk:#ECEBE6; --chalk-2:#B3B7BE; --chalk-3:#80858E;
  --accent:#9AACFF; --accent-ink:#0E0F12;
  --ok:var(--accent); --ok-ink:var(--accent-ink); --miss:#FF6A55; --amrap:var(--chalk-2);
  --live:#2FB463;   /* grønn prikk: vennen har Sammen åpen nå. Samme i alle temaer */
  --train:#E3B42B; --train-ink:#1A1405;   /* manualen: vennen har en økt i gang */
  /* Arket: Kveldsark, blå penn på mørkt papir */
  --paper:#22252B; --ink:#ECEBE6; --ink-2:#B3B7BE; --ink-3:#959AA3; --rule:#393D45; --edge:#6E737B;
  --pen:#9AACFF; --red:#FF6A55; --field:#1B1E23; --press:#2E3138; --kond:#5CCFBE; --rekord:var(--pen);
  --lift:0 14px 30px -16px rgba(0,0,0,.75),0 1px 3px rgba(0,0,0,.35);
  --p25:#D93A2F; --p20:#2F6FDB; --p15:#E3B42B; --p10:#2E9E5B; --p5:#E6E4DE; --p2:#B8413A; --p1:#A9AEB6;
  --face:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --display:var(--face); --body:var(--face);
  color-scheme:dark;
}
/* Dommerlys: hvitt lys er godkjent, rødt er underkjent. Ferdige sett er fylte hvite ruter. */
:root[data-theme="dommer"]{
  --iron:#0B0B0C; --iron-2:#151517; --iron-3:#222225; --line:rgba(230,228,222,.16);
  --chalk:#E6E4DE; --chalk-2:#ABA9A3; --chalk-3:#8F8D88; --accent:#FFFFFF; --accent-ink:#111112; --miss:#FF5B4A;
  --paper:#1C1C1E; --ink:#E6E4DE; --ink-2:#ABA9A3; --ink-3:#8F8D88; --rule:#343437; --edge:#6E6C68;
  --pen:#FFFFFF; --red:#FF5B4A; --field:#151517; --press:#2C2C30; --kond:#F0B13C; --rekord:#FFFFFF}
/* Skivefarger: blå 20 kg = gjort, rød 25 kg = avvik, gul 15 kg = rekord, grønn 10 kg = kondisjon */
:root[data-theme="skive"]{
  --iron:#0C0E14; --iron-2:#141824; --iron-3:#222838; --line:rgba(238,240,244,.16);
  --chalk:#EEF0F4; --chalk-2:#B0B6C3; --chalk-3:#9098A8; --accent:#6AA5FF; --accent-ink:#0C0E14; --miss:#FF5E52;
  --paper:#1B1F2A; --ink:#EEF0F4; --ink-2:#B0B6C3; --ink-3:#9098A8; --rule:#323848; --edge:#687083;
  --pen:#6AA5FF; --red:#FF5E52; --field:#151924; --press:#2A3040; --kond:#41C985; --rekord:#FFD23F}
/* Monokrom blå: alt i blått, mørkest bak bildet og lysere på arket. Rødt for avvik og gull for hovedknapp og rekord. */
:root[data-theme="blaa"]{
  --iron:#070D1A; --iron-2:#0D1528; --iron-3:#17213A; --line:rgba(220,230,255,.16);
  --chalk:#E8EEFB; --chalk-2:#A9B8D6; --chalk-3:#8796B5; --accent:#8AB4F8; --accent-ink:#070D1A; --miss:#FF6B5E;
  --paper:#16233F; --ink:#E8EEFB; --ink-2:#A9B8D6; --ink-3:#8D9CBB; --rule:#26345A; --edge:#5B6F9A;
  --pen:#8AB4F8; --red:#FF6B5E; --field:#0F1A30; --press:#1F2E52; --kond:#7FD8F5; --rekord:#F2C14E}
:root[data-theme="blaa"] .btn:not(.ghost):not(.danger):not(.list>.btn){background:#F2C14E;color:#1A1405}
/* Grønn ro: grønt (gjort), blått (kondisjon) og blågrønt (rekord). Arkene går svakt fra grønt til blått,
   og all tekst holder 4,5:1 mot begge ender av overgangen. */
:root[data-theme="gronn"]{
  --iron:#07120F; --iron-2:#0C1A17; --iron-3:#16292A; --line:rgba(225,245,238,.16);
  --chalk:#E9F3EF; --chalk-2:#A7C2BA; --chalk-3:#86A29B; --accent:#4ADE80; --accent-ink:#07120F; --miss:#FF6B6B;
  --paper:#13293A; --sheet:linear-gradient(135deg,#12302A,#15243F); --ink:#E9F3EF; --ink-2:#A7C2BA; --ink-3:#8EAAA3; --rule:#264244; --edge:#5F807A;
  --pen:#4ADE80; --red:#FF6B6B; --field:#0E201D; --press:#1D3A3A; --kond:#60A5FA; --rekord:#2DD4BF}
:root[data-theme="gronn"] .btn:not(.ghost):not(.danger):not(.list>.btn){background:linear-gradient(135deg,#4ADE80,#3B82F6);color:#04140C}
/* Lyst ark: det lyse arket fra før, med mørkere grå og synlige kanter */
:root[data-theme="lys"]{
  --paper:#F3F2EE; --ink:#22252A; --ink-2:#5B6068; --ink-3:#686D75; --rule:#D5D7DA; --edge:#878C94;
  --pen:#2343C4; --red:#C9301F; --field:#FBFBF9; --press:#E7E6E1; --kond:#0B7A6C; --rekord:var(--pen)}

/* App-skall: bare innholdet scroller. Fanelinjen er en fast del av oppsettet, ikke position:fixed,
   så iOS ikke kan flytte den når sidehøyden endrer seg mellom faner. */
html{height:100%;box-sizing:border-box}
html,body{background:var(--iron);color:var(--chalk)}
body{height:100%;overflow:hidden;
  font:16px/1.45 var(--face);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
::selection{background:var(--pen);color:var(--paper)}
/* Bakgrunnsbilde: mørkt treningsrom. Ligger på skallet, så det står stille mens innholdet scroller. */
.app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:linear-gradient(rgba(10,11,13,.62),rgba(10,11,13,.88)),url(bg.webp) 78% center/cover no-repeat,var(--iron);
  padding-top:env(safe-area-inset-top,0px);
  /* iOS oppgir av og til en altfor stor bunnsone i hjemskjerm-apper. 34 px er hjemmelinjen på iPhone. */
  padding-bottom:min(env(safe-area-inset-bottom,0px),34px)}
.stage{flex:1 1 auto;min-height:0;position:relative}
/* Tastaturet er oppe i en samtale: skallet følger den synlige delen av skjermen, uten faner og bunnsone */
.app.kb{padding-bottom:0}
.app.kb .tabs{display:none}
.scroller{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
button{font-family:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:20px 112px;
  display:grid;gap:14px}

/* Arket: alt du leser ligger på papir. Samme fargenavn, papirets verdier. */
.ex,.ex-row,.card,.box,.sess,.done,.day,.plist,.bankitem,.sx-card,.sx-news,.sx-list,.act-card,.guide-row,.warn,.ch-msg{
  --chalk:var(--ink); --chalk-2:var(--ink-2); --chalk-3:var(--ink-3); --line:var(--rule);
  --iron:var(--field); --iron-2:var(--paper); --iron-3:var(--press);
  --accent:var(--pen); --accent-ink:var(--paper); --ok:var(--pen); --ok-ink:var(--paper); --miss:var(--red);
  background:var(--sheet,var(--paper));color:var(--ink);border:0;border-radius:3px;box-shadow:var(--lift)}

/* Overskrifter: vanlige bokstaver. Linjen som før sto over tittelen, står under den. */
.eyebrow{font:500 13px/1.3 var(--face);color:var(--chalk-2);margin:0}
h1{font:700 32px/1 var(--face);font-stretch:85%;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font:700 20px/1.15 var(--face);margin:0;text-wrap:balance}
/* Seksjonsoverskrift: h2 for skjermleseren, liten og grå på skjermen */
h2.sec{font:600 13px/1.3 var(--face);color:var(--chalk-2);margin:10px 0 -4px}
/* Overskriften får fokus når en ny side åpnes (se toTop). Den er ikke en knapp, så den trenger ingen ring. */
h1[tabindex="-1"]:focus{outline:none}
p{margin:0}
.muted{color:var(--chalk-2)}
.small{font-size:14px}
.head{display:flex;flex-direction:column;gap:5px;padding-top:4px}
.head>*{order:2}
.head>h1,.head>.h-row{order:0}
.head>.eyebrow{order:1}
.head.h-row{flex-direction:row}
.head.h-row>*{order:0}
.head.h-row>div:first-child{display:flex;flex-direction:column;gap:5px}
.head.h-row>div:first-child>.eyebrow{order:1}

/* Knapper: hovedknappen er kritt på mørkt og blyant på arket. Blått er forbeholdt det du har gjort. */
.btn{appearance:none;border:0;border-radius:4px;background:var(--chalk);color:var(--iron);
  font:600 17px/1 var(--face);padding:16px 18px;width:100%;cursor:pointer}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--chalk);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1px var(--miss);color:var(--miss)}
.btn.sm{font-size:15px;padding:11px 14px;width:auto}
.btn:active:not([disabled]){transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.link{appearance:none;background:none;border:0;color:var(--chalk-2);font:600 15px var(--face);padding:8px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-self:start}

/* Øvelsen: navnet, det store tallet og skivene er én trykkflate som fører inn neste sett */
.ex{padding:14px 16px 16px;display:grid;gap:12px}
.ex-hit{display:grid;gap:4px;margin:-14px -16px 0;padding:14px 16px 0;border-radius:3px 3px 0 0;cursor:pointer;-webkit-user-select:none;user-select:none}
.ex-hit:active{background:var(--press)}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ex-head>div{min-width:0}
.ex-head h2{font-size:19px}
.tag{font:500 13px/1.2 var(--face);color:var(--chalk-2);display:block;white-space:nowrap}
.kg{font:800 40px/.9 var(--face);font-stretch:62%;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.ex.now .kg{font-size:104px;line-height:.8;margin-top:4px;letter-spacing:-.03em}
.kg small{font:600 19px/1 var(--face);font-stretch:75%;color:var(--chalk-2);letter-spacing:0}

/* Settene: én rekke, oppvarmingen mindre og grå, en strek før arbeidssettene */
/* To grupper som brekker hver for seg: oppvarmingen (små, grå) og arbeidssettene. Avstanden mellom dem skiller dem. */
.chips{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start}
.chip-grp{display:flex;flex-wrap:wrap;gap:10px 6px}
.cw{display:grid;justify-items:center;gap:4px}
.cw small{font-size:12px;color:var(--chalk-2);font-variant-numeric:tabular-nums}
.chip{width:50px;height:54px;border-radius:3px;border:1.5px solid var(--edge);background:transparent;color:var(--ink);
  font:700 26px/1 var(--face);font-stretch:70%;font-variant-numeric:tabular-nums;cursor:pointer;position:relative;transition:transform .08s}
.chip:active{transform:scale(.94)}
.chip.next{box-shadow:inset 0 -3px 0 var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent);border-color:var(--ink);color:var(--ink)}
.chip.ok{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 55%,var(--edge))}
.chip.ok::after{content:"";position:absolute;right:5px;top:6px;width:5px;height:9px;border:solid var(--pen);border-width:0 2px 2px 0;transform:rotate(45deg)}
.chip.ok.fresh::after{animation:ink .3s cubic-bezier(.2,.8,.2,1)}
@keyframes ink{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.chip.miss{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,var(--edge))}
.chip.miss::after{border-color:var(--red)}
:root[data-theme="dommer"] .chip.ok{background:var(--pen);color:var(--paper);border-color:var(--pen);box-shadow:0 0 12px -3px rgba(255,255,255,.5)}
:root[data-theme="dommer"] .chip.ok::after{border-color:var(--paper)}
.chip.am{border-style:dashed;border-color:var(--ink-3)}
.chip.am.ok{border-style:solid}
.chip sup{position:absolute;top:6px;left:6px;font-size:12px}
.chip.sm{width:42px;height:44px;font-size:18px;color:var(--ink-2);flex:none;padding-top:6px}
.chip.sm.ok{color:var(--pen)}
.chip.sm.ok::after{right:3px;top:3px;width:3px;height:7px;border-width:0 1.5px 1.5px 0}
.chip-hint{font-size:13px;color:var(--chalk-2);margin:-2px 0 0}
/* Liten telefon: fem arbeidssett får plass på én rad */
@media (max-width:359px){.chip{width:44px}}

.amrap{display:flex;align-items:center;gap:12px;background:var(--press);border-radius:3px;padding:6px 6px 6px 14px}
.amrap span{flex:1;font-size:14px;color:var(--chalk-2)}
.amrap b{font:800 28px/1 var(--face);font-stretch:70%;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.step{width:44px;height:44px;border-radius:3px;border:0;background:var(--paper);color:var(--chalk);font:600 24px/1 var(--face);cursor:pointer;box-shadow:inset 0 0 0 1px var(--rule)}

/* Skiver per side */
.platesrow{display:flex;align-items:center;gap:12px;min-height:30px;color:var(--chalk-2);font-size:13px;flex-wrap:wrap}
.plates{display:flex;align-items:center;gap:2px;height:32px;position:relative;padding-left:16px}
.plates::before{content:"";position:absolute;left:0;top:50%;width:16px;height:5px;margin-top:-2.5px;background:#8E939B;border-radius:1px}
.pl{display:block;border-radius:1px}
.p25{width:9px;height:32px;background:var(--p25)} .p20{width:8px;height:32px;background:var(--p20)}
.p15{width:7px;height:32px;background:var(--p15)} .p10{width:6px;height:32px;background:var(--p10)}
.p5{width:5px;height:20px;background:var(--p5);box-shadow:inset 0 0 0 1px #B7B5AE} .p2{width:4px;height:15px;background:var(--p2)} .p1{width:3px;height:12px;background:var(--p1)}
.pl-txt{font-variant-numeric:tabular-nums}
/* Samme høyde med og uten skiver, så «Bare stanga» og skivene tar like mye plass */
.platebox{padding:8px 0 12px;min-height:61px;border-bottom:1px solid var(--rule)}
.platebox .plates{height:40px;padding-left:20px}
.platebox .plates::before{width:20px;height:6px;margin-top:-3px}
.platebox .p25{width:11px;height:40px} .platebox .p20{width:10px;height:40px} .platebox .p15{width:9px;height:40px} .platebox .p10{width:8px;height:40px}
.platebox .p5{width:6px;height:26px} .platebox .p2{width:5px;height:19px} .platebox .p1{width:4px;height:15px}
.platebox .pl-txt{font:700 18px/1 var(--face);color:var(--chalk)}
.platebox .pl-txt small{font:500 13px var(--face);color:var(--chalk-2);margin-left:6px}

/* Fullført-kortet: det du løftet i blått, rekorder ringet rundt, avvik i rødt */
.done{padding:16px;display:grid;gap:12px}
.done .big{font:800 34px/1 var(--face);font-stretch:68%;font-variant-numeric:tabular-nums}
.notes{list-style:none;margin:0;padding:0;display:grid}
.notes li{display:flex;gap:12px;align-items:baseline;font-size:15px;padding:9px 0;border-top:1px solid var(--rule)}
.notes li b{font-weight:600;min-width:7.5em}
.notes.big li{font-size:17px;padding:11px 0}
.nextup{gap:4px}
.nextup b{font-size:19px}
.notes .up{color:var(--pen)} .notes .down{color:var(--red)} .notes .same,.notes .stage{color:var(--ink-2)}
.prs{display:grid;gap:6px}
.pr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:15px}
.pr b{font-weight:600}
.ring{position:relative;display:inline-block;padding:0 4px;color:var(--rekord);font-weight:700;font-variant-numeric:tabular-nums}
.ring svg{position:absolute;left:-8px;top:-7px;width:calc(100% + 16px);height:calc(100% + 14px);fill:none;stroke:var(--rekord);stroke-width:1.8;overflow:visible}

/* Lister: ett ark med hårstreker mellom radene */
.list{display:grid;gap:0;border-radius:3px;box-shadow:var(--lift);overflow:hidden}
.list>*{border-radius:0;box-shadow:none}
.list>*+*{border-top:1px solid var(--rule)}
.list>.btn,.list>p{background:var(--paper);color:var(--ink);border-radius:0}
.list>.btn.ghost{color:var(--ink);box-shadow:none}
.list>p{padding:10px 16px}
.wrap>.sess+.sess,.wrap>.sx-card+.sx-card{margin-top:-14px;border-top:1px solid var(--rule);border-top-left-radius:0;border-top-right-radius:0}
.wrap>.sess:has(+.sess),.wrap>.sx-card:has(+.sx-card){border-bottom-left-radius:0;border-bottom-right-radius:0}

/* Programkort */
.card{appearance:none;text-align:left;width:100%;padding:14px 16px;display:grid;gap:8px;cursor:pointer;font:inherit}
.card:active{background:var(--press)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 12px/1 var(--face);padding:6px 8px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line);color:var(--chalk-2)}
.pill.on{background:var(--chalk);color:var(--iron);box-shadow:none}
.box{padding:16px;display:grid;gap:10px}
.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.day{padding:12px;display:grid;gap:6px}
.day h3{margin:0;font:700 16px/1.1 var(--face)}
.day div{font-size:14px;display:flex;justify-content:space-between;gap:8px}
.day div span{color:var(--chalk-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.day b{color:var(--ink-2);font-size:12px;margin-right:4px}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:500}
.inp{display:flex;align-items:center;gap:6px;color:var(--chalk-2)}
.inp input{width:92px;background:var(--iron);border:1px solid var(--line);border-radius:3px;color:var(--chalk);
  font:700 21px/1 var(--face);font-stretch:75%;padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}
.inp input:focus{border-color:var(--accent);outline:none}
/* ATHX: skjema og kondisjonsdelen */
.inp input.sm{width:52px}
.inp input[type=date]{width:auto;font:500 16px var(--face);text-align:left}
.ax-two{display:flex;gap:8px;align-items:center}
.ax-cond h2{margin:0}
.ax-lines{margin:0;padding-left:18px;display:grid;gap:4px}
.ax-res{display:grid;gap:8px}
.ax-slow button{flex:1 1 30%;font:600 14px/1.1 var(--face);padding:10px 4px}
.ax-score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ax-score div{display:grid;gap:2px}
.ax-score b{font:800 26px/1 var(--face);font-stretch:68%}
.ax-score span{font-size:12px;color:var(--chalk-2)}

/* Logg */
.sess{padding:14px 16px;display:grid;gap:8px}
.sess .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sess .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sess .ln>span:last-child{color:var(--pen);text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.trend{display:grid;gap:0}
.tr{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr b{flex:1;font-weight:500}
.tr span{font-variant-numeric:tabular-nums;color:var(--chalk-2);font-size:14px;white-space:nowrap}
.tr svg{flex:none}

/* Valg */
.seg{display:flex;gap:4px;flex-wrap:wrap;padding:3px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1 1 56px;border:0;border-radius:3px;padding:11px 0;background:transparent;color:var(--chalk);font:600 16px/1 var(--face);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--iron)}
/* Temavalg: fire kort med fargeprøver fra hvert tema */
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.look-opt{appearance:none;display:grid;gap:8px;text-align:left;min-height:44px;padding:12px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--chalk);font:600 16px/1.2 var(--face);cursor:pointer}
.look-opt small{font:400 13px/1.3 var(--face);color:var(--chalk-2)}
.look-opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--chalk);border-color:var(--chalk)}
.look-opt:last-child:nth-child(odd){grid-column:1/-1}
.look-sw{display:flex;gap:4px}
.look-sw i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
textarea{width:100%;min-height:110px;background:var(--iron);border:1px solid var(--line);border-radius:3px;color:var(--chalk);font:16px/1.4 ui-monospace,Menlo,monospace;padding:10px;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.warn{padding:12px 14px;font-size:14px;color:var(--red)}
/* Feil i et felt: rød kant og teksten rett under feltet (se fieldErr) */
[aria-invalid="true"]{border-color:var(--miss)!important}
.ferr{margin:0;font-size:14px;color:var(--miss);flex:1 1 100%}
/* Bare for skjermleseren */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.empty{display:grid;gap:14px;padding:28px 0}
.empty .bar{height:6px;width:120px;background:var(--chalk-3);border-radius:2px;position:relative;margin:8px 0 6px 18px}
.empty .bar::before,.empty .bar::after{content:"";position:absolute;top:-17px;width:9px;height:40px;border-radius:1px;background:var(--p20)}
.empty .bar::before{left:6px;box-shadow:-11px 0 0 var(--p25)} .empty .bar::after{right:6px;box-shadow:11px 0 0 var(--p25)}

/* Pausen: en linjal som brukes opp. Tiden står stort, rødt de siste sekundene, kritt når den er over. */
.rest{position:absolute;left:0;right:0;z-index:21;bottom:0;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.rest-in{max-width:540px;margin:0 auto 8px;background:rgba(14,15,18,.94);color:var(--chalk);border:1px solid var(--line);border-radius:4px;padding:8px 8px 10px 14px;display:grid;gap:8px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
.rest-r1{display:flex;align-items:center;gap:10px}
.rest-r1>b{font:800 38px/1 var(--face);font-stretch:66%;font-variant-numeric:tabular-nums;min-width:2.6ch;flex:none}
.rest-r1>span{flex:1;min-width:0;font-size:13px;color:var(--chalk-2)}
.rest-r1 button{height:44px;padding:0 12px;border:1px solid var(--line);background:transparent;color:var(--chalk);border-radius:3px;font:600 14px var(--face);cursor:pointer;flex:none}
.ruler{height:10px;position:relative;margin-right:6px;background:repeating-linear-gradient(90deg,var(--chalk-3) 0 1px,transparent 1px 10%)}
.ruler i{position:absolute;left:0;top:3px;height:4px;width:var(--lvl,0%);background:var(--chalk);transition:width .25s linear}
.stage[data-rest="warn"] .rest-r1>b,.stage[data-rest="warn"] .rest-r1>span{color:var(--miss)}
.stage[data-rest="warn"] .ruler i{background:var(--miss)}
.stage[data-rest="over"] .ruler{display:none}
.stage[data-rest="over"] .rest-r1>span{color:var(--chalk)}
/* Klokka i arket: tiden der vekten sto, en tykk strek under som brukes opp. Linjen nederst viser da bare knappene. */
/* Streken har alltid sin plass, så settrutene under ikke flytter seg når pausen starter og slutter */
.rest-bar{visibility:hidden;height:8px;background:var(--rule);position:relative;margin:6px 0 2px}
.rest-bar i{position:absolute;left:0;top:0;bottom:0;width:var(--lvl,0%);background:var(--ink);transition:width .25s linear}
.stage[data-clock] .rest-bar{visibility:visible}
.stage[data-clock] .ex.now .kg small{color:var(--ink)}
/* Under pausen: neste vekt stort helt til høyre i arket, med «Neste» over og kg × reps under */
.stage[data-clock] #kgU{display:grid;gap:3px;align-self:flex-end;min-width:0;margin-left:auto;justify-items:end;text-align:right}
.stage[data-clock] #kgU .nx-l{font:600 12px/1 var(--face);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-2)}
.stage[data-clock] #kgU b{font:800 48px/.85 var(--face);font-stretch:62%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stage[data-clock] #kgU>span:last-child{font-size:16px}
.stage[data-clock][data-rest="warn"] #kgN{color:var(--red)}
.stage[data-clock][data-rest="warn"] .rest-bar i{background:var(--red)}
.stage[data-clock]:not([data-rest="over"]) .rest-r1>b,.stage[data-clock] .ruler{display:none}
.stage[data-clock] .rest-in{gap:0}
.rest-flash{position:absolute;inset:0;z-index:22;pointer-events:none;background:var(--chalk);opacity:0}
.rest-flash.go{animation:restflash .9s ease-out}
@keyframes restflash{0%{opacity:0}15%{opacity:.35}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rest-flash.go{animation:none}}

/* Faner: fire, den valgte har en kritt-strek over */
.tabs{flex:none;background:var(--iron);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;background:none;border:0;color:var(--chalk-3);font:600 11px/1 var(--face);
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--chalk)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:24px;margin-left:-12px;height:2px;background:var(--chalk)}
.tab-badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--miss);color:#fff;font:700 11px/18px var(--face);text-align:center;padding:0 5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:40;background:var(--chalk);color:var(--iron);font-weight:600;padding:10px 16px;border-radius:4px;font-size:14px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
select{background:var(--iron);border:1px solid var(--line);border-radius:3px;color:var(--chalk);font:500 16px var(--face);padding:9px 10px;width:58%;min-width:0}
.swapbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.swapbox>label,.swapbox>span.small{flex:1 1 100%}
.swapbox .inp{flex:1}
.swapbox .txt{flex:1 1 100%;background:var(--iron);border:1px solid var(--line);border-radius:3px;color:var(--chalk);font:500 16px var(--face);padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;color:var(--chalk-2)}
.chk input{width:22px;height:22px;accent-color:var(--ink)}
.bankctl{display:grid;gap:10px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.randlbl{font:600 13px/1.2 var(--face);color:var(--chalk-2);margin:0}
.quick2 .btn{font-size:16px}
.selrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.selrow select{width:100%;max-width:none;font-size:16px;padding:10px 8px}
.bankctl .txt,.wodbox .txt{width:100%;background:var(--iron);border:1px solid var(--line);border-radius:3px;color:var(--chalk);font:500 16px var(--face);padding:11px 12px}
.bankitem{appearance:none;text-align:left;width:100%;padding:14px 16px;display:grid;gap:8px;cursor:pointer;font:inherit}
.bankitem:active{background:var(--press)}
.bi-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bi-top b{font:700 17px/1.15 var(--face);min-width:0;overflow-wrap:anywhere}
.bi-top span{color:var(--pen);font-weight:600;white-space:nowrap}
.bi-txt{white-space:pre-line;color:var(--chalk-2);font-size:14px;overflow-wrap:anywhere}
.wodtxt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.5 var(--face);color:var(--chalk)}
.wodtxt.small{font-size:14px;color:inherit}
.plan-mc{display:grid;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line, color-mix(in srgb,currentColor 15%,transparent))}
.wodbox{gap:10px}
.wodbox h2{font-size:20px}
.wodbox .top{display:flex;justify-content:space-between;align-items:center}
.prev{display:grid;gap:4px}
.prev .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--chalk-2);font-variant-numeric:tabular-nums}
.sess-wod{display:grid;gap:4px}
.sess-wod p{font-size:15px}
.sess-wod .res{color:var(--pen);font-weight:600}
.sess-wod summary{cursor:pointer;color:var(--chalk-2);font-size:13px}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:-6px}
.quick{border:1px solid var(--line);background:rgba(14,15,18,.55);color:var(--chalk);border-radius:4px;padding:10px 14px;font:600 14px var(--face);cursor:pointer}
.quick:active{background:var(--iron-3)}
.adj summary{cursor:pointer;color:var(--chalk-2);font-weight:600;padding:2px 0}
.adj[open] summary{margin-bottom:6px}
.notebox{gap:12px}
.notebox textarea{min-height:88px;font:16px/1.45 var(--face)}
.lbl{font:600 13px/1.2 var(--face);color:var(--chalk-2)}
/* Bryter med tilstanden skrevet ut: «På» eller «Av» ved siden av */
.sw{appearance:none;width:100%;display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 0;background:none;border:0;color:var(--chalk);font:600 15px/1.25 var(--face);text-align:left;cursor:pointer}
.sw>span{flex:1;min-width:0}
.sw b{font:600 13px var(--face);color:var(--chalk-2)}
.sw i{flex:none;width:46px;height:28px;border-radius:14px;border:1.5px solid var(--edge);position:relative}
.sw i::after{content:"";position:absolute;top:4px;left:4px;width:17px;height:17px;border-radius:50%;background:var(--chalk-2);transition:transform .15s}
.sw[aria-checked="true"] i{background:var(--chalk);border-color:var(--chalk)}
.sw[aria-checked="true"] i::after{transform:translateX(18px);background:var(--iron)}
.sw[aria-checked="true"] b{color:var(--chalk)}
@media (prefers-reduced-motion:reduce){.sw i::after{transition:none}}
.kbox{display:grid;gap:10px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tog{justify-self:start;border:1px solid var(--line);background:transparent;color:var(--chalk);border-radius:4px;padding:10px 14px;font:600 14px var(--face);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--iron)}
.pill.mc{justify-self:start}
.sess-note{display:grid;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.sess-note p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.wu{font-size:14px;color:var(--chalk-2);font-variant-numeric:tabular-nums;margin:0}
.wu b{color:var(--chalk);font-weight:600;margin-right:8px}
.rpe{display:grid;gap:8px}
.rpe>span{font-size:14px;color:var(--chalk-2)}
.rpe .seg button{font-size:15px;padding:11px 4px;flex:1 1 30%}
.rpe .seg.num button{flex:1 1 30px;font-size:16px}
.day .xs{color:var(--chalk-2);font-size:13px}

/* Metcon-logg */
.mc-sum{display:flex;gap:16px}
.mc-sum>div{flex:1;display:grid;gap:2px}
.mc-sum b{font:800 30px/1 var(--face);font-stretch:68%;font-variant-numeric:tabular-nums}
.mc-sum span{font-size:13px;color:var(--chalk-2)}
.meter{height:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.over{background:var(--miss)}
.mc-form{display:grid;gap:10px;padding-top:4px}
.mc-type button{display:grid;gap:3px;padding:10px 8px;flex:1 1 45%;text-align:left}
.mc-type button b{font:700 15px/1 var(--face)}
.mc-type button small{font:500 12px/1.25 var(--face);color:inherit;opacity:.75}
.x{appearance:none;border:0;background:none;color:var(--chalk-3);font:600 22px/1 var(--face);padding:4px 6px;cursor:pointer}
.warn-t{color:var(--miss)} .ok-t{color:var(--accent)}

/* Valg om lett uke */
.dl .tr span{font-size:13px}
.crit{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--chalk-2)}

/* Programguide: evidensnivå som grå bokstaver, sikrest fylt */
.guide{gap:12px}
.gk{display:grid;gap:3px}
.gk>span{font:600 13px/1.2 var(--face);color:var(--chalk-2)}
.gk p{font-size:15px}
/* Hvor starter du? Tre valg som radioknapper. Valgt har en fylt prikk i blyant, fordi det er planen, ikke noe du har gjort. */
.start{gap:0;padding:2px 14px}
.start button{appearance:none;width:100%;text-align:left;font:inherit;color:var(--chalk);background:none;border:0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;min-height:58px;padding:8px 0;cursor:pointer}
.start button:last-child{border-bottom:0}
.start button>span{display:grid;gap:2px;min-width:0}
.start small{color:var(--chalk-2);font-size:13px}
.start i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--edge)}
.start [aria-checked="true"] i{border-color:var(--ink);background:radial-gradient(circle,var(--ink) 0 4px,transparent 5px)}
/* Bakgrunnsstoffet om et program: én rad som åpnes */
.about{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.about>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;font-weight:600}
.about>summary::-webkit-details-marker{display:none}
.about>summary::after{content:"+";font:500 22px/1 var(--face);color:var(--chalk-2)}
.about[open]>summary::after{content:"−"}
.about-in{display:grid;gap:14px;padding-bottom:16px}
.acc{gap:12px}
.acc summary{cursor:pointer;font:700 16px/1.2 var(--face);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font:500 22px/1 var(--face);color:var(--chalk-2)}
.acc[open] summary::after{content:"−"}
.claims{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.claims li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.lvl{flex:none;width:22px;height:22px;border-radius:2px;display:grid;place-items:center;font:700 12px/1 var(--face);margin-top:1px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-3)}
.lvl-A{background:var(--ink);color:var(--paper);box-shadow:none}
.lvl-B{background:var(--press);box-shadow:inset 0 0 0 1px var(--ink-2)}
.lvl-C{background:transparent}
.lvl-H{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-2)}
.refs{color:var(--chalk-3);font-size:13px}
.refs a,.reflist a{color:var(--chalk-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.reflist{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--chalk-2)}
.link.inl{padding:0;font-size:inherit;text-decoration:underline;display:inline}

/* Hele planen: gjort i blått, hoppet over strøket i rødt, neste markert med blå strek */
.plan-s summary{align-items:flex-start}
.ps{display:grid;gap:3px;min-width:0;flex:1}
.ps-top{display:flex;align-items:center;gap:8px}
.ps-top b{font:700 16px/1.15 var(--face)}
.ps>span:not(.ps-top){font:400 14px/1.35 var(--face)}
.ps .pill{font:600 12px/1 var(--face)}
.plan-s.done-s .ps>span:last-child{color:var(--pen)}
.plan-s.done-s .ps-top .pill{color:var(--pen);box-shadow:none;padding-left:0}
/* Hoppet over er et valg, ikke et avvik: strøket over i grå blyant. Rødt er bare for bom. */
.plan-s.skip-s .ps-top b{text-decoration:line-through;text-decoration-color:var(--ink-3);text-decoration-thickness:1.5px;color:var(--ink-2)}
.plan-s.skip-s .ps-top .pill{color:var(--ink-2);box-shadow:none;padding-left:0}
.plan-s.next-s{box-shadow:inset 0 -3px 0 var(--ink),var(--lift);background:color-mix(in srgb,var(--ink) 5%,var(--paper))}
.list>.plan-s.next-s{box-shadow:inset 0 -3px 0 var(--ink)}
.plan-ex{display:grid;gap:6px}
.plan-ex .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.plan-ex .ln>span:last-child{color:var(--chalk-2);text-align:right;font-variant-numeric:tabular-nums}
.plan-s.done-s .plan-ex .ln>span:last-child{color:var(--pen)}

/* Egne programmer: redigering, hviledag og deling */
#peName,.pe-day .txt,.pe-add .txt{width:100%;background:var(--iron);border:1px solid var(--line);border-radius:3px;color:var(--chalk);font:500 16px var(--face);padding:11px 12px}
.pe-dh{display:flex;align-items:center;gap:8px}
.pe-dh .txt{flex:1;font-weight:700}
.pe-ex{display:grid;gap:2px;text-align:left;width:100%;border:0;border-radius:4px;padding:10px 12px;background:var(--field);color:var(--chalk);font:inherit;cursor:pointer}
.pe-ex small,.pe-ex-h small{color:var(--chalk-2);font-size:13px}
.pe-ex.open{display:grid;gap:12px;cursor:default;box-shadow:inset 0 0 0 1px var(--line)}
.pe-ex-h{display:grid;gap:2px;text-align:left;border:0;background:none;color:var(--chalk);font:inherit;padding:0;cursor:pointer}
.pe-f{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pe-f.col{display:grid;justify-content:stretch;gap:6px}
.pe-f > span{font-size:14px;color:var(--chalk-2)}
.pe-step{display:flex;align-items:center;gap:10px}
.pe-step b{min-width:2ch;text-align:center;font:800 22px/1 var(--face);font-variant-numeric:tabular-nums}
.seg.wrap button{flex:1 1 64px}
.pe-acts{gap:8px;flex-wrap:wrap}
.pe-add{display:grid;gap:8px}
.pe-wd{display:grid;gap:0}
.pe-wd select{min-width:9em}
.pe-pacts{display:flex;flex-wrap:wrap;gap:8px}
.lib-hit.own b{font-weight:600}
.rest-day{gap:4px}
.ps-acts{justify-content:flex-end;gap:8px;padding:0 12px 10px}
.sx-list .plan-ex{padding:4px 14px 10px}
/* Øvelsesbiblioteket: treff under «+ Egen øvelse» */
.lib-res{display:grid;gap:4px;align-self:stretch;width:100%}
.lib-hit{display:grid;gap:2px;text-align:left;width:100%;border:0;border-radius:4px;padding:10px 12px;background:var(--field);color:var(--chalk);font:inherit;cursor:pointer}
.lib-hit small{color:var(--chalk-2);font-size:13px}
/* Fjern en øvelse fra dagens økt */
.ex-rm-l{align-self:flex-start;color:var(--chalk-2);font-size:14px}
.ex-rm{display:grid;gap:10px;padding:12px;border-radius:4px}
.rm-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
/* Bytte en øvelse i dagens økt */
.ex-acts{display:flex;flex-wrap:wrap;gap:6px 20px}
.ex-sw{display:grid;gap:8px;padding:12px;border-radius:4px}
.ex-sw .lbl{margin-top:4px}
.ex-sw-pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
/* Pete Plan */
.pp-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pp-mach{display:flex;gap:4px;padding:3px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
.pp-mach button{flex:1;border:0;border-radius:3px;padding:10px 4px;background:transparent;color:var(--chalk);font:600 15px/1 var(--face);cursor:pointer}
.pp-mach button[aria-pressed="true"]{background:var(--chalk);color:var(--iron)}
.pp-facts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pp-facts div{padding:8px 10px 8px 0;display:grid;gap:2px;min-width:0}
.pp-facts div+div{border-left:1px solid var(--line);padding-left:10px}
.pp-facts b{font:800 24px/1 var(--face);font-stretch:68%;font-variant-numeric:tabular-nums}
.pp-facts b.pp-src{font:600 13px/1.25 var(--face)}
.pp-facts span{font-size:12px;color:var(--chalk-2)}
.pp-card .field label small{display:block;font-size:12px;font-weight:400}
.pp-unit button{font-size:15px;padding:10px 6px}
.box .field label small{display:block;font-size:12px;font-weight:400}

/* Økta: fremdrift øverst, ett ark som er «nå», ferdige øvelser som én linje */
.h-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.h-row h1{margin:0}
.h-row>span{font-size:14px;color:var(--chalk-2);white-space:nowrap;padding-bottom:2px;font-variant-numeric:tabular-nums;margin-left:auto}
.h-row.h-end{justify-content:flex-end}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin-top:6px;order:2}
.prog i{display:block;height:3px;background:var(--line);overflow:hidden}
.prog b{display:block;height:100%;background:var(--chalk)}
/* Får ikke settlinja plass ved siden av navnet, går den ned på en egen linje i stedet for å legge seg oppå navnet */
.ex-row{appearance:none;width:100%;text-align:left;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;cursor:pointer;font:inherit}
.ex-row:active{background:var(--press)}
.ex-row .ck{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.ex-row .ck svg{width:18px;height:18px;fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ex-row .ck.miss{box-shadow:inset 0 0 0 1.5px var(--red)}
.ex-row .ck.miss svg{stroke:var(--red);width:14px;height:14px}
.ex-row b{flex:1 1 auto;font:700 16px/1.1 var(--face);min-width:0}
.ex-row span{font-size:14px;color:var(--pen);text-align:right;font-variant-numeric:tabular-nums}
.ex-row>span:last-child{margin-left:auto}
.notebox .lbl,.pp-top .lbl,.after .lbl{font:600 14px/1.2 var(--face);color:var(--chalk-2)}
.ex-line{min-height:52px}
.ex-line small{flex:none;width:4.4em;font:600 13px/1 var(--face);color:var(--chalk-2)}
.ex-line span{font:700 18px/1 var(--face);font-stretch:75%;color:var(--chalk)}
.after-add{display:flex;flex-wrap:wrap;gap:8px}
.after-add .tog{min-height:44px}
.after-add .tog[aria-pressed="true"]{background:var(--press);border-color:var(--ink-3);color:var(--ink)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 20px}
.links .link{min-height:44px}

/* Plan */
.chev{width:18px;height:18px;flex:none;fill:none;stroke:var(--chalk-3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gear{appearance:none;border:1px solid var(--line);background:rgba(14,15,18,.55);color:var(--chalk);border-radius:4px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.act-card{appearance:none;width:100%;text-align:left;font:inherit;padding:16px;display:grid;gap:10px;cursor:pointer}
.act-card:active{background:var(--press)}
.act-card h2{font-size:24px;font-stretch:90%}
.act-card .tag{margin:0}
.act-top,.act-sub{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--chalk-2)}
.act-facts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
.act-facts div{padding:8px 10px 0 0;display:grid;gap:2px;min-width:0}
.act-facts div+div{border-left:1px solid var(--line);padding-left:10px}
.act-facts b{font:800 24px/1 var(--face);font-stretch:68%;font-variant-numeric:tabular-nums}
.act-facts span{font:500 12px/1.2 var(--face);color:var(--chalk-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{min-height:36px;padding:0 12px;border-radius:3px;border:1px solid var(--line);background:rgba(14,15,18,.4);color:var(--chalk);font:600 13px var(--face);cursor:pointer}
.filt button[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--iron)}
.guide-row{appearance:none;width:100%;text-align:left;font:inherit;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.guide-row>svg:first-child{width:22px;height:22px;flex:none;fill:none;stroke:var(--ink-2);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.guide-row>span,.plist button>span{flex:1;display:grid;gap:2px;min-width:0}
.guide-row b{font-weight:600;font-size:15px}
.guide-row small,.plist small{font-size:13px;color:var(--chalk-2)}
.plist{overflow:hidden}
.plist button{appearance:none;width:100%;text-align:left;font:inherit;display:flex;align-items:center;gap:12px;min-height:58px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--chalk);cursor:pointer}
.plist button:last-child{border-bottom:0}
.plist button:active{background:var(--press)}
.plist b{font:700 16px/1.15 var(--face)}

/* Logg */
.head.h-row .quick{flex:none}
.log-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line);padding-bottom:10px}
.log-sum div{display:grid;gap:2px}
.log-sum div+div{border-left:1px solid var(--line);padding-left:10px}
.log-sum b{font:800 30px/1 var(--face);font-stretch:68%;font-variant-numeric:tabular-nums}
.log-sum b small{font-size:14px;color:var(--chalk-2);margin-left:2px}
.log-sum span{font-size:12px;color:var(--chalk-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 0;justify-items:center}
.cal span{font:600 11px/1 var(--face);color:var(--chalk-2);text-align:center}
.cal i{width:26px;height:26px;border-radius:50%;position:relative}
.cal i::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--rule)}
.cal i.st::after{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--pen)}
.cal i.mc{box-shadow:inset 0 0 0 1.5px var(--kond)}
.cal i.both{box-shadow:inset 0 0 0 1.5px var(--kond)}
.cal i.both::after{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--pen)}
.cal i.sk::after{width:12px;height:2px;margin:-1px 0 0 -6px;border-radius:1px;background:var(--ink-3)}
.cal i.today{outline:2px solid var(--ink);outline-offset:1px}
.cal i.fut{opacity:.4}
.cal-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--chalk-2)}
.cal-key span{display:flex;align-items:center;gap:6px}
.cal-key i{width:12px;height:12px;border-radius:50%;position:relative}
.cal-key i.st{background:var(--pen);width:9px;height:9px}
.cal-key i.mc{box-shadow:inset 0 0 0 1.5px var(--kond)}
.cal-key i.sk{width:12px;height:2px;border-radius:1px;background:var(--ink-3)}
.tr .tr-kg{font:800 22px/1 var(--face);font-stretch:68%;color:var(--chalk);min-width:3.2ch;text-align:right}
.tr .tr-d{font-weight:600;font-size:13px;min-width:4ch;text-align:right}
.miss-t{color:var(--miss)}
.sess{padding:0;gap:0;overflow:hidden}
.sess.open{padding-bottom:14px}
.sess.open>:not(.sess-row){margin:0 16px}
.sess.open>.ln,.sess.open>p{margin-top:8px}
.sess-row{appearance:none;width:100%;text-align:left;font:inherit;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;color:var(--chalk);cursor:pointer;min-height:60px}
.sess-row:active{background:var(--press)}
.sess-row .chev{transition:transform .15s}
.sess-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sess-d{width:40px;flex:none;display:grid;justify-items:center;gap:1px}
.sess-d b{font:800 22px/1 var(--face);font-stretch:68%}
.sess-d small{font:600 11px/1 var(--face);color:var(--chalk-2)}
.sess-t{flex:1;display:grid;gap:2px;min-width:0}
.sess-t b{font:700 16px/1.15 var(--face)}
.sess-note .pill{justify-self:start}
.sess-t small{font-size:13px;color:var(--chalk-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Sammen */
.quick.acc{background:var(--chalk);border-color:var(--chalk);color:var(--iron);font-weight:700}
.sx-acts{display:flex;gap:8px;flex:none}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--miss);color:#fff;font:700 12px/1 var(--face);letter-spacing:0}
.sx-h{display:flex;align-items:center;gap:8px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--face)}
.av.sm{width:24px;height:24px;font-size:10px}
.av.live,.av.train{position:relative}
.av.live::after{content:'';position:absolute;right:-1px;bottom:-1px;width:32%;height:32%;min-width:9px;min-height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px var(--paper)}
/* Trener nå: en manual som løftes i hjørnet av bildet */
.av-tr{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--train);color:var(--train-ink);box-shadow:0 0 0 2px var(--paper)}
.av.sm .av-tr{width:16px;height:16px;right:-6px;bottom:-5px}
.av-tr svg{width:80%;height:80%;animation:lift 1.6s ease-in-out infinite;transform-origin:50% 60%}
@keyframes lift{0%,100%{transform:translateY(1.5px) rotate(-14deg)}50%{transform:translateY(-1.5px) rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.av-tr svg{animation:none}}
.sx-news{appearance:none;width:100%;text-align:left;font:inherit;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.sx-news:active,.sx-card.own:active,.sx-hit:active{background:var(--press)}
.sx-news>span:not(.av){flex:1;display:grid;gap:2px;min-width:0}
.sx-news b{font-weight:600;font-size:15px}
.sx-news small{font-size:13px;color:var(--chalk-2)}
.sx-news .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.sx-card{appearance:none;width:100%;text-align:left;font:inherit;display:grid;gap:10px;padding:14px 16px}
.sx-card.own{gap:6px;cursor:pointer}
.sx-card.own .tag{color:var(--pen)}
.sx-card.cancelled{opacity:.6}
.sx-card.cancelled .sx-time{text-decoration:line-through;text-decoration-color:var(--red)}
.sx-card .btn.sm{width:100%}
.sx-hit{appearance:none;background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;display:grid;gap:6px;cursor:pointer;border-radius:3px}
.sx-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sx-top .tag,.sx-hit .tag{margin:0}
.sx-cnt{font-size:13px;font-weight:600;color:var(--chalk-2)}
.sx-time{font:800 30px/1 var(--face);font-stretch:62%;font-variant-numeric:tabular-nums}
.sx-time.sm{font-size:26px}
.sx-who{display:flex;align-items:center;gap:8px;font-size:14px}
.sx-who b{font-weight:600}
.tag.same{color:var(--chalk-2)}
.sx-what{font-weight:600;font-size:16px}
.sx-sub{font-size:13px;color:var(--chalk-2)}
.sx-mine{font-size:14px;padding-top:8px;margin-top:2px;border-top:1px solid var(--rule)}
.sx-mine b{font-weight:600}
.sx-extra{display:grid;gap:4px;padding-top:10px;margin-top:4px;border-top:1px solid var(--rule)}
.sx-mybox .ln{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}
.sx-people{display:flex;flex-wrap:wrap;gap:12px}
.sx-people>span{display:flex;align-items:center;gap:8px;font-size:15px}
.sx-people small{display:block;font-size:12px}
.sx-max{display:grid;gap:4px;padding-top:10px;margin-top:4px;border-top:1px solid var(--rule)}
.sx-prop{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sx-prop:last-child{border-bottom:0}
.sx-prop>span:not(.sx-time):not(.av){flex:1;display:grid;gap:1px;min-width:0}
.sx-prop b{font-weight:600}
.sx-prop small{font-size:13px;color:var(--chalk-2);overflow-wrap:anywhere}
.sx-prop .sx-time{font-size:26px}
.sx-form{display:grid;gap:14px}
.sx-form .lbl{display:grid;gap:6px}
.sx-form p.lbl{margin:0 0 8px}
.sx-form input[type=time],.sx-form .txt{width:100%;background:var(--iron);border:1px solid var(--line);border-radius:3px;color:var(--chalk);font:500 16px var(--face);padding:12px 14px;min-height:48px;letter-spacing:0}
.sx-form input[type=time]{font:800 26px/1 var(--face);font-stretch:68%;-webkit-appearance:none;appearance:none}
.sx-form .txt:focus,.sx-form input[type=time]:focus{border-color:var(--accent);outline:none}
.sx-form textarea.txt{min-height:90px}
.sx-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sx-fs{border:0;margin:0;padding:0;min-width:0}
.sx-fs legend{padding:0;margin-bottom:8px}
.sx-radio{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:56px;cursor:pointer}
.sx-radio:last-child{border-bottom:0}
.sx-radio input{width:20px;height:20px;accent-color:var(--ink);margin:0;flex:none}
.sx-radio span{display:grid;gap:1px}
.sx-radio b{font-weight:600;font-size:15px}
.sx-radio small{font-size:13px;color:var(--chalk-2)}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;border-radius:4px;padding:3px;box-shadow:inset 0 0 0 1px var(--line);background:rgba(14,15,18,.4)}
.seg2 button{min-height:44px;border:0;border-radius:3px;background:transparent;color:var(--chalk);display:grid;place-items:center;gap:2px;padding:6px;cursor:pointer}
.seg2 button b{font:600 15px/1 var(--face)}
.seg2 button small{font:500 11px var(--face);opacity:.75}
.seg2 button[aria-pressed="true"]{background:var(--chalk);color:var(--iron)}
.box .seg2{background:transparent}
.sx-search{display:flex;align-items:center;gap:8px;background:var(--iron);border:1px solid var(--line);border-radius:3px;padding:0 12px;min-height:48px}
.sx-search:focus-within{border-color:var(--accent)}
.sx-search input{flex:1;min-width:0;background:transparent;border:0;color:var(--chalk);font:500 16px var(--face);outline:none;padding:12px 0}
.sx-list{overflow:hidden}
.sx-row{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
.sx-row:last-child{border-bottom:0}
.sx-row>span:not(.av){flex:1;display:grid;gap:1px;min-width:0}
.sx-row b{font-weight:600;font-size:15px}
.sx-row small{font-size:13px;color:var(--chalk-2)}
.sx-row .st{flex:none;font-size:13px;font-weight:600;color:var(--chalk-2)}
.sx-row .st.ok{color:var(--pen)}
.sx-row .btn.sm{padding:10px 12px;font-size:15px}

/* Sammen: dagens venner og egne timer først. Originalens papir, kritt og Archivo. */
.sx-head{align-items:center}.sx-head .quick{flex:none}
.sx-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-bottom:1px solid var(--line)}
.sx-nav button{min-height:48px;padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-bottom:2px solid transparent;background:none;color:var(--chalk-2);font:500 15px var(--face);cursor:pointer}
.sx-nav button[aria-pressed="true"]{color:var(--chalk);border-bottom-color:var(--chalk);font-weight:600}
.sx-nav .badge{min-width:18px;height:18px;font-size:11px}
.sx-today{gap:12px}.sx-today-title{display:flex;gap:14px;align-items:center}
.sx-today-title>b{font:800 65px/.9 var(--face);font-stretch:68%;letter-spacing:-.02em}
.sx-today-title h2{font-size:23px;line-height:1.15;text-wrap:initial}
.sx-today-people{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--rule)}
.sx-today-people>button{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;gap:8px;padding:0;background:none;border:0;text-align:left;color:var(--ink);font-family:var(--face);cursor:pointer}
.sx-today-people>button>span:not(.av){min-width:0;display:grid;gap:3px}
.sx-today-people b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sx-today-people small{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sx-today-people small.sx-training{color:var(--train)}
.sx-today-people>.sx-today-all{flex:0 0 28px;justify-content:center;font-size:18px}
.sx-news-summary{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;background:none;border:0;padding:0;font:400 13px var(--face);color:var(--chalk-2);text-align:left;cursor:pointer}
.sx-news-summary i{width:5px;height:5px;border-radius:50%;background:var(--red)}.sx-news-summary b{font-weight:600;color:var(--chalk)}.sx-news-summary>span:last-child{margin-left:auto}
.sx-sessions{display:grid;gap:10px;min-width:0}.sx-sessions:focus{outline:none}.sx-sessions .sec{margin:5px 0 0}.sx-sessions .sec:not(:first-child){margin-top:10px}
.sx-session.own{cursor:default}.sx-session .sx-top{gap:8px;align-items:baseline}.sx-session .sx-top .tag{white-space:normal;font-size:12px}.sx-session .sx-top>.sx-sub{text-align:right;font-size:12px}
.sx-session-main{display:flex;align-items:center;gap:14px;min-width:0}.sx-session-main>.sx-time{flex:none;white-space:nowrap}
.sx-session-copy{flex:1;min-width:0;display:grid;gap:3px}.sx-session-copy>b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.sx-session-open{flex:none;width:32px;min-height:44px;border:0;padding:0;background:none;color:var(--ink-2);font:400 24px var(--face);cursor:pointer}
.sx-session-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;margin-top:2px;border-top:1px solid var(--rule)}
.sx-session .sx-session-foot .btn.sm{width:auto;flex:none}.sx-session-foot>.sx-sub{font-size:12px}
.sx-private{width:100%;justify-content:flex-start;background:none;border:0;border-top:1px solid var(--rule);padding-bottom:0;text-align:left;color:var(--ink-2);font:400 13px var(--face);cursor:pointer;min-height:40px}.sx-private svg{width:16px;height:16px;fill:currentColor;flex:none}.sx-private>span:last-child{margin-left:auto}
.sx-section-title{font:700 22px/1.15 var(--face);margin:3px 0 0}.sx-empty{padding-block:12px}
.sx-sheet{position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,560px);max-width:100%;max-height:90dvh;padding:0 0 max(12px,env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;background:var(--iron);color:var(--chalk);box-shadow:0 -16px 60px rgba(0,0,0,.5);overflow:hidden}
.sx-sheet[open]{display:flex;flex-direction:column}.sx-sheet::backdrop{background:rgba(0,0,0,.65)}
.sx-sheet-handle{flex:none;width:34px;height:3px;border-radius:3px;background:var(--chalk-3);margin:9px auto 0}
.sx-sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px;border-bottom:1px solid var(--line)}.sx-sheet-head h2{font-size:23px;font-stretch:85%}.sx-sheet-head h2:focus{outline:none}.sx-sheet-head .link{min-height:44px}
.sx-sheet-body{padding:18px;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;gap:14px}.sx-sheet-body>.head h1{font-size:42px;font-stretch:62%}
.sx-sheet-status{flex:none;padding:10px 18px;background:var(--chalk);color:var(--iron);font-size:14px;font-weight:600}

<script>
/* =====================================================================
   STANGA – treningslogg med lokal lagring
   Tre lag:
   1) MALER   (PROGRAMS)  – programmene slik de er skrevet. Endres aldri.
   2) INSTANS (S.active)  – din kopi: vekter, trinn, hvor langt du har kommet.
   3) LOGG    (S.history) – det du faktisk løftet.
   ===================================================================== */

const KEY = 'stanga.v1';
const APP_VERSION = 98;   // øk ved hver endring. Appen oppdaterer seg selv når tallet på GitHub er høyere.

// Søk på norsk eller engelsk, i navn, utstyr og muskler. Alle ordene må treffe. Navn som starter med søket, kommer først.
const exNorm = t => String(t || '').toLowerCase().replace(/[-,.()/]/g, ' ');
function exSearch(q, n){
  const w = exNorm(q).split(/\s+/).filter(Boolean); if (!w.length) return [];
  const hit = EXLIB.map((r, i) => ({i, name: exNorm(r[0]), all: exNorm(r[0] + ' ' + r[1] + ' ' + r[2] + ' ' + r[3] + ' ' + r[4])}))
    .filter(x => w.every(t => x.all.includes(t)));
  const rank = x => x.name.startsWith(w[0]) ? 0 : x.name.includes(w[0]) ? 1 : 2;
  return hit.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'no')).slice(0, n).map(x => x.i);
}

/* ---------- Strength & Power (12 uker) ----------
   RPE-tabell: andel av 1RM når du tar r reps og har (10 − RPE) reps i reserve.
   Indeks = reps + reps i reserve. Eksempel: 3 reps @ RPE 8 → 5 → 86,3 % av 1RM. */
const RTS = [1,.955,.922,.892,.863,.837,.811,.786,.762,.739,.707,.68];
function pctOf(reps, rpe){
  const r = Math.max(1, reps + (10 - rpe)), lo = Math.floor(r), hi = Math.ceil(r);
  const g = i => RTS[Math.min(i,12) - 1];
  return g(lo) + (g(hi) - g(lo)) * (r - lo);
}
const est1 = (w, reps, rpe) => w / pctOf(reps, rpe);   // estimert 1RM fra ett sett

/* ---------- Cube Method (10 uker) ----------
   Hver uke har hvert løft én rolle. Rollene roterer, så ingen to løft er tunge samme uke.
   Sett skrives som [andel av 1RM, reps, antall sett, maks reps i siste sett?] per bølge. */
const CUBE = {
  rot: [['heavy','expl','rep'], ['expl','rep','heavy'], ['rep','heavy','expl']],   // uke 1, 2, 3 i bølgen × dag
  tag: {heavy:'Tung', expl:'Eksplosiv', rep:'Reps', test:'Test'},
  rest: {heavy:180, expl:90, rep:150, test:240},
  sets: {
    heavy: [[[.8,2,5]], [[.85,2,3]], [[.9,1,1],[.925,1,1],[.95,1,1],[.8,3,1,1]]],
    expl:  [[[.6,3,8]], [[.65,2,6]], [[.7,2,5]]],
    rep:   [[[.7,8,3,1]], [[.8,6,3,1]], [[.85,3,3,1]]]
  },
  test: [[.9,1,1],[.975,1,1],[1.025,1,1]]
};
function cubeSets(list, max){
  const out = [];
  list.forEach(([pc,r,n,am]) => { for (let j = 0; j < n; j++) out.push({t:r, w:r25(max*pc), am: !!(am && j === n-1), d:null}); });
  return out;
}
function buildCube(p, a){
  const i = a.idx, wk = Math.floor(i/3) + 1, day = p.days[i % 3], slot = day.lift, L = sw(a, slot);
  const role = wk === 10 ? 'test' : CUBE.rot[(wk-1) % 3][i % 3], wave = Math.floor((wk-1)/3);
  const sets = cubeSets(role === 'test' ? CUBE.test : CUBE.sets[role][wave], a.e1rm[L]);
  const hint = role === 'expl' ? 'Flytt stanga så raskt du kan. Stopp settet hvis farten faller.'
             : role === 'test' ? 'Tre forsøk: åpning, andre og tredje. Juster vekten etter hvordan forrige løft gikk.' : '';
  return {programId:p.id, day:day.name, sub: wk === 10 ? 'Uke 10 av 10 · Test' : 'Uke ' + wk + ' av 10 · Bølge ' + (wave+1),
    ex:[{key:L, lift:L, slot, part:'cube', sp:1, rest:CUBE.rest[role], tag:CUBE.tag[role], hint, sets}], started:Date.now()};
}
function progressCube(p, a, s){
  const e = s.ex[0], name = liftName(e.lift), notes = [];
  if (e.tag === 'Test') {
    const ok = e.sets.filter(x => x.d >= 1);
    if (ok.length) {
      const best = Math.max(...ok.map(x => x.w)), old = a.e1rm[e.lift];
      a.e1rm[e.lift] = Math.max(best, old);
      notes.push({name, text: best > old ? 'Ny 1RM: ' + fmt(old) + ' → ' + fmt(best) + ' kg' : 'Beste løft ' + fmt(best) + ' kg, 1RM står på ' + fmt(old) + ' kg', kind: best > old ? 'up' : 'same'});
    }
    return notes;
  }
  const am = e.sets.find(x => x.am && x.d != null);
  if (am) notes.push({name, text: am.d + ' reps på ' + fmt(am.w) + ' kg i siste sett', kind: am.d >= am.t ? 'up' : 'same'});
  else if (e.sets.some(x => x.d != null)) notes.push({name, text:'Vektene følger prosentplanen', kind:'same'});
  return notes;
}

// Metcon-budsjett i minutter per uke: mest i volumukene, lite før max out
const burgBudget = wk => wk <= 4 ? 40 : wk <= 8 ? 30 : wk <= 11 ? 20 : 10;
const burgMaxOut = s => /Max out/.test(s.sub || '');
function buildBurg(p, a){
  const i = a.idx, wk = Math.floor(i/4) + 1, di = i % 4, d = BURG[wk-1][di], last = wk === 12 && di === 3;
  const ex = d.ex.map(([L, mx, list, flag], ei) => {
    const top = last && (L === 'snatch' || L === 'cj');
    const sets = list.split(',').map(x => { const [pc, r] = x.split('x'), t = r.split('+').reduce((n, v) => n + +v, 0);
      return Object.assign({t, w:r25(a.e1rm[mx]*pc/100), d:null}, r.includes('+') ? {c:r} : {}); });
    const hint = flag === 'pp' ? 'Arket har bare reps. Vektene er et forslag ut fra clean & jerk, så juster etter dagsform.'
      : flag === 'r20' ? 'Hvil 20 minutter etter snatch før du starter.'
      : last && ei === 0 ? 'Tre forsøk: 85, 90 og 95 %. Juster neste forsøk med − og + etter hvordan det forrige gikk. Beste rene løft i snatch og clean & jerk blir ny 1RM.' : '';
    return {key:L, lift:L, slot:mx, part:'burg', rest: mx === 'squat' || mx === 'frontsquat' ? 180 : 120,
      tag: top ? 'Max out' : '', wu: ei ? 'short' : null, adj: flag === 'pp' || top, hint, sets};
  });
  return {programId:p.id, day:p.days[di].name, sub:'Uke ' + wk + ' av 12' + (last ? ' · Max out' : ''), ex, acc:d.acc || '', mcBud:burgBudget(wk), started:Date.now()};
}
function progressBurg(p, a, s){
  const notes = [];
  if (burgMaxOut(s)) {
    ['snatch','cj'].forEach(l => {
      const ok = s.ex.filter(e => e.lift === l).flatMap(e => e.sets).filter(x => x.d >= 1);
      if (!ok.length) return;
      const best = Math.max(...ok.map(x => x.w)), old = a.e1rm[l];
      a.e1rm[l] = Math.max(best, old);
      notes.push({name:liftName(l), text: best > old ? 'Ny 1RM: ' + fmt(old) + ' → ' + fmt(best) + ' kg' : 'Beste løft ' + fmt(best) + ' kg, 1RM står på ' + fmt(old) + ' kg', kind: best > old ? 'up' : 'same'});
    });
    return notes;
  }
  if (s.ex.some(e => e.sets.some(x => x.d != null))) notes.push({name:s.day, text:'Vektene følger prosentplanen', kind:'same'});
  return notes;
}

/* ---------- Cube EMOM 12 uker (Jonas sitt Google-ark, eget program) ----------
   Fire baseløft (benk, knebøy, markløft, strict press). Hver uke brukes tre av dem, og hvert løft er
   tungt, teknisk og eksplosivt én gang i løpet av uka (hele kuben). Uka etter går ett løft ut, og det som
   sto over, kommer inn. Rotasjonen gir hvert løft en hvileuke, så programmet har ingen egne deloaduker.
   Øktene er E4MOM: minutt 1 tungt, minutt 2 eksplosivt, minutt 3 teknikk, minutt 4 hvile, 4–5 runder.
   Vektene er prosent av treningsmaks. Det tunge løftet spør om RPE, og endringen i treningsmaks
   gjelder fra uka etter, så vektene står fast hele uka. Uke 12 gjentar uke 1 med samme vekter. */
const CBE_ALL = ['bench', 'squat', 'deadlift', 'ohp'];
// Løftet som står over, uke 1–11 (uke 12 = uke 1). Markløft sliter mest og står over oftest.
const CBE_OUT = ['deadlift', 'ohp', 'squat', 'bench', 'deadlift', 'ohp', 'squat', 'bench', 'deadlift', 'ohp', 'squat', 'deadlift'];
// Per uke: [runder, tung %, tung reps, teknikk %, teknikk reps, eksplosiv %, eksplosiv reps]. Uke 4 og 8 gjentar uka før,
// som erstatning for deloadukene i arket. Markløft har færre reps: tung 2, teknikk 3, eksplosiv 2.
const CBE_W = [[4,80,3,65,5,50,3],[4,82.5,3,65,5,52.5,3],[5,82.5,3,67.5,5,55,3],[5,82.5,3,67.5,5,55,3],
  [5,85,2,67.5,5,55,3],[5,85,2,70,4,57.5,3],[5,87.5,2,70,4,60,2],[5,87.5,2,70,4,60,2],
  [5,87.5,2,70,4,55,3],[5,90,2,72.5,4,57.5,2],[5,90,2,72.5,4,60,2],[4,80,3,65,5,50,3]];
const CBE_PHASE = ['Baseline','Base','Bygg','Bygg','Styrke 1','Styrke 2','Styrke 3','Styrke 3','Konsolider','Topp 1','Topp 2','Retest'];
const CBE_RPE = [7,7,7.5,7.5,7.5,7.5,8,8,7.5,8,8,7];
// Hvem har hvilken rolle i økt 1–3: løft i (av de tre denne uka) er tungt i økt i, eksplosivt i økt i+1 og teknisk i økt i+2
const cbeLifts = wk => CBE_ALL.filter(l => l !== CBE_OUT[wk-1]);
function cbeDay(wk, di){
  const L = cbeLifts(wk), [, hp, hr, tp, tr, ep, er] = CBE_W[wk-1], dl = l => l === 'deadlift';
  return [[L[di], 'H', hp, dl(L[di]) ? Math.min(hr, 2) : hr], [L[(di+2) % 3], 'E', ep, dl(L[(di+2) % 3]) ? 2 : er], [L[(di+1) % 3], 'T', tp, dl(L[(di+1) % 3]) ? 3 : tr]];
}
// Treningsmaks denne uka: endringer fra en tidligere uke gjelder, endringer fra denne uka venter
const cbeTm = (a, L, wk) => a.tmNext && a.tmNext.wk < wk && a.tmNext.tm[L] != null ? a.tmNext.tm[L] : mmcTm(a, L);
function cbeCommit(a, wk){ if (a.tmNext && a.tmNext.wk < wk) { a.tm = Object.assign(a.tm || {}, a.tmNext.tm); a.tmNext = null; } }
const CBE_ROLE = {H:['Tung', 'RPE maks 8, minst 2 reps i reserve. Blir det tyngre, ta av 2,5–5 kg samme dag. RPE 7 eller lavere gir høyere treningsmaks neste gang.'],
                  T:['Teknikk', 'Minst 2 reps i reserve. Teknisk kvalitet først.'],
                  E:['Eksplosiv', 'Eksplosiv opp, kontrollert ned. Stopp ved fartsfall.']};
const CBE_DAY = [['Økt 1','A'], ['Økt 2','B'], ['Økt 3','C']];
const CBE_ACC = ['12 min superset, 3 runder:\n10 chest-supported DB rows\n12 band face pulls\n45–60 s pause ved behov',
                 '12 min superset, 3 runder:\n10 liggende lårcurl eller glute bridge\n10 lat pulldown eller ring rows\n45–60 s pause ved behov',
                 '12 min superset, 3 runder:\n10 ettarms DB rows per side\n12 band face pulls\n45–60 s pause ved behov'];
const CBE_MC = ['AMRAP 25 min\n12/10 kcal SkiErg\n12 wall balls\n8 pull-ups / 12 ring rows\n6 × 10 m shuttle run\n\nRPE 7–8, kontrollert. Shuttle run: 10 m per lengde, rør linja og vend.',
                'AMRAP 25 min\n12 kcal BikeErg\n8 box jumps (steg ned)\n12 KB swings (moderat)\n12 sit-ups\n\nRPE 7–8.',
                'AMRAP 25 min\n10 kcal RowErg\n10 alternerende DB snatches (lett)\n8 burpees\n10 hanging knee raises\n\nRPE 7–8.'];
function buildCbe(p, a){
  const i = a.idx, wk = Math.floor(i/3) + 1, di = i % 3, [day, bk] = CBE_DAY[di], rounds = CBE_W[wk-1][0];
  const ex = cbeDay(wk, di).map(([slot, role, pc, r], k) => {
    const L = sw(a, slot), tm = wk === 12 ? a.e1rm[L] * .9 : cbeTm(a, L, wk), heavy = role === 'H', ask = heavy && wk !== 12;
    return {key:L + '.' + role, lift:L, slot, part:'mmc', sp:1, ask, quiet: !heavy, tgt:7.5, rpeLbl:'maks 8', wu:'none', cbeWk: wk,
      rest: k < 2 ? 50 : 110, tag: CBE_ROLE[role][0] + ' · ' + fmt(pc) + ' % av TM',
      hint: 'Minutt ' + (k + 1) + ' i E4MOM. ' + (wk === 12 && heavy ? 'Retest med samme vekt som uke 1.' : CBE_ROLE[role][1]), sets: mk(rounds, r, r25(tm * pc / 100))};
  });
  const text = CBE_MC[di];
  return {programId:p.id, day, sub:'Uke ' + wk + ' av 12 · ' + CBE_PHASE[wk-1], ex, rr:1,
    boxes:[['E4MOM ' + (rounds * 4) + ' min', 'Minutt 1: ' + liftName(ex[0].lift) + ' · minutt 2: ' + liftName(ex[1].lift) + ' · minutt 3: ' + liftName(ex[2].lift) + ' · minutt 4: hvile. ' + rounds + ' runder.\nDenne uka: ' + listNo(cbeLifts(wk).map(l => liftName(sw(a, l)).toLowerCase())) + '. ' + liftName(sw(a, CBE_OUT[wk-1])) + ' står over.\nVarm opp alle tre løftene til arbeidsvekt før klokka starter. Appen tar løftene i samme rekkefølge som minuttene.'],
           ['Tilbehør', CBE_ACC[di] + '\nMål-RPE for økta: ' + fmt(CBE_RPE[wk-1])]],
    wod:{id:'cbe-' + bk.toLowerCase(), navn:(wk === 1 ? 'Baseline ' : wk === 12 ? 'Retest ' : '') + 'Cube EMOM ' + bk, tekst:text, resultat:''},
    metcon:true, mc:{type:mcGuess(text), min:25, rpe:null, auto:1}, started:Date.now()};
}

/* ---------- Juggernaut Method (16 uker, Chad Wesley Smith) ----------
   Fire bølger: 10-ere, 8-ere, 5-ere, 3-ere. Hver bølge: akkumulering, intensivering,
   realisering (test) og deload. Prosentene er av arbeidsmaks (90 % av 1RM).
   Sett skrives som [andel, reps, antall sett, maks reps?], samme format som Cube. */
const JUG = [
  {std:10, acc:[[.60,10,5]], int:[[.55,5,1],[.625,5,1],[.675,10,3]], real:[[.50,5,1],[.60,3,1],[.70,1,1],[.75,10,1,1]]},
  {std:8,  acc:[[.65,8,5]],  int:[[.60,3,1],[.675,3,1],[.725,8,3]],  real:[[.50,5,1],[.60,3,1],[.70,2,1],[.75,1,1],[.80,8,1,1]]},
  {std:5,  acc:[[.70,5,6]],  int:[[.65,2,1],[.725,2,1],[.775,5,4]],  real:[[.50,5,1],[.60,3,1],[.70,2,1],[.75,1,1],[.80,1,1],[.85,5,1,1]]},
  {std:3,  acc:[[.75,3,7]],  int:[[.70,1,1],[.775,1,1],[.825,3,5]],  real:[[.50,5,1],[.60,3,1],[.70,2,1],[.75,1,1],[.80,1,1],[.85,1,1],[.90,3,1,1]]}
];
const JUG_DELOAD = [[.40,5,1],[.50,5,1],[.60,5,1]];
const JUG_WAVE = ['10-ere', '8-ere', '5-ere', '3-ere'];
const JUG_PHASE = ['Akkumulering', 'Intensivering', 'Realisering', 'Deload'];
const jugInc = slot => (slot === 'squat' || slot === 'deadlift') ? 2.5 : 1.25;   // per ekstra rep

function buildJug(p, a){
  const i = a.idx, n = p.days.length, day = p.days[i % n], slot = day.lift, L = sw(a, slot);
  const week = Math.floor(i / n), wave = Math.min(3, Math.floor(week / 4)), phase = week % 4, W = JUG[wave];
  const list = phase === 0 ? W.acc : phase === 1 ? W.int : phase === 2 ? W.real : JUG_DELOAD;
  const hint = phase === 2 ? `Siste sett: så mange reps du klarer. Hver rep over ${W.std} øker arbeidsmaksen med ${fmt(jugInc(slot))} kg (maks 10 reps teller).`
             : phase === 0 && wave === 0 ? 'Lett start er meningen. Ikke øk vekten selv.' : '';
  return {programId:p.id, day:day.name, sub:`Bølge ${JUG_WAVE[wave]} · ${JUG_PHASE[phase]} · uke ${week + 1} av 16`,
    ex:[{key:L, lift:L, slot, tag:JUG_PHASE[phase], rest: phase === 2 ? 180 : phase === 3 ? 90 : 150, hint,
         sets: cubeSets(list, a.tm[L])}], started:Date.now()};
}
function progressJug(p, a, s){
  const e = s.ex[0], n = p.days.length, week = Math.floor(a.idx / n), wave = Math.min(3, Math.floor(week / 4));
  if (week % 4 !== 2) return [];
  const am = e.sets.find(x => x.am);
  if (!am || am.d == null) return [{name:liftName(e.lift), text:'Testsettet er ikke registrert. Arbeidsmaksen står stille.', kind:'same'}];
  const extra = Math.min(10, am.d - JUG[wave].std), old = a.tm[e.lift];
  if (extra <= 0) return [{name:liftName(e.lift), text:`${am.d} reps (mål ${JUG[wave].std}). Arbeidsmaksen står på ${fmt(old)} kg`, kind:'same'}];
  a.tm[e.lift] = old + extra * jugInc(e.slot);
  return [{name:liftName(e.lift), text:`${am.d} reps, ${extra} over målet: arbeidsmaks ${fmt(old)} → ${fmt(a.tm[e.lift])} kg`, kind:'up'}];
}

/* ---------- ATHX 2027 (egen modell) ----------
   Planen står i docs/superpowers/specs/2026-10-26-athx-2027-treningsplan.md.
   Lengden regnes baklengs fra stevnedatoen: Grunn, Bygg, Spesifikk og Taper.
   Uka følger kalenderen. Henger du etter, hopper planen til første økt i denne uka.
   Vektene er prosent av arbeidsmaksen (a.e1rm). Etter hver økt justeres den ut fra RPE på siste sett mot
   målet. Tunge sett (RPE 8 eller mer, 5 reps eller færre) gir et anslag. Er medianen av de tre siste anslagene
   fra seks uker høyere (som i Pete Plan), går arbeidsmaksen opp dit. Én økt flytter den høyst +2,5 % eller −5 %.
   Løpe- og skifarten (per km og per 500 m) anslås på samme måte fra intervallene, med et fast tillegg per
   økttype. Startverdiene kommer fra det brukeren vet fra før. Ingen testuke. */

  for (let b = 0; b < Math.floor(grunn / 4); b++) ['a','b','c','l'].forEach(k => out.push({ph:'grunn', key:k, blk:b + 1}));
  // Bygg: to blokker. Lengre: ekstra uker fra blokk 1 først, også med lett uke. Kortere: de første ukene kuttes.
  const B = [];
  [1,2].forEach(bl => ['a','b','c','l'].forEach(k => B.push({ph:'bygg', key:k, blk:bl})));
  for (let i = 0; i < bygg - 8; i++) out.push({ph:'bygg', key:['a','b','c','l'][i % 4], blk:1});
  out.push(...(bygg >= 8 ? B : B.slice(8 - bygg)));

    if (day === 1) { ex = [T('s2oh',2,1,.90,{rpe:null, tag:'Singler'}), T('s2oh',2,1,.92,{k:'open', rpe:null, tag:'Åpningsvekt'}), T('squat',2,2,.875,{rpe:null})];
      c = axC('SkiErg i målfart', [`3 × 3 min @ ${ski0}, 2 min pause`], [{k:'ski', off:0}], 9); }
    else if (day === 2) c = axC('Målfart på løp og ski', [`2 km @ ${run0}`, `Rett på SkiErg: 5 min @ ${ski0}`, '4 × 20 s stigningsløp'], [{k:'run', off:0, lbl:'Snittfart på løpet'}, {k:'ski', off:0}], 16);
    else if (day === 3) { ex = [T('deadlift',2,2,.875,{rpe:null})]; c = axC('Halve Metcon X @ stevnefart', ['For tid:', ...axMx(S, .5)], [{k:'mc', kind:'half'}], 9, 'L'); }
    else c = easyRun(Math.min(30, axEasy(a, 25)));
  } else {
    if (day === 1) { ex = [T('s2oh',3,1,.80,{rpe:null, tag:'Singler'}), T('squat',2,2,.75,{rpe:null}), T('deadlift',2,2,.75,{rpe:null})];
      c = axC('Kort på skien', [`3 × 1 min @ ${ski0}, 1 min pause`], [], 3); }
    else if (day === 2) c = axC('Kort og lett', [`15 min rolig løp, så 3 × 1 min @ ${run0}`, '3 × 10 kal ro', '2 × 5 burpees over benk'], [{k:'feel'}], 20);
    else if (day === 4) c = axC('Hvile', ['Hvil, eller 15 min rolig og bevegelighet.'], [], 0);
