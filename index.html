function spark(vals){
  const w = 72, h = 24, min = Math.min(...vals), max = Math.max(...vals), rng = max - min || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*(w-6)+3, h-3-((v-min)/rng)*(h-6) ]);
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--chalk)"/></svg>`;
}

// Er økta styrke, kondisjon/metcon, eller begge? Brukes av kalenderen og tellerne i loggen.
const isStrength = h => !h.free && !h.skipped && !(h.ex && !h.ex.length);   // ATHX: løp og ski alene er ikke styrke
const isMetcon = h => !!(h.metcon || h.mc || h.wod || h.pete);
// Fire uker, mandag først, med i dag markert
function vCalendar(){
  const day = 864e5, today = new Date(); today.setHours(0,0,0,0);
  const start = today.getTime() - ((today.getDay() + 6) % 7 + 21) * day;
  const cells = [];
  for (let i = 0; i < 28; i++) {
    const t0 = start + i * day, t1 = t0 + day, hs = S.history.filter(h => h.date >= t0 && h.date < t1);
    const st = hs.some(isStrength), mc = hs.some(isMetcon), sk = !st && !mc && hs.some(h => h.skipped);
    const cls = st && mc ? 'both' : st ? 'st' : mc ? 'mc' : sk ? 'sk' : '';
    const lbl = new Date(t0).toLocaleDateString('nb-NO', {weekday:'long', day:'numeric', month:'long'}) + ': ' + (st && mc ? 'styrke og metcon' : st ? 'styrke' : mc ? 'metcon' : sk ? 'økt hoppet over' : 'ingen økt');
    cells.push(`<i class="${cls}${t0 === today.getTime() ? ' today' : ''}${t0 > today.getTime() ? ' fut' : ''}" title="${lbl}"></i>`);
  }
  return `<div class="cal" role="img" aria-label="Treningsdager de siste fire ukene">${['M','T','O','T','F','L','S'].map(d => `<span>${d}</span>`).join('')}${cells.join('')}</div>
    <div class="cal-key"><span><i class="st"></i>Styrke</span><span><i class="mc"></i>Metcon</span><span><i class="sk"></i>Hoppet over</span></div>`;
}
function vLog(){
  if (ui.logEdit) return vLogEdit();
  let h =`<header class="head h-row"><div><p class="eyebrow">Siste 4 uker</p><h1>Fremgang</h1></div><button class="quick" data-a="free">+ Fri økt</button></header>`;
  if (!S.history.length) return h + `<p class="muted">Øktene du fullfører havner her, med vekt, reps og notater.</p>`;
  const now = Date.now(), last28 = S.history.filter(x => x.date > now - 28*864e5);
  const nSt = last28.filter(isStrength).length, nMc = last28.filter(isMetcon).length;
  h += `<section class="box">
      <div class="log-sum">
        <div><b>${nSt}</b><span>${nSt === 1 ? 'styrkeøkt' : 'styrkeøkter'}</span></div>
        <div><b>${nMc}</b><span>${nMc === 1 ? 'metcon' : 'metcons'}</span></div>
        <div><b>${fmt(mcWindow(now - 7*864e5, now).min)}<small>min</small></b><span>kondisjon 7 d</span></div>
      </div>
      ${vCalendar()}
    </section>`;
  const series = {};
  [...S.history].reverse().forEach(sess => sess.ex.forEach(e => {
    if (/BBB|FSL|T2|T3|Lett|Backoff|Deload|Sekundær|Taper|Teknikk|Manualer|Maks minus|på tid/.test(e.tag || '')) return;
    const done = e.sets.filter(x => x.d > 0); if (!done.length) return;
    (series[e.lift] = series[e.lift] || []).push(Math.max(...done.map(x => x.w)));
  }));
  const rows = Object.entries(series).filter(([,v]) => v.length > 1);
  h += rows.length ? `<section class="box trend"><h3 style="margin:2px 0 0">Toppvekt per økt</h3>${rows.map(([l,v]) => { const d = v[v.length-1] - v[0];
      return `<div class="tr"><b>${liftName(l)}</b>${spark(v)}<span class="tr-kg">${fmt(v[v.length-1])}</span><span class="tr-d ${d > 0 ? 'ok-t' : d < 0 ? 'miss-t' : ''}">${d > 0 ? '+' : ''}${d ? fmt(d) : '±0'}</span></div>`; }).join('')}</section>`
                   : `<p class="muted small">Kurvene dukker opp når du har logget samme løft to ganger.</p>`;
  const mcCount = S.history.filter(x => x.metcon).length;
  h += `<h3>Siste økter</h3>`;
  if (mcCount) h += `<div class="filt" role="group" aria-label="Filter">
      <button data-a="logf:all" aria-pressed="${ui.logF !== 'mc'}">Alle</button>
      <button data-a="logf:mc" aria-pressed="${ui.logF === 'mc'}">Med metcon (${mcCount})</button></div>`;
  const list = ui.logF === 'mc' ? S.history.filter(x => x.metcon) : S.history;
  h += list.slice(0, 60).map(sess => {
    const wodH = sess.wod ? `<div class="sess-wod"><p><b>${esc(sess.wod.navn)}</b>${sess.wod.resultat ? ` · <span class="res">${esc(sess.wod.resultat)}</span>` : ''}</p>
      <details><summary>Vis økta</summary><pre class="wodtxt">${esc(sess.wod.tekst)}</pre></details></div>` : '';
    const mcH = sess.mc && MC[sess.mc.type] ? `<span class="pill">${MC[sess.mc.type].n} · ${fmt(sess.mc.min)} min${sess.mc.rpe ? ' · RPE ' + sess.mc.rpe : ''}</span>` : '';
    const ppH = sess.pete ? `<div class="sess-wod"><p><b>Pete Plan · ${esc(sess.pete.name)}</b> · ${PETE_MACH[sess.pete.mach] || ''}${sess.pete.split ? ` · <span class="res">${paceTxt(sess.pete.split, sess.pete.bike)}</span>` : ''}</p></div>` : '';
    const axH = sess.cond ? `<div class="sess-wod"><p><b>${esc(sess.cond.title)}</b>${axResTxt(sess.cond) ? ` · <span class="res">${esc(axResTxt(sess.cond))}</span>` : ''}</p></div>` : '';
    const noteH = (sess.metcon || sess.note || sess.wod || sess.pete || sess.cond) ? `<div class="sess-note">${sess.metcon ? '<span class="pill mc">Metcon</span>' : ''}${mcH}${axH}${ppH}${wodH}${sess.note ? `<p>${esc(sess.note)}</p>` : ''}</div>` : '';
    const d = new Date(sess.date), open = !!(ui.logOpen && ui.logOpen[sess.date]);
    const dateBox = `<span class="sess-d"><b>${d.getDate()}</b><small>${d.toLocaleDateString('nb-NO', {month:'short'}).replace('.', '')}</small></span>`;
    if (sess.skipped) { const ps = prog(sess.programId);
      return `<article class="sess skipped ${open ? 'open' : ''}"><button class="sess-row" data-a="logopen:${sess.date}" aria-expanded="${open}" aria-label="${dateFmt(sess.date)}: ${esc(sess.day)}, hoppet over">${dateBox}
        <span class="sess-t"><b>${esc(sess.day)}</b><small>Hoppet over${ps ? ' · ' + ps.name : ''}</small></span>${chev}</button>
        ${open ? logActs(sess) : ''}</article>`; }
    const p = sess.free ? null : prog(sess.programId);
    const title = sess.free ? (sess.pete ? 'Pete Plan' : sess.wod ? 'Metcon' : 'Fri økt') : sess.day;
    // Én linje per økt: løftene med toppvekt, eller hva den frie økta var. Trykk for detaljer.
    const sum = sess.free ? (sess.pete ? esc(sess.pete.name) : sess.wod ? esc(sess.wod.navn) : sess.note ? esc(sess.note.slice(0, 60)) : '')
      : sess.ex.length ? Object.entries(sess.ex.reduce((m, e) => (m[e.lift] = Math.max(m[e.lift] || 0, ...e.sets.map(x => x.w)), m), {})).map(([l, w]) => liftName(l) + ' ' + fmt(w)).join(' · ')
      : sess.cond ? esc(sess.cond.title) : '';
    const vol = sess.free ? 0 : sess.ex.reduce((s,e) => s + e.sets.reduce((v,x) => v + (x.d||0)*x.w, 0), 0);
    const body = !open ? '' : sess.free ? noteH : `<p class="muted small">${p ? p.name + ' · ' : ''}${sess.sub} · ${fmt(Math.round(vol))} kg totalt</p>
      ${sess.ex.map(e => {
        const ws = [...new Set(e.sets.map(x => x.w))];
        const reps = e.sets.map(x => x.d == null ? '–' : x.d);
        const right = ws.length === 1 ? reps.join(' ') + ' × ' + fmt(ws[0]) + ' kg' : e.sets.map(x => (x.d == null ? '–' : x.d) + '×' + fmt(x.w)).join(' · ');
        return `<div class="ln"><span>${liftName(e.lift)}${e.tag ? ' <span class="muted">'+e.tag+(e.rpe != null ? ' · RPE '+fmt(e.rpe) : '')+'</span>' : ''}</span><span>${right}</span></div>`;
      }).join('')}
      ${noteH}`;
    return `<article class="sess ${open ? 'open' : ''}">
      <button class="sess-row" data-a="logopen:${sess.date}" aria-expanded="${open}" aria-label="${dateFmt(sess.date)}: ${title}">
        ${dateBox}
        <span class="sess-t"><b>${title}</b>${sum ? `<small>${sum}</small>` : ''}</span>
        ${isMetcon(sess) && !sess.free ? '<span class="pill mc">Metcon</span>' : ''}${chev}
      </button>
      ${body}${open ? logActs(sess) : ''}
    </article>`;
  }).join('');
  return h;
}
// Under en åpen økt i loggen: Endre og Slett. Slett spør først og sier hva som skjer med programmet.
function logActs(sess){
  const k = 'logdel:' + sess.date;
  if (ui.confirm !== k) return `<div class="row log-acts">${sess.skipped ? '' : `<button class="btn ghost sm" data-a="logedit:${sess.date}">Endre</button>`}
    <button class="btn ghost sm" data-a="confirm:${k}">Slett</button></div>`;
  const undo = canUndo(sess), p = prog(sess.programId);
  const txt = undo && sess.skipped ? `«Hoppet over» slettes, og ${esc(sess.day)} står som neste økt igjen.`
    : undo ? `Økta slettes, og ${p ? p.name : 'programmet'} går tilbake til der det var før økta: samme vekter og samme neste økt.`
    : 'Økta slettes fra loggen.' + (sess.free ? '' : ' Vektene i programmet endres ikke.');
  return `<div class="log-acts" style="display:grid;gap:10px"><p class="small">${txt}${undo && draftTouched() ? ' Settene du har ført i neste økt, forsvinner.' : ''} Dette kan ikke angres.</p>
    <div class="row"><button class="btn danger sm" data-a="logdel:${sess.date}">Slett økta</button><button class="btn ghost sm" data-a="cancel">Avbryt</button></div></div>`;
}

// Måling til feilsøking: hva rapporterer telefonen om skjerm og trygge soner?
function diag(){
  try {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;bottom:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(d);
    const cs = getComputedStyle(d), t = Math.round(parseFloat(cs.paddingTop)), b = Math.round(parseFloat(cs.paddingBottom));
    d.remove();
    const app = document.querySelector('.app').getBoundingClientRect();
    return 'Skjerm ' + screen.height + ' · vindu ' + innerHeight + ' · app ' + Math.round(app.height) + ' · topp ' + t + ' · bunn ' + b + ' · justert ' + (ui.gapFix || 0);
  } catch(e) { return ''; }
}

    else if (h.get('chat')) { ui.sxTab = 'chat'; ui.sxView = 'c:' + h.get('chat'); }   // samtalen hentes ved oppstart, se nederst
    else ui.sxView = h.get('sammen') ? 's:' + h.get('sammen') : 'list';
    return;
  }
  if (!h.get('type') && !h.get('error_code')) return;
  history.replaceState(null, '', location.pathname + location.search);
  ui.tab = 'together';
  if (h.get('type') === 'recovery' && h.get('access_token')) {
    const b = jwtBody(h.get('access_token'));
    setSession({access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: +h.get('expires_in') || 3600,
      expires_at: +h.get('expires_at') || undefined, user: {id: b.sub, email: b.email}});
    ui.sxView = 'newpw';
  } else if (h.get('error_code')) {
    ui.sxMode = 'forgot';
    ui.sxMsg = h.get('error_code') === 'otp_expired' ? 'Lenken har gått ut. Be om en ny.' : 'Lenken virket ikke. Be om en ny.';
  }
})();

function sxReset(){ Object.assign(SX, {loaded:false, at:0, me:null, fr:[], ppl:{}, sess:[], part:[], prop:[], chats:[], live:new Map(), hidden:false, seenAt:0, prev:0, err:''}); ui.sxView = 'list'; ui.sxTab = ''; sxBadge(); }

// Hent alt Sammen-fanen trenger: profilen din, venner, kommende timer, påmeldinger, forslag og navnene på de involverte.
// quiet: hentingen i bakgrunnen. Da tegnes skjermen bare på nytt hvis noe er endret.
function sxLoad(quiet){
  if (!auth) return Promise.resolve();
  if (SX.loading) return SX.loading;
  SX.loading = (async () => {
    let same = false;
    try {
      const me = uid();
      const [prof, fr, seen] = await Promise.all([
        db('profiles', 'select=id,username,display_name&id=eq.' + me),
        db('friendships', 'select=*'),
        db('seen', 'select=last_seen_at')]);
      SX.me = prof[0] || null;
      if (SX.me) {
        if (!seen.length) await db('seen', '', {method:'POST', body:{user_id: me}});
        SX.seenAt = seen.length ? Date.parse(seen[0].last_seen_at) : Date.now();
        const now = Date.now(), iso = t => new Date(t).toISOString();
        const sess = await db('sessions', 'select=*&order=starts_at&or=' +
          encodeURIComponent(`(ends_at.gte.${iso(now)},and(ends_at.is.null,starts_at.gte.${iso(now - FIXED_LEN)}))`));
        const ids = sess.map(s => s.id);
        const [part, prop, chats, live, pres] = await Promise.all([
          ids.length ? db('participants', 'select=*&session_id=' + inList(ids)) : [],
          ids.length ? db('proposals', 'select=*&order=proposed_at&session_id=' + inList(ids)) : [],
          rpc('chat_list').catch(() => []),
          rpc('presence_now').catch(() => []),
          db('presence', 'select=hidden').catch(() => [])]);
        const people = [...fr.map(f => f.requester), ...fr.map(f => f.addressee), ...sess.map(s => s.owner),
          ...part.map(p => p.user_id), ...prop.map(p => p.user_id), ...chats.flatMap(c => c.members)].filter(x => x !== me);
        const ppl = people.length ? await db('profiles', 'select=id,username,display_name&id=' + inList(people)) : [];
        SX.ppl = Object.fromEntries(ppl.map(p => [p.id, p])); SX.ppl[me] = SX.me;
        const sig = JSON.stringify([fr, sess, part, prop, chats, ppl, live]);
        same = quiet && sig === SX.sig && SX.loaded && !SX.err;
        Object.assign(SX, {fr, sess, part, prop, chats, sig, live: new Map(live.map(x => [x.user_id, x.state])), hidden: !!(pres[0] && pres[0].hidden)});
        sxSyncPlans();
      }
      SX.loaded = true; SX.err = ''; SX.at = Date.now();
    } catch(e) {
      SX.err = sxErr(e);
    } finally {
      SX.loading = null; sxBadge();
      if (ui.tab === 'together' && !isTyping() && !same) render();
    }
  })();
  return SX.loading;
}
// Når fanen åpnes: hent på nytt, vis det som er nytt siden sist, og merk det som sett
async function sxOpen(){
  if (!auth) return;

// Aktiv nå: si fra at Sammen er åpen (true) eller lukket (false). Vennene ser en grønn prikk. Ikke når bryteren er av.
// keepalive: kallet kommer fram selv om appen legges bort i samme øyeblikk.
function sxPing(active){
  if (!auth || !SX.me || SX.hidden) return;
  rpc('presence_ping', {active}, {keepalive: true}).catch(() => {});
}
function sxErr(e){
  if (!navigator.onLine || /fetch|network|load failed/i.test(e.message || '')) return 'Ingen kontakt med serveren. Sjekk nettet og prøv igjen.';
  if (e.code === '23505') return 'Det finnes allerede.';
  if (e.status === 401 || e.status === 403 || e.code === '42501') return 'Du har ikke tilgang til dette.';
  return e.message || 'Noe gikk galt.';
}

/* ---------- Sammen: pushvarsler ----------
   Varsel når noen blir med på eller foreslår tid på timen din, skriver, eller vil bli venn. Hver telefon slår det på selv.
   På iPhone virker det bare fra hjemskjermen (iOS 16.4 eller nyere), og spørsmålet om lov må komme rett fra et trykk.
   Sendingen skjer i Supabase: en trigger legger varselet i en utboks, og edge-funksjonen «push» sender det. */
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
ui.push = '';   // '' ukjent ennå, 'on', 'off', 'denied', 'ios' (må åpnes fra hjemskjermen) eller 'na' (ikke mulig her)
async function pushSub(){
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
const pushSave = sub => { const j = sub.toJSON(); return rpc('push_register', {endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth}); };
async function pushCheck(){
  try {
    if (!pushSupported()) { ui.push = isIOS && !navigator.standalone ? 'ios' : 'na'; return; }
    const sub = await pushSub();
    ui.push = sub ? 'on' : Notification.permission === 'denied' ? 'denied' : (location.protocol === 'https:' || (await navigator.serviceWorker.getRegistration())) ? 'off' : 'na';
    if (sub && auth) pushSave(sub).catch(() => {});   // hold abonnementet knyttet til kontoen som er innlogget nå
  } catch(e) { ui.push = 'na'; }
}
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
async function pushOn(){
  const perm = await Notification.requestPermission();   // først, mens trykket fortsatt gjelder
  if (perm !== 'granted') {
    ui.push = perm === 'denied' ? 'denied' : 'off';
    throw new Error(perm === 'denied' ? 'Varsler er avslått for Stanga. Slå dem på i Innstillinger → Varslinger.' : 'Varsler ble ikke slått på.');
  }
  const key = await rpc('push_public_key');
  if (!key) throw new Error('Varsler er ikke klare på serveren ennå. Prøv igjen om litt.');
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uBytes(key)});
  await pushSave(sub); ui.push = 'on';
}
async function pushOff(){
  const sub = await pushSub().catch(() => null);
  if (sub) {
    if (auth) await db('push_subscriptions', 'endpoint=eq.' + encodeURIComponent(sub.endpoint), {method:'DELETE'}).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  }
  if (ui.push === 'on') ui.push = 'off';
}
// Trykk på et varsel mens appen er åpen: service workeren sier fra, og vi går til timen
function sxGoto(sid, cid, view){
  Object.assign(ui, {tab:'together', detail:null, plan:null, confirm:null, free:false, bank:false, wod:null});
  ui.sxView = view === 'friends' ? 'friends' : typeof sid === 'string' ? 's:' + sid : 'list';
  sxOpen();
  if (cid) chatOpen(cid); else { render(); toTop(); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  if (e.data && (e.data.sx || e.data.chat)) sxGoto(e.data.sx, e.data.chat, e.data.view);
  // Et varsel kom mens appen er åpen: hent nytt med en gang, så tallene og samtalen stemmer
  else if (e.data && e.data.refresh && auth) { sxLoad(); if (/^c:/.test(ui.sxView || '')) chatFetch(); }
});
pushCheck().then(() => { if (ui.tab === 'together' || ui.detail === 'settings') render(); });

const pad = n => String(n).padStart(2, '0');
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d; };
const dayDiff = t => Math.round((dayStart(t) - dayStart(Date.now())) / 864e5);
function dayLabel(t){
  const n = dayDiff(t); if (n === 0) return 'I dag'; if (n === 1) return 'I morgen';
  const s = new Date(t).toLocaleDateString('nb-NO', {weekday:'long', day:'numeric', month:'short'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const sxEnd = s => s.ends_at ? Date.parse(s.ends_at) : Date.parse(s.starts_at) + FIXED_LEN;
const sxTime = s => s.kind === 'window' ? hm(s.starts_at) + '–' + hm(s.ends_at) : hm(s.starts_at);
const uname = id => SX.ppl[id] ? '@' + SX.ppl[id].username : 'en venn';
// Initialer i en farget sirkel. Fargen følger brukernavnet, så samme person har alltid samme farge.
const AV = [['#2E9E5B','#06150C'],['#E3B42B','#2A2005'],['#2F6FDB','#FFFFFF'],['#D93A2F','#FFFFFF'],['#A9AEB6','#111317'],['#B8413A','#FFFFFF']];
function av(id, sm){
  const p = SX.ppl[id] || {};
  return avTxt(p.display_name || p.username || '?', p.username || '', sm, id !== uid() && SX.live.get(id));
}
// live: 'live' gir grønn prikk (har Sammen åpen), 'train' gir manualen (har en økt i gang)
const DB_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="0.5" y="6" width="2" height="4" rx=".6"/><rect x="2.5" y="3.5" width="2.6" height="9" rx=".8"/><rect x="10.9" y="3.5" width="2.6" height="9" rx=".8"/><rect x="13.5" y="6" width="2" height="4" rx=".6"/><rect x="5" y="7" width="6" height="2"/></g></svg>';
function avTxt(name, key, sm, live){
  const ini = name.split(/[\s._]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  let h = 0; for (const c of key) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const [bg, ink] = AV[h % AV.length];
  return `<span class="av${sm ? ' sm' : ''}${live ? ' ' + live : ''}" style="background:${bg};color:${ink}" aria-hidden="true">${esc(ini)}${live === 'train' ? `<i class="av-tr">${DB_ICON}</i>` : ''}</span>`;
}
function sxWorkout(s){

}

// Det som er nytt siden sist: forslag og påmeldinger på dine timer, nye timer fra venner og venneforespørsler.
// Forespørsler du ikke har svart på, står alltid her til du har svart.
function sxNews(since){
  const me = uid(), at = x => Date.parse(x.created_at), out = [];
  const mine = new Map(SX.sess.filter(s => s.owner === me).map(s => [s.id, s]));
  const sub = s => 'Din time ' + dayLabel(s.starts_at).toLowerCase() + ', ' + sxTime(s);
  SX.fr.forEach(f => {
    if (f.addressee === me && f.status === 'pending') out.push({at: at(f), who: f.requester, txt: 'vil legge deg til', sub: 'Venneforespørsel'});
    if (f.requester === me && f.status === 'accepted' && f.accepted_at && Date.parse(f.accepted_at) > since) out.push({at: Date.parse(f.accepted_at), who: f.addressee, txt: 'godtok forespørselen din', sub: 'Dere er venner nå'});
  });
  SX.prop.forEach(p => { const s = mine.get(p.session_id); if (s && at(p) > since) out.push({at: at(p), who: p.user_id, txt: 'foreslår ' + hm(p.proposed_at), sub: sub(s), sid: s.id}); });
  SX.part.forEach(p => { const s = mine.get(p.session_id); if (s && p.user_id !== me && at(p) > since) out.push({at: at(p), who: p.user_id, txt: 'meldte seg på', sub: sub(s), sid: s.id}); });
  SX.sess.forEach(s => { if (s.owner !== me && !s.cancelled_at && at(s) > since && sxEnd(s) > Date.now())
    out.push({at: at(s), who: s.owner, txt: 'la ut en time', sub: dayLabel(s.starts_at) + ', ' + sxTime(s), sid: s.id}); });
  return out.sort((a, b) => b.at - a.at);
}

// Økta fra programmet på timene du skal på (dine egne og de du er med på), én økt per time i rekkefølge.
// Den første timen får neste økt med alt som er lagt til på den. Timene etter får øktene etter det,
// med vektene planen viser hvis alt går som planlagt. Bare du ser dette. Vennene ser ikke vektene dine.
function myNextSess(){
  const p = S.active && prog(S.active.programId), own = ownDraft();
  if (!p) return null;
  const tot = totalOf(p, S.active);
  if (!own && tot && S.active.idx >= tot) return null;
  const x = own || buildSession(p, S.active);
  return x && ((x.ex && x.ex.length) || myExtras(x).length) ? x : null;
}
// Beste anslag på 1RM i et løft: fra programmet du kjører, ellers fra Maksløft i innstillingene
function rmOf(L){
  const a = S.active, p = a && prog(a.programId);
  if (a && a.e1rm && a.e1rm[L] > 0) return a.e1rm[L];
  if (p && (p.prog === '531' || p.prog === 'jugg') && a.tm && a.tm[L] > 0) return a.tm[L] / .9;
  return S.maxes[L] > 0 ? S.maxes[L] : null;
}
// Økta du deler på timene dine: øvelser, reps og andel av 1RM. Vennene ser ikke vektene.
// Den som kjører det samme, får vekter ut fra sine egne makser (se guestSess).
function sharePlan(x){
  if (!x || !x.ex || !x.ex.length || x.guest) return null;
  const p = S.active && prog(S.active.programId);
  return {prog: p ? p.name : '', day: x.day, sub: x.sub || '', acc: x.acc || '', ex: x.ex.map(e => {
    const r = rmOf(e.lift) ? e.lift : e.slot && rmOf(e.slot) ? e.slot : null;
    return {l: e.lift, tag: e.tag || '', rest: e.rest || 120, wu: e.wu || null, r,
      s: e.sets.map(y => Object.assign({t: y.t, f: !y.w ? 0 : r ? Math.round(y.w / rmOf(r) * 1000) / 1000 : null}, y.am ? {am: 1} : {}, y.c ? {c: y.c} : {}))};
  })};

  if (cancelled) h += `<div class="warn">Timen er avlyst.</div>`;

  h += ownerBox(s);
  // Du velger selv: samme økt som eieren, med dine vekter, eller neste økt i ditt eget program

    ? `<div class="seg" role="group" aria-label="Hvilken økt kjører du?"><button data-a="sxplan:${s.id}:same" aria-pressed="${myPlan(s) === 'same'}">Samme som ${esc(uname(s.owner))}</button><button data-a="sxplan:${s.id}:own" aria-pressed="${myPlan(s) !== 'same'}">Min egen økt</button></div>`
    : `<section class="box"><span class="lbl">Bli med</span><p class="small">Du velger selv hva du kjører. Samme økt får vekter ut fra dine makser, og programmet ditt står der det står.</p>
        <div class="row"><button class="btn sm" data-a="sxjoin:${s.id}:same" ${ui.sxBusy ? 'disabled' : ''}>Samme økt</button><button class="btn ghost sm" data-a="sxjoin:${s.id}:own" ${ui.sxBusy ? 'disabled' : ''}>Min egen økt</button></div></section>`;
  if (own || joined || !s.plan) h += myBox(s);
  if (s.kind === 'window' && !cancelled) {
    const opts = props.map(p => `<div class="sx-prop">${av(p.user_id)}<span><b>${uname(p.user_id)}</b>${p.comment ? `<small>«${esc(p.comment)}»</small>` : ''}</span>

        ${own ? `<button class="btn sm" data-a="sxpick:${p.id}">Velg</button>` : ''}</div>`).join('');
    h += `<h3>Forslag til tidspunkt</h3>`;
    h += props.length ? `<section class="box" style="gap:0;padding-block:4px">${opts}</section>` : `<p class="muted small">${own ? 'Ingen forslag ennå. Vennene dine kan foreslå et tidspunkt innenfor vinduet.' : 'Ingen forslag ennå.'}</p>`;
    if (own && props.length) h += `<p class="muted small">Når du velger et tidspunkt, blir timen fast, og de som foreslo det, står som påmeldt. De kan melde seg av hvis tiden ikke passer.</p>`;
    if (!own) h += myProp
      ? `<div class="row"><button class="btn ghost" data-a="sxunprop:${s.id}">Trekk forslaget mitt (${hm(myProp.proposed_at)})</button></div>`
      : `<section class="box sx-form"><span class="lbl">Ditt forslag</span>
          <div class="sx-2"><label class="lbl">Tidspunkt<input id="sxPT" type="time"${dayDiff(s.ends_at) === dayDiff(s.starts_at) ? ` min="${hm(s.starts_at)}" max="${hm(s.ends_at)}"` : ''} value="${hm(s.starts_at)}"></label>
          <label class="lbl">Kommentar<input id="sxPC" class="txt" type="text" maxlength="120" placeholder="Valgfritt"></label></div>
          <button class="btn" data-a="sxprop:${s.id}" ${ui.sxBusy ? 'disabled' : ''}>Foreslå</button></section>`;
  }
  const pick = p => s.plan ? `<small class="muted">${p.plan === 'same' ? 'samme økt' : 'egen økt'}</small>` : '';
  h += `<h3>Med på timen</h3><div class="sx-people"><span>${av(s.owner)}${own ? 'Deg' : uname(s.owner)}</span>${ps.map(p => `<span>${av(p.user_id)}<span>${p.user_id === me ? 'Deg' : uname(p.user_id)}${pick(p)}</span></span>`).join('')}</div>`;
  const ch = SX.chats.find(c => c.session_id === s.id);   // bare eieren og de påmeldte er med i chatten
  if (ch) h += `<button class="btn ghost" data-a="chopen:${ch.id}">Chat for timen${ch.unread ? ' · ' + ch.unread + ' nye' : ''}</button>`;
  if (own) {
    if (cancelled) h += `<button class="btn ghost" data-a="sxdel:${s.id}">Slett timen</button>`;
    else h += `<div class="sx-form" style="gap:8px"><button class="btn ghost" data-a="sxedit:${s.id}">Endre time</button>
      ${ui.confirm === 'sxc:' + s.id ? `<div class="row"><button class="btn danger sm" data-a="sxcancel:${s.id}">Ja, avlys</button><button class="btn ghost sm" data-a="cancel">Nei</button></div>`
        : `<button class="btn danger" data-a="confirm:sxc:${s.id}">Avlys timen</button>`}</div>`;
  } else if (s.kind === 'fixed' && !cancelled) {
    h += joined ? `<button class="btn ghost" data-a="sxleave:${s.id}">Meld av</button>` : s.plan ? '' : `<button class="btn" data-a="sxjoin:${s.id}">Bli med</button>`;
  }
  return h;
}

/* ---------- Sammen: chat ----------
   Samtaler med én venn, grupper og chat på timer. Bare de som er med, kan lese og skrive (se migrasjonen chat).
   Samtalelisten hentes sammen med resten av Sammen. Mens en samtale er åpen, hentes nye meldinger hvert fjerde sekund,
   og bare meldingene tegnes på nytt, så det du holder på å skrive, blir stående. */
const CH = {cid:null, msgs:[], loading:false, busy:false, err:''};
const chatOf = cid => SX.chats.find(c => c.id === cid);
// En timechat vises når noen har skrevet i den, eller når timen ikke er over og flere enn eieren er med
const chatShown = c => c.kind !== 'session' || (c.last_body && !c.last_system)
  || (c.members.length > 1 && !!c.s_start && Date.parse(c.s_start) + FIXED_LEN > Date.now());
const chatUnread = () => SX.chats.filter(c => c.unread > 0 && chatShown(c)).length;
const chatOther = c => c.members.find(m => m !== uid()) || uid();
const sxFriendIds = () => { const me = uid(); return SX.fr.filter(f => f.status === 'accepted').map(f => f.requester === me ? f.addressee : f.requester); };
function chatName(c){
  if (c.kind === 'group') return c.name;
  if (c.kind === 'dm') return uname(chatOther(c));
  if (!c.s_start) return 'Time';
  return (c.s_owner === uid() ? 'Din time' : 'Timen til ' + uname(c.s_owner)) + ' · ' + dayLabel(c.s_start).toLowerCase() + ' ' + hm(c.s_start);
}
const chatAv = c => c.kind === 'group' ? avTxt(c.name, c.name) : av(c.kind === 'dm' ? chatOther(c) : c.s_owner);
const chatWhen = t => { const n = dayDiff(t); return n === 0 ? hm(t) : n === -1 ? 'I går' : new Date(t).toLocaleDateString('nb-NO', {day:'numeric', month:'short'}); };

function chatRow(c){
  const who = c.last_system ? '' : c.last_user === uid() ? 'Du: ' : c.kind !== 'dm' && c.last_user ? uname(c.last_user) + ': ' : '';
  const sub = c.last_body ? who + c.last_body : c.kind === 'session' ? 'Chat for alle som er med på timen' : 'Ingen meldinger ennå';
  return `<button class="sx-news ch-row${c.unread ? ' new' : ''}" data-a="chopen:${c.id}">${chatAv(c)}
      <span><b>${esc(chatName(c))}</b><small>${esc(sub)}</small></span>
      ${c.unread ? `<i class="ch-n" aria-label="${c.unread} uleste">${c.unread}</i>` : `<i class="ch-t">${chatWhen(c.last_at)}</i>`}</button>`;
}
function vSxChats(h){
  const list = SX.chats.filter(chatShown), friends = sxFriendIds().length;
  if (friends) h += `<div class="ch-acts"><button class="btn ghost sm" data-a="sxview:cdm">Skriv til en venn</button><button class="btn sm" data-a="sxview:cnew">+ Ny gruppe</button></div>`;
  if (!list.length) return h + `<div class="empty"><h2>Ingen samtaler ennå</h2>
      <p class="muted">${friends ? 'Lag en gruppe med treningsvennene dine, eller skriv til én av dem. Timer du er med på, får sin egen chat.' : 'Legg til venner først, så kan dere skrive sammen.'}</p>
      ${friends ? '' : '<button class="btn" data-a="sxview:friends">Finn venner</button>'}</div>`;
  return h + `<div class="list">${list.map(chatRow).join('')}</div>`;
}

function vSxChat(cid){
  const c = chatOf(cid);
  if (!c) return `<button class="link" data-a="sxtab:chat">‹ Chat</button><p class="muted">Samtalen finnes ikke lenger.</p>`;
  const sub = c.kind === 'dm' ? '' : c.members.map(m => m === uid() ? 'deg' : uname(m)).join(', ');
  const acts = [];
  if (c.kind === 'group') acts.push(`<button class="quick" data-a="sxview:cadd:${c.id}">+ Legg til</button>`, ui.confirm === 'chl:' + c.id
    ? `<button class="quick" style="border-color:var(--miss);color:var(--miss)" data-a="chleave:${c.id}">Ja, forlat</button><button class="quick" data-a="cancel">Nei</button>`
    : `<button class="quick" data-a="confirm:chl:${c.id}">Forlat gruppen</button>`);
  if (c.kind === 'session' && SX.sess.some(s => s.id === c.session_id)) acts.push(`<button class="quick" data-a="sxopen:${c.session_id}">Se timen</button>`);
  return `<button class="link" data-a="sxtab:chat">‹ Chat</button>
    <header class="ch-head">${chatAv(c)}<div><h2>${esc(chatName(c))}</h2>${sub ? `<p class="muted small">${esc(sub)}</p>` : ''}</div></header>
    ${acts.length ? `<div class="sx-acts" style="flex-wrap:wrap">${acts.join('')}</div>` : ''}
    <div id="chatMsgs" class="ch-msgs">${chatMsgsHTML()}</div>
    <div class="ch-compose"><input id="chIn" class="txt" type="text" maxlength="1000" enterkeyhint="send" autocomplete="off" placeholder="Skriv en melding" aria-label="Melding" value="${esc(ui.chDraft || '')}">
      <button class="btn" data-a="chsend" onmousedown="event.preventDefault()">Send</button></div>`;
}
// Meldingene: dag som overskrift, navn og klokkeslett når en ny person skriver eller det har gått ti minutter
function chatMsgsHTML(){
  if (!CH.msgs.length) return CH.loading ? '<p class="muted small">Henter …</p>'
    : CH.err ? `<div class="warn">${esc(CH.err)}</div>` : '<p class="ch-sys">Ingen meldinger ennå. Si hei!</p>';
  const c = chatOf(CH.cid), dm = c && c.kind === 'dm';
  let h = '', day = '', prev = null;
  for (const m of CH.msgs) {
    const d = dayLabel(m.created_at);
    if (d !== day) { day = d; prev = null; h += `<p class="ch-day">${d}</p>`; }
    if (m.system) { prev = null; h += `<p class="ch-sys">${esc(m.body)}</p>`; continue; }
    const me = m.user_id === uid();
    if (!prev || prev.user_id !== m.user_id || Date.parse(m.created_at) - Date.parse(prev.created_at) > 10 * 6e4)
      h += `<p class="ch-who${me ? ' me' : ''}">${me || dm ? '' : uname(m.user_id) + ' · '}${hm(m.created_at)}</p>`;
    h += `<div class="ch-msg${me ? ' me' : ''}">${esc(m.body)}</div>`;
    prev = m;
  }
  return h + (CH.err ? `<p class="small warn-t">${esc(CH.err)}</p>` : '');
}
const chatBottom = () => { const sc = $('#scroller'); if (sc) sc.scrollTop = sc.scrollHeight; };
function chatPaint(force){
  const el = $('#chatMsgs'), sc = $('#scroller'); if (!el) return;
  const near = sc && sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
  el.innerHTML = chatMsgsHTML();
  if (force || near) chatBottom();
}
// Legg til nye meldinger (bare de som er nyere enn den siste vi har), og merk samtalen som lest
function chatAdd(rows){
  const last = CH.msgs.length ? CH.msgs[CH.msgs.length - 1].id : 0, add = rows.filter(m => m.id > last);
  CH.msgs.push(...add);
  return add.length;
}
// Merker samtalen som lest og sier fra at den står åpen på skjermen. Da holdes varsler fra den tilbake i ti sekunder.
function chatSeen(cid){
  rpc('chat_read', {cid, active: true}).catch(() => {});
  const c = chatOf(cid), m = CH.msgs[CH.msgs.length - 1];
  if (c) { c.unread = 0; if (m) Object.assign(c, {last_body: m.body, last_user: m.user_id, last_system: m.system, last_at: m.created_at}); }
  sxBadge();
}
async function chatOpen(cid){
  if (CH.cid !== cid) Object.assign(CH, {cid, msgs:[], err:''});
  CH.loading = !CH.msgs.length;
  Object.assign(ui, {tab:'together', sxTab:'chat', sxView:'c:' + cid, confirm:null, chDraft:''});
  render(); chatBottom();
  await chatFetch(true);
}
async function chatFetch(first){
  const cid = CH.cid; if (!cid || CH.busy || !auth) return;
  CH.busy = true;
  const last = CH.msgs.length ? CH.msgs[CH.msgs.length - 1].id : 0;
  try {
    const rows = await db('messages', 'select=id,user_id,body,system,created_at&conversation_id=eq.' + cid +
      (last ? '&id=gt.' + last + '&order=id&limit=200' : '&order=id.desc&limit=100'));
    if (cid !== CH.cid) return;
    CH.loading = false; CH.err = '';
    const n = chatAdd(last ? rows : rows.reverse());
    chatSeen(cid);   // hvert fjerde sekund: samtalen står fortsatt åpen
    if (n || first) chatPaint(first);
  } catch(e) {
    if (cid === CH.cid) { CH.loading = false; CH.err = sxErr(e); chatPaint(); }
  } finally { CH.busy = false; }
}
async function chatSend(){
  const inp = $('#chIn'), body = (inp ? inp.value : '').trim(), cid = CH.cid;
  if (!body || !cid || ui.chSending) return;
  ui.chSending = true;
  try {
    const rows = await db('messages', '', {method:'POST', headers:{Prefer:'return=representation'}, body:{conversation_id: cid, body}});
    if (inp) inp.value = '';
    ui.chDraft = '';
    if (cid === CH.cid && chatAdd(rows || [])) { chatSeen(cid); chatPaint(true); }
  } catch(e) { toast(sxErr(e)); }
  finally { ui.chSending = false; }
}
// Samtalelisten på nytt mens du ser på den. Er det nye folk i en samtale, hentes alt, så navnene kommer med.
async function chatListRefresh(){
  if (!auth || !SX.me) return;
  try {
    const chats = await rpc('chat_list');
    if (chats.some(c => c.members.some(m => !SX.ppl[m]))) return sxLoad();
    SX.chats = chats; sxBadge();
    if (ui.tab === 'together' && ui.sxTab === 'chat' && (ui.sxView || 'list') === 'list' && !isTyping()) render();
  } catch(e) {}
}
// Mens Sammen står åpen: samtalen hvert fjerde sekund, samtalelisten hvert 16., og at du er aktiv hvert minutt. Oversikten og Venner hentes hvert
// 32. sekund, så forespørsler, svar og nye timer kommer uten at appen må startes på nytt. Ikke i skjemaer, der
// en ny tegning ville tatt med seg det du holder på med.
let chatTick = 0;
setInterval(() => {
  if (!auth || document.visibilityState !== 'visible' || ui.tab !== 'together') return;
  chatTick++;
  const v = ui.sxView || 'list';
  if (chatTick % 15 === 0) sxPing(true);   // aktiv nå: omtrent hvert minutt
  if (/^c:/.test(v)) chatFetch();
  else if ((v === 'list' || v === 'friends') && chatTick % 8 === 0) sxLoad(true);
  else if (ui.sxTab === 'chat' && chatTick % 4 === 0) chatListRefresh();
}, 4000);

// Velg venner: ny gruppe, legg til i en gruppe, eller skriv til én venn
function vSxPick(mode, cid){
  const c = cid && chatOf(cid), busy = ui.sxBusy ? 'disabled' : '';
  const fr = sxFriendIds().filter(id => !c || !c.members.includes(id)).sort((a, b) => uname(a).localeCompare(uname(b)));
  const back = c ? `<button class="link" data-a="chopen:${c.id}">‹ ${esc(chatName(c))}</button>` : `<button class="link" data-a="sxtab:chat">‹ Chat</button>`;
  const none = `<p class="muted small">${c ? 'Alle vennene dine er allerede med.' : 'Du har ingen venner ennå. Legg dem til under Venner.'}</p>`;
  if (mode === 'cdm') return back + `<header class="head"><h1>Skriv til</h1></header>` + (fr.length
    ? `<div class="sx-list">${fr.map(id => `<button class="sx-row ch-pick" data-a="chdm:${id}">${av(id)}<span><b>${uname(id)}</b></span></button>`).join('')}</div>` : none);
  const list = fr.length ? `<div class="sx-list">${fr.map(id => `<label class="sx-row ch-pick">${av(id)}<span><b>${uname(id)}</b></span>
      <input type="checkbox" class="ch-ck" value="${id}" aria-label="Velg ${uname(id)}"></label>`).join('')}</div>` : none;
  if (mode === 'cadd') return back + `<header class="head"><h1>Legg til</h1><p class="muted">Du kan legge til vennene dine. De ser hele samtalen, også det som er skrevet før.</p></header>`
    + list + (fr.length ? `<button class="btn" data-a="chaddgo:${c.id}" ${busy}>Legg til</button>` : '');
  return back + `<header class="head"><h1>Ny gruppe</h1></header>
    <section class="box sx-form"><label class="lbl">Navn<input id="chName" class="txt" type="text" maxlength="40" placeholder="For eksempel Treningsgruppen"></label></section>
    <h3>Velg venner</h3>${list}${fr.length ? `<button class="btn" data-a="chcreate" ${busy}>Lag gruppe</button>` : ''}
    <p class="muted small">Alle i gruppen kan legge til vennene sine.</p>`;
}
const chatPicked = () => [...document.querySelectorAll('.ch-ck:checked')].map(x => x.value);
const chatGo = () => { const id = ui.chGo; ui.chGo = null; if (id) chatOpen(id); };

// Konto under Innstillinger
function vSxAccount(){
  return `<h3>Konto for Sammen</h3>
    <div class="box">${auth
      ? `<p>${SX.me ? `Innlogget som <b>@${esc(SX.me.username)}</b>` : 'Innlogget'} <span class="muted">· ${esc(auth.user.email || '')}</span></p>

// Kjør en handling mot serveren, vis feil som melding, og hent på nytt etterpå
async function sxDo(fn, okMsg){
  if (ui.sxBusy) return;
  ui.sxBusy = true;
  try { await fn(); if (okMsg) toast(okMsg); ui.confirm = null; await sxLoad(); if (auth && SX.me && ui.tab === 'together') sxSeen(); }
  catch(e) { toast(e.status || e.code ? sxErr(e) : (e.message || sxErr(e))); }
  finally { ui.sxBusy = false; render(); }
}
// Logg inn eller lag konto med e-post og passord. Uten e-postbekreftelse får du en innlogging med en gang.
async function sxAuth(kind){
  const email = (($('#sxE') || {}).value || '').trim(), pw = ($('#sxP') || {}).value || '';
  ui.sxEmail = email;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { ui.sxMsg = 'Skriv en gyldig e-postadresse.'; render(); return; }
  if (kind === 'signup' ? pw.length < 8 : !pw) { ui.sxMsg = kind === 'signup' ? 'Passordet må ha minst 8 tegn.' : 'Skriv passordet ditt.'; render(); return; }
  ui.sxBusy = true; ui.sxMsg = ''; render();
  try {
    const d = await sbFetch(kind === 'signup' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password', {method:'POST', auth:false, body:{email, password: pw}});
    if (!d || !d.access_token) throw new Error('Kontoen er laget, men kan ikke brukes ennå. Prøv å logge inn.');
    setSession(d); ui.sxMode = 'login'; ui.sxBusy = false;
    toast(kind === 'signup' ? 'Kontoen er laget' : 'Du er logget inn');
    if (kind === 'login') syncAfterLogin();
    await sxOpen();
  } catch(e) {
    ui.sxMsg = e.code === 'user_already_exists' || /already registered/i.test(e.message) ? 'Det finnes allerede en konto med denne e-posten. Logg inn i stedet.'
      : e.code === 'invalid_credentials' || (kind === 'login' && e.status === 400) ? 'Feil e-post eller passord.'
      : e.code === 'weak_password' ? 'Passordet er for svakt. Bruk minst 8 tegn og gjerne både bokstaver og tall.'
      : e.status === 429 ? 'For mange forsøk. Vent litt og prøv igjen.' : sxErr(e);
  }
  ui.sxBusy = false; render();
}
async function sxForgot(){
  const email = ($('#sxE') ? $('#sxE').value : ui.sxEmail || '').trim(); ui.sxEmail = email;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { ui.sxMsg = 'Skriv en gyldig e-postadresse.'; render(); return; }
  ui.sxBusy = true; ui.sxMsg = ''; render();
  try { await sbFetch('/auth/v1/recover', {method:'POST', auth:false, body:{email}}); ui.sxForgotSent = true; toast('Koden er sendt'); }
  catch(e) { ui.sxMsg = e.status === 429 ? 'For mange forsøk. Vent litt og prøv igjen.' : sxErr(e); }
  ui.sxBusy = false; render();
}
// Glemt passord: koden fra e-posten gir en innlogging, og så lagres det nye passordet med en gang
async function sxResetPw(){
  const token = (($('#sxC') || {}).value || '').replace(/\D/g, ''), pw = ($('#sxP') || {}).value || '';
  if (token.length < 6) { ui.sxMsg = 'Skriv inn koden fra e-posten.'; render(); return; }
  if (pw.length < 8) { ui.sxMsg = 'Passordet må ha minst 8 tegn.'; render(); return; }
  ui.sxBusy = true; ui.sxMsg = ''; render();
  try {
    setSession(await sbFetch('/auth/v1/verify', {method:'POST', auth:false, body:{type:'recovery', email: ui.sxEmail, token}}));
  } catch(e) {
    ui.sxMsg = e.status === 400 || e.status === 403 ? 'Koden stemmer ikke eller har gått ut. Prøv igjen, eller send en ny kode.' : sxErr(e);
    ui.sxBusy = false; render(); return;
  }
  try {
    await sbFetch('/auth/v1/user', {method:'PUT', body:{password: pw}});
    ui.sxForgotSent = false; ui.sxMode = 'login'; ui.sxBusy = false; toast('Passordet er endret');
    await sxOpen();
  } catch(e) {
    ui.sxView = 'newpw';   // innlogget med koden, men passordet ble ikke lagret: prøv igjen på siden for nytt passord
    ui.sxMsg = e.code === 'same_password' ? 'Velg et annet passord enn det gamle.' : e.code === 'weak_password' ? 'Passordet er for svakt.' : sxErr(e);
  }
  ui.sxBusy = false; render();
}
async function sxNewPw(){
  const pw = ($('#sxP') || {}).value || '';
  if (pw.length < 8) { ui.sxMsg = 'Passordet må ha minst 8 tegn.'; render(); return; }
  ui.sxBusy = true; ui.sxMsg = ''; render();
  try { await sbFetch('/auth/v1/user', {method:'PUT', body:{password: pw}}); ui.sxView = 'list'; toast('Passordet er endret'); ui.sxBusy = false; await sxOpen(); }
  catch(e) { ui.sxMsg = e.code === 'same_password' ? 'Velg et annet passord enn det gamle.' : e.code === 'weak_password' ? 'Passordet er for svakt.' : sxErr(e); }
  ui.sxBusy = false; render();
}
async function sxUser(){
  const u = ($('#sxU').value || '').trim().toLowerCase().replace(/^@/, ''), n = ($('#sxN').value || '').trim();
  ui.sxU = u; ui.sxN = n;
  if (!/^[a-z0-9._]{3,20}$/.test(u)) { ui.sxMsg = 'Brukernavnet må ha 3–20 tegn: små bokstaver, tall, punktum og understrek.'; render(); return; }
  ui.sxBusy = true; ui.sxMsg = ''; render();
  try { await db('profiles', '', {method:'POST', body:{id: uid(), username: u, display_name: n || null}}); ui.sxBusy = false; await sxOpen(); }
  catch(e) { ui.sxMsg = e.code === '23505' ? 'Brukernavnet er tatt. Prøv et annet.' : sxErr(e); }
  ui.sxBusy = false; render();
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const [a, ...r] = b.dataset.a.split(':');
  switch (a) {
    case 'tab': if (ui.tab === 'together' && r[0] !== 'together') sxPing(false);
      ui.tab = r[0]; ui.detail = null; ui.stack = []; ui.plan = null; ui.confirm = null; ui.free = false; ui.bank = false; ui.wod = null; ui.logEdit = null;
      if (r[0] === 'together') { ui.sxView = 'list'; sxOpen(); }
      render(); toTop(); break;
    // Undersider i Plan: Tilbake går dit du kom fra (planen, biblioteket eller guiden)
    case 'open': case 'go': if (r[0] !== 'settings') ui.tab = 'plan'; (ui.stack = ui.stack || []).push(ui.detail); ui.detail = r[0]; ui.confirm = null; render(); toTop(); break;
    case 'back': ui.detail = (ui.stack || []).pop() || null; ui.confirm = null; render(); toTop(); break;
    case 'activate': activate(r[0]); break;
    case 'set': {
      const ex = S.draft.ex[+r[0]], x = ex.sets[+r[1]];
      if (x.am) x.d = x.d == null ? x.t : null;
      else x.d = x.d == null ? x.t : (x.d > 0 ? x.d - 1 : null);
      if (x.d != null) startRest(ex.rest);
      ui.fresh = r[0] + ':' + r[1];
      save(); trainTick(); render(); wake(); break;
    }
    // Trykk på arket: neste oppvarmingssett, ellers neste arbeidssett, føres inn med målet som reps
    case 'next': {
      const ei = +r[0], s = S.draft, e = s && s.ex[ei]; if (!e) break;
      const wk = !e.sets.some(x => x.d != null) && wuKind(s, ei), done = e.wuDone || [];
      const wu = wk ? warmups(e.slot, e.sets[0].w, e.sets[0].t, wk) : [];
      const wi = wu.findIndex(([w, n]) => !done.includes(w + 'x' + n));
      if (wi > -1) {
        const kk = wu[wi][0] + 'x' + wu[wi][1];
        e.wuDone = done.concat(kk); ui.fresh = 'wu:' + ei + ':' + kk;
        startRest(wi === wu.length - 1 ? REST.warmupLast : REST.warmup);
      } else {
        const si = e.sets.findIndex(x => x.d == null); if (si < 0) break;
        e.sets[si].d = e.sets[si].t; ui.fresh = ei + ':' + si;
        startRest(e.rest);

      save(); trainTick(); render(); wake(); break;
    }
    case 'am': { const x = S.draft.ex[+r[0]].sets[+r[1]]; x.d = Math.max(0, Math.min(99, x.d + (+r[2]))); save(); render(); break; }
    case 'rpe': S.draft.ex[+r[0]].rpe = +r[1]; save(); render(); break;
    case 'q': S.draft.ex[+r[0]].q = r[1]; save(); render(); break;
    case 'w': { const e = S.draft.ex[+r[0]], min = LIFTS[e.lift] && LIFTS[e.lift].bar ? BAR() : 2.5;
      e.sets.forEach(x => { if (!(e.adj && x.d != null)) x.w = Math.max(min, x.w + 2.5*(+r[1])); }); save(); render(); break; }
    case 'wu': {
      const e = S.draft.ex[+r[0]], k = r[1]; e.wuDone = e.wuDone || [];
      const j = e.wuDone.indexOf(k);
      if (j > -1) e.wuDone.splice(j, 1); else { e.wuDone.push(k); ui.fresh = 'wu:' + r[0] + ':' + k; startRest(r[2] === '1' ? REST.warmupLast : REST.warmup); }
      save(); render(); wake(); break;
    }
    case 'cut': { const e = S.draft.ex[+r[0]]; if (e.sets.length > 1 && e.sets[e.sets.length-1].d == null) { e.sets.pop(); e.cut = (e.cut||0) + 1; } save(); render(); break; }

    case 'sxjoin': sxDo(() => db('participants', '', {method:'POST', body:{session_id: r[0], plan: r[1] === 'same' ? 'same' : 'own'}}), r[1] === 'same' ? 'Du er med og kjører samme økt' : 'Du er med'); break;
    case 'sxplan': sxDo(() => db('participants', 'session_id=eq.' + r[0] + '&user_id=eq.' + uid(), {method:'PATCH', body:{plan: r[1]}}), r[1] === 'same' ? 'Du kjører samme økt' : 'Du kjører din egen økt'); break;
    case 'sxstart': guestStart(r[0]); break;
    case 'sxgo': ui.tab = 'together'; ui.sxView = 's:' + r[0]; ui.confirm = null; sxOpen(); render(); toTop(); break;
    case 'guestquit': S.draft = S.parked || null; delete S.parked; ui.confirm = null; ui.rest = null; updateRest(); save(); render(); toTop(); toast('Engangsøkta er avbrutt'); break;
    case 'sxleave': sxDo(() => db('participants', 'session_id=eq.' + r[0] + '&user_id=eq.' + uid(), {method:'DELETE'}), 'Du er meldt av'); break;
    case 'sxprop': {
      const s0 = SX.sess.find(x => x.id === r[0]), t = ($('#sxPT') || {}).value, c = (($('#sxPC') || {}).value || '').trim();
      if (!s0 || !/^\d{1,2}:\d{2}/.test(t || '')) { toast('Velg et tidspunkt'); break; }
      const d0 = new Date(s0.starts_at), [hh, mm] = t.split(':').map(Number); d0.setHours(hh, mm, 0, 0);
      if (d0 < new Date(s0.starts_at)) d0.setDate(d0.getDate() + 1);   // vinduet går over midnatt
      if (d0 < new Date(s0.starts_at) || d0 > new Date(s0.ends_at)) { toast('Velg en tid mellom ' + sxTime(s0).replace('–', ' og ')); break; }
      sxDo(() => db('proposals', '', {method:'POST', body:{session_id: s0.id, proposed_at: d0.toISOString(), comment: c || null}}), 'Forslaget er sendt');
      break;
    }
    case 'sxunprop': sxDo(() => db('proposals', 'session_id=eq.' + r[0] + '&user_id=eq.' + uid(), {method:'DELETE'}), 'Forslaget er trukket'); break;
    case 'sxpick': sxDo(() => rpc('pick_proposal', {pid: r[0]}), 'Tidspunktet er valgt'); break;
    case 'sxcancel': sxDo(() => db('sessions', 'id=eq.' + r[0], {method:'PATCH', body:{cancelled_at: new Date().toISOString()}}), 'Timen er avlyst'); break;
    case 'sxdel': ui.sxView = 'list'; sxDo(() => db('sessions', 'id=eq.' + r[0], {method:'DELETE'}), 'Timen er slettet'); break;
    case 'sxadd': sxDo(() => db('friendships', '', {method:'POST', body:{addressee: r[0]}}), 'Forespørselen er sendt').then(() => { const el = $('#sxRes'); if (el) el.innerHTML = sxResHTML(); }); break;
    case 'sxaccept': sxDo(() => db('friendships', 'requester=eq.' + r[0] + '&addressee=eq.' + uid(), {method:'PATCH', body:{status:'accepted', accepted_at: new Date().toISOString()}}), 'Dere er venner nå'); break;
    case 'sxdecline': { const me = uid();
      sxDo(() => db('friendships', 'or=' + encodeURIComponent(`(and(requester.eq.${me},addressee.eq.${r[0]}),and(requester.eq.${r[0]},addressee.eq.${me}))`), {method:'DELETE'}));
      break; }
    case 'sxlive': { const show = ev.target.checked;
      sxDo(async () => { await rpc('presence_show', {show}); SX.hidden = !show; if (show && ui.tab === 'together') sxPing(true); if (show && trainingNow()) trainSend(true); },
        show ? 'Vennene ser når du er i Sammen eller trener' : 'Vennene ser ikke lenger når du er i Sammen eller trener'); break; }
    case 'sxlogout': sxPing(false); if (TR.on) trainSend(false); pushOff().finally(() => {   // en annen som logger inn på telefonen, skal ikke få varslene dine
      const tok = auth && auth.access_token;
      if (tok) fetch(SB_URL + '/auth/v1/logout', {method:'POST', headers:{apikey: SB_KEY, Authorization: 'Bearer ' + tok}}).catch(() => {});
      saveAuth(null); syncOff(); sxReset(); ui.confirm = null; render(); toast('Du er logget ut');
    }); break;
    case 'sxdelacc': sxDo(async () => { await pushOff(); await rpc('delete_account'); saveAuth(null); syncOff(); sxReset(); }, 'Kontoen er slettet'); break;
    case 'pushon': sxDo(pushOn, 'Varsler er på'); break;
    case 'pushoff': sxDo(pushOff, 'Varsler er slått av'); break;
    case 'pushtest': sxDo(() => rpc('push_test'), 'Testvarselet er sendt'); break;
    case 'pushno': S.settings.pushNo = true; save(); render(); break;
    case 'sxtab': ui.sxTab = r[0]; ui.sxView = 'list'; ui.confirm = null; render(); toTop(); if (r[0] === 'chat') chatListRefresh(); break;
    case 'chopen': chatOpen(r[0]); break;
    case 'chsend': chatSend(); break;
    case 'chdm': sxDo(async () => { ui.chGo = await rpc('chat_dm', {friend: r[0]}); }).then(chatGo); break;
    case 'chcreate': {
      const name = (($('#chName') || {}).value || '').trim(), members = chatPicked();
      if (!name) { toast('Gi gruppen et navn'); break; }
      if (!members.length) { toast('Velg minst én venn'); break; }
      sxDo(async () => { ui.chGo = await rpc('chat_group', {name, members}); }, 'Gruppen er laget').then(chatGo); break;
    }
    case 'chaddgo': {
      const members = chatPicked();
      if (!members.length) { toast('Velg minst én venn'); break; }
      sxDo(async () => { await rpc('chat_add', {cid: r[0], members}); ui.chGo = r[0]; }, 'Lagt til').then(chatGo); break;
    }
    case 'chleave': sxDo(async () => { await rpc('chat_leave', {cid: r[0]}); ui.sxView = 'list'; CH.cid = null; }, 'Du har forlatt gruppen'); break;
    case 'restadd': if (ui.rest) { const now = Date.now(); ui.rest.end = Math.max(ui.rest.end, now) + (+r[0])*1000; ui.rest.total = Math.max(ui.rest.total, (ui.rest.end - now)/1000); ui.rest.done = false; updateRest(); } break;
    case 'exopen': { const o = ui.exOpen = ui.exOpen || {}; o[r[0]] = !o[r[0]]; render(); break; }
    case 'restscale': S.settings.restScale = +r[0]; save(); render(); break;
    case 'sound': S.settings.sound = !S.settings.sound; save(); unlockAudio(); render(); if (S.settings.sound) { beep(); toast('Lyd er på'); } break;
    case 'confirm': ui.confirm = r.join(':'); render(); break;
    case 'cancel': ui.confirm = null; render(); break;
    case 'quit': S.active = null; dropOwnDraft(); ui.summary = null; ui.confirm = null; save(); render(); toast('Programmet er avsluttet'); break;
    case 'reset': syncOff(); S = fresh(); mergeCustom();   // kopien i skyen skal ikke overskrives av en tom logg ui.summary = null; ui.confirm = null; ui.exportText = ''; save(); ui.tab = 'plan'; ui.detail = null; ui.stack = []; render(); toast('Alle data er slettet'); break;
    case 'export': ui.exportText = JSON.stringify(S); render(); break;
    case 'copy': {
      const ta = $('#exportBox');
      const fallback = () => { ta.focus(); ta.select(); toast('Teksten er merket. Kopier den manuelt.'); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast('Kopiert'), fallback); } catch(e) { fallback(); }
      break;
    }
    case 'import': {
      try {
        const o = JSON.parse($('#importBox').value);
        if (!o || !Array.isArray(o.history)) throw 0;
        S = Object.assign(fresh(), o); mergeCustom(); save(); render(); toast(o.history.length + ' økter importert');
      } catch(e) { toast('Teksten ble ikke gjenkjent som en Stanga-eksport'); }
      break;
    }
  }
});

// Sammen: skjemafeltene for ny time lagres mens du skriver, så de overlever at skjermen tegnes på nytt
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.sxf && ui.sxForm && t.type !== 'radio') ui.sxForm[t.dataset.sxf] = t.value;
  if (t.id === 'sxQ') { ui.sxQ = t.value; sxSearch(t.value); }
  if (t.id === 'chIn') ui.chDraft = t.value;
});
document.addEventListener('keydown', ev => {
  if (ev.target.id === 'chIn' && ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); chatSend(); }
  // Arket i økta er en knapp laget av en div, så Enter og mellomrom må gjøre det samme som et trykk
  if (ev.target.matches && ev.target.matches('[role="button"][data-a]') && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.sxf === 'wk' && ui.sxForm) { ui.sxForm.wk = t.value; render(); }
});

/* iOS gir av og til hjemskjerm-appen et vindu som slutter over skjermkanten.
   Da måler vi avstanden og strekker app-skallet ned til kanten. */
const isTyping = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
function fitViewport(){
  if (isTyping()) return;          // tastaturet er oppe: ikke mål nå
  try {
    const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    const portrait = innerHeight > innerWidth;
    const gap = Math.round(screen.height - innerHeight);
    const fix = standalone && portrait && gap > 0 && gap < 140 ? gap : 0;
    document.querySelector('.app').style.bottom = fix ? (-fix) + 'px' : '';
    ui.gapFix = fix;
  } catch(e) {}
}
let fitT;
function scheduleFit(ms){
  clearTimeout(fitT);
  fitT = setTimeout(() => { if (isTyping()) return; scrollTo(0, 0); fitViewport(); }, ms || 250);
}
fitViewport();
addEventListener('resize', () => scheduleFit());
if (window.visualViewport) visualViewport.addEventListener('resize', () => scheduleFit());
addEventListener('orientationchange', () => scheduleFit(400));
document.addEventListener('focusout', () => scheduleFit(350));   // tastaturet lukkes

document.addEventListener('input', ev => {
  if (ev.target.id === 'note' && S.draft) { S.draft.note = ev.target.value; save(); }
  else if (ev.target.dataset && ev.target.dataset.ppsplit) {
    const ctx = ev.target.dataset.ppsplit, pk = ctx === 'session' ? S.draft && S.draft.pete : ui.freePete;
    if (pk) { pk.split = ev.target.value; if (ctx === 'session') save(); }
  }
  else if (ev.target.dataset && ev.target.dataset.mcmin) {
    const ctx = ev.target.dataset.mcmin; if (ctx === 'session' && !S.draft) return;
    mcOf(ctx).min = ev.target.value.replace(/[^\d]/g, '').slice(0, 3); if (ctx === 'session') save();
  }
  else if (ev.target.id === 'freeNote') ui.freeNote = ev.target.value;
  else if (ev.target.dataset && ev.target.dataset.orm && ui.detail) {
    const p = prog(ui.detail), l = ev.target.dataset.orm, orm = parseFloat(String(ev.target.value).replace(',', '.'));
    if (!(orm > 0) || !p.derive) return;
    document.querySelectorAll('[data-key]').forEach(inp => {
      const k = inp.dataset.key; if (k.split('.')[0] !== l || inp.dataset.edited) return;
      const v = p.derive(k, orm); if (v != null) inp.value = fmt(v);
    });
  }
  else if (ev.target.dataset && ev.target.dataset.ax && ui.ax) ui.ax[ev.target.dataset.ax] = ev.target.value;
  else if (ev.target.dataset && ev.target.dataset.axres && S.draft && S.draft.cond) {
    (S.draft.cond.res = S.draft.cond.res || {})[ev.target.dataset.axres] = ev.target.value; save();
  }
  else if (ev.target.dataset && ev.target.dataset.key) ev.target.dataset.edited = '1';
  else if (ev.target.id === 'wodRes') {
    if (ev.target.dataset.ctx === 'session' && S.draft && S.draft.wod) { S.draft.wod.resultat = ev.target.value; save(); }
    else if (ui.freeWod) ui.freeWod.resultat = ev.target.value;
  }
  else if (ev.target.id === 'bq') {
    clearTimeout(ui.bqT);
    ui.bqT = setTimeout(() => { ui.bf.q = ev.target.value; ui.bankN = 30; const el = $('#bankList'); if (el) el.innerHTML = bankListHTML(); }, 150);
  }
});

document.addEventListener('change', ev => {
  if (ev.target.dataset && ev.target.dataset.max) {
    const v = parseFloat(String(ev.target.value).replace(',', '.'));
    if (v > 0) { S.maxes[ev.target.dataset.max] = v; save(); toast('Lagret'); } else { ev.target.value = fmt(S.maxes[ev.target.dataset.max]); }
    return;
  }
  // 1RM som mangler for å kjøre samme økt som en venn. Lagres under Maksløft, og vektene regnes ut med en gang.
  if (ev.target.dataset && ev.target.dataset.gmax) {
    const v = parseFloat(String(ev.target.value).replace(',', '.'));
    if (v > 0 && v < 500) { S.maxes[ev.target.dataset.gmax] = v; save(); render(); toast('1RM i ' + liftName(ev.target.dataset.gmax).toLowerCase() + ' er lagret'); }
    else if (ev.target.value.trim()) toast('Skriv 1RM som et tall, for eksempel 82,5');
    return;
  }
  if (ev.target.dataset && ev.target.dataset.ppref) {
    const sec = parseSplit(ev.target.value), m = ev.target.dataset.ppref;
    if (sec && sec > 60) { S.settings.pete.ref[m] = sec; S.settings.pete.refAt = Object.assign({}, S.settings.pete.refAt, {[m]: Date.now()}); save(); render(); toast('Testet tid lagret. Den brukes til nyere økter gir et nytt anslag.'); }
    else if (ev.target.value.trim()) toast('Skriv tiden som minutter:sekunder, f.eks. 7:20');
    return;
  }
  if (ev.target.dataset && ev.target.dataset.bf) { ui.bf[ev.target.dataset.bf] = ev.target.value; ui.bankN = 30; render(); return; }
  if (ev.target.dataset && ev.target.dataset.axsel) {
    const f = ui.ax || axFormInit(), v = ev.target.value;
    if (ev.target.dataset.axsel === 'ev') { f.ev = v; if (v !== '') f.date = AX_EVENTS[+v][0]; }
    else f.date = v;
    render(); return;
  }
  const s = ev.target.closest('[data-swap]'); if (!s) return;
  ui.swapSel = {slot: s.dataset.swap, lift: s.value}; render();
});

render();

/* ---------- PWA: offline og varig lagring (virker når siden ligger på din egen nettadresse) ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // updateViaCache:'none': sjekk alltid sw.js direkte mot GitHub, ikke mot nettleserens lager
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {});
}

/* ---------- Ny versjon uten å skrive versjon i adressen ----------
   Når appen åpnes, hentes den alltid fra nettet (se sw.js). Men iPhone vekker ofte appen fra
   bakgrunnen uten å laste den på nytt. Derfor sjekker vi APP_VERSION på GitHub når appen kommer
   i forgrunnen, høyst én gang i minuttet. Er den høyere, laster appen seg selv på nytt.
   Det er trygt: alt du trykker eller skriver, lagres med en gang. Holder du på å skrive, venter vi. */
let lastCheck = 0, newVersion = 0;
async function checkUpdate(){
  if (location.protocol !== 'https:' || !navigator.onLine || Date.now() - lastCheck < 60e3) return;
  lastCheck = Date.now();
  try {
    const res = await fetch('./index.html', {cache:'no-cache'});
    if (!res.ok) return;
    const m = (await res.text()).match(/APP_VERSION = (\d+)/);
    if (m && +m[1] > APP_VERSION) { newVersion = +m[1]; reloadWhenIdle(); }
  } catch(e) {}
}
function reloadWhenIdle(){
  if (!newVersion || isTyping()) return;   // prøv igjen når tastaturet lukkes
  try { sessionStorage.setItem(KEY + '.from', String(APP_VERSION)); } catch(e) {}
  location.reload();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
// Sammen: hent nytt når appen åpnes og våkner (høyst hvert minutt), så tallet i fanen stemmer
if (auth) setTimeout(() => {
  if (ui.tab !== 'together') return sxLoad();
  sxOpen();
  if (/^c:/.test(ui.sxView || '')) chatOpen(ui.sxView.slice(2));
}, 400);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && auth && Date.now() - SX.at > 60000) { if (ui.tab === 'together') sxOpen(); else sxLoad(); } });
// Aktiv nå: borte når appen legges bort, tilbake når den kommer fram igjen på Sammen
document.addEventListener('visibilitychange', () => { if (ui.tab === 'together') sxPing(document.visibilityState === 'visible'); });
// Skybackup: se etter endringer fra andre telefoner når appen åpnes og våkner, og lagre før den legges bort
const syncWake = () => { if (!syncOn()) return; if (SY.dirty) syncPush(); else if (Date.now() - SYNC.pulled > 30000) syncPull(); };
if (syncOn()) setTimeout(syncWake, 600);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') syncWake();
  else if (syncOn() && SY.dirty) syncPush();
});
addEventListener('online', syncWake);
addEventListener('pageshow', e => { if (e.persisted) checkUpdate(); });
addEventListener('online', checkUpdate);
document.addEventListener('focusout', () => setTimeout(reloadWhenIdle, 400));
// Etter en oppdatering: si fra én gang
try {
  const from = +sessionStorage.getItem(KEY + '.from');
  sessionStorage.removeItem(KEY + '.from');
  if (from && from < APP_VERSION) setTimeout(() => toast('Stanga er oppdatert til versjon ' + APP_VERSION), 500);
} catch(e) {}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
</script>
