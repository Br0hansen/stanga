// Resultatet i loggen: «5:02/km · 2:04/500 m · 15:30»
function axResTxt(c){
  const r = c.res || {};
  return [r.run && r.run + '/km', r.ski && r.ski + '/500 m', r.endrun && 'løp ' + r.endrun, r.endm && r.endm + ' m ski', r.mc, r.kg && r.kg + ' kg',
    r.slow && 'tregest: ' + AX_SLOW[r.slow].toLowerCase(), r.feel].filter(Boolean).join(' · ');
}
// Anslått stevnescore ut fra arbeidsmaksen og fartene
function axScore(a){
  const e = L => a.e1rm[sw(a, L)], S = axSpec(a.ax), P = axPace(a, 'run'), K = axPace(a, 'ski');
  const kg = Math.round(e('s2oh') + e('squat') * .95 + e('deadlift') * .93);
  const runT = P ? P * S.km : null, m = runT && K ? Math.round((1440 - runT - 20) / K * 500 / 10) * 10 : null;
  const full = (a.mc || []).filter(x => (x.kind === 'full' || x.kind === 'race') && x.sec).slice(-1)[0];
  return `<section class="box"><span class="lbl">Anslått stevnescore nå</span>
    <div class="ax-score"><div><b>${fmt(kg)}</b><span>kg i Strength</span></div>
      <div><b>${m ? fmt(m) : '–'}</b><span>${m ? 'meter ski etter ' + axTxt(runT) + ' løp' : 'meter ski: mangler fart'}</span></div>
      <div><b>${full ? axTxt(full.sec) : '–'}</b><span>Metcon X${full ? '' : ': ikke kjørt helt'}</span></div></div>
    <p class="small muted">Knebøy 2RM ≈ 95 % og markløft 3RM ≈ 93 % av arbeidsmaksen. Meterne bygger på 3 km-farten og skifarten nå.</p></section>`;
}

/* ---------- Bytte løft ----------
   Vekten lagres på LØFTET, ikke på plassen. Frontbøy får sin egen vekt, og knebøyvektene
   ligger urørt hvis du bytter tilbake. */
function refValue(p, a, L){
  if (p.prog === 'linear') return a.lifts[L] && a.lifts[L].w;
  if (p.prog === 'gzclp') return (a.lifts[L+'.T1'] || a.lifts[L+'.T2'] || {}).w;
  if (p.prog === '531' || p.prog === 'jugg') return a.tm[L];
  return a.e1rm && a.e1rm[L];
}
const refLabel = p => ({linear:'Arbeidsvekt', gzclp:'T1-vekt', '531':'Treningsmaks', jugg:'Arbeidsmaks'})[p.prog] || '1RM';
const ratio = L => LIFTS[L].r || 1;
const estFor = (p, a, from, to) => r25(refValue(p, a, from) / ratio(from) * ratio(to));
const slotsOf = p => [...new Set(p.days.flatMap(d => d.ex ? d.ex.map(e => e.lift) : [d.lift]))].filter(s => s && ALTS(s).length);

function doSwap(slot){
  const a = S.active, p = prog(a.programId), A = sw(a, slot);
  let B = ui.swapSel.lift;
  const W = parseFloat(String(($('#swW') || {}).value || '').replace(',', '.'));
  if (B === '__new') {
    const nm = String(($('#swName') || {}).value || '').replace(/[<>&"]/g, '').trim().slice(0, 40);
    if (!nm) { toast('Skriv inn et navn på øvelsen'); return; }
    if (!(W > 0)) { toast('Skriv inn en vekt for ' + nm.toLowerCase()); return; }
    const id = 'c_' + Date.now().toString(36);
    S.custom = S.custom || {};
    S.custom[id] = {n: nm, bar: ($('#swBar') || {}).checked ? 1 : 0, alt: slot};
    mergeCustom();
    B = ui.swapSel.lift = id;
  }
  if (refValue(p, a, B) == null) {
    if (!(W > 0)) { toast('Skriv inn en vekt for ' + liftName(B).toLowerCase()); return; }
    const k = W / refValue(p, a, A);
    Object.keys(a.lifts).forEach(key => {
      if (key !== A && !key.startsWith(A + '.')) return;
      const nk = B + key.slice(A.length), v = a.lifts[key];
      if (!a.lifts[nk]) a.lifts[nk] = Object.assign({}, v, {w: r25(v.w*k), fails:0, stage:0, last: v.last != null ? r25(v.last*k) : undefined});
    });
    if (p.prog === '531' || p.prog === 'jugg') a.tm[B] = r25(W);
    if (a.e1rm) { a.e1rm[B] = W; a.base[B] = W; }
  }
  a.swaps = a.swaps || {};
  if (B === slot) delete a.swaps[slot]; else a.swaps[slot] = B;
  const started = draftTouched();
  if (!started) dropOwnDraft();
  ui.swapSel = null; save(); render();
  toast(liftName(B) + (started ? ' gjelder fra neste økt' : ' er lagt inn'));
}

function swapRows(p, a){
  const slots = slotsOf(p);
  if (!slots.length) return '';
  return `<h3>Løft i programmet</h3><div class="box" style="gap:0">${slots.map(slot => {
    const cur = sw(a, slot), sel = ui.swapSel && ui.swapSel.slot === slot ? ui.swapSel.lift : cur;
    let h = `<div class="field"><label for="sw-${slot}">${liftName(slot)}</label>
      <select id="sw-${slot}" data-swap="${slot}">${[slot, ...ALTS(slot)].map(l => `<option value="${l}"${l === sel ? ' selected' : ''}>${liftName(l)}</option>`).join('')}
        <option value="__new"${sel === '__new' ? ' selected' : ''}>+ Egen øvelse …</option></select></div>`;
    if (sel === '__new') {
      h += `<div class="swapbox">
        <label for="swName" class="small">Navn på øvelsen</label>
        <input id="swName" class="txt" type="text" maxlength="40" placeholder="For eksempel hang snatch" autocomplete="off">
        <label class="chk small"><input id="swBar" type="checkbox" checked> Vanlig stang (viser skiver per side)</label>
        <label for="swW" class="small">${refLabel(p)} i øvelsen</label>
        <span class="inp"><input id="swW" type="text" inputmode="decimal" value="${fmt(refValue(p, a, cur))}">kg</span>
        <button class="btn sm" data-a="doswap:${slot}">Legg til</button>
        <span class="small muted">Øvelsen følger reglene for ${liftName(slot).toLowerCase()} i programmet.</span></div>`;
    } else if (sel !== cur) {
      h += refValue(p, a, sel) != null
        ? `<div class="swapbox"><span class="small muted">Vektene dine i ${liftName(sel).toLowerCase()} er lagret fra før.</span><button class="btn sm" data-a="doswap:${slot}">Bytt</button></div>`
        : `<div class="swapbox"><label for="swW" class="small">${refLabel(p)} i ${liftName(sel).toLowerCase()} (forslag ut fra ${liftName(cur).toLowerCase()})</label>
           <span class="inp"><input id="swW" type="text" inputmode="decimal" value="${fmt(estFor(p, a, cur, sel))}">kg</span><button class="btn sm" data-a="doswap:${slot}">Bytt</button></div>`;
    }
    return h;
  }).join('')}</div>
  <p class="muted small">Hvert løft har sin egen vekt. Bytter du tilbake, fortsetter du der du slapp.</p>`;
}

// Uke 4 og 8 er lette uker. Hopper du over en av dem, kjøres fasen før én uke til.
const spPhase = (wk, a) => {
  const skip = (a && a.skipDl) || {};
  if (wk <= 3) return 'p1';
  if (wk === 4) return skip.d4 ? 'p1' : 'd4';
  if (wk <= 7) return 'p2';
  if (wk === 8) return skip.d8 ? 'p2' : 'd8';
  if (wk <= 10) return 'p3';
  return wk === 11 ? 'tap' : 'test';
};
const spWeek = a => Math.floor(a.idx/3) + 1;

// 1RM i et sekundærløft, regnet fra hovedløftet i samme mønster
function extraMax(a, X){
  const M = sw(a, SP.base[X]);
  return a.e1rm[M] / ratio(M) * ratio(X);
}
function spExtraEx(a, slot, ph, opt){
  const list = (SP.extras[slot] || {})[opt && opt.from || ph] || [];
  return list.map(([X, n, r, pct]) => {
    const key = 'x.' + X + '.' + (opt && opt.from || ph);
    if (!a.lifts[key]) a.lifts[key] = {w: Math.max(BAR(), r25(extraMax(a, X) * pct))};
    let w = a.lifts[key].w, sets = n, reps = r;
    if (opt && opt.light) { sets = Math.max(1, Math.round(n/2)); w = Math.max(BAR(), r25(w * .9)); }
    if (ph === 'tap') w = Math.max(BAR(), r25(extraMax(a, X) * pct));
    return {key, lift:X, slot:X, part: ph === 'tap' || (opt && opt.light) ? 'extra-fixed' : 'extra', sp:1, rest:150,
            rpe:null, tag:'Sekundær', hint: X === 'cleanpull' ? 'Trekk eksplosivt til full strekk. Ingen catch.' : '', sets: mk(sets, reps, w)};
  });
}

function buildSP(p, a){
  const i = a.idx, wk = spWeek(a), day = p.days[i % 3], slot = day.lift, L = sw(a, slot), pc = slot === 'clean';
  const ph = spPhase(wk, a), rest = pc ? 150 : 210, ex = [];
  const skipped = (wk === 4 || wk === 8) && ph[0] === 'p';
  if (ph[0] === 'p') {
    const sc = SP.scheme[slot][ph];
    ['top','back'].forEach(part => {
      const [n, r, pct] = sc[part], key = L + '.' + ph + '.' + part;
      if (!a.lifts[key]) a.lifts[key] = {w: r25(a.e1rm[L] * pct)};   // ny fase: start fra aktuell 1RM
      ex.push({key, lift:L, slot, part, sp:1, rest, rpe:null, q:null, cut:0,
               tag: part === 'back' ? 'Backoff' : (n > 1 ? 'Singler' : 'Toppsett'), sets: mk(n, r, a.lifts[key].w)});
    });
    ex.push(...spExtraEx(a, slot, ph));
  } else if (ph[0] === 'd') {
    const D = SP.deload[ph], src = a.lifts[L + '.' + D.from + '.back'];
    const base = src ? (src.last != null ? src.last : src.w) : r25(a.e1rm[L] * SP.scheme[slot][D.from].back[2]);
    ex.push({key:L+'.deload', lift:L, slot, part:'deload', sp:1, rest, tag:'Lett uke', sets: mk(D[slot][0], D[slot][1], Math.max(BAR(), r25(base * .87)))});
    ex.push(...spExtraEx(a, slot, ph, {from: D.from, light: true}));
  } else if (ph === 'tap') {
    const T = SP.taper[slot];
    ex.push({key:L+'.taper', lift:L, slot, part:'taper', sp:1, rest, tag: pc ? 'Taper · singler' : 'Taper · toppsett', sets: mk(T.top[0], T.top[1], r25(a.e1rm[L] * T.top[2]))});
    if (T.back) ex.push({key:L+'.taper.b', lift:L, slot, part:'taper', sp:1, rest, tag:'Taper · backoff', sets: mk(T.back[0], T.back[1], r25(a.e1rm[L] * T.back[2]))});
    ex.push(...spExtraEx(a, slot, ph));
  } else {
    ex.push({key:L+'.test', lift:L, slot, part:'test', sp:1, rest, tag: pc ? 'Beste single' : 'Test 3RM',
             sets: mk(1, pc ? 1 : 3, r25(a.e1rm[L] * (pc ? .95 : .92)))});
  }
  return {programId:p.id, day: day.name, ph, wk,
          sub: 'Uke ' + wk + ' av 12 · ' + (skipped ? SP.phaseName[ph] + ' (ekstra uke)' : SP.phaseName[ph]), ex, started:Date.now()};
}

// Siste vurdering av toppsettet per hovedløft, og om estimert 1RM har holdt seg eller steget
function spReadiness(a){
  const p = prog('sp12');
  return p.days.map(d => {
    const L = sw(a, d.lift), hist = (a.e1log && a.e1log[L]) || [];
    const last = S.history.find(h => h.programId === 'sp12' && !h.skipped && h.date >= a.startedAt &&
      h.ex.some(e => e.lift === L && /Toppsett|Singler/.test(e.tag || '')));
    const e = last && last.ex.find(e => e.lift === L && /Toppsett|Singler/.test(e.tag || ''));
    const eff = !e ? null : d.lift === 'clean' ? (e.q === 'god' ? 'raske og rene' : e.q === 'treg' ? 'tregere' : e.q === 'teknisk' ? 'teknikk sviktet' : null)
                                               : (e.rpe != null ? 'RPE ' + fmt(e.rpe) : null);
    const effOk = !e ? null : d.lift === 'clean' ? e.q === 'god' : (e.rpe != null && e.rpe <= 9);
    const trendOk = hist.length < 2 ? null : hist[hist.length-1] >= hist[Math.max(0, hist.length-3)] * .99;
    return {name: liftName(L), eff, effOk, trendOk};
  });
}

function progressSP(p, a, s){
  const notes = [];
  s.ex.forEach(e => {
    if (!e.sets.some(x => x.d != null)) return;
    const name = liftName(e.lift) + ' · ' + e.tag.toLowerCase();
    const used = e.sets[0].w, allHit = e.sets.every(x => x.d != null && x.d >= x.t);
    if (e.part === 'deload') { notes.push({name, text:'Lett uke, ingen endring', kind:'same'}); return; }
    if (e.part === 'taper' || e.part === 'extra-fixed') { notes.push({name, text: e.part === 'taper' ? 'Taper, ingen endring' : 'Lett variant, ingen endring', kind:'same'}); return; }
    if (e.part === 'extra') {
      // Sekundærøvelser skal ligge rundt RPE 6–7,5: litt lettere enn hovedløftet
      const st = a.lifts[e.key], r = e.rpe; let next = used, kind = 'same', why;
      if (!allHit) { next = used - 2.5; kind = 'down'; why = 'Ikke alle reps'; }
      else if (r == null) why = 'Ingen RPE registrert';
      else if (r <= 6) { next = used + 2.5; kind = 'up'; why = 'RPE ' + fmt(r); }
      else if (r <= 7.5) why = 'RPE ' + fmt(r) + ', på mål';
      else { next = used - 2.5; kind = 'down'; why = 'RPE ' + fmt(r) + ', for tungt for en sekundærøvelse'; }
      st.last = used; st.w = next = Math.max(BAR(), next);
      notes.push({name, text: why + ': ' + (next === used ? 'samme vekt, ' + fmt(used) + ' kg' : fmt(used) + ' → ' + fmt(next) + ' kg'), kind});
      return;
    }

    if (e.part === 'test') {
      const x = e.sets[0];
      if (x.d > 0) {
        const est = e.slot === 'clean' ? x.w : est1(x.w, x.d, 10);
        a.e1rm[e.lift] = Math.round(est*10)/10;
        notes.push({name, text: e.slot === 'clean' ? 'Beste rene single: ' + fmt(x.w) + ' kg'
          : x.d + ' × ' + fmt(x.w) + ' kg. Estimert 1RM ' + fmt(Math.round(est*2)/2) + ' kg', kind:'up'});
      }
      return;
    }
    const st = a.lifts[e.key]; st.last = used;
    let next = used, kind = 'same', why;
    if (e.slot === 'clean') {
      if (!allHit || e.q === 'teknisk') { next = used - 2.5; kind = 'down'; why = allHit ? 'Teknikken sviktet' : 'Bom på reps'; }
      else if (e.q === 'god') {
        next = used + 2.5; kind = 'up'; why = 'Raske og rene løft';
        if (e.part === 'top' && used / .92 > a.e1rm[e.lift]) a.e1rm[e.lift] = r25(used / .92);
      }
      else if (e.q === 'treg') why = 'Farten falt';
      else why = 'Ingen vurdering registrert';
    } else {
      const r = e.rpe;
      if (!allHit) { next = used - 2.5; kind = 'down'; why = 'Ikke alle reps'; }
      else if (r == null) why = 'Ingen RPE registrert';
      else if (r <= 7) { next = used + (e.slot === 'squat' && r <= 6 ? 5 : 2.5); kind = 'up'; why = 'RPE ' + fmt(r); }
      else if (r <= 8.5) why = 'RPE ' + fmt(r) + ', på mål';
      else if (r <= 9) why = 'RPE 9, gjenta';
      else { next = used - 2.5; kind = 'down'; why = 'RPE ' + fmt(r); }
      if (e.part === 'top' && allHit && r != null) a.e1rm[e.lift] = Math.round(est1(used, e.sets[0].d, r)*10)/10;
    }
    st.w = next = Math.max(BAR(), next);
    notes.push({name, text: why + ': ' + (next === used ? 'samme vekt, ' + fmt(used) + ' kg' : fmt(used) + ' → ' + fmt(next) + ' kg'), kind});
    // Logg estimert 1RM etter hvert toppsett, så appen kan se trenden før en lett uke
    if (e.part === 'top') {
      a.e1log = a.e1log || {};
      a.e1log[e.lift] = (a.e1log[e.lift] || []).concat(a.e1rm[e.lift]).slice(-8);
    }
  });
  return notes;
}

// Oppvarming (teller ikke som arbeidssett): stiger mot dagens første arbeidsvekt.
// kind 'full' = hovedløft. kind 'short' = sekundærøvelse eller løft senere i økta, når kroppen er varm.
// Er første arbeidssett 1–2 reps, legges det til en single på ca. 90 %.
// Markløft starter ikke med tom stang, fordi stanga ligger for lavt uten skiver.
// slot er plassen i programmet (f.eks. 'deadlift' også når du har byttet til sumo).
function warmups(slot, W, reps, kind){
  const single = reps <= 2 && W >= 60 ? [[.9,1]] : [];
  const steps = kind === 'short' ? [[.5,5],[.75,3]]
    : ['clean','snatch','cj'].includes(slot) ? [[0,5],[.4,3],[.55,2],[.7,1],[.8,1]]
    : slot === 'deadlift' ? [[.5,5],[.65,3],[.8,2]].concat(single)
    : [[0,10],[.45,6],[.65,4],[.8,2]].concat(single);
  const out = [];
  steps.forEach(([f,r]) => {
    const w = Math.max(BAR(), f ? r25(W*f) : BAR());
    if (w >= W || (out.length && out[out.length-1][0] >= w)) return;
    out.push([w, r]);
  });
  return out;
}

// Hvilken oppvarming trenger øvelse nr. ei i økta? Bare stangøvelser får oppvarming.
// Første løft og hovedløft: full. Sekundærøvelser og volumløft (T2/T3): kort. Samme løft igjen: ingen.
function wuKind(s, ei){
  const e = s.ex[ei];
  if (!LIFTS[e.lift] || !LIFTS[e.lift].bar) return null;
  if (s.ex.slice(0, ei).some(x => x.lift === e.lift)) return null;
  if (e.wu) return e.wu;   // Burgener: kort oppvarming etter første løft, kroppen er varm
  if (ei === 0) return 'full';
  return /Sekundær|T2|T3/.test(e.tag || '') ? 'short' : 'full';
}
// Oppvarmingen står først i samme rekke som arbeidssettene, mindre og grå, med en strek før arbeidssettene.
// Rutene står også når oppvarmingen er gjort, så arbeidssettene ikke flytter seg under tommelen.
function vWarmup(e, ei, wu, wuNext, warm){
  const done = e.wuDone || [];
  return wu.map(([w, r], wi) => { const kk = w + 'x' + r, ok = done.includes(kk), last = wi === wu.length - 1 ? 1 : 0;
      const fr = ok && ui.fresh === 'wu:' + ei + ':' + kk ? ' fresh' : '';
      return `<div class="cw"><button class="chip sm ${ok ? 'ok' : warm && wi === wuNext ? 'next' : ''}${fr}" data-a="wu:${ei}:${kk}:${last}" aria-label="Oppvarming, teller ikke som arbeidssett: ${r} reps på ${fmt(w)} kg${ok ? ', gjort' : ''}">${r}</button><small>${fmt(w)}</small></div>`; }).join('');
}
// Nytt PR-anslag (Epley) for løftene i økta, sammenlignet med det beste fra før. Bare sett med 1–12 reps teller.
const e1 = (w, r) => w * (1 + r / 30);
function bestE1(ex){
  return ex.reduce((m, x) => x.d > 0 && x.d <= 12 && x.w > 0 ? Math.max(m, e1(x.w, x.d)) : m, 0);
}
function findRecords(s){
  const out = [];
  [...new Set(s.ex.map(e => e.lift))].filter(l => !(LIFTS[l] && LIFTS[l].cx)).forEach(l => {
    const sets = s.ex.filter(e => e.lift === l).flatMap(e => e.sets), now = bestE1(sets);
    const before = S.history.filter(h => !h.skipped && h.ex).reduce((m, h) => Math.max(m, bestE1(h.ex.filter(e => e.lift === l).flatMap(e => e.sets))), 0);
    if (!before || now <= before + 0.01) return;
    const top = sets.filter(x => x.d > 0 && x.d <= 12).reduce((a, x) => e1(x.w, x.d) > e1(a.w, a.d) ? x : a);
    out.push({name: liftName(l), w: top.w, d: top.d, e: Math.round(now * 2) / 2});
  });
  return out;
}

function spExtras(e, ei){
  let h = `<div class="amrap"><span>Juster vekt etter dagsform</span>
    <button class="step" data-a="w:${ei}:-1" aria-label="2,5 kg lettere">−</button>
    <button class="step" data-a="w:${ei}:1" aria-label="2,5 kg tyngre">+</button></div>`;
  const all = e.sets.every(x => x.d != null);
  if (e.part === 'extra' && all) {
    h += `<div class="rpe"><span>RPE for ${liftName(e.lift).toLowerCase()} (mål 6–7,5)</span><div class="seg num">${
      [6,7,7.5,8,8.5,9,9.5,10].map(v => `<button data-a="rpe:${ei}:${v}" aria-pressed="${e.rpe === v}">${fmt(v)}</button>`).join('')}</div></div>`;
  }
  if ((e.part === 'top' || e.part === 'back') && all) {
    if (e.slot === 'clean') h +=`<div class="rpe"><span>Hvordan gikk løftene?</span><div class="seg">${
      [['god','Raske og rene'],['treg','Tregere'],['teknisk','Teknikk sviktet']].map(([v,l]) => `<button data-a="q:${ei}:${v}" aria-pressed="${e.q === v}">${l}</button>`).join('')}</div></div>`;
    else h += `<div class="rpe"><span>${e.athx ? 'RPE på siste sett' + (e.rpeT != null ? ' (mål ' + fmt(e.rpeT) + ')' : '')
      : 'RPE for ' + (e.part === 'top' ? 'toppsettet' : 'backoff-settene')}</span><div class="seg num">${
      [6,7,7.5,8,8.5,9,9.5,10].map(v => `<button data-a="rpe:${ei}:${v}" aria-pressed="${e.rpe === v}">${fmt(v)}</button>`).join('')}</div></div>`;
  }
  if (e.part === 'back' && !all && (e.cut||0) < 2 && e.sets.length > 1 && e.sets[e.sets.length-1].d == null)
    h += `<button class="link" data-a="cut:${ei}">Kutt ett backoff-sett etter tung metcon</button>`;
  return h;
}

/* ---------- Hjelpere ---------- */
const $ = s => document.querySelector(s);
const r25 = x => Math.round(x/2.5)*2.5;
const fmt = n => (Math.round(n*100)/100).toLocaleString('nb-NO');
const prog = id => PROGRAMS.find(p => p.id === id);
const inc = (p, lift) => (p.inc && p.inc[lift]) || 2.5;
const liftName = l => LIFTS[l] ? LIFTS[l].n : l;
const keyLabel = k => { const [l,t] = k.split('.'); return liftName(l) + (t ? ' · ' + t : ''); };
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const dateFmt = t => new Date(t).toLocaleDateString('nb-NO',{weekday:'short',day:'numeric',month:'short'});

/* ---------- Lagring ---------- */
function fresh(){ return {v:1, active:null, draft:null, history:[], settings:{rest:90, pete:{on:true, ver:'str', mach:'row', ref:{}}}, maxes:{}, pete:{idx:0, targets:{}, pb:{}}}; }
function load(){
  const d = fresh();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); return Object.assign(d, o, {settings:Object.assign(d.settings, o.settings||{})}); }
  } catch(e) {}
  return d;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); ui.storageOK = true; }
  catch(e) { ui.storageOK = false; }
  syncMark();   // skybackup, hvis den er slått på (se Skybackup)
  if (TR.on && !trainingNow()) trainSend(false);   // økta er ferdig, hoppet over eller slettet
}

// Trener nå: vennene ser en manual på deg fra du krysser av første sett (også oppvarming) til økta er ferdig.
// Mens du krysser av, fornyes det hvert 20. minutt. Serveren glemmer det to timer etter siste gang.
// TR huskes på telefonen, så slutten blir sendt også om appen ble startet på nytt midt i økta.
const trainingNow = () => !!(S && S.draft && S.draft.ex.some(e => e.sets.some(x => x.d != null) || (e.wuDone && e.wuDone.length)));
let TR = (() => { try { return JSON.parse(localStorage.getItem(KEY + '.tr')) || {on:false, at:0}; } catch(e) { return {on:false, at:0}; } })();
function trainSend(on){
  TR = {on, at: Date.now()};
  try { localStorage.setItem(KEY + '.tr', JSON.stringify(TR)); } catch(e) {}
  setTimeout(() => { if (auth) rpc('presence_train', {training: on}, {keepalive: true}).catch(() => {}); });   // etter oppstart, når kontoen er lest
}
function trainTick(){ if (trainingNow() && (!TR.on || Date.now() - TR.at > 20 * 60000)) trainSend(true); }

let S = load();
S.maxes = S.maxes || {};
const myMax = (lift, dflt) => (S.maxes && S.maxes[lift] > 0) ? S.maxes[lift] : dflt;
// Egne øvelser lagres i S.custom og legges inn i LIFTS, så resten av appen ser dem som vanlige løft
function mergeCustom(){
  Object.keys(LIFTS).filter(k => k.startsWith('c_')).forEach(k => delete LIFTS[k]);
  Object.assign(LIFTS, S.custom || {});
}
mergeCustom();
const ui = {tab: S.active ? 'today' : 'plan', stack:[], detail:null, rest:null, summary:null, confirm:null, exportText:'', storageOK:true, keepDl:null};
try { localStorage.setItem(KEY+'.t','1'); localStorage.removeItem(KEY+'.t'); } catch(e){ ui.storageOK = false; }

/* ---------- Motor: lag dagens økt fra mal + instans ---------- */
/* ---------- Pauser ----------
   Forskning: tunge sett (ca. 80 % av 1RM og mer) 3–5 min, volumsett ca. 2 min, lette hjelpeøvelser ca. 90 s
   (Grgic 2018, Schoenfeld 2016, de Salles 2009, Singer 2024). Strength & Power, Cube og Juggernaut
   har egne pauser i sine maler. Alle pauser skaleres med innstillingen «Kortere / Standard / Lengre». */
const REST = {
  linear: {sl5x5: {squat:180, deadlift:180, _:120}, ss: {_:180}},
  gzclp: {T1:180, T2:120, T3:90},
  w531: {main:180, light:90, fsl:120, bbb:90},
  warmup:60, warmupLast:120
};
const linearRest = (p, slot) => { const t = REST.linear[p.id] || {}; return t[slot] || t._ || 120; };
const REST_SCALE = [[.75,'Kortere'],[1,'Standard'],[1.25,'Lengre']];

function mk(n, reps, w, lastAm){
  return Array.from({length:n}, (_,j) => ({t:reps, w, am: !!(lastAm && j === n-1), d:null}));
}
function buildSession(p, a){
  if (p.prog === 'sp12') return buildSP(p, a);
  if (p.prog === 'cube') return buildCube(p, a);
  if (p.prog === 'jugg') return buildJug(p, a);
  if (p.prog === 'athx') return buildAthx(p, a);
  if (p.prog === 'burg') return buildBurg(p, a);
  const i = a.idx, n = p.days.length, day = p.days[i % n];
  // Økta heter det programmet kaller den (Økt A, Dag 1). Linjen over viser uka, ikke et eget øktnummer.
  let ex = [], sub = 'Uke ' + (Math.floor(i / (parseInt(p.perWeek) || 3)) + 1);
  if (p.prog === 'linear') {
    ex = day.ex.map(e => { const L = sw(a, e.lift);
      return {key:L, lift:L, slot:e.lift, tag:'', rest: linearRest(p, e.lift), sets: mk(e.sets, e.reps, a.lifts[L].w)}; });
  } else if (p.prog === 'gzclp') {
    ex = day.ex.map(e => {
      const L = sw(a, e.lift), key = L + '.' + e.tier, st = a.lifts[key]; let sets;
      if (e.tier === 'T1') { const [s,r] = T1S[st.stage]; sets = mk(s, r, st.w, true); }
      else if (e.tier === 'T2') { const [s,r] = T2S[st.stage]; sets = mk(s, r, st.w); }
      else sets = mk(3, 15, st.w, true);
      return {key, lift:L, slot:e.lift, tag:e.tier, rest: REST.gzclp[e.tier], sets};
    });
  } else {
    const L = sw(a, day.lift), wk = Math.floor(i/n) % 4, cyc = Math.floor(i/(n*4)) + 1, tm = a.tm[L];
    ex = [{key:L, lift:L, slot:day.lift, tag: wk === 3 ? 'Lett uke' : 'Hovedløft', rest: wk === 3 ? REST.w531.light : REST.w531.main,
           sets: W531[wk].map(([pc,r,am]) => ({t:r, w:r25(tm*pc), am:!!am, d:null}))}];
    if (wk < 3) {
      if (p.fsl) { const pc = W531[wk][0][0]; ex.push({key:L+'.fsl', lift:L, slot:day.lift, tag:`FSL · ${Math.round(pc*100)} %`, rest: REST.w531.fsl, sets: mk(5, 5, r25(tm*pc))}); }
      else ex.push({key:L+'.bbb', lift:L, slot:day.lift, tag:'BBB · 50 %', rest: REST.w531.bbb, sets: mk(5, 10, r25(tm*.5))});
    }
    sub = 'Syklus ' + cyc + ' · Uke ' + (wk+1);
  }
  return {programId:p.id, day:day.name, sub, ex, started:Date.now()};
}

/* ---------- Motor: oppdater instansen etter en økt ---------- */
function progress(p, a, s){
  if (p.prog === 'sp12') return progressSP(p, a, s);
  if (p.prog === 'cube') return progressCube(p, a, s);
  if (p.prog === 'jugg') return progressJug(p, a, s);
  if (p.prog === 'athx') return progressAthx(p, a, s);
  if (p.prog === 'burg') return progressBurg(p, a, s);
  const notes = [];
  const hit = x => x.d != null && x.d >= x.t;
  const touched = e => e.sets.some(x => x.d != null);
  const note = (e, text, kind) => notes.push({name: keyLabel(e.key), text, kind});

  if (p.prog === 'linear') {
    s.ex.forEach(e => {
      if (!touched(e)) return;
      const st = a.lifts[e.key], old = st.w;
      if (e.sets.every(hit)) { st.w = old + inc(p, e.slot); st.fails = 0; note(e, fmt(old)+' → '+fmt(st.w)+' kg', 'up'); }
      else {
        st.fails = (st.fails||0) + 1;
        if (st.fails >= 3) { st.w = r25(old*.9); st.fails = 0; note(e, 'Ned 10 % til '+fmt(st.w)+' kg', 'down'); }
        else note(e, 'Samme vekt neste gang (bom '+st.fails+' av 3)', 'same');
      }
    });
  } else if (p.prog === 'gzclp') {
    s.ex.forEach(e => {
      if (!touched(e)) return;
      const st = a.lifts[e.key], old = st.w;
      if (e.tag === 'T3') {
        const last = e.sets[e.sets.length-1];
        if (last.d != null && last.d >= 25) { st.w = old + 2.5; note(e, fmt(old)+' → '+fmt(st.w)+' kg', 'up'); }
        else note(e, 'Samme vekt, mål: 25 reps i siste sett', 'same');
        return;
      }
      const S_ = e.tag === 'T1' ? T1S : T2S;
      if (e.sets.every(hit)) { st.w = old + inc(p, e.slot); note(e, fmt(old)+' → '+fmt(st.w)+' kg', 'up'); }
      else if (st.stage < 2) { st.stage++; const [ss,rr] = S_[st.stage]; note(e, 'Neste trinn: '+ss+'×'+rr+' på '+fmt(old)+' kg', 'stage'); }
      else { st.stage = 0; st.w = r25(old*.85); const [ss,rr] = S_[0]; note(e, 'Ny runde: '+ss+'×'+rr+' på '+fmt(st.w)+' kg', 'down'); }
    });
  } else {
    const per = p.days.length * 4;
    if ((a.idx + 1) % per === 0) {
      p.days.forEach(d => { const l = sw(a, d.lift), old = a.tm[l]; a.tm[l] = old + inc(p, d.lift);
        notes.push({name: liftName(l), text:'Treningsmaks '+fmt(old)+' → '+fmt(a.tm[l])+' kg', kind:'up'}); });
    } else {
      const amr = s.ex[0].sets.find(x => x.am);
      if (amr && amr.d != null) notes.push({name: liftName(s.ex[0].lift), text: amr.d+' reps på '+fmt(amr.w)+' kg i siste sett', kind: amr.d >= amr.t ? 'up' : 'same'});
    }
  }
  return notes;
}

function finish(){
  const s = S.draft, g = s.guest, p = g ? null : prog(S.active.programId);
  // ATHX: kondisjonsdelen teller i metcon-budsjettet, med mindre du har lagt inn en egen metcon
  if (s.cond && s.cond.min > 0 && !(s.mc && s.mc.min)) { s.metcon = true; s.mc = {type:s.cond.type, min:s.cond.min, rpe:(s.cond.res || {}).rpe || (s.mc && s.mc.rpe) || null}; }
  const prs = findRecords(s);   // før økta legges i loggen, så den ikke sammenlignes med seg selv
  // Samme økt som en venn er en engangsøkt: ingen progresjon, og programmet står der det står
  const undo = g ? undefined : undoPoint(!!s.pete);
  const notes = g ? [{name:'Programmet ditt', text:'Står der det sto. Neste økt er den samme som før.', kind:'same'}] : progress(p, S.active, s);
  const vol = s.ex.reduce((sum,e) => sum + e.sets.reduce((v,x) => v + (x.d||0)*x.w, 0), 0);
  S.history.unshift({date:Date.now(), programId: g ? undefined : p.id, guest: g ? {sid:g.sid, who:g.who} : undefined, day:s.day, sub:s.sub, note:(s.note||'').trim(), metcon:!!(s.metcon || s.wod), mc: (s.metcon || s.wod) ? mcSaved(s.mc) : undefined,
    wod: s.wod ? {id:s.wod.id, navn:s.wod.navn, tekst:s.wod.tekst, resultat:(s.wod.resultat||'').trim()} : undefined,
    pete: s.pete ? peteDone(s.pete) : undefined, idx: g ? undefined : S.active.idx,
    cond: s.cond ? {title:s.cond.title, lines:s.cond.lines, res:s.cond.res || {}} : undefined,
    ex: s.ex.map(e => ({lift:e.lift, tag:e.tag, rpe:e.rpe, q:e.q, sets:e.sets.map(x => Object.assign({t:x.t, w:x.w, d:x.d}, x.c ? {c:x.c} : {}))})), undo});
  if (g) { S.draft = S.parked || null; delete S.parked; }   // din egen økt kommer tilbake slik du forlot den
  else { keepOneUndo(); S.active.idx++; S.draft = null; }
  ui.summary = {day:s.day, notes, vol, prs};
  ui.rest = null; updateRest();
  save(); render(); toTop();
}

// Hopp over dagens økt: ingen progresjon, vektene står som de er. Økta logges som hoppet over,
// så «Hele planen» fortsatt kobler hver økt til riktig linje i loggen.
function skipSession(){
  const p = prog(S.active.programId), s = S.draft;
  S.history.unshift({date:Date.now(), programId:p.id, day:s.day, sub:s.sub, skipped:true, idx:S.active.idx,
    ex: s.ex.map(e => ({lift:e.lift, tag:e.tag, sets:e.sets.map(x => ({t:x.t, w:x.w, d:null}))})), undo: undoPoint(false)});
  keepOneUndo();
  S.active.idx++;
  S.draft = null; ui.confirm = null; ui.summary = null;
  ui.rest = null; updateRest();
  save(); render(); toTop(); toast(s.day + ' er hoppet over');
}

/* ---------- Endre og slette økter i loggen ----------
   Den siste programøkta har en kopi av programmet slik det var før økta (undo). Slettes den,
   går programmet tilbake dit: samme vekter og samme neste økt. Bare den nyeste økta har kopien. */
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const undoPoint = pete => ({active: clone(S.active), pete: pete ? clone(S.pete) : undefined});
function keepOneUndo(){ S.history.forEach((h, k) => { if (k && h.undo) delete h.undo; }); }
// Kan økta angres? Bare hvis programmet fortsatt står der økta forlot det.
const canUndo = h => !!(h && h.undo && S.active && S.active.programId === h.programId && S.active.idx === h.idx + 1);
// Kjører du samme økt som en venn, ligger din egen økt til side i S.parked til engangsøkta er ferdig
const ownDraft = () => S.draft && S.draft.guest ? S.parked : S.draft;
function dropOwnDraft(){ if (S.draft && S.draft.guest) S.parked = null; else S.draft = null; }
const draftTouched = () => { const d = ownDraft(); return !!(d && d.ex.some(e => e.sets.some(x => x.d != null))); };

function logDelete(date){
  const i = S.history.findIndex(h => h.date === date); if (i < 0) return;
  const h = S.history[i], undo = canUndo(h);
  if (undo) {
    S.active = h.undo.active;
    // Pete Plan går bare tilbake hvis ingen nyere økt har en Pete Plan-økt
    if (h.undo.pete && !S.history.slice(0, i).some(x => x.pete)) S.pete = h.undo.pete;
    dropOwnDraft(); ui.summary = null; ui.rest = null; updateRest();
  }
  S.history.splice(i, 1);
  ui.confirm = null; if (ui.logOpen) delete ui.logOpen[date];
  save(); render(); toast(undo ? 'Økta er slettet, og programmet er tilbake der det var' : 'Økta er slettet');
}
function logEditOpen(date){
  const h = S.history.find(x => x.date === date); if (!h) return;
  ui.logEdit = {date, h: clone(h)}; ui.confirm = null; render(); toTop();
}
const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const numIn = v => parseFloat(String(v).replace(',', '.').trim());
// Leser skjemaet, sjekker tallene og lagrer. Tidspunktet på dagen beholdes når datoen endres.
function logEditSave(){
  const E = ui.logEdit, h = S.history.find(x => x.date === E.date); if (!h) { ui.logEdit = null; render(); return; }
  const ex = clone(h.ex);
  for (const inp of document.querySelectorAll('[data-le]')) {
    const [ei, si, f] = inp.dataset.le.split(':'), x = ex[+ei] && ex[+ei].sets[+si]; if (!x) continue;
    const raw = inp.value.trim(), v = numIn(raw);
    if (f === 'w') {
      if (!(v >= 0 && v <= 999)) { toast('Skriv vekten som et tall, for eksempel 82,5'); inp.focus(); return; }
      x.w = Math.round(v * 100) / 100;
    } else {
      if (raw === '' || raw === '–') { x.d = null; continue; }
      if (!(Number.isInteger(v) && v >= 0 && v <= 99)) { toast('Reps må være et helt tall, eller tomt hvis settet ikke ble tatt'); inp.focus(); return; }
      x.d = v;
    }
  }
  // Minutter på metcon eller kondisjon: tomt betyr ukjent, og økta teller da ikke i metcon-budsjettet
  let mc = h.mc;
  const mn = $('#leMin');
  if (mn) {
    const raw = mn.value.trim(), v = numIn(raw);
    if (raw === '') mc = undefined;
    else if (!(Number.isInteger(v) && v >= 1 && v <= 600)) { toast('Skriv minuttene som et helt tall, for eksempel 18'); mn.focus(); return; }
    else mc = Object.assign({type: h.wod ? mcGuess(h.wod.tekst) : 'M', rpe: null}, h.mc, {min: v});
  }
  let date = h.date;
  const dv = ($('#leDate') || {}).value;
  if (dv && dv !== ymd(h.date)) {
    const [y, m, d] = dv.split('-').map(Number), nd = new Date(h.date); nd.setFullYear(y, m - 1, d);
    if (isNaN(nd) || nd.getTime() > Date.now() + DAY) { toast('Velg en dato som ikke er fram i tid'); return; }
    date = nd.getTime();
    while (S.history.some(x => x !== h && x.date === date)) date++;   // datoen er nøkkelen til økta
  }
  h.ex = ex; h.date = date;
  if (mn) { h.mc = mc; if (mc) h.metcon = true; }
  const note = $('#leNote'); if (note) h.note = note.value.trim();
  const res = $('#leRes'); if (res && h.wod) h.wod.resultat = res.value.trim();
  S.history.sort((a, b) => b.date - a.date);
  if (ui.logOpen && ui.logOpen[E.date]) { delete ui.logOpen[E.date]; ui.logOpen[date] = true; }
  ui.logEdit = null; save(); render(); toTop(); toast('Endringene er lagret');
}
function vLogEdit(){
  const h = ui.logEdit.h, title = h.free ? (h.pete ? 'Pete Plan' : h.wod ? 'Metcon' : 'Fri økt') : h.day;
  return `<button class="link" data-a="logeditx">‹ Avbryt</button>

    ${h.ex.map((e, ei) => `<section class="box le-ex">

      <div class="le-head" aria-hidden="true"><span>Sett</span><span>kg</span><span>Reps</span></div>
      ${e.sets.map((x, si) => `<div class="le-row"><span>${si + 1}</span>

    ${h.metcon || h.mc || h.wod || h.pete || h.cond ? `<div class="box" style="gap:0"><div class="field"><label for="leMin">Minutter${h.pete && !h.wod ? ' kondisjon' : ' metcon'}<small class="muted">Teller i metcon-budsjettet${h.mc && h.mc.rpe ? ' · RPE ' + h.mc.rpe : ''}</small></label>

    <button class="btn" data-a="logsave">Lagre endringene</button>`;
}
// «knebøy, benkpress og stangroing»
const listNo = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' og ' + a[a.length - 1];

// Lager en ny instans fra tallene i feltene på programsiden. Brukes både til å aktivere og til å vise planen.
function newInstance(p){
  if (p.prog === 'athx') return axInstance(p);
  const a = {programId:p.id, startedAt:Date.now(), idx:0, lifts:{}, tm:{}};
  if (p.prog === 'sp12' || p.prog === 'cube' || p.prog === 'burg') { a.e1rm = {}; a.base = {}; }
  Object.keys(p.inputs).forEach((k,i) => {
    const el = $('#in-'+i); let v = parseFloat(String(el && el.value || '').replace(',', '.'));
    if (!isFinite(v) || v < 0) v = p.inputs[k];
    if (p.prog === '531' || p.prog === 'jugg') a.tm[k] = r25(v*.9);
    else if (a.e1rm) { a.e1rm[k] = v; a.base[k] = v; }
    else a.lifts[k] = {w:v, fails:0, stage:0};
  });
  return a;
}

function activate(id){
  const p = prog(id), a = newInstance(p);
  if (!a) return;
  // Husk maksløftene, så neste program fylles ut automatisk
  const num = el => { const v = parseFloat(String(el && el.value || '').replace(',', '.')); return v > 0 ? v : null; };
  if (p.prog === 'athx') ['s2oh','squat','deadlift'].forEach(l => { if (!a.guess[l]) S.maxes[l] = a.e1rm[l]; });
  else if (p.orm) Object.keys(p.orm).forEach(l => { const v = num($('#orm-' + l)); if (v) S.maxes[l] = v; });
  else if (p.inputLabel === '1RM') Object.keys(p.inputs).forEach((k, i) => { const v = num($('#in-' + i)); if (v) S.maxes[k] = v; });
  S.active = a; dropOwnDraft();
  ui.detail = null; ui.stack = []; ui.summary = null; ui.tab = 'today';
  save(); render(); toTop(); toast(p.name+' er aktivert');
}

/* ---------- Skiver per side (20 eller 15 kg stang, se BAR) ---------- */
// Skivene på gymmet. 25 kg er bevisst utelatt: 20 kg er største skive.
const PL = [[20,'p20'],[15,'p15'],[10,'p10'],[5,'p5'],[2.5,'p2'],[1.25,'p1']];
function platesOf(w){
  let side = (w - BAR()) / 2; const out = [];
  for (const [kg,c] of PL) while (side >= kg - 1e-6) { out.push([kg,c]); side -= kg; }
  return out;
}
const plateTxt = w => w <= BAR() ? 'bare stanga' : platesOf(w).map(x => fmt(x[0])).join(' + ') + ' per side';
// big: stor variant i kortet som er «nå», med skivene som tall og «per side» under
function plateHTML(w, big){
  if (w <= BAR()) return `<span class="pl-txt">Bare stanga (${BAR()} kg)</span>`;
  const out = platesOf(w), txt = out.map(x => fmt(x[0])).join(' + ');
  return '<span class="plates" aria-hidden="true">' + out.map(([kg,c]) => '<i class="pl '+c+'"></i>').join('') +
         '</span><span class="pl-txt">' + txt + (big ? `<small>per side · ${BAR()} kg stang</small>` : ' per side') + '</span>';
}

/* ---------- Metcon-belastning ----------
   Bygger på metcon-registreringen som finnes fra før: øktbanken, «Metcon i dag» og fri økt.
   Til hver metcon kan du legge inn type, minutter arbeid og RPE (1–10). Belastning = minutter × RPE (session RPE).
   Typen styrer rådene i Strength & Power: beintunge metcons og olympiske løft konkurrerer med knebøy
   og clean, og pressende gymnastikk konkurrerer med benk. */
const MC = {
  M:{n:'Kondisjon', d:'Sykkel, ro, ski, løp'},
  G:{n:'Gymnastikk', d:'Pull-ups, push-ups, HSPU, burpees'},
  L:{n:'Beintung', d:'Thrusters, wall balls, lunges, bokshopp'},
  O:{n:'Olympisk', d:'Cleans eller snatches for reps'}
};
const DAY = 864e5;
// Forslag ut fra teksten i økta. Rekkefølge: olympisk, beintung, gymnastikk, ellers kondisjon.
function mcGuess(text){
  const t = String(text || '').toLowerCase();
  if (/clean|snatch|c ?& ?j/.test(t)) return 'O';
  if (/thruster|wall ?ball|squat|lunge|box ?jump|step[- ]?up|deadlift|markløft|knebøy|utfall|bokshopp|pistol/.test(t)) return 'L';
  if (/push[- ]?up|hspu|handstand|pull[- ]?up|chin[- ]?up|toes[- ]?to[- ]?bar|t2b|burpee|\bdips?\b|muscle[- ]?up|ring row/.test(t)) return 'G';
  return 'M';
}
const mcOf = ctx => ctx === 'session' ? (S.draft.mc = S.draft.mc || {}) : (ui.freeMcData = ui.freeMcData || {});
const mcSaved = m => m && m.min > 0 ? {type: m.type || 'M', min: Math.round(+m.min), rpe: m.rpe || null} : undefined;
function mcWindow(from, to){
  const inWin = h => h.date > from && h.date <= to;
  const list = S.history.filter(h => h.mc && inWin(h));
  return {min: list.reduce((a,h) => a + h.mc.min, 0), load: list.reduce((a,h) => a + h.mc.min * (h.mc.rpe || 0), 0), n: list.length,
          unknown: S.history.filter(h => h.metcon && !h.mc && inWin(h)).length};
}
// Hvilke metcon-typer bør ikke ligge dagen før dette løftet?
const mcAvoid = slot => slot === 'squat' ? ['L'] : ['clean','snatch','cj'].includes(slot) ? ['L','O'] : slot === 'bench' ? ['G'] : [];
const mcAdvice = {
  squat:'Neste styrkeøkt er knebøy. Unngå beintunge metcons dagen før.',
  clean:'Neste styrkeøkt er power clean. Unngå beintunge metcons og olympiske løft dagen før, og ta aldri metcon før clean samme dag.',
  bench:'Neste styrkeøkt er benk. Unngå mye push-ups og HSPU dagen før.',
  snatch:'Neste økt starter med snatch. Unngå beintunge metcons og olympiske løft dagen før, og ta aldri metcon før løftene samme dag.',
  cj:'Neste økt starter med clean & jerk. Unngå beintunge metcons og olympiske løft dagen før, og ta aldri metcon før løftene samme dag.'
};
const mcRecentConflict = slot => S.history.find(h => h.mc && Date.now() - h.date < 30*3600e3 && mcAvoid(slot).includes(h.mc.type));

function mcFields(ctx, mc){

function vMetconBudget(p, s){
  const now = Date.now(), cur = mcWindow(now - 7*DAY, now), prev = mcWindow(now - 14*DAY, now - 7*DAY);

  let h = `<section class="box">

      <div><b>${fmt(cur.load)}</b><span>belastning${grow != null ? ' · ' + (grow > 0 ? '+' : '') + grow + ' % fra uka før' : ''}</span></div></div>`;
  if (bud) h += `<div class="meter" role="img" aria-label="${fmt(cur.min)} av ${bud} minutter"><i style="width:${Math.min(100, cur.min / bud * 100)}%" class="${cur.min > bud ? 'over' : ''}"></i></div>`;

  if ((p.prog === 'sp12' || p.prog === 'burg') && mcAdvice[slot]) h += `<p class="small muted">${mcAdvice[slot]}</p>`;

/* ---------- Hele planen ----------
   Kjører programmet framover på en kopi av instansen, som om alle økter går som planlagt.
   Ekte data endres ikke. Fullførte økter hentes fra loggen. */
const PLAN_NOTE = {
  linear:'Planen viser vektene hvis du klarer alle reps hver gang. Bommer du, står vekten stille, og etter tre bom går den ned 10 %.',
  gzclp:'Planen viser vektene hvis du klarer alle reps hver gang. Bommer du, går du til neste trinn med samme vekt.',
  '531':'Treningsmaksen øker etter hver syklus på fire uker. Repsene i siste sett påvirker ikke planen.',
  jugg:'Arbeidsmaksen øker bare med reps over målet i testsettene. Planen viser vektene hvis du akkurat når målet, så de blir høyere hvis du tar flere reps.',
  cube:'Vektene er prosent av 1RM og endres ikke underveis. Uke 10 er test, og beste løft blir ny 1RM.',
  sp12:'Planen viser vektene hvis toppsett og backoff går på RPE 7 og clean er rask og ren. Da øker vekten 2,5 kg fra uke til uke. Ved RPE 7,5–9 står vekten stille. Når en ny fase starter, regnes vektene ut fra estimert 1RM.',
  burg:'Vektene er prosent av 1RM og endres ikke underveis. Uke 12, dag 4 er max out, og beste snatch og clean & jerk blir ny 1RM.',
  athx:'Vektene er prosent av arbeidsmaksen din i dag, og fartene følger anslaget ditt. Begge oppdateres etter hver økt, så tallene framover endrer seg. Henger du etter kalenderen, hopper planen til første økt i denne uka.'
};
const planPer = (p, a) => p.prog === 'athx' ? a.ax.per : ['531','jugg','cube','sp12','burg'].includes(p.prog) ? p.days.length : (parseInt(p.perWeek) || 3);
function simulate(p, a0, n){
  const a = JSON.parse(JSON.stringify(a0)), out = [], tot = totalOf(p, a0);
  while (out.length < n && !(tot && a.idx >= tot)) {
    const s = buildSession(p, a);
    out.push({idx: a.idx, s: JSON.parse(JSON.stringify(s))});
    s.ex.forEach(e => { e.sets.forEach(x => x.d = x.t); e.rpe = 7; e.q = 'god'; });
    // ATHX styres av anslag fra ekte økter, så planen viser vektene ut fra arbeidsmaksen i dag
    if (p.prog !== 'athx') progress(p, a, s);
    a.idx++;
  }
  return out;
}
// Sett med lik vekt og reps slås sammen: «5×5 · 80 kg». Fullførte sett viser repsene du faktisk tok hvis de avvek.
function setsLine(e, done){
  const g = [];
  e.sets.forEach(x => { const l = g[g.length-1];
    if (l && l.w === x.w && l.t === x.t && l.c === x.c && !!l.am === !!x.am) { l.n++; l.d.push(x.d); } else g.push({w:x.w, t:x.t, c:x.c, am:x.am, n:1, d:[x.d]}); });
  return g.map(x => done && x.d.some(d => d !== x.t)
    ? x.d.map(d => d == null ? '–' : d).join(', ') + ' × ' + fmt(x.w) + ' kg'
    : x.n + '×' + (x.c ? '(' + x.c + ')' : x.t) + (x.am ? '+' : '') + ' · ' + fmt(x.w) + ' kg').join(' + ');
}
function vPlan(){
  const P = ui.plan, p = prog(P.id), a = P.active ? S.active : P.inst;
  if (!p || !a) { ui.plan = null; return ''; }
  return `<button class="link" data-a="planclose">‹ Tilbake</button>
    <header class="head"><h1>Hele planen</h1><p class="eyebrow">${p.name}</p>
      <p class="muted small">${PLAN_NOTE[p.prog] || ''}${P.active ? '' : ' Vektene er regnet ut fra tallene du har skrevet inn.'}${totalOf(p, a) ? '' : ' Programmet har ingen fast slutt, så planen viser 12 uker.'}</p></header>
    ${planWeeks(P, p, a)}`;
}
// Ukene i planen. Brukes både i Program-fanen og når du ser planen til et program før du aktiverer det.
function planWeeks(P, p, a){
  const per = planPer(p, a), ax = p.prog === 'athx', tot = totalOf(p, a);
  const N = tot || Math.max(12 * per, a.idx + 4 * per);
  const doneH = P.active ? S.history.filter(h => h.programId === p.id && !h.free && h.date >= a.startedAt).reverse().slice(-a.idx) : [];
  // ATHX kan hoppe fram i kalenderen, så økta husker sin egen plass (idx)
  const rows = doneH.map((h, k) => ({k: ax && h.idx != null ? h.idx : k, done:!h.skipped, skipped:!!h.skipped, day:h.day, sub:h.sub, ex:h.ex, cond:h.cond}));
  simulate(p, a, N - a.idx).forEach(f => {
    const s = P.active && f.idx === a.idx && ownDraft() ? ownDraft() : f.s;
    rows.push({k: f.idx, done:false, next: P.active && f.idx === a.idx, day:s.day, sub:s.sub, ex:s.ex, cond:s.cond});
  });
  const weeks = [];
  rows.forEach(r => { const w = Math.floor(r.k / per); (weeks[w] = weeks[w] || []).push(r); });
  // Uka står i overskriften, så «Uke 9 av 12» trengs ikke på hver økt
  const subOf = (r, w) => ax ? r.sub.replace(/^Uke \d+ av \d+ · /, '') : p.prog === 'burg' ? r.sub.replace(/^Uke \d+ av \d+( · )?/, '') : r.sub !== 'Uke ' + (w + 1) ? r.sub : '';
  return `${ax ? axScore(a) : ''}
    ${weeks.map((list, w) => list ? `<h3>Uke ${w + 1}${ax && a.ax.weeks[w] ? ' · ' + AX_PH[a.ax.weeks[w].ph] : ''}</h3><div class="list">${list.map(r => {
      const m = r.ex[0], sub = r.sub ? subOf(r, w) : '';
      return `<details class="box acc plan-s${r.done ? ' done-s' : ''}${r.skipped ? ' skip-s' : ''}${r.next ? ' next-s' : ''}"${r.next ? ' open' : ''}>
        <summary><span class="ps"><span class="ps-top"><b>${esc(r.day)}</b>${r.done ? '<span class="pill">Gjort</span>' : r.skipped ? '<span class="pill">Hoppet over</span>' : r.next ? '<span class="pill on">Neste</span>' : ''}</span>
          ${sub ? `<span class="small muted">${esc(sub)}</span>` : ''}
          <span class="small">${m ? liftName(m.lift) + ' · ' + setsLine(m, r.done) : r.cond ? esc(r.cond.title) : ''}</span></span></summary>
        <div class="plan-ex">${r.ex.map(e => `<div class="ln"><span>${liftName(e.lift)}${e.tag ? ` <span class="muted">${e.tag}</span>` : ''}</span><span>${setsLine(e, r.done)}</span></div>`).join('')}
          ${r.cond ? `<div class="ln"><span><b>${esc(r.cond.title)}</b></span><span>${r.done ? esc(axResTxt(r.cond)) : ''}</span></div>
            ${r.cond.lines ? `<ul class="ax-lines small">${r.cond.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}` : ''}</div>
      </details>`; }).join('')}</div>` : '').join('')}`;
}

/* ---------- Pete Plan (Pete Marston) ----------
   Tre-ukers rotasjon med seks økter per uke, kontrollert mot Pete Marstons egen tabell
   (machars.net/waspeteplan.htm). Kan slås av under Program.
   off = målfart i sekunder per 500 m i forhold til 2K-farten (negativ = raskere).
   Progresjon (fra planen): snittet fra alle dragene i en intervalløkt blir målet neste gang samme økt kommer.
   Hard distanse: prøv å komme nær din beste tid. Rolige økter følger 2K-farten.
   «Tilpasset styrke» er vår egen tilpasning, ikke en del av Pete Plan: rolige økter 6 km og hard distanse 5 km. */
const PETE = [
  {kind:'speed',  d:[500,500,500,500,500,500,500,500], rest:[210], off:-2.5},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[2000,2000,2000,2000], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10},
  {kind:'speed',  d:[1000,1000,1000,1000], rest:[300], off:2},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[1500,1500,1500,1500,1500], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10},
  {kind:'speed',  d:[250,500,750,1000,750,500,250], rest:[90,180,270,360,270,180], off:-2},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[3000,2500,2000], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10}
];
const PETE_KIND = {speed:'Fartsintervaller', steady:'Rolig distanse', endur:'Utholdenhetsintervaller', hard:'Hard distanse'};
const PETE_MACH = {row:'Ro', ski:'Ski', bike:'Sykkel'};
const PETE_REF = {row:'Romaskin, 2000 m', ski:'Ski, 2000 m', bike:'Sykkel, 4000 m'};
const peteOn = () => !!(S.settings.pete && S.settings.pete.on);
const distTxt = m => (m >= 10000 ? String(m).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : String(m)) + ' m';
const splitTxt = sec => { if (!(sec > 0)) return '–'; const t = Math.round(sec * 10) / 10, m = Math.floor(t / 60), r = t - m*60;
  return m + ':' + (r < 10 ? '0' : '') + (Math.round(r*10) % 10 ? r.toFixed(1) : String(Math.round(r))); };
// «1:52», «1:52.4» eller «1.52,4» → sekunder
function parseSplit(v){
  const m = String(v || '').trim().replace(',', '.').match(/^(\d{1,2})[:.](\d{1,2}(?:\.\d)?)$/);
  return m ? +m[1]*60 + +m[2] : null;
}
// Økta for posisjon pos, i valgt versjon og på valgt apparat. Sykkel: dobbel distanse, fart per 1000 m.
function peteSession(pos, ver, mach){
  const base = PETE[pos % PETE.length], bike = mach === 'bike';
  let d = base.d.slice();
  if (ver === 'str' && base.kind === 'steady') d = [6000];
  if (ver === 'str' && base.kind === 'hard') d = [5000];
  if (bike) d = d.map(x => x * 2);
  const same = d.every(x => x === d[0]);
  const name = d.length === 1 ? distTxt(d[0]) : same ? d.length + ' × ' + distTxt(d[0]) : d.join(' / ') + ' m';
  const rests = base.rest ? (base.rest.length === 1 ? Array(d.length - 1).fill(base.rest[0]) : base.rest) : [];
  const restTxt = !rests.length ? '' : new Set(rests).size === 1 ? mmss(rests[0]) + ' pause' : 'pauser ' + rests.map(mmss).join(', ');
  return {pos: pos % PETE.length, kind: base.kind, off: base.off, d, meters: d.reduce((a,b) => a+b, 0), rests, name, restTxt, bike};
}
/* Referansefart regnet begge veier.
   Framover: 2K-farten + tillegget for økta = målfart.
   Baklengs: snittfarten du rodde − tillegget = anslått 2K-fart nå.
   Bare intervalløkter og hard distanse gir anslag (rolige økter er ikke maks innsats).
   Brukes: medianen av de tre siste anslagene fra de siste seks ukene, per apparat.
   En testet 2K-tid du skriver inn går foran, helt til nyere anslag kommer.
   Alle farter er i sekunder per 500 m (på sykkel: per 500 sykkelmeter). */
const PETE_EST_DAYS = 42;
const median = a => { const b = a.slice().sort((x, y) => x - y), m = Math.floor(b.length / 2); return b.length % 2 ? b[m] : (b[m-1] + b[m]) / 2; };
function peteRef(mach){
  const set = S.settings.pete, tested = set.ref && set.ref[mach], testedAt = (set.refAt && set.refAt[mach]) || 0;
  const est = ((S.pete.est || {})[mach] || []).filter(e => Date.now() - e.t < PETE_EST_DAYS * DAY && e.t > testedAt).slice(-3);
  if (est.length) return {split: median(est.map(e => e.sec)), src:'est', n: est.length};
  if (tested) return {split: mach === 'bike' ? tested / 8 : tested / 4, src:'test'};
  return {split: null, src:'none'};
}
// Fart per 500 m → testtid (2000 m, sykkel 4000 m)
const refTime = (split, mach) => split * (mach === 'bike' ? 8 : 4);
const refLine = (mach) => { const r = peteRef(mach); if (!r.split) return '';
  const what = mach === 'bike' ? '4K' : '2K';
  return r.src === 'est' ? `Beregnet ${what}: ${splitTxt(refTime(r.split, mach))}, ${r.n === 1 ? 'fra siste økt' : 'fra dine siste ' + r.n + ' økter'}` : `Testet ${what}: ${splitTxt(refTime(r.split, mach))}`; };

// Målfart for økta, og hvor målet kommer fra
function peteTarget(ss, mach){
  const P = S.pete || {}, key = ss.pos + '|' + mach, pbKey = 'hard|' + mach + '|' + ss.meters;
  if ((ss.kind === 'speed' || ss.kind === 'endur') && P.targets && P.targets[key]) return {sec: P.targets[key], src:'ditt snitt sist'};
  if (ss.kind === 'hard' && P.pb && P.pb[pbKey]) return {sec: P.pb[pbKey], src:'din beste'};
  const r = peteRef(mach), what = mach === 'bike' ? '4K' : '2K';
  if (!r.split) return {sec: null, src:'mangler referansetid'};
  return {sec: r.split + ss.off, src: (r.src === 'est' ? 'beregnet ' : 'testet ') + what};
}
const paceTxt = (sec, bike) => sec ? (bike ? splitTxt(sec * 2) + ' /1000 m' : splitTxt(sec) + ' /500 m') : '–';
const peteWorkMin = (ss, t) => t.sec ? Math.round(ss.meters / 500 * t.sec / 60) : null;
// Tid per drag når alle dragene er like lange, eller total tid når økta er ett drag. Ellers null (pyramiden).
// Ved 500 m-drag (1000 m på sykkel) er tid per drag det samme som farten, så da vises den ikke.
const dragMeters = ss => ss.d.every(x => x === ss.d[0]) && ss.d[0] !== (ss.bike ? 1000 : 500) ? ss.d[0] : null;
const dragTime = (ss, sec) => { const m = dragMeters(ss); return m && sec ? m / 500 * sec : null; };
const dragLabel = ss => ss.d.length === 1 ? 'Total tid' : 'Tid per drag';
const peteNote = k => k === 'steady' ? 'Jevnt, ikke lett. Ro helst uten stopp.'
  : k === 'hard' ? 'Så hardt du klarer. Prøv å komme nær din beste tid.'
  : 'Fart som gjør at du klarer alle dragene. Siste drag tar du fullt ut. Snittet ditt blir målet neste gang denne økta kommer.' + (k === 'endur' ? ' Rundt 5K-fart.' : '');

// Resultatet du skrev inn → fart per 500 m. unit 'drag' = tid per drag eller total tid.
function peteResultSec(ss, pick){
  const v = parseSplit(pick.split); if (!v) return null;
  if (pick.unit === 'drag') { const m = dragMeters(ss); return m ? v / (m / 500) : null; }
  return ss.bike ? v / 2 : v;   // sykkel vises per 1000 m
}

// Kortet: viser neste økt i planen. ctx = 'session' (etter styrkeøkta) eller 'free' (fri økt).
// picked = valgt økt med felt for resultat.
function peteBox(ctx, picked){
  const set = S.settings.pete, mach = picked ? picked.mach : set.mach, ver = picked ? picked.ver : set.ver;
  const idx = picked ? picked.idx : (S.pete.idx || 0), ss = peteSession(idx, ver, mach), t = peteTarget(ss, mach);
  const wk = Math.floor(ss.pos / 6) + 1, day = ss.pos % 6 + 1, round = Math.floor(idx / PETE.length) + 1, min = peteWorkMin(ss, t);
  const ref = peteRef(mach), dt = dragTime(ss, t.sec), unit = picked && picked.unit === 'drag' && dragMeters(ss) ? 'drag' : 'split';
  const example = unit === 'drag' ? (dt ? splitTxt(dt) : '7:40') : (t.sec ? (ss.bike ? splitTxt(t.sec*2) : splitTxt(t.sec)) : '1:55');
  return `<section class="box pp-card${picked ? ' pp-picked' : ''}">
    <div class="pp-top"><span class="lbl">${picked ? 'Dagens Pete Plan' : 'Fortsett Pete Plan'}</span>
      ${picked ? `<button class="link" data-a="pp:rm:${ctx}">Fjern</button>` : `<span class="small muted">Runde ${round} · uke ${wk} · økt ${day} av 6</span>`}</div>
    ${picked ? '' : `<div class="pp-mach" role="group" aria-label="Apparat">${Object.entries(PETE_MACH).map(([k,v]) => `<button data-a="pp:mach:${k}" aria-pressed="${mach === k}">${v}</button>`).join('')}</div>`}
    <div><p class="small muted">${PETE_KIND[ss.kind]}${ss.restTxt ? ' · ' + ss.restTxt : ''}${picked ? ' · ' + PETE_MACH[mach] : ''}${ver === 'str' && (ss.kind === 'steady' || ss.kind === 'hard') ? ' · tilpasset styrke' : ''}</p><h2>${ss.name}</h2></div>
    <div class="pp-facts">
      <div><span>Målfart</span><b>${t.sec ? (ss.bike ? splitTxt(t.sec*2) : splitTxt(t.sec)) : '–'}</b><span>${ss.bike ? 'per 1000 m' : 'per 500 m'}</span></div>
      ${dt ? `<div><span>${ss.d.length === 1 ? 'Måltid' : 'Per drag'}</span><b>${splitTxt(dt)}</b><span>${ss.d.length === 1 ? 'totalt' : 'mål'}</span></div>` : ''}
      <div><span>Arbeid</span><b>${min != null ? min + ' min' : '–'}</b><span>ca.</span></div>
    </div>
    <p class="small muted">Mål fra ${t.src}${ref.split && !/testet|beregnet/.test(t.src) ? '. ' + refLine(mach) : ref.split ? ': ' + refLine(mach).replace(/^(Beregnet|Testet) [24]K: /, '') : ''}</p>
    ${!ref.split ? `<div class="field"><label for="ppRef-${ctx}">${PETE_REF[mach]}<small class="muted">Referansetid gir målfart</small></label>
      <span class="inp"><input id="ppRef-${ctx}" data-ppref="${mach}" type="text" inputmode="decimal" placeholder="${mach === 'bike' ? '6:40' : '7:20'}"></span></div>` : ''}
    <p class="small muted">${peteNote(ss.kind)}</p>
    ${picked ? `${dragMeters(ss) ? `<div class="seg pp-unit" role="group" aria-label="Hva skriver du inn?">
        <button data-a="pp:unit:${ctx}:split" aria-pressed="${unit === 'split'}">Snittfart</button>
        <button data-a="pp:unit:${ctx}:drag" aria-pressed="${unit === 'drag'}">${dragLabel(ss)}</button></div>` : ''}
      <div class="field"><label for="ppSplit-${ctx}">${unit === 'drag' ? (ss.d.length === 1 ? 'Total tid i dag' : 'Snittid per drag i dag') : 'Snittfart i dag'}<small class="muted">${unit === 'drag' ? 'minutter:sekunder' : (ss.bike ? 'per 1000 m' : 'per 500 m')}, f.eks. ${example}</small></label>
      <span class="inp"><input id="ppSplit-${ctx}" data-ppsplit="${ctx}" type="text" inputmode="decimal" value="${esc(picked.split || '')}"></span></div>`
      : `<button class="btn ghost" data-a="pp:pick:${ctx}">Velg denne økta</button>`}
  </section>`;
}
function petePick(ctx){
  const set = S.settings.pete, ss = peteSession(S.pete.idx || 0, set.ver, set.mach), t = peteTarget(ss, set.mach);
  const pick = {idx: S.pete.idx || 0, mach: set.mach, ver: set.ver, split: '', unit: 'split'};
  const mc = {type:'M', min: peteWorkMin(ss, t) || ''};
  if (ctx === 'session' && S.draft) { S.draft.pete = pick; S.draft.metcon = true; S.draft.mc = Object.assign(mc, S.draft.mc && S.draft.mc.rpe ? {rpe:S.draft.mc.rpe} : {}); save(); }
  else { ui.free = true; ui.freePete = pick; ui.freeMc = true; ui.freeMcData = mc; }
}
// Når økta er lagret: neste økt i rotasjonen, nytt mål og nytt 2K-anslag hvis resultat er registrert
function peteDone(pick){
  const ss = peteSession(pick.idx, pick.ver, pick.mach), sec = peteResultSec(ss, pick);
  S.pete = S.pete || {idx:0, targets:{}, pb:{}};
  S.pete.est = S.pete.est || {};
  if (sec && (ss.kind === 'speed' || ss.kind === 'endur')) S.pete.targets[ss.pos + '|' + pick.mach] = sec;
  if (sec && ss.kind === 'hard') { const k = 'hard|' + pick.mach + '|' + ss.meters; if (!S.pete.pb[k] || sec < S.pete.pb[k]) S.pete.pb[k] = sec; }
  if (sec && ss.kind !== 'steady') S.pete.est[pick.mach] = (S.pete.est[pick.mach] || []).concat({t: Date.now(), sec: sec - ss.off, pos: ss.pos}).slice(-10);
  if (pick.idx === (S.pete.idx || 0)) S.pete.idx = (S.pete.idx || 0) + 1;
  return {name: ss.name, kind: ss.kind, mach: pick.mach, split: sec || null, bike: ss.bike, pos: ss.pos, est: sec && ss.kind !== 'steady' ? sec - ss.off : null};
}

/* ---------- Visninger ---------- */
function vFree(){
  return `<button class="link" data-a="freecancel">‹ Tilbake</button>
    <header class="head"><p class="eyebrow">Uten program</p><h1>Fri økt</h1>
      <p class="muted small">Påvirker ikke programmet ditt. Lagres i loggen med dagens dato.</p></header>
    ${ui.freePete ? peteBox('free', ui.freePete) : ui.freeWod ? wodBox(ui.freeWod, 'free') : (peteOn() ? peteBox('free') : '') + quickPick('free')}
    <div class="box notebox">
      <label for="freeNote" class="lbl">${ui.freeWod || ui.freePete ? 'Notat' : 'Hva gjorde du?'}</label>
      <textarea id="freeNote" placeholder="For eksempel: 20 min AMRAP med 5 pull-ups, 10 push-ups og 15 air squats. 9 runder.">${esc(ui.freeNote)}</textarea>
      <button class="tog" data-a="freemc" aria-pressed="${ui.freeMc !== false}">Metcon</button>
      ${ui.freeMc !== false || ui.freeWod || ui.freePete ? mcFields('free', ui.freeMcData) : ''}
    </div>
    <button class="btn" data-a="freesave">Lagre fri økt</button>`;
}

function vToday(){
  if (ui.bank) return vBank();
  if (ui.free) return vFree();
  const g = S.draft && S.draft.guest;   // samme økt som en venn, se guestSess
  if (!S.active && !g) return `
    <div class="h-row h-end">${gearBtn()}</div>${guestToday()}
    <div class="empty">
      <div class="bar" aria-hidden="true"></div>
      <h1>Ingen program ennå</h1>
      <p class="muted">Velg et styrkeprogram, legg inn startvektene dine, så lager appen øktene for deg.</p>
      <button class="btn" data-a="tab:plan">Velg program</button>
      <button class="btn ghost" data-a="free">+ Logg fri økt</button>
    </div>`;
  const p = g ? {name: 'Engangsøkt', prog: 'guest'} : prog(S.active.programId);
  // ATHX følger kalenderen. En økt du ikke har begynt på, byttes når uka er over.
  if (p.prog === 'athx' && !(S.draft && S.draft.ex.some(e => e.sets.some(x => x.d != null))) && axSync(S.active)) { S.draft = null; save(); }
  const tot = g ? 0 : totalOf(p, S.active), over = tot && S.active.idx >= tot && !S.draft;
  if (!S.draft && !over) { S.draft = buildSession(p, S.active); save(); }
  const s = S.draft;
  // Under en økt ligger «Se planen» og «Logg fri økt» i tekstraden nederst, så toppen bare viser økta
  let h = over ? '<div class="topbar"><button class="quick" data-a="free">+ Logg fri økt</button></div>' : '';
  if (ui.summary) {
    const u = ui.summary;
    // Rekord: ringet rundt med blå penn, fordi det er noe du har gjort. Rødt er bare for avvik.
    const ring = '<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M8 22C6 8 40 2 70 4c22 2 30 10 26 20-4 11-36 15-62 12C14 34 4 28 10 16"/></svg>';
    h += `<section class="done" aria-live="polite">
      <h2>${u.day} fullført</h2>
      ${u.vol > 0 ? `<div class="big">${fmt(Math.round(u.vol))} kg <span class="muted small">løftet totalt</span></div>` : ''}
      ${u.prs && u.prs.length ? `<div class="prs">${u.prs.map(r => `<div class="pr"><b>Rekord i ${r.name.toLowerCase()}</b>
        <span class="ring">${fmt(r.w)} × ${r.d}${ring}</span></div><p class="small muted">Anslått 1RM ${fmt(r.e)} kg</p>`).join('')}</div>` : ''}
      <ul class="notes">${u.notes.map(n => `<li><b>${n.name}</b><span class="${n.kind}">${n.text}</span></li>`).join('')}</ul>
      <button class="link" data-a="dismiss">Lukk</button>
    </section>`;
  }
  if (over) {
    const a = S.active;
    return h + `<header class="head"><p class="eyebrow">${p.name}</p><div class="h-row"><h1>Programmet er fullført</h1>${gearBtn()}</div></header>
      ${a.e1rm ? `<div class="box trend">${Object.keys(a.e1rm).map(l => `<div class="tr"><b>${liftName(l)}</b><span>${fmt(a.base[l])} → ${fmt(Math.round(a.e1rm[l]*2)/2)} kg</span></div>`).join('')}</div>
      <p class="muted small">Startverdi mot estimert 1RM nå.</p>` : ''}
      <button class="btn" data-a="go:library">Velg neste program</button>`;
  }
  const anyTouched = s.ex.some(e => e.sets.some(x => x.d != null));
  const allDone = e => e.sets.every(x => x.d != null);
  const touched = e => e.sets.some(x => x.d != null) || !!(e.wuDone && e.wuDone.length);
  // Strength & Power spør om RPE eller kvalitet når settene er gjort. Kortet holdes åpent til det er svart,
  // men neste øvelse blir den du holder på med, så pauseklokka står i den med en gang alle settene er krysset av.
  const asks = e => e.sp && allDone(e) && ((e.part === 'extra' && e.rpe == null) || ((e.part === 'top' || e.part === 'back') && (e.slot === 'clean' ? e.q == null : e.rpe == null)));
  const cur = s.ex.findIndex(e => !allDone(e));
  const setsLeft = s.ex.reduce((n, e) => n + e.sets.filter(x => x.d == null).length, 0);
  const mins = Math.floor((Date.now() - s.started) / 60000);
  if (!g) h += guestToday();
  h += `<header class="head">
      <p class="eyebrow">${p.name} · ${s.sub}</p>
      <div class="h-row"><h1>${s.day}</h1>${anyTouched ? `<span>${mins} min · ${setsLeft ? setsLeft + ' sett igjen' : 'alt gjort'}</span>` : ''}${gearBtn()}</div>
      <div class="prog" aria-label="${cur < 0 ? 'Alle øvelser er gjort' : 'Øvelse ' + (cur+1) + ' av ' + s.ex.length}">${s.ex.map(e => {
        const d = e.sets.filter(x => x.d != null).length;
        return `<i class="${d === e.sets.length ? 'full' : ''}"><b style="width:${Math.round(d / e.sets.length * 100)}%"></b></i>`; }).join('')}</div>
      ${p.prog === 'athx' ? axStatus(S.active, s)
        : g ? `<p class="muted small">Vektene er regnet ut fra dine makser. Programmet ditt står der det står.</p>`
        : S.active.e1rm && s.ex[0] && S.active.e1rm[s.ex[0].lift] ? `<p class="muted small">${p.prog === 'sp12' ? 'Estimert 1RM' : '1RM'} ${liftName(s.ex[0].lift).toLowerCase()}: ${fmt(Math.round(S.active.e1rm[s.ex[0].lift]*2)/2)} kg</p>` : ''}
    </header>`;
  if (p.prog === 'sp12') {
    const c = mcRecentConflict(s.ex[0].slot);
    if (c && !anyTouched) h += `<div class="warn">Du logget en ${MC[c.mc.type].n.toLowerCase()} metcon for ${Math.max(1, Math.round((Date.now() - c.date)/3600e3))} timer siden. Forvent høyere RPE i dag, og kutt gjerne ett backoff-sett.</div>`;
    if ((s.ph === 'd4' || s.ph === 'd8') && !anyTouched && ui.keepDl !== s.ph) h += vDeloadChoice(s.ph);
  }
  if (p.prog === 'burg') {
    const c = mcRecentConflict(s.ex[0].slot);
    if (c && !anyTouched) h += `<div class="warn">Du logget en ${MC[c.mc.type].n.toLowerCase()} metcon for ${Math.max(1, Math.round((Date.now() - c.date)/3600e3))} timer siden. Forvent tyngre løft i dag, og stopp ved prosentene der teknikken holder.</div>`;
  }
  s.ex.forEach((e,ei) => {
    const top = Math.max(...e.sets.map(x => x.w));
    const k = s.started + '-' + ei, opened = !!(ui.exOpen && ui.exOpen[k]);
    const wk = wuKind(s, ei), wu = wk ? warmups(e.slot, e.sets[0].w, e.sets[0].t, wk) : [];
    // Ferdig øvelse blir én linje når du har begynt på en senere øvelse. Trykk for å åpne den igjen.
    if (!opened && cur !== ei && allDone(e) && !asks(e) && s.ex.slice(ei+1).some(touched)) {
      const hit = e.sets.every(x => x.d >= x.t);
      h += `<button class="ex-row" data-a="exopen:${k}" aria-label="${liftName(e.lift)}, ferdig: ${setsLine(e, true)}. Trykk for å åpne">
        <span class="ck ${hit ? '' : 'miss'}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${hit ? 'M5 12l5 5L20 7' : 'M12 7v6M12 17v.01'}"/></svg></span>
        <b>${liftName(e.lift)}</b><span>${setsLine(e, true)}</span></button>`;
      return;
    }
    // Øvelser som ikke er påbegynt etter den du holder på med, vises som én linje med navn og vekt
    if (!opened && cur > -1 && ei > cur && !touched(e)) {
      h += `<button class="ex-row ex-line" data-a="exopen:${k}" aria-label="${ei === cur + 1 ? 'Neste' : 'Senere'}: ${liftName(e.lift)}, ${setsLine(e)}. Trykk for å åpne">
        <small>${ei === cur + 1 ? 'Neste' : 'Senere'}</small><b>${liftName(e.lift)}</b><span>${fmt(top)} kg</span></button>`;
      return;
    }
    const now = ei === cur;
    // Ett tall om gangen: før arbeidssettene er i gang viser kortet neste oppvarmingssett som det store tallet
    const wuDone = e.wuDone || [], wuNext = wu.findIndex(([w, r]) => !wuDone.includes(w + 'x' + r));
    const warm = now && wuNext > -1 && !e.sets.some(x => x.d != null);
    const nextSi = now && !warm ? e.sets.findIndex(x => x.d == null) : -1;
    const varies = new Set(e.sets.map(x => x.w)).size > 1;
    const amIdx = e.sets.findIndex(x => x.am && x.d != null);
    // Ett tall om gangen: det store tallet er alltid neste sett. Den markerte ruta viser hvor i rekka du er,
    // så kortet trenger ikke si «Oppvarming 2 av 3» eller «sett 2 av 5» i tillegg.
    const [bigW, bigR] = warm ? wu[wuNext] : nextSi > -1 ? [e.sets[nextSi].w, e.sets[nextSi].c || e.sets[nextSi].t] : [top, 0];
    const bigAm = !warm && nextSi > -1 && e.sets[nextSi].am;
    const head = `<div class="ex-head"><h2>${liftName(e.lift)}</h2>${e.tag ? `<span class="tag">${e.tag}</span>` : ''}</div>
        ${now ? `<div class="kg"><span id="kgN" data-w="${fmt(bigW)}">${fmt(bigW)}</span><small id="kgU" data-u="kg${bigR ? ' × ' + bigR + (bigAm ? '+' : '') : ''}">kg${bigR ? ' × ' + bigR + (bigAm ? '+' : '') : ''}</small></div>
        <div class="rest-bar" aria-hidden="true"><i></i></div>`
          : `<div class="kg">${fmt(bigW)}<small>kg${bigR ? ' × ' + bigR + (bigAm ? '+' : '') : ''}</small></div>`}
        ${LIFTS[e.lift].bar ? `<div class="platesrow ${now ? 'platebox' : ''}">${plateHTML(bigW, now)}</div>` : ''}`;
    // Hele toppen av arket er knappen for neste sett: stor flate, ingen leting etter riktig rute
    const canNext = now && (warm || nextSi > -1);
    h += `<section class="ex ${now ? 'now' : ''}">
      ${canNext ? `<div class="ex-hit" role="button" tabindex="0" data-a="next:${ei}" aria-label="Før inn ${bigR}${bigAm ? '+' : ''} reps på ${fmt(bigW)} kg${warm ? ', oppvarming' : ''}">${head}</div>` : head}
      ${e.hint ? `<p class="wu">${e.hint}</p>` : ''}
      <div class="chips">${wu.length ? `<div class="chip-grp wu-grp">${vWarmup(e, ei, wu, wuNext, warm)}</div>` : ''}<div class="chip-grp">${e.sets.map((x,si) => {
        const st = x.d == null ? (si === nextSi ? 'next' : '') : (x.d >= x.t ? 'ok' : 'miss');
        const fr = x.d != null && ui.fresh === ei + ':' + si ? ' fresh' : '';
        const lbl = 'Sett '+(si+1)+': '+(x.d == null ? 'ikke gjort, mål '+(x.c || x.t)+' reps' : x.d+' reps')+(x.am ? ', så mange du klarer' : '');
        return `<div class="cw"><button class="chip ${st} ${x.am?'am':''}${fr}" data-a="set:${ei}:${si}" aria-label="${lbl}">${x.c && (x.d == null || x.d === x.t) ? x.c : x.d == null ? x.t : x.d}${x.am ? '<sup>+</sup>' : ''}</button>${varies || wu.length ? `<small>${fmt(x.w)}</small>` : ''}</div>`;
      }).join('')}</div></div>
      ${amIdx > -1 ? `<div class="amrap"><span>Siste sett, så mange du klarer</span>
        <button class="step" data-a="am:${ei}:${amIdx}:-1" aria-label="Én rep mindre">−</button>
        <b>${e.sets[amIdx].d}</b>
        <button class="step" data-a="am:${ei}:${amIdx}:1" aria-label="Én rep mer">+</button></div>` : ''}
      ${canNext && S.history.filter(x => !x.free && !x.skipped).length < 3 ? '<p class="chip-hint">Trykk på tallet = gjort · trykk på et sett igjen = én rep mindre</p>' : ''}
      ${e.sp ? spExtras(e, ei) : ''}
      ${e.adj ? `<div class="amrap"><span>Juster vekt etter dagsform</span>
        <button class="step" data-a="w:${ei}:-1" aria-label="2,5 kg lettere">−</button>
        <button class="step" data-a="w:${ei}:1" aria-label="2,5 kg tyngre">+</button></div>` : ''}
    </section>`;
  });
  // Burgener: kroppsvektøvelsene står som en påminnelse og logges ikke
  if (s.acc) h += `<section class="box"><span class="lbl">Til slutt, uten vekt</span><p class="small">${esc(s.acc)}</p></section>`;
  if (s.cond) h += axCondBox(s);
  // Etter styrken: kondisjon, metcon og notat ligger bak én rad. En del med innhold står alltid åpen.
  const af =ui.after && ui.after.k === s.started ? ui.after : (ui.after = {k: s.started});
  const has = {cond: !!s.pete, mc: !!(s.wod || s.metcon), note: !!(s.note || '').trim()};
  const show = k => !!(af[k] || has[k]);
  const parts = [peteOn() || s.pete ? ['cond', 'Kondisjon'] : null, ['mc', 'Metcon'], ['note', 'Notat']].filter(Boolean);
  h += `<section class="box after"><span class="lbl">${s.ex.length ? 'Etter styrken' : 'Mer i økta'}</span>
      <div class="after-add">${parts.map(([k, n]) => `<button class="tog" data-a="after:${k}" aria-pressed="${show(k)}">${show(k) ? n : '+ ' + n}</button>`).join('')}</div></section>`;
  if (show('cond')) h += peteBox('session', s.pete);
  if (show('mc')) {
    h += vMetconBudget(p, s);
    h += s.wod ? wodBox(s.wod, 'session') : s.pete ? '' : quickPick('session');
    h += `<section class="box"><button class="tog" data-a="metcon" aria-pressed="${!!s.metcon}">Metcon i dag</button>
      ${s.metcon || s.wod ? mcFields('session', s.mc) : ''}</section>`;
  }
  if (show('note')) h += `<section class="box notebox">
      <label for="note" class="lbl">Notat</label>
      <textarea id="note" placeholder="For eksempel dagsform eller en teknikkdetalj">${esc(s.note)}</textarea>
    </section>`;
  // Mangler det sett, sier appen hva som skjer med dem før økta lukkes
  if (ui.confirm === 'finish' && setsLeft) {
    const left = e => e.sets.filter(x => x.d == null).length;
    const cap = list => list.map((n, i) => i ? n.charAt(0).toLowerCase() + n.slice(1) : n);
    const part = s.ex.filter(e => left(e) && e.sets.some(x => x.d != null)), none = s.ex.filter(e => e.sets.every(x => x.d == null));
    const missing = cap([...part.map(e => liftName(e.lift) + ' (' + left(e) + ' sett)'), ...none.map(e => liftName(e.lift))]);
    // Lineære programmer og GZCLP: påbegynte løft med hull teller som bom, løft du ikke har rørt, står stille (se progress)
    let why = 'Settene lagres som ikke tatt i loggen.';
    if (p.prog === 'linear' || p.prog === 'gzclp') why = [part.length ? 'Løft med sett som mangler, regnes som bom.' : '',
      none.length ? listNo(cap(none.map(e => liftName(e.lift)))) + ' står på samme vekt neste gang.' : ''].join(' ');
    h += `<section class="box skipbox" aria-live="polite"><p><b>Fullføre med ${setsLeft} sett som ikke er logget?</b></p>
      <p class="small">Ikke logget: ${esc(listNo(missing))}. ${esc(why)}</p>
      <div class="row"><button class="btn sm" data-a="finish">Fullfør likevel</button><button class="btn ghost sm" data-a="cancel">Fortsett økta</button></div></section>`;
  } else h += `<button class="btn" data-a="${setsLeft ? 'confirm:finish' : 'finish'}" ${anyTouched || s.cond ? '' : 'disabled'}>Fullfør økt</button>`;
  if (ui.confirm === 'skipday') {
    const a1 = JSON.parse(JSON.stringify(S.active)); a1.idx++;
    const next = tot && a1.idx >= tot ? null : buildSession(p, a1);
    const lifts = [...new Set(s.ex.map(e => liftName(e.lift)))].map((n, i) => i ? n.toLowerCase() : n);
    h += `<section class="box skipbox" aria-live="polite"><p><b>Hoppe over ${esc(s.day)}?</b></p>
      <p class="small">${lifts.length ? listNo(lifts) + ' får ingen økning denne gangen, og vektene står som de er.' : 'Økta lagres som hoppet over.'}${anyTouched ? ' Settene du har tatt i dag, lagres ikke.' : ''}${s.wod || s.pete ? ' Metconen du har valgt, lagres heller ikke.' : ''}
        ${next ? 'Neste økt blir ' + esc(next.day) + (next.sub && next.sub !== s.sub ? ' (' + esc(next.sub) + ')' : '') + '.' : 'Dette var siste økt i programmet.'}</p>
      <div class="row"><button class="btn danger sm" data-a="skipday">Ja, hopp over</button><button class="btn ghost sm" data-a="cancel">Avbryt</button></div></section>`;
  }
  // Engangsøkta kan avbrytes. Da kommer din egen økt tilbake, med settene du hadde ført.
  if (g) h += ui.confirm === 'guestquit'
    ? `<section class="box skipbox" aria-live="polite"><p><b>Avbryte økta med ${esc(g.who)}?</b></p>
      <p class="small">${anyTouched ? 'Settene du har tatt, lagres ikke. ' : ''}${S.parked ? 'Din egen økt kommer tilbake slik du forlot den.' : 'Neste økt i programmet ditt står klar.'}</p>
      <div class="row"><button class="btn danger sm" data-a="guestquit">Ja, avbryt</button><button class="btn ghost sm" data-a="cancel">Fortsett økta</button></div></section>`
    : `<div class="links"><button class="link" data-a="confirm:guestquit">Avbryt økta</button></div>`;
  // Planen ligger under Program og fri økt under Fremgang, så her står bare det som gjelder dagens økt
  else if (ui.confirm !== 'skipday') h += `<div class="links"><button class="link" data-a="confirm:skipday">Hopp over økta</button></div>`;
  ui.fresh = null;   // blekket tegnes bare én gang, på settet du nettopp førte inn
  return h;
}

// Lett uke: vis tallene appen har, og la utøveren velge
function vDeloadChoice(ph){
  const rows = spReadiness(S.active);
  const mark = v => v == null ? '<span class="muted">–</span>' : v ? '<span class="ok-t">✓</span>' : '<span class="warn-t">✗</span>';
  const allOk = rows.every(r => r.effOk && r.trendOk);
  return `<section class="box dl">
    <h3 style="margin:0">Lett uke, eller én uke til?</h3>
    <p class="small">Forskningen tyder på at en fast lett uke ikke alltid trengs. Hopp bare over den hvis alle punktene stemmer.</p>
    <div class="trend">${rows.map(r => `<div class="tr"><b>${r.name}</b><span>${r.eff || 'ingen vurdering'}</span>${mark(r.effOk)}<span class="muted">1RM-trend</span>${mark(r.trendOk)}</div>`).join('')}</div>
    <ul class="small crit">
      <li>Estimert 1RM har stått stille eller steget de siste to ukene.</li>
      <li>Toppsettene har ligget på RPE 9 eller lavere, og clean har vært rask og ren.</li>
      <li>Du sover godt, føler deg uthvilt og har ingen smerter.</li>
    </ul>
    <p class="small ${allOk ? 'ok-t' : 'muted'}">${allOk ? 'Tallene i appen ser bra ut. Du avgjør punktet om søvn og smerter.' : 'Tallene peker mot å ta den lette uka.'}</p>
    <div class="row"><button class="btn ghost sm" data-a="keepdl:${ph}">Ta lett uke</button><button class="btn ghost sm" data-a="skipdl:${ph}">Hopp over</button></div>
  </section>`;
}

function dayLines(p, d){
  if (d.lines) return d.lines.map(([n, v]) => `<div>${n}<span>${v}</span></div>`);
  if (p.prog === 'cube') {
    const di = p.days.indexOf(d);
    return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
      ...['1 · 4 · 7','2 · 5 · 8','3 · 6 · 9'].map((u,k) => `<div>Uke ${u}<span>${CUBE.tag[CUBE.rot[k][di]]}</span></div>`),
      `<div>Uke 10<span>Test</span></div>`];
  }
  if (p.prog === 'sp12') {
    const sc = SP.scheme[d.lift], f = x => x[0] + '×' + x[1];
    const xs = [...new Set(Object.values(SP.extras[d.lift] || {}).flat().map(x => liftName(x[0]).toLowerCase()))];
    return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
      ...['p1','p2','p3'].map((ph,k) => `<div>Uke ${['1–3','5–7','9–10'][k]}<span>${f(sc[ph].top)} + ${f(sc[ph].back)}</span></div>`),
      `<div>Uke 4 og 8<span>Lett uke</span></div>`, `<div>Uke 11<span>Taper</span></div>`,
      `<div>Uke 12<span>${d.lift === 'clean' ? 'Beste single' : 'Test 3RM'}</span></div>`,
      ...(xs.length ? [`<div class="xs">+ ${xs.join(' og ')}</div>`] : [])];
  }
  if (p.prog === 'linear') return d.ex.map(e => `<div>${liftName(e.lift)}<span>${e.sets}×${e.reps}</span></div>`);
  if (p.prog === 'gzclp') return d.ex.map(e => `<div><span style="color:var(--chalk)"><b>${e.tier}</b>${liftName(e.lift)}</span><span>${e.tier==='T1'?'5×3+':e.tier==='T2'?'3×10':'3×15+'}</span></div>`);
  if (p.prog === 'jugg') return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
    ...JUG_WAVE.map((w, k) => `<div>Uke ${k*4+1}–${k*4+4}<span>${w}</span></div>`)];
  return [`<div>${liftName(d.lift)}<span>3 sett</span></div>`, `<div>${liftName(d.lift)}<span>${p.fsl ? 'FSL 5×5' : '5×10'}</span></div>`];
}

// Programmer: det aktive programmet øverst, så filter på nivå og en kompakt liste
const LEVELS = ['Nybegynner','Middels','Erfaren'];
const chev = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
function vActiveCard(){
  const a = S.active, p = prog(a.programId); if (!p) return '';
  const tot = totalOf(p, a), over = tot && a.idx >= tot;
  const next = over ? null : (ownDraft() || buildSession(p, JSON.parse(JSON.stringify(a))));
  const lifts = next ? [...new Map(next.ex.map(e => [e.lift, Math.max(...e.sets.map(x => x.w))])).entries()].slice(0, 3) : [];
  return `<button class="act-card" data-a="open:${p.id}">
      <div class="act-top"><span class="tag">Aktivt program</span>${next ? `<span>${esc(next.sub)}</span>` : ''}</div>
