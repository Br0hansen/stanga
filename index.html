/* ---------- Metcon-klokke ----------
   Én klokke for For Time, AMRAP, EMOM og intervaller. Oppsettet er en liste med blokker,
   og blokkene blir en liste med biter: {k, sec, bi, rp, r, n, lbl}.
   k: 'up' = For Time (teller opp), 'am' = AMRAP (teller ned), 'work' og 'rest' = fast tid,
   'open' = arbeid uten fast tid (du trykker når draget er ferdig). sec = null: biten varer til du trykker.
   Tiden regnes fra starttidspunktet, ikke ved å telle tikk, så klokka står riktig også når appen har vært
   i bakgrunnen. Klokka lagres for seg selv og følger ikke med i skybackup.
   Klokka startes fra ikonet på I dag eller fra metcon-kortet. Resultatet kobles til økta først når du
   trykker «Ferdig», så du trenger ikke velge økt før du starter. */
const CK_KEY = KEY + '.clock';
let CK = (() => { try { const c = JSON.parse(localStorage.getItem(CK_KEY)); return c && c.bits && Date.now() - c.t0 < 6 * 3600e3 ? c : null; } catch(e) { return null; } })();
const ckStore = () => { try { CK ? localStorage.setItem(CK_KEY, JSON.stringify(CK)) : localStorage.removeItem(CK_KEY); } catch(e) {} };
const ckOn = () => !!(CK && !CK.done);
const ckCopy = c => JSON.parse(JSON.stringify(c));
const CK_T = {ft:'For Time', amrap:'AMRAP', emom:'EMOM', int:'Intervaller', rest:'Pause'};
const ckNew = t => ({ft:{t:'ft', cap:0}, amrap:{t:'amrap', sec:720}, emom:{t:'emom', every:60, n:10, st:[]}, int:{t:'int', work:40, rest:20, n:10}, rest:{t:'rest', sec:120}})[t];
const CK_QUICK = [
  ['Tabata 20/10 × 8', {t:'int', work:20, rest:10, n:8}], ['40/20 × 10', {t:'int', work:40, rest:20, n:10}],
  ['30/30 × 10', {t:'int', work:30, rest:30, n:10}], ['EMOM 10', {t:'emom', every:60, n:10, st:[]}],
  ['AMRAP 12', {t:'amrap', sec:720}], ['For Time', {t:'ft', cap:0}]];
const durTxt = s => s % 60 ? (s < 60 ? s + ' s' : mmss(s)) : s / 60 + ' min';
const ckCd = () => S.settings.ckCd != null ? S.settings.ckCd : 10;
const ckSound = () => S.settings.clockSound !== false;
const playSVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';
const clockSVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5V6M18.5 6.5L20 5"/></svg>';

function ckDesc1(b){
  if (b.t === 'ft') return 'For Time' + (b.cap ? ' · tak ' + durTxt(b.cap) : '');
  if (b.t === 'amrap') return 'AMRAP ' + durTxt(b.sec);
  if (b.t === 'emom') return b.every % 60 ? `Hvert ${durTxt(b.every)} × ${b.n}` : (b.every === 60 ? 'EMOM ' : `E${b.every / 60}MOM `) + durTxt(b.n * b.every);
  if (b.t === 'int') return b.work ? durTxt(b.work) + (b.rest ? ' / ' + durTxt(b.rest) : '') + ' × ' + b.n : `${b.n} drag${b.rest ? ' · ' + durTxt(b.rest) + ' pause' : ''}`;
  return 'Pause ' + durTxt(b.sec);
}
const ckDesc = c => { const d = c.b.map(ckDesc1).join(' → '); return c.rep > 1 ? `(${d}) × ${c.rep}` : d; };

// Blokkene blir biter. Pausen etter siste drag og en pause helt til slutt tas bort.
function ckBits(c){
  const out = [];
  for (let rp = 0; rp < (c.rep || 1); rp++) c.b.forEach((b, bi) => {
    const o = (k, sec, r, n, lbl) => out.push({k, sec, bi, rp, r, n, lbl: lbl || ''});
    if (b.t === 'ft') o('up', b.cap || null, 0, 1);
    else if (b.t === 'amrap') o('am', b.sec, 0, 1);
    else if (b.t === 'emom') for (let i = 0; i < b.n; i++) o('work', b.every, i, b.n, b.st && b.st.length ? b.st[i % b.st.length] : '');
    else if (b.t === 'int') for (let i = 0; i < b.n; i++) { o(b.work ? 'work' : 'open', b.work || null, i, b.n); if (i < b.n - 1 && b.rest) o('rest', b.rest, i, b.n); }
    else o('rest', b.sec, 0, 1);
  });
  while (out.length > 1 && out[out.length - 1].k === 'rest') out.pop();
  return out;
}

// Fylt ut fra øktbanken: blokkene leses fra teksten i rekkefølge. Formatet og minuttene i banken er reserven.
// Tolkingen kan bomme, så beskrivelsen står alltid ved «Start klokke», og «Endre» åpner oppsettet.
function ckParse(text, f, m){
  const lines = String(text || '').split('\n').map(x => x.trim()), b = [], low = String(text || '').toLowerCase();
  const n = x => parseInt(x, 10) || 0;
  let em = null, rep = 0;   // em = EMOM-blokka vi samler stasjoner til
  // «2x 9 min AMRAP» er en oppsummering: blokkene står under (A, B), eller den skal gjentas
  const sumOf = l => n((l.match(/(?:^|\s|:)(\d)\s*[x×]\s*\d+\s*min/) || [])[1]);
  // «m/ 2 min hvile mellom» gjelder mellom blokkene
  const gapM = low.match(/(\d{1,3})\s*(s\b|sek\w*|min\w*)\s*(?:hvile|pause|rest)\s*(?:mellom|between)/);
  const gap = gapM ? n(gapM[1]) * (/^m/.test(gapM[2]) ? 60 : 1) : 0;
  const setsM = low.match(/(?:^|\n)\s*(?:for\s*)?(\d{1,2})\s*sett\s*(?:av|med)\b/);   // «For 5 sett av: AMRAP 5 minutter»
  const capM = low.match(/(\d{1,3})\s*(?:min\w*)?\s*(?:time ?cap|cap|tak)\b|(?:time ?cap|cap|tak)\s*(?:på\s*)?:?\s*(\d{1,3})/);
  const cap = capM ? (n(capM[1]) || n(capM[2])) * 60 : 0;
  for (const ln of lines){
    const l = ln.toLowerCase();
    let x;
    if (!l) { if (em) em.body = em.body || em.lines.length > 0 || em.st.length > 0; continue; }
    if ((x = l.match(/\be(\d{1,2})?mom\b[\s:\-]*(?:(?:x|×)\s*(\d{1,3})|(\d{1,3}))?/))) {
      const every = (n(x[1]) || 1) * 60, tot = n(x[3]) || n((l.match(/(\d{1,3})\s*min/) || [])[1]);
      b.push(em = {t:'emom', every, n: n(x[2]) || (tot ? Math.max(1, Math.round(tot * 60 / every)) : 0), st:[], lines:[], sum: sumOf(l)});
      continue;
    }
    if ((x = l.match(/(\d{1,3})\s*(?:min\w*\.?|')\s*amrap|amrap\s*(?:på\s*|i\s*)?(\d{1,3})\b/))) { em = null; b.push({t:'amrap', sec: (n(x[1]) || n(x[2])) * 60, sum: sumOf(l)}); continue; }
    if (/^for (?:time|tid)\b|^\d+\s*(?:rft|rounds for time|runder for tid)\b/.test(l) && !b.some(y => y.t === 'ft')) { em = null; b.push({t:'ft', cap}); continue; }
    if ((x = l.match(/^(?:rest|pause|hvile)\s*:?\s*(\d{1,2}(?::\d{2})?)\s*(min\w*|m\b|s\b|sek\w*)?|^(\d{1,2})\s*min\w*\s*(?:rest|pause|hvile)\b/))) {
      em = null; const v = x[3] ? n(x[3]) * 60 : /:/.test(x[1]) ? n(x[1]) * 60 + n(x[1].split(':')[1]) : /^s/.test(x[2] || '') ? n(x[1]) : n(x[1]) * 60;
      if (v) b.push({t:'rest', sec: v}); continue;
    }
    if ((x = l.match(/^(\d{1,2})\s*(?:runder|rounds|rnds)\.?$/))) { rep = n(x[1]); continue; }
    if (/^gjenta\b/.test(l)) { rep = rep || 2; continue; }
    if (em && !em.body) {
      if ((x = ln.match(/^(\d{1,2})\s*[:.,)]\s*(\S.*)$/) || ln.match(/^\d{1,2}\s*-\s*\d{1,2}\s*[-–:]\s*(\S.*)$/))) em.st.push((x[2] || x[1]).trim());
      else em.lines.push(ln);
    }
  }
  b.forEach(y => {
    if (y.t !== 'emom') return;
    if (!y.st.length && y.lines.length && y.lines.length <= 3) y.st = [y.lines.join(' + ')];
    if (!y.n) y.n = y.st.length ? y.st.length * (rep || 1) : Math.round((m || 12) * 60 / y.every);
    delete y.lines; delete y.body;
  });
  // Oppsummeringen tas bort når blokkene står under den, ellers blir den N like blokker
  for (let i = b.length - 1; i >= 0; i--) if (b[i].sum > 1) {
    const same = b.filter((y, j) => j !== i && y.t === b[i].t).length;
    const one = Object.assign({}, b[i]); delete one.sum;
    b.splice(i, 1, ...(same >= 2 ? [] : Array.from({length: b[i].sum}, () => Object.assign({}, one, {st: one.st ? one.st.slice() : undefined}))));
  }
  b.forEach(y => delete y.sum);
  if (b.some(y => y.t === 'ft')) b.splice(0, b.length, b.find(y => y.t === 'ft'));   // For Time går i ett, pausene er en del av tida
  if (b.every(y => y.t === 'rest')) b.length = 0;
  if (gap && b.length > 1 && !b.some(y => y.t === 'rest')) for (let i = b.length - 1; i > 0; i--) b.splice(i, 0, {t:'rest', sec: gap});
  const emomRep = b.length === 1 && b[0].t === 'emom';   // «3 runder» hørte til stasjonene
  if (setsM && b.length) rep = n(setsM[1]);
  const reps = setsM || (!emomRep && b.length > 1) ? rep : 0;
  while (reps < 2 && b.length > 1 && b[b.length - 1].t === 'rest') b.pop();   // pausen etter siste blokk er ikke en del av klokka
  if (!b.length) {
    let x;
    if (/tabata/.test(low)) b.push({t:'int', work:20, rest:10, n:8});
    else if ((x = low.match(/(\d{1,3})\s*s\w*\s*(?:on|arbeid|jobb)\s*[\/,]?\s*(\d{1,3})\s*s\w*\s*(?:off|pause|hvile)/))) {
      const r = low.match(/(\d{1,2})\s*(?:runder|rounds|x\b|×)/); b.push({t:'int', work:n(x[1]), rest:n(x[2]), n: r ? n(r[1]) : 8});
    }
    else if (f === 'EMOM / intervall' && (x = low.match(/(\d{1,2})(?:\s*[–-]\s*(\d{1,2}))?\s*(?:[x×]\s*\S|runder\b|rounds\b|drag\b)/))) {
      const p = low.match(/(\d{1,3})\s*(s\b|sek\w*|min\w*)\s*(?:\w+\s+){0,2}(?:pause|hvile|rest|mellom)|(?:pause|hvile|rest)\s*:?\s*(\d{1,2})\s*(s\b|sek\w*|min\w*)?/);
      const rest = p ? (p[1] ? n(p[1]) * (/^m/.test(p[2]) ? 60 : 1) : n(p[3]) * (/^s/.test(p[4] || 'min') ? 1 : 60)) : 60;
      b.push({t:'int', work:0, rest, n: n(x[2]) || n(x[1])});
    }
    else if (f === 'AMRAP') b.push({t:'amrap', sec: (m || 20) * 60});
    else if (f === 'EMOM / intervall') b.push({t:'emom', every:60, n: m || 12, st:[]});
    else b.push({t:'ft', cap});
  }
  b.forEach(y => { if (y.n) y.n = Math.min(y.n, 100); if (y.t === 'amrap' && !(y.sec > 0)) y.sec = (m || 20) * 60; });
  return {b, rep: reps > 1 ? Math.min(reps, 10) : 1};
}
function ckWod(ctx){ return ctx === 'session' ? S.draft && S.draft.wod : ctx === 'free' ? ui.freeWod : null; }
function ckFromWod(w){
  const bw = bankGet(w.id);
  return Object.assign(bw && bw.ck ? ckCopy(bw.ck) : ckParse(w.tekst, bw && bw.f, bw && bw.m), {name: w.navn, from: w.id});
}
const ckCtxNow = () => ui.free ? 'free' : S.draft ? 'session' : null;
function ckDefault(ctx){
  const w = ckWod(ctx), rec = S.settings.ckRecent || [];
  return w ? ckFromWod(w) : rec[0] ? ckCopy(rec[0]) : {b:[ckNew('amrap')], rep:1};
}

// Hvor er klokka nå? e = sekunder siden start, uten nedtelling og pauser.
function ckNow(){
  const e = CK.done ? CK.endE : ((CK.pausedAt || Date.now()) - CK.t0 - CK.paused) / 1000 - CK.cd;
  if (e < 0) return {cd: -e, e};
  let a = 0;
  for (let i = 0; i < CK.bits.length; i++) {
    const b = CK.bits[i], end = CK.ends[i] != null ? CK.ends[i] : b.sec != null ? a + b.sec : Infinity;
    if (e < end) return {i, b, e, a, inn: e - a, left: isFinite(end) && CK.ends[i] == null ? end - e : null};
    a = end;
  }
  return {over: true, e: a};
}
const ckBitTxt = b => !b ? '' : b.k === 'rest' ? 'Pause ' + durTxt(b.sec) : b.k === 'open' ? `Drag ${b.r + 1} av ${b.n}`
  : b.k === 'up' ? 'For Time' : b.k === 'am' ? 'AMRAP ' + durTxt(b.sec) : b.lbl || `Arbeid ${durTxt(b.sec)}`;
// Det skjermen viser: overskrift, tid, linja under og hvor mye av biten som er igjen
function ckFace(s){
  if (s.cd != null) return {k:'cd', ph:'Klar', t: String(Math.ceil(s.cd)), sub: 'Først: ' + ckBitTxt(CK.bits[0]), lvl: CK.cd ? s.cd / CK.cd : 0, warn: s.cd <= 3};
  const b = s.b, blk = CK.cfg.b[b.bi], nx = CK.bits[s.i + 1];
  let ph, t, sub = nx ? 'Neste: ' + ckBitTxt(nx) : b.k === 'work' ? 'Siste runde' : '';
  if (b.k === 'up') { ph = 'Tid brukt'; t = mmss(s.inn); sub = b.sec ? 'Tak om ' + mmss(Math.ceil(s.left)) : 'Trykk «Ferdig» når du er ferdig'; }
  else if (b.k === 'am') { ph = 'Igjen'; t = mmss(Math.ceil(s.left)); }
  else if (b.k === 'open') { ph = `Drag ${b.r + 1} av ${b.n}`; t = mmss(s.inn); sub = 'Trykk når draget er ferdig'; }
  else if (b.k === 'work') { ph = blk.t === 'emom' ? (blk.every === 60 ? 'Minutt ' : 'Runde ') + (b.r + 1) + ' av ' + b.n : `Arbeid · runde ${b.r + 1} av ${b.n}`; t = mmss(Math.ceil(s.left)); }
  else { ph = 'Pause'; t = mmss(Math.ceil(s.left)); }
  const lvl = b.sec ? (b.k === 'up' ? s.inn / b.sec : s.left / b.sec) : null;
  return {k: b.k, ph, t, sub, lvl, warn: s.left != null && s.left <= 3};
}

/* Lyd: tre korte pip før hver ny bit, ett langt når den starter. Telefonen vibrerer der det går (ikke iPhone).
   Lyden låses opp når du trykker Start, og igjen når du trykker på klokka. Med låst skjerm kjører ikke appen,
   derfor holdes skjermen på mens klokka går. */
function ckBeep(long){
  if (navigator.vibrate) try { navigator.vibrate(long ? 300 : 60); } catch(e) {}
  if (!ckSound() || !audio) return;
  try {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime, d = long ? .5 : .12;
    o.frequency.value = long ? 1180 : 880;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + d + .02);
  } catch(e) {}
}
function ckSignal(){
  ckBeep(true);
  const el = $('#clk'), f = el && !el.hidden ? el : $('#restFlash'), c = f === el ? 'flash' : 'go';
  if (f) { f.classList.remove(c); void f.offsetWidth; f.classList.add(c); }
}
let ckLast = {i: null, s: null};
function ckTick(){
  if (!CK || CK.done) { ckBar(); return; }
  const s = ckNow();
  if (s.over) { ckFinish(s.e); return; }
  if (!CK.pausedAt) {
    const key = s.cd != null ? 'cd' : s.i;
    if (key !== ckLast.i) {
      if (ckLast.i != null && s.cd == null) ckSignal();
      ckLast = {i: key, s: null};
      if (ui.clockView === 'run') { ckRender(); return; }
    }
    const left = s.cd != null ? s.cd : s.left;
    if (left != null) { const sec = Math.ceil(left); if (sec >= 1 && sec <= 3 && sec !== ckLast.s) { ckLast.s = sec; ckBeep(false); } }
  }
  if (ui.clockView === 'run') ckPaint(s);
  ckBar(s);
}
setInterval(ckTick, 250);

function ckStart(cfg, ctx){
  const c = ckCopy(cfg); c.rep = c.rep || 1;
  unlockAudio(ckSound());
  CK = {cfg: c, bits: ckBits(c), t0: Date.now(), cd: ckCd(), paused: 0, pausedAt: 0, ends: {}, laps: [], ctx: ctx || null, done: false};
  ckLast = {i: 'start', s: null};
  ui.rest = null; updateRest();   // metcon-klokka tar over plassen til pauseklokka
  const key = JSON.stringify([c.b, c.rep]);
  S.settings.ckRecent = [{b: c.b, rep: c.rep, name: c.name || ''}].concat((S.settings.ckRecent || []).filter(x => JSON.stringify([x.b, x.rep]) !== key)).slice(0, 3);
  save(); ckStore(); ui.clockView = 'run'; ui.ckEnd = null; wake(); ckRender();
}
function ckFinish(e){
  CK.done = true; CK.endE = Math.max(0, e); CK.pausedAt = 0;
  ui.ckEnd = ckResult(); ckStore(); ckSignal();
  if (ui.clockView === 'run') ui.clockView = 'end';
  ckRender();
}
function ckClose(){
  CK = null; ckStore(); ui.clockView = null; ui.ckEnd = null; ckRender(); render();
  setTimeout(reloadWhenIdle, 400);   // en ny versjon venter til klokka er lukket
}

// Resultatet: tid på For Time, runder på AMRAP, snitt på åpne drag. Du kan rette det før det lagres.
function ckResult(){
  const segs = [], groups = []; let a = 0;
  for (let i = 0; i < CK.bits.length && a < CK.endE; i++) {
    const b = CK.bits[i], end = Math.min(CK.ends[i] != null ? CK.ends[i] : b.sec != null ? a + b.sec : CK.endE, CK.endE);
    segs.push({b, i, a, d: end - a, cut: CK.ends[i] == null && !(b.sec != null && a + b.sec <= CK.endE)}); a = end;
  }
  segs.forEach(s => { const k = s.b.rp + ':' + s.b.bi, g = groups[groups.length - 1];
    if (g && g.k === k) g.segs.push(s); else groups.push({k, t: CK.cfg.b[s.b.bi].t, segs: [s]}); });
  const parts = [], split = [];
  groups.forEach(g => {
    const laps = CK.laps.filter(l => g.segs.some(s => s.i === l.i)).map(l => l.e);
    const s0 = g.segs[0];
    if (g.t === 'amrap') parts.push(laps.length + ' runder');
    else if (g.t === 'ft') parts.push(s0.b.sec && CK.ends[s0.i] == null && !s0.cut ? 'Tak ' + mmss(s0.b.sec) + (laps.length ? ', ' + laps.length + ' runder' : '') : mmss(s0.d));
    else if (g.t === 'int' && !CK.cfg.b[s0.b.bi].work) {
      const dr = g.segs.filter(s => s.b.k === 'open' && CK.ends[s.i] != null).map(s => s.d);
      if (dr.length) parts.push(dr.length + ' drag, snitt ' + mmss(Math.round(dr.reduce((x, y) => x + y, 0) / dr.length)));
    }
    if ((g.t === 'amrap' || g.t === 'ft') && laps.length >= 2) {
      const d = laps.map((t, j) => t - (j ? laps[j - 1] : s0.a));
      split.push(`Raskeste runde ${mmss(Math.round(Math.min(...d)))} · tregeste ${mmss(Math.round(Math.max(...d)))}`);
    }
  });
  const work = groups.filter(g => g.t !== 'rest');
  return {res: parts.join(' · '), min: Math.max(1, Math.round(CK.endE / 60)), sec: CK.endE, split: split.join(' · '),
    am: work.length === 1 && work[0].t === 'amrap' ? parts[0] : null, reps: 0};
}
const ckTarget = () => CK.ctx === 'free' || ui.free || !S.draft ? 'free' : 'session';
function ckSave(where){
  const res = (($('#ckRes') || {}).value || '').trim(), min = parseInt(($('#ckMin') || {}).value, 10) || ui.ckEnd.min;
  const line = 'Klokke: ' + ckDesc(CK.cfg) + (res ? ' · ' + res : ''), from = CK.cfg.from;
  const fits = w => w && (!from || from === w.id);
  ui.bank = false; ui.detail = null; ui.tab = 'today';
  if (where === 'session' && S.draft) {
    const d = S.draft;
    d.metcon = true; d.mc = Object.assign({type: mcGuess(d.wod ? d.wod.tekst : '')}, d.mc || {}, {min});
    if (fits(d.wod)) d.wod.resultat = res; else d.note = (d.note ? d.note + '\n' : '') + line;
    ui.free = false; save(); toast('Lagt inn i dagens økt');
  } else {
    // Klokka kom fra en økt i øktbanken: den blir dagens metcon i fri økt, med resultatet
    const bw = !ui.freeWod && from ? bankGet(from) : null;
    if (bw) ui.freeWod = {id: bw.i, navn: wodTitle(bw), tekst: bw.x, resultat: ''};
    const w = ui.freeWod;
    ui.free = true; ui.freeMc = true;
    if (fits(w)) w.resultat = res; else ui.freeNote = (ui.freeNote ? ui.freeNote + '\n' : '') + line;
    ui.freeMcData = Object.assign({type: mcGuess(w ? w.tekst : '')}, ui.freeMcData || {}, {min});
    toast('Se over og trykk «Lagre fri økt»');
  }
  ckClose(); toTop();
}

// «1:30» → 90. Tall uten kolon regnes i unit sekunder (1 = sekunder, 60 = minutter).
function ckDur(v, unit){
  const s = String(v || '').trim().replace(',', '.'), m = s.match(/^(\d+):(\d{1,2})$/);
  if (m) return +m[1] * 60 + +m[2];
  const x = parseFloat(s); return x > 0 ? Math.round(x * unit) : 0;
}
function ckField(el){
  const [bi, k] = el.dataset.ckf.split(':'), c = ui.ckCfg, b = c && c.b[bi], v = el.value;
  if (!c) return;
  if (bi === 'g') c.rep = Math.max(1, Math.min(10, parseInt(v, 10) || 1));
  else if (!b) return;
  else if (k === 'st') b.st = v.split('\n').map(x => x.trim()).filter(Boolean);
  else if (k === 'n') b.n = Math.max(1, Math.min(100, parseInt(v, 10) || 1));
  else if (k === 'cap') b.cap = ckDur(v, 60);
  else if (b.t === 'amrap') b.sec = Math.max(30, ckDur(v, 60) || 60);
  else b[k] = Math.max(k === 'rest' ? 0 : 5, ckDur(v, 1));
  const sum = $('#ckSum'); if (sum) sum.innerHTML = ckSumHTML(c);
}

function ckAct(r){
  const [c, x, y] = r, cfg = ui.ckCfg;
  switch (c) {
    case 'open':
      ui.ckFor = null;
      if (CK) { ui.clockView = CK.done ? 'end' : 'run'; break; }
      ui.ckCtx = x || ckCtxNow(); ui.ckCfg = ckDefault(ui.ckCtx); ui.clockView = 'setup'; break;
    case 'show': ui.clockView = CK ? (CK.done ? 'end' : 'run') : null; unlockAudio(ckSound()); break;
    case 'hide': case 'close': ui.clockView = null; ui.ckFor = null; ui.whl = null; break;
    // Klokka til en egen metcon: oppsettet lagres med metconen i stedet for å starte
    case 'mine': ui.ckFor = 'mine'; ui.ckCtx = null; ui.ckCfg = ckCopy(mineCk(ui.mineEdit)); ui.clockView = 'setup'; break;
    case 'keep': { const k = ckCopy(cfg); delete k.name; delete k.from; ui.mineEdit.ck = k; ui.ckFor = null; ui.clockView = null; ckRender(); render(); return; }
    case 'wod': { const w = ckWod(x); if (w) { ckStart(ckFromWod(w), x); return; } break; }
    case 'edit': { const w = ckWod(x); ui.ckCtx = x; ui.ckFor = null; ui.ckCfg = w ? ckFromWod(w) : ckDefault(x); ui.clockView = 'setup'; break; }
    case 'fromwod': { const w = ckWod(ui.ckCtx); if (w) ui.ckCfg = ckFromWod(w); break; }
    case 'quick': ui.ckCfg = {b: [ckCopy(CK_QUICK[+x][1])], rep: 1}; break;
    case 'recent': ui.ckCfg = ckCopy((S.settings.ckRecent || [])[+x] || cfg); break;
    case 'bt': cfg.b[+x] = ckNew(y); break;
    case 'badd': cfg.b.push(ckCopy(cfg.b[cfg.b.length - 1])); break;
    case 'brm': cfg.b.splice(+x, 1); if (cfg.b.length < 2) cfg.rep = 1; if (cfg.b.length === 1 && cfg.b[0].t === 'rest') cfg.b[0] = ckNew('amrap'); break;
    case 'wm': cfg.b[+x].work = y === 'open' ? 0 : 40; break;
    case 'cd': S.settings.ckCd = +x; save(); break;
    case 'whl': ui.whl = {bi: x === 'g' ? 'g' : +x, k: y}; break;
    case 'whlok': {
      // For kort tid rettes opp når hjulet lukkes: arbeid minst 5 s, ny EMOM-runde minst 10 s, AMRAP minst 30 s
      const w = ui.whl; ui.whl = null; if (!w) break;
      const sp = whlSpec(w.bi, w.k), b = w.bi === 'g' ? null : cfg.b[w.bi];
      if (sp.time && b && b[w.k] < sp.min && !(w.k === 'cap' && !b[w.k])) b[w.k] = sp.min;
      break;
    }
    case 'snd': S.settings.clockSound = !ckSound(); save(); break;
    case 'start': ckStart(cfg, ui.ckCtx); return;
    case 'pause':
      if (!ckOn()) break;
      if (CK.pausedAt) { CK.paused += Date.now() - CK.pausedAt; CK.pausedAt = 0; unlockAudio(ckSound()); } else CK.pausedAt = Date.now();
      ckStore(); break;
    case 'go': if (ckOn()) { CK.cd = Math.max(0, ((CK.pausedAt || Date.now()) - CK.t0 - CK.paused) / 1000); ckStore(); } break;
    case 'tap': case 'next': {
      if (!ckOn() || CK.pausedAt) break;
      unlockAudio(ckSound());
      const s = ckNow(); if (!s.b) break;
      if (c === 'tap' && (s.b.k === 'up' || s.b.k === 'am')) { CK.laps.push({i: s.i, e: s.e}); if (navigator.vibrate) try { navigator.vibrate(30); } catch(e) {} }
      else if (c === 'next' || s.b.k === 'open') CK.ends[s.i] = s.e;
      ckStore(); ckTick(); break;
    }
    case 'undo': { const s = ckNow(), k = CK.laps.map(l => l.i).lastIndexOf(s.i); if (k > -1) { CK.laps.splice(k, 1); ckStore(); } break; }
    case 'stop': {
      if (!CK) break;
      const s = ckNow();
      if (s.cd != null) { ckClose(); return; }   // før start: bare lukk
      if (ui.ckArm && Date.now() - ui.ckArm < 3000) { ui.ckArm = 0; ckFinish(s.e); return; }
      ui.ckArm = Date.now(); const b = $('#ckStop'); if (b) b.textContent = 'Trykk igjen';
      setTimeout(() => { const b = $('#ckStop'); if (b) b.textContent = 'Avslutt'; }, 3000);
      return;
    }
    case 'reps': {
      const R = ui.ckEnd; if (!R || !R.am) break;
      R.reps = Math.max(0, R.reps + +x); const inp = $('#ckRes');
      if (inp) inp.value = R.am + (R.reps ? ' + ' + R.reps : '');
      const n = $('#ckReps'); if (n) n.textContent = R.reps; return;
    }
    case 'save': ckSave(x); return;
    case 'drop': ckClose(); return;
  }
  ckRender(); if (c === 'open' || c === 'close' || c === 'hide' || c === 'show') render();
}

/* ---------- Visningene til klokka ---------- */
function ckRender(){
  const el = $('#clk'); if (!el) return;
  if ((ui.clockView === 'run' || ui.clockView === 'end') && !CK) ui.clockView = null;
  if (ckOn() && !CK.pausedAt) { const s = ckNow(); if (s.over) { CK.done = true; CK.endE = s.e; ui.ckEnd = ckResult(); ckStore(); } }   // ferdig mens appen var lukket
  if (ui.clockView === 'run' && CK.done) ui.clockView = 'end';
  if (ui.clockView === 'setup' && !ui.ckCfg) ui.ckCfg = ckDefault(ui.ckCtx);
  el.hidden = !ui.clockView;
  if (ui.clockView !== 'setup' && ui.whl && ui.whl.bi !== 'pp') ui.whl = null;
  el.innerHTML = ui.clockView === 'setup' ? ckSetupHTML() : ui.clockView === 'run' ? ckRunHTML() : ui.clockView === 'end' ? ckEndHTML() : '';
  whlInit(); ckBar();
}
// Bare tiden og streken oppdateres i hvert tikk, så knappene ikke byttes ut under fingeren
function ckPaint(s){
  const f = ckFace(s), t = $('#ckT'); if (!t) return;
  t.textContent = f.t; t.classList.toggle('warn', !!f.warn && !CK.pausedAt);
  const sub = $('#ckSub'); if (sub) sub.textContent = f.sub;
  const lv = $('#ckLvl'); if (lv && f.lvl != null) lv.style.width = (Math.max(0, Math.min(1, f.lvl)) * 100).toFixed(1) + '%';
}
function ckSumHTML(c){
  const bits = ckBits(c), known = bits.reduce((a, b) => a + (b.sec || 0), 0), open = bits.some(b => b.sec == null);
  return `<div class="top"><span class="lbl">Slik blir klokka</span><b>${known ? 'Totalt ' + mmss(known) : 'Åpen tid'}${known && open ? ' + åpne deler' : ''}</b></div>
    <div class="ck-strip" aria-hidden="true">${bits.slice(0, 240).map(b => `<i class="${b.k}" style="flex-grow:${b.sec || 60}"></i>`).join('')}</div>
    <p class="small muted">${esc(ckDesc(c))}</p>`;
}
/* Hjul for tid og runder, som på iPhone: kolonner som snapper, og raden i midten er valgt.
   Verdien endres mens du drar, så «Slik blir klokka» følger med. «Ferdig» eller et trykk utenfor lukker. */
const WHL_H = 44;
const ckRange = (a, z) => Array.from({length: z - a + 1}, (_, i) => a + i);
function whlSpec(bi, k){
  if (bi === 'pp') return ppWhlSpec(k);
  const c = ui.ckCfg, b = bi === 'g' ? null : c.b[bi];
  if (k === 'rep') return {lbl:'Gjenta alt', cols:[{vals: ckRange(1, 10), unit:'ganger'}], get: () => [c.rep || 1], set: v => { c.rep = v[0]; }};
  if (k === 'n') return {lbl:'Runder', cols:[{vals: ckRange(1, 100), unit:'runder'}], get: () => [b.n], set: v => { b.n = v[0]; }};
  const am = b.t === 'amrap', long = k === 'cap' || am;
  return {lbl: {cap:'Tak', work:'Arbeid', rest:'Pause', every:'Ny runde hver', sec: am ? 'Lengde' : 'Pause'}[k], time: true,
    min: k === 'cap' || k === 'rest' ? 0 : k === 'every' ? 10 : am ? 30 : 5,
    cols: [{vals: ckRange(0, long ? 99 : 59), unit:'min'}, {vals: ckRange(0, 59), unit:'sek', pad: true}],
    get: () => [Math.floor((b[k] || 0) / 60), (b[k] || 0) % 60], set: v => { b[k] = v[0] * 60 + v[1]; }};
}
/* Testet tid i Pete Plan (2000 m, sykkel 4000 m) stilles på det samme hjulet: minutter og sekunder.
   Hjulet starter på tiden som brukes nå. Verdien lagres først når hjulet lukkes, og bare hvis den er endret,
   så en testet tid med tideler (7:20.4) står som den er hvis du bare ser på den. */
const ppWhlStart = m => { const set = S.settings.pete, r = peteRef(m);
  return set.ref[m] || (r.split ? Math.round(refTime(r.split, m)) : m === 'bike' ? 400 : 440); };
const ppWhlSec = m => ui.whl && ui.whl.bi === 'pp' && ui.whl.k === m && ui.whl.v != null ? ui.whl.v : ppWhlStart(m);
function ppWhlSpec(m){
  return {lbl: PETE_REF[m], time: true, cols: [{vals: ckRange(4, 15), unit:'min'}, {vals: ckRange(0, 59), unit:'sek', pad: true}],
    get: () => { const t = Math.round(ppWhlSec(m)); return [Math.floor(t / 60), t % 60]; },
    set: v => { ui.whl.v = v[0] * 60 + v[1]; }};
}
function whlTxt(bi, k){
  if (bi === 'pp') return splitTxt(ppWhlSec(k));
  const sp = whlSpec(bi, k), v = sp.get();
  if (!sp.time) return String(v[0]) + (k === 'rep' ? ' ×' : '');
  const sec = v[0] * 60 + v[1];
  return k === 'cap' && !sec ? 'Uten tak' : mmss(sec);
}
const whlBtn = (bi, k, hint) => { const sp = whlSpec(bi, k), t = whlTxt(bi, k);
  return `<div class="field"><span class="whl-l">${sp.lbl}${hint ? `<small class="muted">${hint}</small>` : ''}</span>
    <button class="whl-btn" data-a="ck:whl:${bi}:${k}" aria-label="${sp.lbl}: ${t}. Trykk for å endre">${t}</button></div>`; };
function whlHTML(){
  const {bi, k} = ui.whl, sp = whlSpec(bi, k), ok = bi === 'pp' ? 'ppok' : 'ck:whlok';
  return `<div class="whl-back" data-a="${ok}"></div>
  <div class="whl-sheet" role="dialog" aria-label="${sp.lbl}">
    <div class="whl-head"><span class="lbl">${bi === 'pp' ? 'Testet tid' : sp.lbl}</span><b id="whlVal">${whlTxt(bi, k)}</b><button class="link" data-a="${ok}">Ferdig</button></div>
    <div class="whl">${sp.cols.map((c, ci) => `<div class="whl-c"><div class="whl-col" data-ci="${ci}" tabindex="0" role="listbox" aria-label="${c.unit}">
      <div class="whl-list">${c.vals.map(v => `<div class="whl-it" role="option">${c.pad ? String(v).padStart(2, '0') : v}</div>`).join('')}</div>
      </div><span class="whl-u">${c.unit}</span></div>`).join('')}<i class="whl-band" aria-hidden="true"></i></div>
  </div>`;
}
/* Hjulene styres med fingeren selv, ikke med vanlig rulling. Rullefelt inne i et ark som legges over siden,
   reagerer ofte ikke på iPhone før du har trykket på dem. Her følger lista fingeren fra første berøring,
   ruller videre etter et raskt sveip og snapper til nærmeste rad. Et trykk på en rad velger den. */
const WHL = new WeakMap();   // per kolonne: {pos (px, rad × WHL_H), i, n, anim}
const WHL_TOP = 88;          // avstand fra toppen av kolonnen til raden i midten
function whlInit(){
  if (!ui.whl) return;
  const sp = whlSpec(ui.whl.bi, ui.whl.k), cur = sp.get();
  document.querySelectorAll('.whl-col').forEach((col, ci) => {
    const vals = sp.cols[ci].vals, i = Math.max(0, vals.indexOf(cur[ci]));
    WHL.set(col, {pos: i * WHL_H, i, n: vals.length, anim: 0});
    whlPaint(col); whlMark(col, i);
  });
}
const whlMark = (col, i) => col.querySelectorAll('.whl-it').forEach((el, j) => { el.classList.toggle('on', j === i); el.setAttribute('aria-selected', j === i); });
const whlPaint = col => { col.firstElementChild.style.transform = `translateY(${WHL_TOP - WHL.get(col).pos}px)`; };
// Lista står på pos. Når en ny rad kommer i midten, endres verdien med en gang.
function whlPos(col, pos){
  const st = WHL.get(col); st.pos = pos; whlPaint(col);
  const i = Math.max(0, Math.min(st.n - 1, Math.round(pos / WHL_H)));

async function syncPush(){
  clearTimeout(syncT);
  if (!syncOn() || !SY.dirty || SYNC.ask) return;
  if (syncBusy) { syncT = setTimeout(syncPush, 2000); return; }
  syncBusy = true; const gen = syncGen; let changed = false;
  try {
    const body = {data: S, app_version: APP_VERSION}, pref = {Prefer: 'return=representation'};
    const rows = SY.rev
      ? await db('backups', 'select=rev,updated_at&user_id=eq.' + uid() + '&rev=eq.' + SY.rev, {method:'PATCH', body, headers: pref})
      : await db('backups', 'select=rev,updated_at', {method:'POST', body, headers: pref});
    if (!rows || !rows.length) changed = true;   // en annen telefon har lagret i mellomtiden
    else {
      Object.assign(SY, {rev: rows[0].rev, at: Date.parse(rows[0].updated_at), err: ''});
      if (gen === syncGen) SY.dirty = false;
    }
  } catch(e) {
    if (e.code === '23505') changed = true;   // en annen telefon laget backupen først
    else SY.err = sxErr(e);
  } finally {
    syncBusy = false; syncStore();
    if (ui.detail === 'settings' && !isTyping()) render();
  }
  if (changed) return syncPull();
}
// Se om skyen er endret siden sist. Ingen nye endringer her: hent den. Endringer begge steder: spør.
async function syncPull(){
  if (!syncOn() || syncBusy) return;
  syncBusy = true; SYNC.pulled = Date.now(); let row = null;
  try {
    const rows = await db('backups', 'select=rev,updated_at,data&user_id=eq.' + uid() + (SY.rev ? '&rev=neq.' + SY.rev : ''));
    SY.err = '';
    if (rows.length) row = rows[0];
    else if (SY.rev) {   // ingen nyere versjon i skyen. Er backupen slettet, lages den på nytt.
      const still = await db('backups', 'select=rev&user_id=eq.' + uid());
      if (!still.length) { SY.rev = 0; SY.dirty = true; }
    } else SY.dirty = true;
  } catch(e) { SY.err = sxErr(e); }
  finally { syncBusy = false; syncStore(); }
  if (row && !SY.dirty) { syncAdopt(row); render(); toast('Loggen er hentet fra skyen'); }
  else if (row) { SYNC.ask = {row, kind: SY.rev ? 'conflict' : 'exists'}; render(); }
  else if (SY.dirty && !SY.err) syncPush();
}
// Slå på: finnes det ingen backup, lagres telefonen. Er telefonen tom, hentes backupen. Ellers velger brukeren.
async function syncEnable(){
  SY = {on: true, uid: uid(), rev: 0, dirty: !syncEmpty(S), at: 0, err: ''}; syncStore();
  syncBusy = true;
  try {
    const rows = await db('backups', 'select=rev,updated_at,data&user_id=eq.' + uid());
    syncBusy = false;
    if (!rows.length) { SY.dirty = true; syncStore(); await syncPush(); toast(SY.err ? SY.err : 'Skybackup er på'); return; }
    if (syncEmpty(S)) { syncAdopt(rows[0]); toast('Skybackup er på. Loggen er hentet fra skyen.'); return; }
    SYNC.ask = {row: rows[0], kind: 'exists'};
  } catch(e) { syncBusy = false; SY = {}; syncStore(); toast(sxErr(e)); }
}
// Brukeren har valgt: skyen eller denne telefonen
function syncChoose(which){
  const A = SYNC.ask; if (!A) return;
  SYNC.ask = null;
  if (which === 'cloud') { syncAdopt(A.row); toast('Loggen er hentet fra skyen'); }
  else { SY.rev = A.row.rev; SY.dirty = true; syncStore(); syncPush(); toast('Denne telefonen lagres i skyen'); }
  render();
}
function syncOff(){ SY = {}; syncStore(); clearTimeout(syncT); SYNC.ask = null; }
// Etter innlogging: er telefonen tom og det finnes en backup, hentes den med en gang
async function syncAfterLogin(){

}

// Hent alt Sammen-fanen trenger: profilen din, venner, kommende timer, påmeldinger, forslag og navnene på de involverte.
// quiet: hentingen i bakgrunnen. Da tegnes skjermen bare på nytt hvis noe er endret.
function sxLoad(quiet){
  if (!auth) return Promise.resolve();
  if (SX.loading) return SX.loading;
  SX.loading = (async () => {
    let same = false;
    try {
      const me = uid();
      const [prof, fr, seen] = await Promise.all([
        db('profiles', 'select=id,username,display_name&id=eq.' + me),
        db('friendships', 'select=*'),
        db('seen', 'select=last_seen_at')]);
      SX.me = prof[0] || null;
      if (SX.me) {
        if (!seen.length) await db('seen', '', {method:'POST', body:{user_id: me}});
        SX.seenAt = seen.length ? Date.parse(seen[0].last_seen_at) : Date.now();
        const now = Date.now(), iso = t => new Date(t).toISOString(), from = Math.min(+dayStart(now), now - FIXED_LEN);
        const sess = await db('sessions', 'select=*&order=starts_at&or=' +
          encodeURIComponent(`(ends_at.gte.${iso(+dayStart(now))},and(ends_at.is.null,starts_at.gte.${iso(from)}))`));
        const ids = sess.map(s => s.id);
        const [part, prop, chats, live, pres, ps] = await Promise.all([
          ids.length ? db('participants', 'select=*&session_id=' + inList(ids)) : [],
          ids.length ? db('proposals', 'select=*&order=proposed_at&session_id=' + inList(ids)) : [],
          rpc('chat_list').catch(() => []),
          rpc('presence_now').catch(() => []),
          db('presence', 'select=hidden').catch(() => []),
          db('program_shares', 'select=*&order=created_at.desc&limit=50').catch(() => [])]);
        const people = [...fr.map(f => f.requester), ...fr.map(f => f.addressee), ...sess.map(s => s.owner),
          ...part.map(p => p.user_id), ...prop.map(p => p.user_id), ...chats.flatMap(c => c.members), ...ps.flatMap(x => [x.sender, x.recipient])].filter(x => x !== me);
        const ppl = people.length ? await db('profiles', 'select=id,username,display_name&id=' + inList(people)) : [];
        SX.ppl = Object.fromEntries(ppl.map(p => [p.id, p])); SX.ppl[me] = SX.me;
        const sig = JSON.stringify([+dayStart(now), fr, sess, part, prop, chats, ppl, live, ps]);
        same = quiet && sig === SX.sig && SX.loaded && !SX.err;
        Object.assign(SX, {fr, sess, part, prop, chats, ps, sig, live: new Map(live.map(x => [x.user_id, x.state])), hidden: !!(pres[0] && pres[0].hidden)});
        sxSyncPlans();
      }
      SX.loaded = true; SX.err = ''; SX.at = Date.now();
    } catch(e) {
      SX.err = sxErr(e);
    } finally {
      SX.loading = null; sxBadge();
      if (ui.tab === 'together' && !isTyping() && !same) render();
    }
  })();
  return SX.loading;
}

function sxErr(e){
  if (!navigator.onLine || /fetch|network|load failed/i.test(e.message || '')) return 'Ingen kontakt med serveren. Sjekk nettet og prøv igjen.';
  if (e.code === '23505') return 'Det finnes allerede.';
  if (e.status === 401 || e.status === 403 || e.code === '42501') return 'Du har ikke tilgang til dette.';
  return e.message || 'Noe gikk galt.';
}

/* ---------- Sammen: pushvarsler ----------
   Varsel når noen blir med på eller foreslår tid på timen din, skriver, eller vil bli venn. Hver telefon slår det på selv.
   På iPhone virker det bare fra hjemskjermen (iOS 16.4 eller nyere), og spørsmålet om lov må komme rett fra et trykk.
   Sendingen skjer i Supabase: en trigger legger varselet i en utboks, og edge-funksjonen «push» sender det. */
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
ui.push = '';   // '' ukjent ennå, 'on', 'off', 'denied', 'ios' (må åpnes fra hjemskjermen) eller 'na' (ikke mulig her)
async function pushSub(){
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
const pushSave = sub => { const j = sub.toJSON(); return rpc('push_register', {endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth}); };
async function pushCheck(){
  try {
    if (!pushSupported()) { ui.push = isIOS && !navigator.standalone ? 'ios' : 'na'; return; }
    const sub = await pushSub();
    ui.push = sub ? 'on' : Notification.permission === 'denied' ? 'denied' : (location.protocol === 'https:' || (await navigator.serviceWorker.getRegistration())) ? 'off' : 'na';
    if (sub && auth) pushSave(sub).catch(() => {});   // hold abonnementet knyttet til kontoen som er innlogget nå
  } catch(e) { ui.push = 'na'; }
}
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
async function pushOn(){
  const perm = await Notification.requestPermission();   // først, mens trykket fortsatt gjelder
  if (perm !== 'granted') {
    ui.push = perm === 'denied' ? 'denied' : 'off';
    throw new Error(perm === 'denied' ? 'Varsler er avslått for Stanga. Slå dem på i Innstillinger → Varslinger.' : 'Varsler ble ikke slått på.');
  }
  const key = await rpc('push_public_key');
  if (!key) throw new Error('Varsler er ikke klare på serveren ennå. Prøv igjen om litt.');
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uBytes(key)});
  await pushSave(sub); ui.push = 'on';
}
async function pushOff(){
  const sub = await pushSub().catch(() => null);
  if (sub) {
    if (auth) await db('push_subscriptions', 'endpoint=eq.' + encodeURIComponent(sub.endpoint), {method:'DELETE'}).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  }
  if (ui.push === 'on') ui.push = 'off';
}
// Trykk på et varsel mens appen er åpen: service workeren sier fra, og vi går til timen

if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {

const pad = n => String(n).padStart(2, '0');
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d; };
const dayDiff = t => Math.round((dayStart(t) - dayStart(Date.now())) / 864e5);
function dayLabel(t){
  const n = dayDiff(t); if (n === 0) return 'I dag'; if (n === 1) return 'I morgen';
  const s = new Date(t).toLocaleDateString('nb-NO', {weekday:'long', day:'numeric', month:'short'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const sxEnd = s => s.ends_at ? Date.parse(s.ends_at) : Date.parse(s.starts_at) + FIXED_LEN;
const sxTime = s => s.kind === 'window' ? hm(s.starts_at) + '–' + hm(s.ends_at) : hm(s.starts_at);
const uname = id => SX.ppl[id] ? '@' + SX.ppl[id].username : 'en venn';
// Initialer i en farget sirkel. Fargen følger brukernavnet, så samme person har alltid samme farge.
const AV = [['#2E9E5B','#06150C'],['#E3B42B','#2A2005'],['#2F6FDB','#FFFFFF'],['#D93A2F','#FFFFFF'],['#A9AEB6','#111317'],['#B8413A','#FFFFFF']];
function av(id, sm){
  const p = SX.ppl[id] || {};
  return avTxt(p.display_name || p.username || '?', p.username || '', sm, id !== uid() && SX.live.get(id));
}
// live: 'live' gir grønn prikk (har Sammen åpen), 'train' gir manualen (har en økt i gang)
const DB_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="0.5" y="6" width="2" height="4" rx=".6"/><rect x="2.5" y="3.5" width="2.6" height="9" rx=".8"/><rect x="10.9" y="3.5" width="2.6" height="9" rx=".8"/><rect x="13.5" y="6" width="2" height="4" rx=".6"/><rect x="5" y="7" width="6" height="2"/></g></svg>';
function avTxt(name, key, sm, live){
  const ini = name.split(/[\s._]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  let h = 0; for (const c of key) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const [bg, ink] = AV[h % AV.length];
  return `<span class="av${sm ? ' sm' : ''}${live ? ' ' + live : ''}" style="background:${bg};color:${ink}" aria-hidden="true">${esc(ini)}${live === 'train' ? `<i class="av-tr">${DB_ICON}</i>` : ''}</span>`;
}
function sxWorkout(s){

    const w = BANK && BANK.find(x => x.i === s.workout_ref);
    return {lbl:'Samme økt', txt: w ? 'Metcon: ' + wodTitle(w) : 'Metcon fra øktbanken', body: w ? w.x : ''};
  }

// Det som er nytt siden sist: forslag og påmeldinger på dine timer, nye timer fra venner og venneforespørsler.
// Forespørsler du ikke har svart på, står alltid her til du har svart.
function sxNews(since){
  const me = uid(), at = x => Date.parse(x.created_at), out = [];
  const mine = new Map(SX.sess.filter(s => s.owner === me).map(s => [s.id, s]));
  const sub = s => 'Din time ' + dayLabel(s.starts_at).toLowerCase() + ', ' + sxTime(s);
  SX.fr.forEach(f => {
    if (f.addressee === me && f.status === 'pending') out.push({at: at(f), who: f.requester, txt: 'vil legge deg til', sub: 'Venneforespørsel'});
    if (f.requester === me && f.status === 'accepted' && f.accepted_at && Date.parse(f.accepted_at) > since) out.push({at: Date.parse(f.accepted_at), who: f.addressee, txt: 'godtok forespørselen din', sub: 'Dere er venner nå'});
  });
  (SX.ps || []).forEach(x => {
    if (x.recipient === me && x.status === 'pending') out.push({at: at(x), who: x.sender, txt: 'vil dele et program med deg', sub: '«' + x.name + '». Svar under Venner'});
    if (x.sender === me && x.status === 'accepted' && x.answered_at && Date.parse(x.answered_at) > since) out.push({at: Date.parse(x.answered_at), who: x.recipient, txt: 'tok imot programmet ditt', sub: '«' + x.name + '»'});
  });
  SX.prop.forEach(p => { const s = mine.get(p.session_id); if (s && at(p) > since) out.push({at: at(p), who: p.user_id, txt: 'foreslår ' + hm(p.proposed_at), sub: sub(s), sid: s.id}); });
  SX.part.forEach(p => { const s = mine.get(p.session_id); if (s && p.user_id !== me && at(p) > since) out.push({at: at(p), who: p.user_id, txt: 'meldte seg på', sub: sub(s), sid: s.id}); });
  SX.sess.forEach(s => { if (s.owner !== me && !s.cancelled_at && at(s) > since && sxEnd(s) > Date.now())
    out.push({at: at(s), who: s.owner, txt: 'la ut en time', sub: dayLabel(s.starts_at) + ', ' + sxTime(s), sid: s.id}); });
  return out.sort((a, b) => b.at - a.at);
}
function sxBadge(){
  const el = $('#sxBadge'); if (!el) return;
  const n = auth && SX.me ? sxNews(SX.seenAt).length + chatUnread() : 0;

// Økta fra programmet på timene du skal på (dine egne og de du er med på), én økt per time i rekkefølge.
// Den første timen får neste økt med alt som er lagt til på den. Timene etter får øktene etter det,
// med vektene planen viser hvis alt går som planlagt. Bare du ser dette. Vennene ser ikke vektene dine.
function myNextSess(){
  const p = S.active && prog(S.active.programId), own = ownDraft();
  if (!p) return null;
  const tot = totalOf(p, S.active);
  if (!own && tot && S.active.idx >= tot) return null;
  const x = own || buildSession(p, S.active);
  return x && ((x.ex && x.ex.length) || myExtras(x).length) ? x : null;
}
// Beste anslag på 1RM i et løft: fra programmet du kjører, ellers fra Maksløft i innstillingene
function rmOf(L){
  const a = S.active, p = a && prog(a.programId);
  if (a && a.e1rm && a.e1rm[L] > 0) return a.e1rm[L];
  if (p && (p.prog === '531' || p.prog === 'jugg') && a.tm && a.tm[L] > 0) return a.tm[L] / .9;
  return S.maxes[L] > 0 ? S.maxes[L] : null;
}
// Økta du deler på timene dine: øvelser, reps og andel av 1RM. Vennene ser ikke vektene.
// Den som kjører det samme, får vekter ut fra sine egne makser (se guestSess).
function sharePlan(x){
  if (!x || !x.ex || !x.ex.length || x.guest) return null;
  const p = S.active && prog(S.active.programId);
  return {prog: p ? p.name : '', day: x.day, sub: x.sub || '', acc: x.acc || '', ex: x.ex.map(e => {
    const r = rmOf(e.lift) ? e.lift : e.slot && rmOf(e.slot) ? e.slot : null;
    return {l: e.lift, n: liftName(e.lift), b: LIFTS[e.lift] && LIFTS[e.lift].bar ? 1 : 0, tag: e.tag || '', rest: e.rest || 120, wu: e.wu || null, r,
      s: e.sets.map(y => Object.assign({t: y.t, f: !y.w ? 0 : r ? Math.round(y.w / rmOf(r) * 1000) / 1000 : null}, y.am ? {am: 1} : {}, y.c ? {c: y.c} : {}))};
  })};
}
// Hold økta på timene dine oppdatert, så vennene ser den du faktisk skal kjøre. Går i bakgrunnen.
// jsonb lagrer nøklene i en annen rekkefølge, så de sorteres før sammenligningen.
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort()) : x);
function sxSyncPlans(){
  const me = uid(), now = Date.now();
  SX.sess.filter(s => s.owner === me && !s.cancelled_at && sxEnd(s) > now).forEach(s => {
    const plan = sharePlan(mySessFor(s));
    if (canon(plan) === canon(s.plan || null)) return;
    s.plan = plan;
    db('sessions', 'id=eq.' + s.id, {method:'PATCH', body:{plan}}).catch(() => {});
  });
}
// Hva du har valgt på en time du er med på: samme økt som eieren eller din egen
const myPlan = s => (SX.part.find(p => p.session_id === s.id && p.user_id === uid()) || {}).plan;
const goesSame = s => s.owner !== uid() && !!s.plan && myPlan(s) === 'same';
// Løftene der du mangler 1RM for å få vektene i samme økt som eieren
const guestMissing = s => s.plan ? [...new Set(s.plan.ex.filter(e => e.r && e.s.some(y => y.f)).map(e => e.r))].filter(L => !rmOf(L)) : [];
// Samme økt som eieren av timen, med vekter fra dine egne makser. Engangsøkt: programmet ditt står der det står.
function guestSess(s){
  const P = s.plan, who = uname(s.owner), w = s.workout_kind === 'bank' && BANK && BANK.find(x => x.i === s.workout_ref);
  const x = {guest: {sid: s.id, who}, day: P.day, sub: 'Med ' + who + (P.prog ? ' · ' + P.prog : ''), acc: P.acc || '', started: Date.now(),
    ex: P.ex.map(e => {
      // En øvelse appen din ikke har (en venns egen), blir din egen med samme navn
      if (!LIFTS[e.l] && /^c_[a-z0-9_]{1,40}$/.test(e.l)) { S.custom = S.custom || {}; S.custom[e.l] = {n: String(e.n || 'Øvelse').replace(/[<>&"`]/g, '').slice(0, 40), bar: e.b ? 1 : 0}; mergeCustom(); save(); }
      const rm = e.r ? rmOf(e.r) : null, bar = LIFTS[e.l] && LIFTS[e.l].bar ? BAR() : 0;
      return {key: e.l, lift: e.l, slot: e.l, tag: e.tag, rest: e.rest, wu: e.wu, adj: true,
        hint: e.s.some(y => y.f == null) ? 'Appen kunne ikke regne ut vekten, så velg den selv med − og +.' : '',
        sets: e.s.map(y => Object.assign({t: y.t, w: y.f == null ? bar : y.f ? Math.max(bar, r25(y.f * rm)) : 0, am: !!y.am, d: null}, y.c ? {c: y.c} : {}))};
    })};
  if (w) { x.wod = {id: w.i, navn: wodTitle(w), tekst: w.x, resultat: ''}; x.metcon = true; }
  return x;
}
// Start samme økt som eieren. Har du begynt på din egen økt, venter den til etterpå.
function guestStart(id){

// Det som er lagt til på økta: kondisjonsdelen i ATHX, Pete Plan, metcon og notat
function myExtras(x){

  if (x.pete) { const ss = peteSession(x.pete.idx, x.pete.ver, x.pete.mach); out.push({k:'Pete Plan', t:ss.name + ' · ' + (PETE_MACH[x.pete.mach] || ''), body:''}); }

  if ((x.note || '').trim()) out.push({k:'Notat', t:x.note.trim(), body:''});
  return out;
}
function myUpcoming(){
  const me = uid(), now = Date.now();
  // Timer der du kjører samme økt som eieren, bruker ikke av øktene i programmet ditt
  return SX.sess.filter(s => !s.cancelled_at && sxEnd(s) > now && !goesSame(s) &&
    (s.owner === me || SX.part.some(p => p.session_id === s.id && p.user_id === me)))
    .sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at)).map(s => s.id);
}
function mySessFor(s){
  if (goesSame(s)) return S.draft && S.draft.guest && S.draft.guest.sid === s.id ? S.draft : guestSess(s);
  const p = S.active && prog(S.active.programId), i = myUpcoming().indexOf(s.id);
  if (!p || i < 0) return null;
  if (i === 0) return myNextSess();
  const f = simulate(p, S.active, i + 1)[i];
  return f && f.s.ex && f.s.ex.length ? Object.assign(f.s, {later: i}) : null;
}
const exTop = e => Math.max(0, ...e.sets.map(x => x.w || 0));
function myLine(s){

// Dagsoversikten teller unike, godkjente venner på dagens timer, ikke innlogginger.
// En time som går over midnatt, hører til begge dagene. Avlyste timer teller ikke.
function sxDaySessions(now = Date.now()){
  const from = +dayStart(now), to = new Date(from); to.setDate(to.getDate() + 1);
  return SX.sess.filter(s => !s.cancelled_at && Date.parse(s.starts_at) < +to && sxEnd(s) > from)
    .sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));
}
function sxTodayFriends(now = Date.now()){
  const accepted = new Set(sxFriendIds()), seen = new Map();
  for (const s of sxDaySessions(now)) {
    const ids = [s.owner, ...SX.part.filter(p => p.session_id === s.id).map(p => p.user_id)];
    for (const id of ids) {
      if (!accepted.has(id)) continue;
      const previous = seen.get(id);
      // Åpne en pågående/kommende time, eller den siste hvis alle er over.
      if (!previous || (sxEnd(previous) <= now && (sxEnd(s) > now || Date.parse(s.starts_at) > Date.parse(previous.starts_at)))) seen.set(id, s);
    }
  }
  return [...seen].map(([id, session]) => ({id, session}));
}

  const me = uid(), today = new Set(sxDaySessions(now).map(s => s.id));

  return SX.sess.filter(s => sxEnd(s) > now && (!s.cancelled_at || mine(s)) &&
    (filter === 'mine' ? mine(s) : filter === 'upcoming' ? Date.parse(s.starts_at) > now && !today.has(s.id) : today.has(s.id) || (s.cancelled_at && dayDiff(s.starts_at) === 0)))
    .sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));
}

async function sxSave(){
  const f = ui.sxForm, d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + f.day);
  const at = v => { if (!/^\d{1,2}:\d{2}/.test(v || '')) return null; const [h, m] = v.split(':').map(Number); const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
  const start = at(f.from), end = f.kind === 'window' ? at(f.to) : null;
  if (!start) throw new Error('Velg et klokkeslett.');
  if (f.kind === 'window' && (!end || end <= start)) throw new Error('Slutten av vinduet må være etter starten.');
  if ((end || new Date(+start + FIXED_LEN)) <= new Date()) throw new Error('Tidspunktet har allerede vært.');
  if (f.wk === 'bank' && !f.ref) throw new Error('Velg en metcon fra øktbanken, eller velg et annet alternativ.');
  if (f.wk === 'text' && !f.text.trim()) throw new Error('Skriv hva dere skal kjøre.');
  const body = {kind: f.kind, starts_at: start.toISOString(), ends_at: end ? end.toISOString() : null, place: f.place.trim() || null,

  S.settings.sxPlace = body.place || ''; save();
  ui.sxView = f.id ? 's:' + f.id : 'list';
  if (!f.id) { ui.sxTab = 'timer'; ui.sxFilter = f.day === 0 ? 'today' : 'upcoming'; ui.sxUnder = 'list'; }
  ui.sxForm = null;
}

/* ---------- Sammen: chat ----------
   Samtaler med én venn, grupper og chat på timer. Bare de som er med, kan lese og skrive (se migrasjonen chat).
   Samtalelisten hentes sammen med resten av Sammen. Mens en samtale er åpen, hentes nye meldinger hvert fjerde sekund,
   og bare meldingene tegnes på nytt, så det du holder på å skrive, blir stående. */
const CH = {cid:null, msgs:[], loading:false, busy:false, err:''};
const chatOf = cid => SX.chats.find(c => c.id === cid);
// En timechat vises når noen har skrevet i den, eller når timen ikke er over og flere enn eieren er med
const chatShown = c => c.kind !== 'session' || (c.last_body && !c.last_system)
  || (c.members.length > 1 && !!c.s_start && Date.parse(c.s_start) + FIXED_LEN > Date.now());
const chatUnread = () => SX.chats.filter(c => c.unread > 0 && chatShown(c)).length;
const chatOther = c => c.members.find(m => m !== uid()) || uid();
const sxFriendIds = () => { const me = uid(); return SX.fr.filter(f => f.status === 'accepted').map(f => f.requester === me ? f.addressee : f.requester); };
function chatName(c){
  if (c.kind === 'group') return c.name;
  if (c.kind === 'dm') return uname(chatOther(c));
  if (!c.s_start) return 'Time';
  return (c.s_owner === uid() ? 'Din time' : 'Timen til ' + uname(c.s_owner)) + ' · ' + dayLabel(c.s_start).toLowerCase() + ' ' + hm(c.s_start);
}
const chatAv = c => c.kind === 'group' ? avTxt(c.name, c.name) : av(c.kind === 'dm' ? chatOther(c) : c.s_owner);
const chatWhen = t => { const n = dayDiff(t); return n === 0 ? hm(t) : n === -1 ? 'I går' : new Date(t).toLocaleDateString('nb-NO', {day:'numeric', month:'short'}); };

function chatRow(c){
  const who = c.last_system ? '' : c.last_user === uid() ? 'Du: ' : c.kind !== 'dm' && c.last_user ? uname(c.last_user) + ': ' : '';
  const sub = c.last_body ? who + c.last_body : c.kind === 'session' ? 'Chat for alle som er med på timen' : 'Ingen meldinger ennå';
  return `<button class="sx-news ch-row${c.unread ? ' new' : ''}" data-a="chopen:${c.id}">${chatAv(c)}
      <span><b>${esc(chatName(c))}</b><small>${esc(sub)}</small></span>
      ${c.unread ? `<i class="ch-n" aria-label="${c.unread} uleste">${c.unread}</i>` : `<i class="ch-t">${chatWhen(c.last_at)}</i>`}</button>`;
}
function vSxChats(h){
  const list = SX.chats.filter(chatShown), friends = sxFriendIds().length;
  if (friends) h += `<div class="ch-acts"><button class="btn ghost sm" data-a="sxview:cdm">Skriv til en venn</button><button class="btn sm" data-a="sxview:cnew">+ Ny gruppe</button></div>`;
  if (!list.length) return h + `<div class="empty"><h2>Ingen samtaler ennå</h2>
      <p class="muted">${friends ? 'Lag en gruppe med treningsvennene dine, eller skriv til én av dem. Timer du er med på, får sin egen chat.' : 'Legg til venner først, så kan dere skrive sammen.'}</p>
      ${friends ? '' : '<button class="btn" data-a="sxview:friends">Finn venner</button>'}</div>`;
  return h + `<div class="list">${list.map(chatRow).join('')}</div>`;
}

function vSxChat(cid){
  const c = chatOf(cid);
  if (!c) return `<button class="link" data-a="sxtab:chat">‹ Chat</button><p class="muted">Samtalen finnes ikke lenger.</p>`;
  const sub = c.kind === 'dm' ? '' : c.members.map(m => m === uid() ? 'deg' : uname(m)).join(', ');
  const acts = [];
  if (c.kind === 'group') acts.push(`<button class="quick" data-a="sxview:cadd:${c.id}">+ Legg til</button>`, ui.confirm === 'chl:' + c.id

    : `<button class="quick" data-a="confirm:chl:${c.id}">Forlat gruppen</button>`);
  if (c.kind === 'session' && SX.sess.some(s => s.id === c.session_id)) acts.push(`<button class="quick" data-a="sxopen:${c.session_id}">Se timen</button>`);
  // Tilbakeknappen og navnet står fast øverst, så du kommer tilbake uten å rulle helt opp
  return `<div class="ch-top"><button class="link" data-a="sxtab:chat">‹ Chat</button>
    <header class="ch-head">${chatAv(c)}<div><h2>${esc(chatName(c))}</h2>${sub ? `<p class="muted small">${esc(sub)}</p>` : ''}</div></header></div>
    ${acts.length ? `<div class="sx-acts" style="flex-wrap:wrap">${acts.join('')}</div>` : ''}
    <div id="chatMsgs" class="ch-msgs">${chatMsgsHTML()}</div>
    <div class="ch-compose"><input id="chIn" class="txt" type="text" maxlength="1000" enterkeyhint="send" autocomplete="off" placeholder="Skriv en melding" aria-label="Melding" value="${esc(ui.chDraft || '')}">
      <button class="btn" data-a="chsend" onmousedown="event.preventDefault()">Send</button></div>`;
}
// Meldingene: dag som overskrift, navn og klokkeslett når en ny person skriver eller det har gått ti minutter
function chatMsgsHTML(){
  if (!CH.msgs.length) return CH.loading ? '<p class="muted small">Henter …</p>'
    : CH.err ? `<div class="warn">${esc(CH.err)}</div>` : '<p class="ch-sys">Ingen meldinger ennå. Si hei!</p>';
  const c = chatOf(CH.cid), dm = c && c.kind === 'dm';
  let h = '', day = '', prev = null;
  for (const m of CH.msgs) {
    const d = dayLabel(m.created_at);
    if (d !== day) { day = d; prev = null; h += `<p class="ch-day">${d}</p>`; }
    if (m.system) { prev = null; h += `<p class="ch-sys">${esc(m.body)}</p>`; continue; }
    const me = m.user_id === uid();
    if (!prev || prev.user_id !== m.user_id || Date.parse(m.created_at) - Date.parse(prev.created_at) > 10 * 6e4)
      h += `<p class="ch-who${me ? ' me' : ''}">${me || dm ? '' : uname(m.user_id) + ' · '}${hm(m.created_at)}</p>`;
    h += `<div class="ch-msg${me ? ' me' : ''}">${esc(m.body)}</div>`;
    prev = m;
  }
  return h + (CH.err ? `<p class="small warn-t">${esc(CH.err)}</p>` : '');
}
const chatBottom = () => { const sc = $('#scroller'); if (sc) sc.scrollTop = sc.scrollHeight; };
function chatPaint(force){
  const el = $('#chatMsgs'), sc = $('#scroller'); if (!el) return;
  const near = sc && sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
  el.innerHTML = chatMsgsHTML();
  if (force || near) chatBottom();
}
// Legg til nye meldinger (bare de som er nyere enn den siste vi har), og merk samtalen som lest
function chatAdd(rows){
  const last = CH.msgs.length ? CH.msgs[CH.msgs.length - 1].id : 0, add = rows.filter(m => m.id > last);
  CH.msgs.push(...add);
  return add.length;
}
// Merker samtalen som lest og sier fra at den står åpen på skjermen. Da holdes varsler fra den tilbake i ti sekunder.
function chatSeen(cid){
  rpc('chat_read', {cid, active: true}).catch(() => {});
  const c = chatOf(cid), m = CH.msgs[CH.msgs.length - 1];
  if (c) { c.unread = 0; if (m) Object.assign(c, {last_body: m.body, last_user: m.user_id, last_system: m.system, last_at: m.created_at}); }
  sxBadge();
}
async function chatOpen(cid){
  if (CH.cid !== cid) Object.assign(CH, {cid, msgs:[], err:''});
  CH.loading = !CH.msgs.length;
  Object.assign(ui, {tab:'together', sxTab:'chat', sxView:'c:' + cid, confirm:null, chDraft:''});
  render(); chatBottom();
  await chatFetch(true);
}
async function chatFetch(first){
  const cid = CH.cid; if (!cid || CH.busy || !auth) return;
  CH.busy = true;
  const last = CH.msgs.length ? CH.msgs[CH.msgs.length - 1].id : 0;
  try {
    const rows = await db('messages', 'select=id,user_id,body,system,created_at&conversation_id=eq.' + cid +
      (last ? '&id=gt.' + last + '&order=id&limit=200' : '&order=id.desc&limit=100'));
    if (cid !== CH.cid) return;
    CH.loading = false; CH.err = '';
    const n = chatAdd(last ? rows : rows.reverse());
    chatSeen(cid);   // hvert fjerde sekund: samtalen står fortsatt åpen
    if (n || first) chatPaint(first);
  } catch(e) {
    if (cid === CH.cid) { CH.loading = false; CH.err = sxErr(e); chatPaint(); }
  } finally { CH.busy = false; }
}
async function chatSend(){
  const inp = $('#chIn'), body = (inp ? inp.value : '').trim(), cid = CH.cid;
  if (!body || !cid || ui.chSending) return;
  ui.chSending = true;
  try {
    const rows = await db('messages', '', {method:'POST', headers:{Prefer:'return=representation'}, body:{conversation_id: cid, body}});
    if (inp) inp.value = '';
    ui.chDraft = '';
    if (cid === CH.cid && chatAdd(rows || [])) { chatSeen(cid); chatPaint(true); }
  } catch(e) { toast(sxErr(e)); }
  finally { ui.chSending = false; }
}
// Samtalelisten på nytt mens du ser på den. Er det nye folk i en samtale, hentes alt, så navnene kommer med.
async function chatListRefresh(){
  if (!auth || !SX.me) return;
  try {
    const chats = await rpc('chat_list');
    if (chats.some(c => c.members.some(m => !SX.ppl[m]))) return sxLoad();
    SX.chats = chats; sxBadge();
    if (ui.tab === 'together' && ui.sxTab === 'chat' && (ui.sxView || 'list') === 'list' && !isTyping()) render();
  } catch(e) {}
}
// Mens Sammen står åpen: samtalen hvert fjerde sekund, samtalelisten hvert 16., og at du er aktiv hvert minutt. Oversikten og Venner hentes hvert
// 32. sekund, så forespørsler, svar og nye timer kommer uten at appen må startes på nytt. Ikke i skjemaer, der
// en ny tegning ville tatt med seg det du holder på med.
let chatTick = 0;
setInterval(() => {
  if (!auth || document.visibilityState !== 'visible' || ui.tab !== 'together') return;
  chatTick++;
  const v = ui.sxView || 'list';
  if (chatTick % 15 === 0) sxPing(true);   // aktiv nå: omtrent hvert minutt
  if (/^c:/.test(v)) chatFetch();
  else if ((v === 'list' || v === 'friends') && chatTick % 8 === 0) sxLoad(true);
  else if (ui.sxTab === 'chat' && chatTick % 4 === 0) chatListRefresh();
}, 4000);

// Logg inn eller lag konto med e-post og passord. Uten e-postbekreftelse får du en innlogging med en gang.
async function sxAuth(kind){
  const email = (($('#sxE') || {}).value || '').trim(), pw = ($('#sxP') || {}).value || '';
  ui.sxEmail = email;

/* iOS gir av og til hjemskjerm-appen et vindu som slutter over skjermkanten.
   Da måler vi avstanden og strekker app-skallet ned til kanten.
   Bare på iOS: på Android teller skjermhøyden med statuslinja og navigasjonslinja, så avstanden er alltid
   50–100 px. Strekker vi da, havner fanelinja under skjermkanten (sett på Google Pixel). */
const isTyping = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
function fitViewport(){
  if (isTyping()) return;          // tastaturet er oppe: ikke mål nå
  try {
    const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    const portrait = innerHeight > innerWidth;
    const gap = Math.round(screen.height - innerHeight);
    const fix = isIOS && standalone && portrait && gap > 0 && gap < 140 ? gap : 0;
    document.querySelector('.app').style.bottom = fix ? (-fix) + 'px' : '';
    ui.gapFix = fix;
  } catch(e) {}
}
let fitT;
function scheduleFit(ms){
  clearTimeout(fitT);
  fitT = setTimeout(() => { if (isTyping()) return; scrollTo(0, 0); fitViewport(); }, ms || 250);
}
fitViewport();
addEventListener('resize', () => scheduleFit());
if (window.visualViewport) visualViewport.addEventListener('resize', () => scheduleFit());
addEventListener('orientationchange', () => scheduleFit(400));

/* Chat med tastaturet oppe: telefonen skyver hele siden opp for å vise feltet, og da forsvinner toppen.
   I stedet krymper vi app-skallet til den synlige delen over tastaturet, så «‹ Chat» og navnet står
   øverst og skrivefeltet rett over tastaturet. Fanene skjules så lenge, for å gi plass til meldingene. */
function kbFit(){
  const vv = window.visualViewport, app = document.querySelector('.app');
  if (!vv || !app) return;
  const on = ui.tab === 'together' && /^c:/.test(ui.sxView || '') && isTyping() && matchMedia('(pointer:coarse)').matches;
  const was = app.classList.contains('kb');
  if (on) {
    app.classList.add('kb');
    app.style.top = vv.offsetTop + 'px'; app.style.height = vv.height + 'px'; app.style.bottom = 'auto';
    if (!was) chatBottom();   // de nyeste meldingene står rett over feltet
  } else if (was) {
    app.classList.remove('kb');
    app.style.top = ''; app.style.height = ''; app.style.bottom = ui.gapFix ? (-ui.gapFix) + 'px' : '';
  }
}
if (window.visualViewport) { visualViewport.addEventListener('resize', kbFit); visualViewport.addEventListener('scroll', kbFit); }
document.addEventListener('focusin', () => { kbFit(); setTimeout(kbFit, 300); });
document.addEventListener('focusout', () => setTimeout(kbFit, 50));
document.addEventListener('focusout', () => scheduleFit(350));   // tastaturet lukkes

/* ---------- Ny versjon uten å skrive versjon i adressen ----------
   Når appen åpnes, hentes den alltid fra nettet (se sw.js). Men iPhone vekker ofte appen fra
   bakgrunnen uten å laste den på nytt. Derfor sjekker vi APP_VERSION på GitHub når appen kommer
   i forgrunnen, høyst én gang i minuttet. Er den høyere, laster appen seg selv på nytt.
   Det er trygt: alt du trykker eller skriver, lagres med en gang. Holder du på å skrive, venter vi. */
let lastCheck = 0, newVersion = 0;
async function checkUpdate(){
  if (location.protocol !== 'https:' || !navigator.onLine || Date.now() - lastCheck < 60e3) return;
  lastCheck = Date.now();
  try {
    const res = await fetch('./index.html', {cache:'no-cache'});
    if (!res.ok) return;
    const m = (await res.text()).match(/APP_VERSION = (\d+)/);
    if (m && +m[1] > APP_VERSION) { newVersion = +m[1]; reloadWhenIdle(); }
  } catch(e) {}
}
function reloadWhenIdle(){
  if (!newVersion || isTyping() || ckOn()) return;   // prøv igjen når tastaturet lukkes eller klokka er ferdig
  try { sessionStorage.setItem(KEY + '.from', String(APP_VERSION)); } catch(e) {}
  location.reload();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

}, 400);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && auth && Date.now() - SX.at > 60000) { if (ui.tab === 'together') sxOpen(); else sxLoad(); } });
// Aktiv nå: borte når appen legges bort, tilbake når den kommer fram igjen på Sammen
document.addEventListener('visibilitychange', () => { if (ui.tab === 'together') sxPing(document.visibilityState === 'visible'); });
// Skybackup: se etter endringer fra andre telefoner når appen åpnes og våkner, og lagre før den legges bort
const syncWake = () => { if (!syncOn()) return; if (SY.dirty) syncPush(); else if (Date.now() - SYNC.pulled > 30000) syncPull(); };
if (syncOn()) setTimeout(syncWake, 600);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') syncWake();
  else if (syncOn() && SY.dirty) syncPush();
});
addEventListener('online', syncWake);
addEventListener('pageshow', e => { if (e.persisted) checkUpdate(); });
addEventListener('online', checkUpdate);
document.addEventListener('focusout', () => setTimeout(reloadWhenIdle, 400));
// Etter en oppdatering: si fra én gang
try {
  const from = +sessionStorage.getItem(KEY + '.from');
  sessionStorage.removeItem(KEY + '.from');
  if (from && from < APP_VERSION) setTimeout(() => toast('Stanga er oppdatert til versjon ' + APP_VERSION), 500);
} catch(e) {}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
