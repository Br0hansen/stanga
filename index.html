/* ---------- Metcon-belastning ----------
   Bygger på metcon-registreringen som finnes fra før: øktbanken, «Metcon i dag» og fri økt.
   Til hver metcon kan du legge inn type, minutter arbeid og RPE (1–10). Belastning = minutter × RPE (session RPE).
   Typen styrer rådene i Strength & Power: beintunge metcons og olympiske løft konkurrerer med knebøy
   og clean, og pressende gymnastikk konkurrerer med benk. */
const MC = {
  M:{n:'Kondisjon', d:'Sykkel, ro, ski, løp'},
  G:{n:'Gymnastikk', d:'Pull-ups, push-ups, HSPU, burpees'},
  L:{n:'Beintung', d:'Thrusters, wall balls, lunges, bokshopp'},
  O:{n:'Olympisk', d:'Cleans eller snatches for reps'}
};
const DAY = 864e5;
// Forslag ut fra teksten i økta. Rekkefølge: olympisk, beintung, gymnastikk, ellers kondisjon.
function mcGuess(text){
  const t = String(text || '').toLowerCase();
  if (/clean|snatch|c ?& ?j/.test(t)) return 'O';
  if (/thruster|wall ?ball|squat|lunge|box ?jump|step[- ]?up|deadlift|markløft|knebøy|utfall|bokshopp|pistol/.test(t)) return 'L';
  if (/push[- ]?up|hspu|handstand|pull[- ]?up|chin[- ]?up|toes[- ]?to[- ]?bar|t2b|burpee|\bdips?\b|muscle[- ]?up|ring row/.test(t)) return 'G';
  return 'M';
}
const mcOf = ctx => ctx === 'session' ? (S.draft.mc = S.draft.mc || {}) : (ui.freeMcData = ui.freeMcData || {});
const mcSaved = m => m && m.min > 0 ? {type: m.type || 'M', min: Math.round(+m.min), rpe: m.rpe || null} : undefined;
function mcWindow(from, to){
  const inWin = h => h.date > from && h.date <= to;
  const list = S.history.filter(h => h.mc && inWin(h));
  return {min: list.reduce((a,h) => a + h.mc.min, 0), load: list.reduce((a,h) => a + h.mc.min * (h.mc.rpe || 0), 0), n: list.length,
          unknown: S.history.filter(h => h.metcon && !h.mc && inWin(h)).length};
}
// Hvilke metcon-typer bør ikke ligge dagen før dette løftet?
const mcAvoid = slot => slot === 'squat' ? ['L'] : ['clean','snatch','cj'].includes(slot) ? ['L','O'] : slot === 'bench' ? ['G'] : [];
const mcAdvice = {
  squat:'Neste styrkeøkt er knebøy. Unngå beintunge metcons dagen før.',
  clean:'Neste styrkeøkt er power clean. Unngå beintunge metcons og olympiske løft dagen før, og ta aldri metcon før clean samme dag.',
  bench:'Neste styrkeøkt er benk. Unngå mye push-ups og HSPU dagen før.',
  snatch:'Neste økt starter med snatch. Unngå beintunge metcons og olympiske løft dagen før, og ta aldri metcon før løftene samme dag.',
  cj:'Neste økt starter med clean & jerk. Unngå beintunge metcons og olympiske løft dagen før, og ta aldri metcon før løftene samme dag.'
};
const mcRecentConflict = slot => S.history.find(h => h.mc && Date.now() - h.date < 30*3600e3 && mcAvoid(slot).includes(h.mc.type));

function mcFields(ctx, mc){
  mc = mc || {};
  return `<div class="mc-form">
    <span class="lbl">Type metcon</span>
    <div class="seg mc-type">${Object.entries(MC).map(([k,v]) => `<button data-a="mct:${ctx}:${k}" aria-pressed="${mc.type === k}" aria-label="${v.n}: ${v.d}"><b>${v.n}</b><small>${v.d}</small></button>`).join('')}</div>
    <div class="field"><label for="mcMin-${ctx}">Minutter arbeid</label>
      <span class="inp"><input id="mcMin-${ctx}" data-mcmin="${ctx}" type="text" inputmode="numeric" value="${esc(mc.min || '')}" placeholder="12">min</span></div>
    <span class="lbl">Hvor hard var den? (RPE 1–10)</span>
    <div class="seg num">${[3,4,5,6,7,8,9,10].map(v => `<button data-a="mcr:${ctx}:${v}" aria-pressed="${mc.rpe === v}">${v}</button>`).join('')}</div>
    <p class="small muted">Brukes til ukebudsjettet for metcons. Uten minutter teller metconen ikke med.</p>
  </div>`;
}

function vMetconBudget(p, s){
  const now = Date.now(), cur = mcWindow(now - 7*DAY, now), prev = mcWindow(now - 14*DAY, now - 7*DAY);
  // Strength & Power har budsjett per fase, Burgener per uke (s.mcBud)
  const ph = p.prog === 'sp12' && s ? s.ph : null, bud = ph ? SP.budget[ph] : s && s.mcBud || null;
  if (!bud && !cur.n) return '';
  const slot = s && s.ex[0] && s.ex[0].slot;
  const grow = prev.load > 0 && cur.load > 0 ? Math.round((cur.load / prev.load - 1) * 100) : null;
  let h = `<section class="box">
    <span class="lbl">Metcons siste 7 dager</span>
    <div class="mc-sum"><div><b>${fmt(cur.min)}</b><span>min${bud ? ' av ' + bud + ' i budsjett' : ''}</span></div>
      <div><b>${fmt(cur.load)}</b><span>belastning${grow != null ? ' · ' + (grow > 0 ? '+' : '') + grow + ' % fra uka før' : ''}</span></div></div>`;
  if (bud) h += `<div class="meter" role="img" aria-label="${fmt(cur.min)} av ${bud} minutter"><i style="width:${Math.min(100, cur.min / bud * 100)}%" class="${cur.min > bud ? 'over' : ''}"></i></div>`;
  if (bud && cur.min > bud) h += `<p class="small warn-t">Over budsjettet for ${ph ? SP.phaseName[ph].toLowerCase() : 'denne uka'}. Kutt metcons før du kutter styrken.</p>`;
  else if (grow != null && grow > 15) h += `<p class="small warn-t">Belastningen er ${grow} % høyere enn uka før. Hold den flat en stund når styrken er prioritert.</p>`;
  if (cur.unknown) h += `<p class="small muted">${cur.unknown} ${cur.unknown === 1 ? 'metcon' : 'metcons'} uten minutter teller ikke med.</p>`;
  if ((p.prog === 'sp12' || p.prog === 'burg') && mcAdvice[slot]) h += `<p class="small muted">${mcAdvice[slot]}</p>`;
  return h + `</section>`;
}

/* ---------- Hele planen ----------
   Kjører programmet framover på en kopi av instansen, som om alle økter går som planlagt.
   Ekte data endres ikke. Fullførte økter hentes fra loggen. */
const PLAN_NOTE = {
  linear:'Planen viser vektene hvis du klarer alle reps hver gang. Bommer du, står vekten stille, og etter tre bom går den ned 10 %.',
  gzclp:'Planen viser vektene hvis du klarer alle reps hver gang. Bommer du, går du til neste trinn med samme vekt.',
  '531':'Treningsmaksen øker etter hver syklus på fire uker. Repsene i siste sett påvirker ikke planen.',
  jugg:'Arbeidsmaksen øker bare med reps over målet i testsettene. Planen viser vektene hvis du akkurat når målet, så de blir høyere hvis du tar flere reps.',
  cube:'Vektene er prosent av 1RM og endres ikke underveis. Uke 10 er test, og beste løft blir ny 1RM.',
  sp12:'Planen viser vektene hvis toppsett og backoff går på RPE 7 og clean er rask og ren. Da øker vekten 2,5 kg fra uke til uke. Ved RPE 7,5–9 står vekten stille. Når en ny fase starter, regnes vektene ut fra estimert 1RM.',
  burg:'Vektene er prosent av 1RM og endres ikke underveis. Uke 12, dag 4 er max out, og beste snatch og clean & jerk blir ny 1RM.',
  cbe:'Planen viser vektene hvis det tunge løftet går på RPE 7 hver gang. Da øker treningsmaksen 2,5 kg i benk og press og 5 kg i knebøy og markløft fra uka etter, så tallene framover er et tak. Hver uke har tre løft, og ett står over etter tur. Uke 12 bruker vektene fra uke 1, så retesten kan sammenlignes.',
  cir:'Planen viser vektene hvis benk og knebøy går på RPE 7 og clean er rask og ren hver uke. Da øker treningsmaksen 2,5 kg i benk og clean og 5 kg i knebøy per uke, så tallene framover er et tak. Uke 12 bruker vektene fra uke 1, så retesten kan sammenlignes. Hver økt viser kretsen med åtte stasjoner.',
  emc:'Planen viser vektene hvis benk og knebøy går en halv RPE under målet og clean er rask og ren hver uke. Da øker treningsmaksen 2,5 kg i benk og clean og 5 kg i knebøy per uke, så tallene framover er et tak. Uke 12 bruker vektene fra uke 1, så retesten kan sammenlignes. Hver økt viser 4-stasjons EMOM-en.',
  mmc:'Planen viser vektene hvis siste sett går på RPE 7 og clean er rask og ren hver uke. Da øker treningsmaksen 2,5 kg i benk og clean og 5 kg i knebøy per uke. Ved RPE 7,5–9 står den stille, så tallene framover er et tak, ikke et løfte. Metconene står i hver økt, og uke 1, 6 og 12 har de samme tre benchmark-metconene.',
  athx:'Vektene er prosent av arbeidsmaksen din i dag, og fartene følger anslaget ditt. Begge oppdateres etter hver økt, så tallene framover endrer seg. Henger du etter kalenderen, hopper planen til første økt i denne uka.'
};
const planPer = (p, a) => p.prog === 'athx' ? a.ax.per : ['531','jugg','cube','sp12','burg','mmc','emc','cir','cbe'].includes(p.prog) ? p.days.length : (parseInt(p.perWeek) || 3);
function simulate(p, a0, n){
  const a = JSON.parse(JSON.stringify(a0)), out = [], tot = totalOf(p, a0);
  while (out.length < n && !(tot && a.idx >= tot)) {
    const s = buildSession(p, a);
    out.push({idx: a.idx, s: JSON.parse(JSON.stringify(s))});
    s.ex.forEach(e => { e.sets.forEach(x => x.d = x.t); e.rpe = 7; e.q = 'god'; });
    // ATHX styres av anslag fra ekte økter, så planen viser vektene ut fra arbeidsmaksen i dag
    if (p.prog !== 'athx') progress(p, a, s);
    a.idx++;
  }
  return out;
}
// Sett med lik vekt og reps slås sammen: «5×5 · 80 kg». Fullførte sett viser repsene du faktisk tok hvis de avvek.
function setsLine(e, done){
  const g = [];
  e.sets.forEach(x => { const l = g[g.length-1];
    if (l && l.w === x.w && l.t === x.t && l.c === x.c && !!l.am === !!x.am) { l.n++; l.d.push(x.d); } else g.push({w:x.w, t:x.t, c:x.c, am:x.am, n:1, d:[x.d]}); });
  return g.map(x => done && x.d.some(d => d !== x.t)
    ? x.d.map(d => d == null ? '–' : d).join(', ') + ' × ' + fmt(x.w) + ' kg'
    : x.n + '×' + (x.c ? '(' + x.c + ')' : x.t) + (x.am ? '+' : '') + ' · ' + fmt(x.w) + ' kg').join(' + ');
}
function vPlan(){
  const P = ui.plan, p = prog(P.id), a = P.active ? S.active : P.inst;
  if (!p || !a) { ui.plan = null; return ''; }
  return `<button class="link" data-a="planclose">‹ Tilbake</button>
    <header class="head"><h1>Hele planen</h1><p class="eyebrow">${p.name}</p>
      <p class="muted small">${PLAN_NOTE[p.prog] || ''}${P.active ? '' : ' Vektene er regnet ut fra tallene du har skrevet inn.'}${totalOf(p, a) ? '' : ' Programmet har ingen fast slutt, så planen viser 12 uker.'}</p></header>
    ${planWeeks(P, p, a)}`;
}
// Ukene i planen. Brukes både i Program-fanen og når du ser planen til et program før du aktiverer det.
// short: bare uka du er i og neste (Program-fanen), med en knapp for resten
function planWeeks(P, p, a, short){
  const per = planPer(p, a), ax = p.prog === 'athx', tot = totalOf(p, a);
  const N = tot || Math.max(12 * per, a.idx + 4 * per);
  const doneH = P.active ? S.history.filter(h => h.programId === p.id && !h.free && h.date >= a.startedAt).reverse().slice(-a.idx) : [];
  // ATHX kan hoppe fram i kalenderen, så økta husker sin egen plass (idx)
  const rows = doneH.map((h, k) => ({k: ax && h.idx != null ? h.idx : k, done:!h.skipped, skipped:!!h.skipped, day:h.day, sub:h.sub, ex:h.ex, cond:h.cond, wod:h.wod}));
  simulate(p, a, N - a.idx).forEach(f => {
    const s = P.active && f.idx === a.idx && ownDraft() ? ownDraft() : f.s;
    rows.push({k: f.idx, done:false, next: P.active && f.idx === a.idx, day:s.day, sub:s.sub, ex:s.ex, cond:s.cond, wod:s.wod, boxes:s.boxes});
  });
  const weeks = [];
  rows.forEach(r => { const w = Math.floor(r.k / per); (weeks[w] = weeks[w] || []).push(r); });
  // Uka står i overskriften, så «Uke 9 av 12» trengs ikke på hver økt
  const subOf = (r, w) => ax ? r.sub.replace(/^Uke \d+ av \d+ · /, '') : ['burg','mmc','emc','cir','cbe'].includes(p.prog) ? r.sub.replace(/^Uke \d+ av \d+( · )?/, '') : r.sub !== 'Uke ' + (w + 1) ? r.sub : '';
  const from = short ? Math.floor(Math.min(a.idx, N - 1) / per) : 0, to = short ? from + 2 : weeks.length;
  const inProgress = P.active && ownDraft() && ownDraft().ex.some(e => e.sets.some(x => x.d != null) || (e.wuDone || []).length);
  const exLine = r => r.ex.slice(0, 3).map(e => { const t = Math.max(...e.sets.map(x => x.w)); return liftName(e.lift) + (t > 0 ? ' ' + fmt(t) : ''); }).join(' · ') + (r.ex.length > 3 ? ' …' : '');
  const more = P.active && weeks.length > 2 ? `<button class="btn ghost" data-a="planall">${short ? 'Vis alle ' + weeks.length + ' uker' : 'Vis bare denne og neste uke'}</button>` : '';
  return `${ax ? axScore(a) : ''}
    ${weeks.map((list, w) => list && w >= from && w < to ? `<h2 class="sec">Uke ${w + 1}${ax && a.ax.weeks[w] ? ' · ' + AX_PH[a.ax.weeks[w].ph] : ''}</h2><div class="list">${list.map(r => {
      const m = r.ex[0], sub = r.sub ? subOf(r, w) : '';
      return `<details class="box acc plan-s${r.done ? ' done-s' : ''}${r.skipped ? ' skip-s' : ''}${r.next ? ' next-s' : ''}"${r.next ? ' open' : ''}>
        <summary><span class="ps"><span class="ps-top"><b>${esc(r.day)}</b>${r.done ? '<span class="pill">Gjort</span>' : r.skipped ? '<span class="pill">Hoppet over</span>' : r.next ? `<span class="pill on">${inProgress ? 'Pågår' : 'Neste'}</span>` : ''}</span>
          ${sub ? `<span class="small muted">${esc(sub)}</span>` : ''}
          <span class="small">${m ? exLine(r) : r.cond ? esc(r.cond.title) : ''}</span>
          ${r.wod ? `<span class="small muted">Metcon · ${esc(r.wod.tekst.split('\n')[0].replace(/:$/, ''))}${r.done && r.wod.resultat ? ' · ' + esc(r.wod.resultat) : ''}</span>` : ''}</span></summary>
        <div class="plan-ex">${r.ex.map(e => `<div class="ln"><span>${liftName(e.lift)}${e.tag ? ` <span class="muted">${e.tag}</span>` : ''}</span><span>${setsLine(e, r.done)}</span></div>`).join('')}
          ${r.cond ? `<div class="ln"><span><b>${esc(r.cond.title)}</b></span><span>${r.done ? esc(axResTxt(r.cond)) : ''}</span></div>
            ${r.cond.lines ? `<ul class="ax-lines small">${r.cond.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}` : ''}
          ${r.wod ? `<div class="plan-mc"><div class="ln"><span><b>${esc(r.wod.navn)}</b></span><span>${r.done ? esc(r.wod.resultat || '') : ''}</span></div>
            <pre class="wodtxt small">${esc(r.wod.tekst)}</pre></div>` : ''}
          ${(r.boxes || []).map(([l, t]) => `<div class="plan-mc"><span class="lbl">${esc(l)}</span><p class="small" style="white-space:pre-line;margin:0">${esc(t)}</p></div>`).join('')}
          ${r.next ? `<button class="btn" data-a="tab:today">${inProgress ? 'Fortsett dagens økt' : 'Gå til dagens økt'}</button>` : ''}</div>
      </details>`; }).join('')}</div>` : '').join('')}
    ${more}`;
}

/* ---------- Pete Plan (Pete Marston) ----------
   Tre-ukers rotasjon med seks økter per uke, kontrollert mot Pete Marstons egen tabell
   (machars.net/waspeteplan.htm). Kan slås av under Program.
   off = målfart i sekunder per 500 m i forhold til 2K-farten (negativ = raskere).
   Progresjon (fra planen): snittet fra alle dragene i en intervalløkt blir målet neste gang samme økt kommer.
   Hard distanse: prøv å komme nær din beste tid. Rolige økter følger 2K-farten.
   «Tilpasset styrke» er vår egen tilpasning, ikke en del av Pete Plan: rolige økter 6 km og hard distanse 5 km. */
const PETE = [
  {kind:'speed',  d:[500,500,500,500,500,500,500,500], rest:[210], off:-2.5},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[2000,2000,2000,2000], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10},
  {kind:'speed',  d:[1000,1000,1000,1000], rest:[300], off:2},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[1500,1500,1500,1500,1500], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10},
  {kind:'speed',  d:[250,500,750,1000,750,500,250], rest:[90,180,270,360,270,180], off:-2},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[3000,2500,2000], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10}
];
const PETE_KIND = {speed:'Fartsintervaller', steady:'Rolig distanse', endur:'Utholdenhetsintervaller', hard:'Hard distanse'};
const PETE_MACH = {row:'Ro', ski:'Ski', bike:'Sykkel'};
const PETE_REF = {row:'Romaskin, 2000 m', ski:'Ski, 2000 m', bike:'Sykkel, 4000 m'};
const peteOn = () => !!(S.settings.pete && S.settings.pete.on);
const distTxt = m => (m >= 10000 ? String(m).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : String(m)) + ' m';
const splitTxt = sec => { if (!(sec > 0)) return '–'; const t = Math.round(sec * 10) / 10, m = Math.floor(t / 60), r = t - m*60;
  return m + ':' + (r < 10 ? '0' : '') + (Math.round(r*10) % 10 ? r.toFixed(1) : String(Math.round(r))); };
// «1:52», «1:52.4» eller «1.52,4» → sekunder
function parseSplit(v){
  const m = String(v || '').trim().replace(',', '.').match(/^(\d{1,2})[:.](\d{1,2}(?:\.\d)?)$/);
  return m ? +m[1]*60 + +m[2] : null;
}
// Økta for posisjon pos, i valgt versjon og på valgt apparat. Sykkel: dobbel distanse, fart per 1000 m.
function peteSession(pos, ver, mach){
  const base = PETE[pos % PETE.length], bike = mach === 'bike';
  let d = base.d.slice();
  if (ver === 'str' && base.kind === 'steady') d = [6000];
  if (ver === 'str' && base.kind === 'hard') d = [5000];
  if (bike) d = d.map(x => x * 2);
  const same = d.every(x => x === d[0]);
  const name = d.length === 1 ? distTxt(d[0]) : same ? d.length + ' × ' + distTxt(d[0]) : d.join(' / ') + ' m';
  const rests = base.rest ? (base.rest.length === 1 ? Array(d.length - 1).fill(base.rest[0]) : base.rest) : [];
  const restTxt = !rests.length ? '' : new Set(rests).size === 1 ? mmss(rests[0]) + ' pause' : 'pauser ' + rests.map(mmss).join(', ');
  return {pos: pos % PETE.length, kind: base.kind, off: base.off, d, meters: d.reduce((a,b) => a+b, 0), rests, name, restTxt, bike};
}
/* Referansefart regnet begge veier.
   Framover: 2K-farten + tillegget for økta = målfart.
   Baklengs: snittfarten du rodde − tillegget = anslått 2K-fart nå.
   Bare intervalløkter og hard distanse gir anslag (rolige økter er ikke maks innsats).
   Brukes: medianen av de tre siste anslagene fra de siste seks ukene, per apparat.
   En testet 2K-tid du skriver inn går foran, helt til nyere anslag kommer.
   Alle farter er i sekunder per 500 m (på sykkel: per 500 sykkelmeter). */
const PETE_EST_DAYS = 42;
const median = a => { const b = a.slice().sort((x, y) => x - y), m = Math.floor(b.length / 2); return b.length % 2 ? b[m] : (b[m-1] + b[m]) / 2; };
function peteRef(mach){
  const set = S.settings.pete, tested = set.ref && set.ref[mach], testedAt = (set.refAt && set.refAt[mach]) || 0;
  const est = ((S.pete.est || {})[mach] || []).filter(e => Date.now() - e.t < PETE_EST_DAYS * DAY && e.t > testedAt).slice(-3);
  if (est.length) return {split: median(est.map(e => e.sec)), src:'est', n: est.length};
  if (tested) return {split: mach === 'bike' ? tested / 8 : tested / 4, src:'test'};
  return {split: null, src:'none'};
}
// Fart per 500 m → testtid (2000 m, sykkel 4000 m)
const refTime = (split, mach) => split * (mach === 'bike' ? 8 : 4);
const refLine = (mach) => { const r = peteRef(mach); if (!r.split) return '';
  const what = mach === 'bike' ? '4K' : '2K';
  return r.src === 'est' ? `Beregnet ${what}: ${splitTxt(refTime(r.split, mach))}, ${r.n === 1 ? 'fra siste økt' : 'fra dine siste ' + r.n + ' økter'}` : `Testet ${what}: ${splitTxt(refTime(r.split, mach))}`; };

// Målfart for økta, og hvor målet kommer fra
function peteTarget(ss, mach){
  const P = S.pete || {}, key = ss.pos + '|' + mach, pbKey = 'hard|' + mach + '|' + ss.meters;
  if ((ss.kind === 'speed' || ss.kind === 'endur') && P.targets && P.targets[key]) return {sec: P.targets[key], src:'ditt snitt sist'};

// Ved 500 m-drag (1000 m på sykkel) er tid per drag det samme som farten, så da vises den ikke.
const dragMeters = ss => ss.d.every(x => x === ss.d[0]) && ss.d[0] !== (ss.bike ? 1000 : 500) ? ss.d[0] : null;

const dragLabel = ss => ss.d.length === 1 ? 'Total tid' : 'Tid per drag';
const peteNote = k => k === 'steady' ? 'Jevnt, ikke lett. Ro helst uten stopp.'
  : k === 'hard' ? 'Så hardt du klarer. Prøv å komme nær din beste tid.'
  : 'Fart som gjør at du klarer alle dragene. Siste drag tar du fullt ut. Snittet ditt blir målet neste gang denne økta kommer.' + (k === 'endur' ? ' Rundt 5K-fart.' : '');

// Resultatet du skrev inn → fart per 500 m. unit 'drag' = tid per drag eller total tid.
function peteResultSec(ss, pick){
  const v = parseSplit(pick.split); if (!v) return null;

  return ss.bike ? v / 2 : v;   // sykkel vises per 1000 m
}

function petePick(ctx){
  const set = S.settings.pete, ss = peteSession(S.pete.idx || 0, set.ver, set.mach), t = peteTarget(ss, set.mach);
  const pick = {idx: S.pete.idx || 0, mach: set.mach, ver: set.ver, split: '', unit: 'split'};
  const mc = {type:'M', min: peteWorkMin(ss, t) || ''};
  if (ctx === 'session' && S.draft) { S.draft.pete = pick; S.draft.metcon = true; S.draft.mc = Object.assign(mc, S.draft.mc && S.draft.mc.rpe ? {rpe:S.draft.mc.rpe} : {}); save(); }
  else { ui.free = true; ui.freePete = pick; ui.freeMc = true; ui.freeMcData = mc; }
}
// Når økta er lagret: neste økt i rotasjonen, nytt mål og nytt 2K-anslag hvis resultat er registrert
function peteDone(pick){
  const ss = peteSession(pick.idx, pick.ver, pick.mach), sec = peteResultSec(ss, pick);

  S.pete.est = S.pete.est || {};

}

// Samme rekkefølge i visning og automatisk overgang. EMOM-løft følger runder, ikke hele øvelser.
function todayCurrent(s){
  if (!s) return -1;
  const done = e => e.sets.every(x => x.d != null);
  return s.rr ? s.ex.reduce((b, e, i) => done(e) ? b : b < 0 || e.sets.filter(x => x.d != null).length < s.ex[b].sets.filter(x => x.d != null).length ? i : b, -1)

}
function rememberSet(ei){
  const s = S.draft;
  return {draft:s, session:s.started, ei, before:clone(s.ex[ei]), rest:ui.rest ? clone(ui.rest) : null};
}
function canUndoSet(){
  const u = ui.setUndo, s = S.draft;
  return !!(u && s && u.draft === s && u.session === s.started && u.check === JSON.stringify(s.ex));
}
function followExercise(ei){
  const target = $(ei < 0 ? '#today-after' : '#exercise-' + ei);
  if (!target) return;
  target.scrollIntoView({block:'start', behavior:'instant'});
  const focus = target.querySelector('.ex-hit') || target.querySelector('h2') || target;
  if (!focus.hasAttribute('tabindex') && focus.tagName !== 'BUTTON') focus.tabIndex = -1;
  focus.focus({preventScroll:true});
}
function registeredSet(before, previous, message){
  before.check = JSON.stringify(S.draft.ex); ui.setUndo = before;
  const next = todayCurrent(S.draft);
  if (next !== previous && ui.exOpen) delete ui.exOpen[S.draft.started + '-' + previous];
  save(); trainTick(); render(); wake();
  if (next !== previous) followExercise(next);
  say(message + (next !== previous ? next < 0 ? '. Alle arbeidssett er registrert.' : '. Neste: ' + liftName(S.draft.ex[next].lift) : '') + '. Angre siste registrering er tilgjengelig.');
}
function undoSet(){
  if (!canUndoSet()) { ui.setUndo = null; render(); return; }
  const u = ui.setUndo;
  S.draft.ex[u.ei] = u.before; ui.rest = u.rest; ui.setUndo = null;
  (ui.exOpen = ui.exOpen || {})[S.draft.started + '-' + u.ei] = true;
  save(); render(); followExercise(u.ei); say('Siste registrering angret. ' + liftName(u.before.lift));
}

      <div class="h-row"><h1>${s.day}</h1>${topBtns()}</div>
      <div class="today-progress"><span>${s.ex.reduce((n, e) => n + e.sets.length, 0) - setsLeft} av ${s.ex.reduce((n, e) => n + e.sets.length, 0)} arbeidssett</span><span>${anyTouched ? mins + ' min i gang' : 'Klar når du er'}</span></div>
      <div class="prog" aria-label="${cur < 0 ? 'Alle øvelser er gjort' : 'Øvelse ' + (cur+1) + ' av ' + s.ex.length}">${s.ex.map(e => {
        const d = e.sets.filter(x => x.d != null).length;
        return `<i class="${d === e.sets.length ? 'full' : ''}"><b style="width:${Math.round(d / e.sets.length * 100)}%"></b></i>`; }).join('')}</div>
      ${p.prog === 'athx' ? axStatus(S.active, s)
        : g ? `<p class="muted small">Vektene er regnet ut fra dine makser. Programmet ditt står der det står.</p>`
        : ['mmc','emc','cir','cbe'].includes(p.prog) && s.ex[0] && S.active.e1rm[s.ex[0].lift] ? `<p class="muted small">Treningsmaks ${liftName(s.ex[0].lift).toLowerCase()}: ${fmt(Math.round((s.ex[0].cbeWk ? cbeTm(S.active, s.ex[0].lift, s.ex[0].cbeWk) : mmcTm(S.active, s.ex[0].lift)) * 2) / 2)} kg</p>`
        : S.active.e1rm && s.ex[0] && S.active.e1rm[s.ex[0].lift] ? `<p class="muted small">${p.prog === 'sp12' ? 'Estimert 1RM' : '1RM'} ${liftName(s.ex[0].lift).toLowerCase()}: ${fmt(Math.round(S.active.e1rm[s.ex[0].lift]*2)/2)} kg</p>` : ''}
    </header>`;
  if (s.calT && s.calT > day0(Date.now()) && !anyTouched) h += `<div class="box rest-day"><b>Hviledag i dag</b>
      <p class="small">Neste økt er ${esc(s.sub.toLowerCase())}. Vil du trene i dag, tar du den nå. Da blir neste økt den som kommer etter.</p></div>`;
  if (p.prog === 'sp12') {
    const c = s.ex[0] && mcRecentConflict(s.ex[0].slot);
    if (c && !anyTouched) h += `<div class="warn">Du logget en ${MC[c.mc.type].n.toLowerCase()} metcon for ${Math.max(1, Math.round((Date.now() - c.date)/3600e3))} timer siden. Forvent høyere RPE i dag, og kutt gjerne ett backoff-sett.</div>`;
    if ((s.ph === 'd4' || s.ph === 'd8') && !anyTouched && ui.keepDl !== s.ph) h += vDeloadChoice(s.ph);
  }
  if (p.prog === 'burg') {
    const c = s.ex[0] && mcRecentConflict(s.ex[0].slot);
    if (c && !anyTouched) h += `<div class="warn">Du logget en ${MC[c.mc.type].n.toLowerCase()} metcon for ${Math.max(1, Math.round((Date.now() - c.date)/3600e3))} timer siden. Forvent tyngre løft i dag, og stopp ved prosentene der teknikken holder.</div>`;
  }
  s.ex.forEach((e,ei) => {
    const top = Math.max(...e.sets.map(x => x.w));
    const k = s.started + '-' + ei, opened = !!(ui.exOpen && ui.exOpen[k]);
    const wk = wuKind(s, ei), wu = wk ? warmups(e.slot, e.sets[0].w, e.sets[0].t, wk) : [];
    // Ferdig øvelse blir én linje med en gang. Vurderinger og AMRAP er fortsatt tilgjengelige.
    if (!opened && cur !== ei && allDone(e) && !asks(e) && !e.sets.some(x => x.am)) {
      const hit = e.sets.every(x => x.d >= x.t);
      h += `<button class="ex-row" data-a="exopen:${k}" aria-label="${liftName(e.lift)}, ferdig: ${setsLine(e, true)}. Trykk for å åpne">
        <span class="ck ${hit ? '' : 'miss'}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${hit ? 'M5 12l5 5L20 7' : 'M12 7v6M12 17v.01'}"/></svg></span>
        <b>${liftName(e.lift)}</b><span>${setsLine(e, true)}</span></button>`;
      return;
    }
    // Øvelser som ikke er påbegynt etter den du holder på med, vises som én linje med navn og vekt
    if (!opened && cur > -1 && ei !== cur && !allDone(e)) {
      h += `<button class="ex-row ex-line" data-a="exopen:${k}" aria-label="${ei === cur + 1 ? 'Neste' : 'Senere'}: ${liftName(e.lift)}, ${setsLine(e)}. Trykk for å åpne">
        <small>${ei === cur + 1 ? 'Neste' : 'Senere'}</small><b>${liftName(e.lift)}</b><span>${fmt(top)} kg</span>${touched(e) ? `<span class="small muted">${e.sets.filter(x => x.d != null).length} av ${e.sets.length} sett</span>` : ''}</button>`;
      return;
    }
    const now = ei === cur;
    // Ett tall om gangen: før arbeidssettene er i gang viser kortet neste oppvarmingssett som det store tallet
    const wuDone = e.wuDone || [], wuNext = wu.findIndex(([w, r]) => !wuDone.includes(w + 'x' + r));
    const warm = now && wuNext > -1 && !e.sets.some(x => x.d != null);
    const nextSi = now && !warm ? e.sets.findIndex(x => x.d == null) : -1;
    const varies = new Set(e.sets.map(x => x.w)).size > 1;
    const amIdx = e.sets.findIndex(x => x.am && x.d != null);
    // Ett tall om gangen: det store tallet er alltid neste sett. Den markerte ruta viser hvor i rekka du er,
    // så kortet trenger ikke si «Oppvarming 2 av 3» eller «sett 2 av 5» i tillegg.
    const [bigW, bigR] = warm ? wu[wuNext] : nextSi > -1 ? [e.sets[nextSi].w, e.sets[nextSi].c || e.sets[nextSi].t] : [top, 0];
    const bigAm = !warm && nextSi > -1 && e.sets[nextSi].am;
    const menuOpen = ui.exMenu === k;
    const head = `${now ? `<p class="today-stage"><span>${warm ? 'Oppvarming · ' + (wuNext + 1) + ' av ' + wu.length : nextSi > -1 ? 'Arbeidssett · ' + (nextSi + 1) + ' av ' + e.sets.length : 'Alle sett er registrert'}</span><strong class="current-reps">${bigR}${bigAm ? '+' : ''}<small>reps</small></strong></p>` : ''}
        ${now ? `<div class="kg"><span id="kgN" data-w="${fmt(bigW)}">${fmt(bigW)}</span><small id="kgU" data-u="kg">kg</small></div>
        `
          : `<div class="kg">${fmt(bigW)}<small>kg${bigR ? ' × ' + bigR + (bigAm ? '+' : '') : ''}</small></div>`}
        `;
    // Vekt, pause og registrering deler én stor trykkflate; øvelsesvalgene står utenfor.
    const canNext = now && (warm || nextSi > -1);
    h += `<section class="ex today-ex ${now ? 'now' : ''}" id="exercise-${ei}">
      <div class="ex-head"><div><h2>${liftName(e.lift)}</h2>${e.tag ? `<span class="tag">${e.tag}</span>` : ''}<p class="small muted">${setsLine(e)}</p></div><button class="link today-menu" data-a="exmenu:${k}" aria-expanded="${!!menuOpen}" aria-haspopup="dialog" aria-controls="exerciseSheet" aria-label="Valg for ${esc(liftName(e.lift))}">Valg ${chev}</button></div>
      ${canNext ? `<button class="ex-hit" data-a="next:${ei}" aria-label="Registrer ${bigR}${bigAm ? '+' : ''} reps på ${fmt(bigW)} kg${warm ? ', oppvarming' : ''}">${head}</button>` : head}
      ${now ? `<div class="rest-bar" aria-hidden="true"><i></i></div><div class="today-controls" id="todayRestControls"><button class="link" data-a="undoset" ${canUndoSet() ? '' : 'hidden'}>Angre</button><button class="link" data-a="restadd:30" id="todayRestAdd" hidden aria-label="30 sekunder lengre pause">+30 s</button><button class="link" data-a="skip" id="todayRestSkip" hidden>Avslutt pause</button></div>` : ''}
      ${LIFTS[e.lift].bar ? `<div class="platesrow ${now ? 'platebox' : ''}">${plateHTML(bigW, now)}</div>` : ''}
      ${e.hint ? `<p class="wu">${e.hint}</p>` : ''}
      ${wu.length ? `<details class="today-warmup" ${(ui.wuOpen?.[k] ?? warm) ? 'open' : ''}><summary data-a="wuopen:${k}" aria-controls="warmup-${ei}">Oppvarming · ${wu.filter(([w, r]) => wuDone.includes(w + 'x' + r)).length} av ${wu.length} gjort ${chev}</summary><div class="chip-grp wu-grp" id="warmup-${ei}">${vWarmup(e, ei, wu, wuNext, warm)}</div></details>` : ''}
      <p class="today-set-label">Arbeidssett <span class="muted">· ${e.sets.filter(x => x.d != null).length} av ${e.sets.length}</span></p>
      <div class="chips"><div class="chip-grp">${e.sets.map((x,si) => {
        const st = x.d == null ? (si === nextSi ? 'next' : '') : (x.d >= x.t ? 'ok' : 'miss');
        const fr = x.d != null && ui.fresh === ei + ':' + si ? ' fresh' : '';
        const lbl = 'Sett '+(si+1)+': '+(x.d == null ? 'ikke gjort, mål '+(x.c || x.t)+' reps' : x.d+' reps')+(x.am ? ', så mange du klarer' : '');
        return `<div class="cw"><button class="chip ${st} ${x.am?'am':''}${fr}" data-a="set:${ei}:${si}" aria-label="${lbl}">${x.c && (x.d == null || x.d === x.t) ? x.c : x.d == null ? x.t : x.d}${x.am ? '<sup>+</sup>' : ''}</button>${varies ? `<small>${fmt(x.w)}</small>` : ''}</div>`;
      }).join('')}</div></div>
      ${amIdx > -1 ? `<div class="amrap"><span>Siste sett, så mange du klarer</span>
        <button class="step" data-a="am:${ei}:${amIdx}:-1" aria-label="Én rep mindre">−</button>
        <b>${e.sets[amIdx].d}</b>
        <button class="step" data-a="am:${ei}:${amIdx}:1" aria-label="Én rep mer">+</button></div>` : ''}
      ${canNext && S.history.filter(x => !x.free && !x.skipped).length < 3 ? '<p class="chip-hint">Trykk på et registrert sett for én rep mindre.</p>' : ''}
      ${e.sp ? spExtras(e, ei) : ''}
      ${e.adj ? `<div class="amrap"><span>Juster vekt etter dagsform</span>
        <button class="step" data-a="w:${ei}:-1" aria-label="2,5 kg lettere">−</button>
        <button class="step" data-a="w:${ei}:1" aria-label="2,5 kg tyngre">+</button></div>` : ''}

    </section>`;
  });
  h += `<section class="today-tail" id="today-after" tabindex="-1">${cur < 0 && canUndoSet() ? '<button class="link" data-a="undoset">Angre siste registrering</button>' : ''}`;
  // Øvelser du har fjernet i dag, kan hentes tilbake slik de var
  // Originalen til en byttet øvelse står ikke her. Den hentes med «Tilbake til …» i kortet.
  if ((s.rmEx || []).some(e => !e.swapId)) h += `<section class="box rm-list"><span class="lbl">Fjernet fra dagens økt</span>
      ${s.rmEx.map((e, i) => e.swapId ? '' : `<div class="rm-row"><span>${esc(liftName(e.lift))}${e.tag ? ` <span class="muted small">${esc(e.tag)}</span>` : ''}</span>
        <button class="link" data-a="exback:${i}">Ta tilbake</button></div>`).join('')}
      <p class="small muted">Vekta står som den er til neste gang.</p></section>`;
  // Burgener: kroppsvektøvelsene står som en påminnelse og logges ikke
  if (s.acc) h += `<section class="box"><span class="lbl">Til slutt, uten vekt</span><p class="small">${esc(s.acc)}</p></section>`;
  // Muscle MetCon: sekundærløft og finisher står som tekst og logges ikke
  (s.boxes || []).forEach(([l, t]) => { h += `<section class="box"><span class="lbl">${esc(l)}</span><p class="small" style="white-space:pre-line">${esc(t)}</p></section>`; });
  if (s.cond) h += axCondBox(s);
  // Etter styrken: kondisjon, metcon og notat ligger bak én rad. En del med innhold står alltid åpen.
  const af =ui.after && ui.after.k === s.started ? ui.after : (ui.after = {k: s.started});
  const has = {cond: !!s.pete, mc: !!(s.wod || s.metcon), note: !!(s.note || '').trim()};
  const show = k => af[k] != null ? af[k] : has[k];   // et trykk overstyrer, ellers står en del med innhold åpen
  const parts = [peteOn() || s.pete ? ['cond', 'Kondisjon'] : null, ['mc', 'Metcon'], ['note', 'Notat']].filter(Boolean);
  h += `<section class="box after"><span class="lbl">${s.ex.length ? 'Etter styrken' : 'Mer i økta'}</span>
      <div class="after-add">${parts.map(([k, n]) => `<button class="tog" data-a="after:${k}" aria-pressed="${show(k)}">${show(k) ? n : '+ ' + n}</button>`).join('')}</div></section>`;
  if (show('cond')) h += peteBox('session', s.pete);
  if (show('mc')) {
    h += vMetconBudget(p, s);
    if (s.wod) h += wodBox(s.wod, 'session') + `<section class="box">${mcFields('session', s.mc)}</section>`;
    else {
      h += `<section class="box">${switchRow('metcon', 'Logg en metcon jeg tok', s.metcon)}${s.metcon ? mcFields('session', s.mc) : ''}</section>`;
      if (!s.pete) h += quickPick('session', false);
    }
  }
  if (show('note')) h += `<section class="box notebox">
      <label for="note" class="lbl">Notat</label>
      <textarea id="note" placeholder="For eksempel dagsform eller en teknikkdetalj">${esc(s.note)}</textarea>
    </section>`;
  // Mangler det sett, sier appen hva som skjer med dem før økta lukkes
  if (ui.confirm === 'finish' && setsLeft) {
    const left = e => e.sets.filter(x => x.d == null).length;
    const cap = list => list.map((n, i) => i ? n.charAt(0).toLowerCase() + n.slice(1) : n);
    const part = s.ex.filter(e => left(e) && e.sets.some(x => x.d != null)), none = s.ex.filter(e => e.sets.every(x => x.d == null));
    const missing = cap([...part.map(e => liftName(e.lift) + ' (' + left(e) + ' sett)'), ...none.map(e => liftName(e.lift))]);
    // Lineære programmer og GZCLP: påbegynte løft med hull teller som bom, løft du ikke har rørt, står stille (se progress)
    let why = 'Settene lagres som ikke tatt i loggen.';
    if (p.prog === 'linear' || p.prog === 'gzclp') why = [part.length ? 'Løft med sett som mangler, regnes som bom.' : '',
      none.length ? listNo(cap(none.map(e => liftName(e.lift)))) + ' står på samme vekt neste gang.' : ''].join(' ');
    h += `<section class="box skipbox" aria-live="polite"><p><b>Fullføre med ${setsLeft} sett som ikke er logget?</b></p>
      <p class="small">Ikke logget: ${esc(listNo(missing))}. ${esc(why)}</p>
      <div class="row"><button class="btn sm" data-a="finish">Fullfør likevel</button><button class="btn ghost sm" data-a="cancel">Fortsett økta</button></div></section>`;
  } else h += `<button class="btn${setsLeft ? ' ghost' : ''}" data-a="${setsLeft ? 'confirm:finish' : 'finish'}" ${anyTouched || s.cond ? '' : 'disabled'}>Fullfør økt</button>`;
  if (ui.confirm === 'skipday') {
    const a1 = JSON.parse(JSON.stringify(S.active)); a1.idx++;
    const next = tot && a1.idx >= tot ? null : buildSession(p, a1);
    const lifts = [...new Set(exAll(s).map(e => liftName(e.lift)))].map((n, i) => i ? n.toLowerCase() : n);
    h += `<section class="box skipbox" aria-live="polite"><p><b>Hoppe over ${esc(s.day)}?</b></p>
      <p class="small">${lifts.length ? listNo(lifts) + ' får ingen økning denne gangen, og vektene står som de er.' : 'Økta lagres som hoppet over.'}${anyTouched ? ' Settene du har tatt i dag, lagres ikke.' : ''}${s.wod || s.pete ? ' Metconen du har valgt, lagres heller ikke.' : ''}
        ${next ? 'Neste økt blir ' + esc(next.day) + (next.sub && next.sub !== s.sub ? ' (' + esc(next.sub) + ')' : '') + '.' : 'Dette var siste økt i programmet.'}</p>
      <div class="row"><button class="btn danger sm" data-a="skipday">Ja, hopp over</button><button class="btn ghost sm" data-a="cancel">Avbryt</button></div></section>`;
  }
  // Engangsøkta kan avbrytes. Da kommer din egen økt tilbake, med settene du hadde ført.
  if (g) h += ui.confirm === 'guestquit'
    ? `<section class="box skipbox" aria-live="polite"><p><b>Avbryte økta med ${esc(g.who)}?</b></p>
      <p class="small">${anyTouched ? 'Settene du har tatt, lagres ikke. ' : ''}${S.parked ? 'Din egen økt kommer tilbake slik du forlot den.' : 'Neste økt i programmet ditt står klar.'}</p>
      <div class="row"><button class="btn danger sm" data-a="guestquit">Ja, avbryt</button><button class="btn ghost sm" data-a="cancel">Fortsett økta</button></div></section>`
    : `<div class="links"><button class="link" data-a="confirm:guestquit">Avbryt økta</button></div>`;
  // Planen ligger under Program og fri økt under Fremgang, så her står bare det som gjelder dagens økt
  else if (ui.confirm !== 'skipday') h += `<div class="links"><button class="link" data-a="confirm:skipday">Hopp over økta</button></div>`;
  ui.fresh = null;   // blekket tegnes bare én gang, på settet du nettopp førte inn
  return h + '</section>';
}

// Lett uke: vis tallene appen har, og la utøveren velge
function vDeloadChoice(ph){
  const rows = spReadiness(S.active);
  const mark = v => v == null ? '<span class="muted">–</span>' : v ? '<span class="ok-t">✓</span>' : '<span class="warn-t">✗</span>';
  const allOk = rows.every(r => r.effOk && r.trendOk);
  return `<section class="box dl">
    <h2 class="sec" style="margin:0">Lett uke, eller én uke til?</h2>
    <p class="small">Forskningen tyder på at en fast lett uke ikke alltid trengs. Hopp bare over den hvis alle punktene stemmer.</p>
    <div class="trend">${rows.map(r => `<div class="tr"><b>${r.name}</b><span>${r.eff || 'ingen vurdering'}</span>${mark(r.effOk)}<span class="muted">1RM-trend</span>${mark(r.trendOk)}</div>`).join('')}</div>
    <ul class="small crit">
      <li>Estimert 1RM har stått stille eller steget de siste to ukene.</li>
      <li>Toppsettene har ligget på RPE 9 eller lavere, og clean har vært rask og ren.</li>
      <li>Du sover godt, føler deg uthvilt og har ingen smerter.</li>
    </ul>
    <p class="small ${allOk ? 'ok-t' : 'muted'}">${allOk ? 'Tallene i appen ser bra ut. Du avgjør punktet om søvn og smerter.' : 'Tallene peker mot å ta den lette uka.'}</p>
    <div class="row"><button class="btn ghost sm" data-a="keepdl:${ph}">Ta lett uke</button><button class="btn ghost sm" data-a="skipdl:${ph}">Hopp over</button></div>
  </section>`;
}

function dayLines(p, d){
  if (p.prog === 'user') return d.ex.map(e => `<div>${esc(liftName(e.lift))}<span>${esc(exLine(e))} · ${esc(RULES[e.rule].n.toLowerCase())}</span></div>`);
  if (d.lines) return d.lines.map(([n, v]) => `<div>${n}<span>${v}</span></div>`);
  if (p.prog === 'cube') {
    const di = p.days.indexOf(d);
    return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
      ...['1 · 4 · 7','2 · 5 · 8','3 · 6 · 9'].map((u,k) => `<div>Uke ${u}<span>${CUBE.tag[CUBE.rot[k][di]]}</span></div>`),
      `<div>Uke 10<span>Test</span></div>`];
  }
  if (p.prog === 'sp12') {
    const sc = SP.scheme[d.lift], f = x => x[0] + '×' + x[1];
    const xs = [...new Set(Object.values(SP.extras[d.lift] || {}).flat().map(x => liftName(x[0]).toLowerCase()))];
    return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
      ...['p1','p2','p3'].map((ph,k) => `<div>Uke ${['1–3','5–7','9–10'][k]}<span>${f(sc[ph].top)} + ${f(sc[ph].back)}</span></div>`),
      `<div>Uke 4 og 8<span>Lett uke</span></div>`, `<div>Uke 11<span>Taper</span></div>`,
      `<div>Uke 12<span>${d.lift === 'clean' ? 'Beste single' : 'Test 3RM'}</span></div>`,
      ...(xs.length ? [`<div class="xs">+ ${xs.join(' og ')}</div>`] : [])];
  }
  if (p.prog === 'linear') return d.ex.map(e => `<div>${liftName(e.lift)}<span>${e.sets}×${e.reps}</span></div>`);
  if (p.prog === 'gzclp') return d.ex.map(e => `<div><span style="color:var(--chalk)"><b>${e.tier}</b>${liftName(e.lift)}</span><span>${e.tier==='T1'?'5×3+':e.tier==='T2'?'3×10':'3×15+'}</span></div>`);
  if (p.prog === 'jugg') return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
    ...JUG_WAVE.map((w, k) => `<div>Uke ${k*4+1}–${k*4+4}<span>${w}</span></div>`)];
  return [`<div>${liftName(d.lift)}<span>3 sett</span></div>`, `<div>${liftName(d.lift)}<span>${p.fsl ? 'FSL 5×5' : '5×10'}</span></div>`];
}

/* ---------- Guide-visninger ---------- */
const lvl = l => `<span class="lvl lvl-${l}" title="Evidensnivå ${l}">${l}</span>`;
const refLink = k => { const r = REFS[k]; if (!r) return '';
  const url = r.doi ? 'https://doi.org/' + r.doi : 'https://pubmed.ncbi.nlm.nih.gov/' + r.pmid + '/';
  return `<a href="${url}" target="_blank" rel="noopener">${r.a}</a>`; };
const claim = ([text, l, refs]) => `<li>${lvl(l)}<span>${text}${refs.length ? ` <span class="refs">${refs.map(refLink).join(', ')}</span>` : ''}</span></li>`;
const refList = keys => { const u = [...new Set(keys)].filter(k => REFS[k]);
  return u.length ? `<ul class="reflist small">${u.map(k => `<li>${refLink(k)}. <i>${REFS[k].j}</i>. ${REFS[k].t}.</li>`).join('')}</ul>` : ''; };

function vProgramGuide(p){
  const g = GUIDE[p.id]; if (!g) return '';
  const keys = [...g.science, ...g.expect].flatMap(c => c[2]).concat(g.metconRefs || []);
  return `<h2 class="sec">Om programmet</h2>
    <div class="box guide">
      <div class="gk"><span>Fokus</span><p>${g.focus}</p></div>
      <div class="gk"><span>Passer for</span><p>${g.fits}</p></div>
      <div class="gk"><span>Passer mindre for</span><p>${g.notFor}</p></div>
      <div class="gk"><span>Slik virker det</span><p>${g.how}</p></div>
    </div>
    <details class="box acc" open><summary>Hva forskningen sier</summary><ul class="claims">${g.science.map(claim).join('')}</ul></details>
    <details class="box acc" open><summary>Hva du kan forvente</summary><ul class="claims">${g.expect.map(claim).join('')}</ul></details>

// Startvektene: tre veier inn, og ingen tall brukeren ikke har skrevet selv eller lagret fra før.
// Programmer med 1RM-forslag (p.orm): tom stang, et sett du klarte, eller 1RM. Prosentprogrammene: et sett eller 1RM.
const e1rmOf = (w, r) => r > 1 ? w * (1 + Math.min(r, 12) / 30) : w;   // Epley, regnet opp til 12 reps
function startMode(p){
  if (ui.start && ui.start.id === p.id) return ui.start.mode;
  const known = Object.keys(p.orm || p.inputs).some(l => S.maxes[l] > 0);
  return known ? 'orm' : p.orm ? 'bar' : 'set';
}
// Tom stang: stanga på alt, og markløft med 10 kg per side så stanga ligger i riktig høyde. Øvelser uten stang beholder forslaget.
const barStart = (p, k) => { const l = k.split('.')[0]; return !LIFTS[l] || !LIFTS[l].bar ? p.inputs[k] : l === 'deadlift' ? BAR() + 20 : BAR(); };
function vStart(p){
  const mode = startMode(p), base = Object.keys(p.orm || p.inputs);
  const known = l => S.maxes[l] > 0 ? fmt(S.maxes[l]) : '';
  const modes = (p.orm ? [['bar', 'Tom stang', 'Anbefalt når du er ny med stang']] : []).concat([
    ['set', 'Et sett jeg klarte nylig', 'Vekt og reps, så regner appen ut resten'],
    ['orm', 'Jeg vet maksløftene mine', 'Tyngste løft på én rep']]);
  let h = `<h2 class="sec">Hvor starter du?</h2>
    <div class="box start" role="radiogroup" aria-label="Hvor starter du?">${modes.map(([m, n, d]) =>
      `<button role="radio" aria-checked="${mode === m}" data-a="startmode:${p.id}:${m}"><i aria-hidden="true"></i><span><b>${n}</b><small>${d}</small></span></button>`).join('')}</div>`;
  if (mode === 'set') h += `<div class="box" style="gap:0">${base.map(l => `
      <div class="field"><label for="est-${l}">${liftName(l)}</label>
        <span class="inp"><input id="est-${l}" data-est="${l}" type="text" inputmode="decimal" placeholder="kg" aria-label="${liftName(l)}, kg">×<input id="estr-${l}" class="sm" data-est="${l}" type="text" inputmode="numeric" placeholder="reps" aria-label="${liftName(l)}, reps"></span></div>`).join('')}</div>
    <p class="muted small">Et sett du klarte de siste ukene, med god teknikk. Appen anslår 1RM ut fra det.</p>`;
  if (mode === 'orm' && p.orm) h += `<div class="box" style="gap:0">${base.map(l => `
      <div class="field"><label for="orm-${l}">${liftName(l)}</label>
        <span class="inp"><input id="orm-${l}" data-orm="${l}" type="text" inputmode="decimal" placeholder="–" value="${known(l)}">kg</span></div>`).join('')}</div>`;
  // Feltene appen bruker: startvekter, eller 1RM i prosentprogrammene. De står alltid åpent og kan endres.
  h += `<h2 class="sec">${p.orm ? 'Første økt blir' : mode === 'set' ? 'Anslått 1RM' : 'Din 1RM (tyngste løft på én rep)'}</h2>
    <div class="box" style="gap:0">${Object.keys(p.inputs).map((k, i) => {
      const [l] = k.split('.');
      const v = !p.orm ? (mode === 'orm' ? known(k) : '')
        : p.derive(k, 100) == null ? fmt(p.inputs[k])
        : mode === 'bar' ? fmt(barStart(p, k)) : mode === 'orm' && S.maxes[l] > 0 ? fmt(p.derive(k, S.maxes[l])) : '';
      return `
      <div class="field"><label for="in-${i}">${keyLabel(k)}</label>
        <span class="inp"><input id="in-${i}" data-key="${k}" type="text" inputmode="decimal" placeholder="–" value="${v}">kg</span></div>`; }).join('')}</div>`;
  return h;
}
// Fyller feltene appen bruker fra en 1RM, enten den er skrevet inn eller anslått fra et sett. Felt du har endret selv, står.
function fillStart(p, l, orm){
  document.querySelectorAll('input[data-key]').forEach(inp => {
    const k = inp.dataset.key; if (k.split('.')[0] !== l || inp.dataset.edited) return;
    const v = p.derive ? p.derive(k, orm) : Math.round(orm * 2) / 2; if (v != null) inp.value = fmt(v);
  });
}

function spark(vals){
  const w = 72, h = 24, min = Math.min(...vals), max = Math.max(...vals), rng = max - min || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*(w-6)+3, h-3-((v-min)/rng)*(h-6) ]);
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--chalk)"/></svg>`;
}

// Er økta styrke, kondisjon/metcon, eller begge? Brukes av kalenderen og tellerne i loggen.
const isStrength = h => !h.free && !h.skipped && !(h.ex && !h.ex.length);   // ATHX: løp og ski alene er ikke styrke
const isMetcon = h => !!(h.metcon || h.mc || h.wod || h.pete);
// Fire uker, mandag først, med i dag markert
function vCalendar(){
  const day = 864e5, today = new Date(); today.setHours(0,0,0,0);
  const start = today.getTime() - ((today.getDay() + 6) % 7 + 21) * day;
  const cells = [];
  for (let i = 0; i < 28; i++) {
    const t0 = start + i * day, t1 = t0 + day, hs = S.history.filter(h => h.date >= t0 && h.date < t1);
    const st = hs.some(isStrength), mc = hs.some(isMetcon), sk = !st && !mc && hs.some(h => h.skipped);
    const cls = st && mc ? 'both' : st ? 'st' : mc ? 'mc' : sk ? 'sk' : '';
    const lbl = new Date(t0).toLocaleDateString('nb-NO', {weekday:'long', day:'numeric', month:'long'}) + ': ' + (st && mc ? 'styrke og metcon' : st ? 'styrke' : mc ? 'metcon' : sk ? 'økt hoppet over' : 'ingen økt');
    cells.push(`<i class="${cls}${t0 === today.getTime() ? ' today' : ''}${t0 > today.getTime() ? ' fut' : ''}" title="${lbl}"></i>`);
  }
  return `<div class="cal" role="img" aria-label="Treningsdager de siste fire ukene">${['M','T','O','T','F','L','S'].map(d => `<span>${d}</span>`).join('')}${cells.join('')}</div>
    <div class="cal-key"><span><i class="st"></i>Styrke</span><span><i class="mc"></i>Metcon</span><span><i class="sk"></i>Hoppet over</span></div>`;
}
function vLog(){
  if (ui.logEdit) return vLogEdit();
  let h =`<header class="head h-row"><div><p class="eyebrow">Siste 4 uker</p><h1>Fremgang</h1></div><button class="quick" data-a="free">+ Fri økt</button></header>`;
  if (!S.history.length) return h + `<p class="muted">Øktene du fullfører havner her, med vekt, reps og notater.</p>`;
  if (ui.leNotes) h += `<section class="box"><span class="lbl">Programmet er regnet ut på nytt</span>
      ${ui.leNotes.length ? `<ul class="notes">${ui.leNotes.map(n => `<li><b>${n.name}</b><span class="${n.kind}">${n.text}</span></li>`).join('')}</ul>` : '<p class="small">Ingen endring i vektene.</p>'}
      <button class="btn ghost sm" data-a="lenotesx">OK</button></section>`;
  const now = Date.now(), last28 = S.history.filter(x => x.date > now - 28*864e5);
  const nSt = last28.filter(isStrength).length, nMc = last28.filter(isMetcon).length;
  h += `<section class="box">
      <div class="log-sum">
        <div><b>${nSt}</b><span>${nSt === 1 ? 'styrkeøkt' : 'styrkeøkter'}</span></div>
        <div><b>${nMc}</b><span>${nMc === 1 ? 'metcon' : 'metcons'}</span></div>
        <div><b>${fmt(mcWindow(now - 28*864e5, now).min)}<small>min</small></b><span>kondisjon</span></div>
      </div>
      ${vCalendar()}
    </section>`;
  const series = {};
  [...S.history].reverse().forEach(sess => sess.ex.forEach(e => {
    if (/BBB|FSL|T2|T3|Lett|Backoff|Deload|Sekundær|Taper|Teknikk|Manualer|Maks minus|på tid/.test(e.tag || '')) return;
    const done = e.sets.filter(x => x.d > 0); if (!done.length) return;
    (series[e.lift] = series[e.lift] || []).push(Math.max(...done.map(x => x.w)));
  }));
  const rows = Object.entries(series).filter(([,v]) => v.length > 1);
  h += rows.length ? `<section class="box trend"><h2 class="sec" style="margin:2px 0 0">Toppvekt per økt</h2>${rows.map(([l,v]) => { const d = v[v.length-1] - v[0];

                   : `<p class="muted small">Kurvene dukker opp når du har logget samme løft to ganger.</p>`;
  const mcCount = S.history.filter(x => x.metcon).length;
  h += `<h2 class="sec">Siste økter</h2>`;
  if (mcCount) h += `<div class="filt" role="group" aria-label="Filter">
      <button data-a="logf:all" aria-pressed="${ui.logF !== 'mc'}">Alle</button>
      <button data-a="logf:mc" aria-pressed="${ui.logF === 'mc'}">Med metcon (${mcCount})</button></div>`;
  const list = ui.logF === 'mc' ? S.history.filter(x => x.metcon) : S.history;
  h += list.slice(0, 60).map(sess => {
    const wodH = sess.wod ? `<div class="sess-wod"><p><b>${esc(sess.wod.navn)}</b>${sess.wod.resultat ? ` · <span class="res">${esc(sess.wod.resultat)}</span>` : ''}</p>
      <details><summary>Vis økta</summary><pre class="wodtxt">${esc(sess.wod.tekst)}</pre></details></div>` : '';
    const mcH = sess.mc && MC[sess.mc.type] ? `<span class="pill">${MC[sess.mc.type].n} · ${fmt(sess.mc.min)} min${sess.mc.rpe ? ' · RPE ' + sess.mc.rpe : ''}</span>` : '';
    const ppH = sess.pete ? `<div class="sess-wod"><p><b>Pete Plan · ${esc(sess.pete.name)}</b> · ${PETE_MACH[sess.pete.mach] || ''}${sess.pete.split ? ` · <span class="res">${paceTxt(sess.pete.split, sess.pete.bike)}</span>` : ''}</p></div>` : '';
    const axH = sess.cond ? `<div class="sess-wod"><p><b>${esc(sess.cond.title)}</b>${axResTxt(sess.cond) ? ` · <span class="res">${esc(axResTxt(sess.cond))}</span>` : ''}</p></div>` : '';
    const noteH = (sess.metcon || sess.note || sess.wod || sess.pete || sess.cond) ? `<div class="sess-note">${sess.metcon ? '<span class="pill mc">Metcon</span>' : ''}${mcH}${axH}${ppH}${wodH}${sess.note ? `<p>${esc(sess.note)}</p>` : ''}</div>` : '';
    const d = new Date(sess.date), open = !!(ui.logOpen && ui.logOpen[sess.date]);
    const dateBox = `<span class="sess-d"><b>${d.getDate()}</b><small>${d.toLocaleDateString('nb-NO', {month:'short'}).replace('.', '')}</small></span>`;
    if (sess.skipped) { const ps = prog(sess.programId);
      return `<article class="sess skipped ${open ? 'open' : ''}"><button class="sess-row" data-a="logopen:${sess.date}" aria-expanded="${open}" aria-label="${dateFmt(sess.date)}: ${esc(sess.day)}, hoppet over">${dateBox}
        <span class="sess-t"><b>${esc(sess.day)}</b><small>Hoppet over${ps ? ' · ' + ps.name : ''}</small></span>${chev}</button>
        ${open ? logActs(sess) : ''}</article>`; }
    const p = sess.free ? null : prog(sess.programId);
    const title = sess.free ? (sess.pete ? 'Pete Plan' : sess.wod ? 'Metcon' : 'Fri økt') : sess.day;
    // Én linje per økt: løftene med toppvekt, eller hva den frie økta var. Trykk for detaljer.
    const sum = sess.free ? (sess.pete ? esc(sess.pete.name) : sess.wod ? esc(sess.wod.navn) : sess.note ? esc(sess.note.slice(0, 60)) : '')
      : sess.ex.some(e => !e.rm) ? Object.entries(sess.ex.filter(e => !e.rm).reduce((m, e) => (m[e.lift] = Math.max(m[e.lift] || 0, ...e.sets.map(x => x.w)), m), {})).map(([l, w]) => liftName(l) + ' ' + fmt(w)).join(' · ')
      : sess.cond ? esc(sess.cond.title) : '';
    const vol = sess.free ? 0 : sess.ex.reduce((s,e) => s + e.sets.reduce((v,x) => v + (x.d||0)*x.w, 0), 0);
    const body = !open ? '' : sess.free ? noteH : `<p class="muted small">${p ? p.name + ' · ' : ''}${sess.sub} · ${fmt(Math.round(vol))} kg totalt</p>
      ${sess.ex.map(e => {
        const ws = [...new Set(e.sets.map(x => x.w))];
        const reps = e.sets.map(x => x.d == null ? '–' : x.d);
        const right = e.rm ? `<span class="muted">${e.sw ? 'Byttet ut' : 'Fjernet'}</span>` : ws.length === 1 ? reps.join(' ') + ' × ' + fmt(ws[0]) + ' kg' : e.sets.map(x => (x.d == null ? '–' : x.d) + '×' + fmt(x.w)).join(' · ');
        const extra = [e.tag, e.rpe != null ? 'RPE ' + fmt(e.rpe) : e.q ? (LE_Q.find(([v]) => v === e.q) || [, e.q])[1].toLowerCase() : null].filter(Boolean).join(' · ');
        return `<div class="ln"><span>${liftName(e.lift)}${extra ? ' <span class="muted">' + extra + '</span>' : ''}</span><span>${right}</span></div>`;
      }).join('')}
      ${noteH}`;
    return `<article class="sess ${open ? 'open' : ''}">
      <button class="sess-row" data-a="logopen:${sess.date}" aria-expanded="${open}" aria-label="${dateFmt(sess.date)}: ${title}">
        ${dateBox}
        <span class="sess-t"><b>${title}</b>${sum ? `<small>${sum}</small>` : ''}</span>
        ${isMetcon(sess) && !sess.free ? '<span class="pill mc">Metcon</span>' : ''}${chev}
      </button>
      ${body}${open ? logActs(sess) : ''}
    </article>`;
  }).join('');
  return h;
}
// Under en åpen økt i loggen: Endre og Slett. Slett spør først og sier hva som skjer med programmet.
function logActs(sess){

/* Vekter i programmet du kjører: tallene programmet regner vektene ut fra, rettet for hånd.
   Generelt for alle programmer: kandidatene er treningsmaks, 1RM og arbeidsvekter i programmet. Appen prøver hvert tall
   (+10 kg i en kopi) og ser hvilke av de neste øktene som får andre vekter. Tall som styrer de neste øktene, står øverst. */
const PW_N = 9;   // så mange økter fram ser appen
const pwLift = (grp, k) => grp === 'lifts' ? (k.split('.')[0] === 'x' ? k.split('.')[1] : k.split('.')[0]) : k;
function pwLabel(p, grp, k){
  if (grp === 'tm') return 'Treningsmaks';
  if (grp === 'tmNext') return 'Treningsmaks fra neste uke';
  if (grp === 'e1rm') return p.prog === 'athx' ? 'Arbeidsmaks' : '1RM';
  const parts = k.split('.'), rest = parts[0] === 'x' ? parts.slice(2) : parts.slice(1);
  if (!rest.length || parts[0] === 'x') return 'Arbeidsvekt';
  if (/^T\d$/.test(rest[0])) return rest[0] + '-vekt';
  if (isUkey(rest[0])) return 'Arbeidsvekt (' + ukeyTxt(rest[0]) + ')';
  const last = rest[rest.length - 1];
  return last === 'top' ? 'Toppsett' : last === 'back' ? 'Backoff' : 'Arbeidsvekt (' + rest.join(' ') + ')';
}
// Programmet slik neste økt ser det: startvekter neste økt lagrer, og treningsmaks som ellers regnes fra 1RM
function pwBase(p){
  const a = clone(S.active); buildSession(p, a);
  if (['mmc','emc','cir','cbe'].includes(p.prog) && a.e1rm) { a.tm = a.tm || {}; Object.keys(a.e1rm).forEach(L => { if (a.tm[L] == null) a.tm[L] = mmcTm(a, L); }); }
  return a;
}
const pwGet = (a, path) => path.reduce((o, k) => o && o[k], a);
function pwSet(a, path, v){
  let o = a; path.slice(0, -1).forEach(k => { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }); o[path[path.length - 1]] = v;
}
const pwPlan = (p, a, k) => { a = clone(a); a.idx = S.active.idx + k; const s = buildSession(p, a);
  return {s, v: JSON.stringify(s.ex.map(e => [e.lift, e.sets.map(x => x.w)]))}; };
function pwRows(p){
  const base = pwBase(p), plans = [...Array(PW_N)].map((_, k) => pwPlan(p, base, k));
  const cand = [];
  ['tm','e1rm'].forEach(g => Object.keys(base[g] || {}).forEach(k => cand.push({path: [g, k], g, k})));
  Object.keys(base.lifts || {}).forEach(k => { if (typeof (base.lifts[k] || {}).w === 'number') cand.push({path: ['lifts', k, 'w'], g: 'lifts', k}); });
  if (base.tmNext && base.tmNext.tm) Object.keys(base.tmNext.tm).forEach(k => cand.push({path: ['tmNext', 'tm', k], g: 'tmNext', k}));
  const list = [];
  for (const {path, g, k} of cand) {
    const v = pwGet(base, path); if (typeof v !== 'number' || !isFinite(v)) continue;
    const b = clone(base); pwSet(b, path, v + 10);
    let first = -1;
    for (let j = 0; j < PW_N && first < 0; j++) if (pwPlan(p, b, j).v !== plans[j].v) first = j;
    const L = pwLift(g, k), order = plans.findIndex(x => x.s.ex.some(e => e.lift === L));
    list.push({path, L, v, label: pwLabel(p, g, k), first, when: first < 0 ? '' : first ? 'Brukes fra ' + plans[first].s.day + (plans[first].s.sub ? ' (' + plans[first].s.sub.split(' · ')[0].toLowerCase() + ')' : '') : 'Brukes i neste økt', order: order < 0 ? 99 : order});
  }
  return list.sort((x, y) => (x.first < 0) - (y.first < 0) || x.order - y.order || x.L.localeCompare(y.L));
}
function vProgWeights(p){
  if (!S.active || !p) return '';
  const rows = pwRows(p), used = rows.filter(r => r.first >= 0), other = rows.filter(r => r.first < 0);
  if (!rows.length) return '';
  const field = r => `<div class="field"><label for="pw-${esc(r.path.join('-'))}">${esc(liftName(r.L))} · ${esc(r.label)}${r.when ? `<small class="muted">${esc(r.when)}</small>` : ''}</label>
      <span class="inp"><input id="pw-${esc(r.path.join('-'))}" data-pw="${esc(r.path.join('|'))}" type="text" inputmode="decimal" value="${fmt(Math.round(r.v * 10) / 10)}">kg</span></div>`;
  return `<h2 class="sec">Vekter i programmet</h2>
    <div class="box" style="gap:0">${used.map(field).join('') || '<p class="muted small">Ingen av tallene styrer de neste øktene.</p>'}</div>
    ${other.length ? `<details class="box"><summary class="small">Andre tall i programmet (${other.length})</summary><div style="display:grid">${other.map(field).join('')}</div>
      <p class="muted small">Disse styrer ikke de neste ${PW_N} øktene, men kan brukes senere, for eksempel i en ny fase eller en retest.</p></details>` : ''}
    <p class="muted small">Rett et tall hvis vektene ikke stemmer, for eksempel etter en økt du har rettet i loggen. Programmet fortsetter herfra med vanlig progresjon. Loggen endres ikke.${draftTouched() ? ' <b>Dagens økt er påbegynt</b>, så den beholder vektene sine. Endringen gjelder fra neste økt.' : ''}</p>`;
}
// Lagrer et tall fra Vekter i programmet. Neste økt bygges på nytt hvis den ikke er påbegynt.
function pwSave(inp){
  const p = S.active && prog(S.active.programId), path = inp.dataset.pw.split('|'), v = numIn(inp.value);
  if (!p) return;
  const base = pwBase(p), old = pwGet(base, path);
  if (!(v > 0 && v < 1000)) { toast('Skriv vekten som et tall, for eksempel 92,5'); inp.value = fmt(Math.round(old * 10) / 10); return; }
  const r = Math.round(v * 100) / 100; if (r === Math.round(old * 100) / 100) return;
  // Mangler tallet i programmet (startvekt neste økt ikke har lagret ennå), kopieres resten av objektet med
  if (path[0] === 'lifts' && !(S.active.lifts || {})[path[1]]) { S.active.lifts = S.active.lifts || {}; S.active.lifts[path[1]] = clone(base.lifts[path[1]]); }
  pwSet(S.active, path, r);
  if (!draftTouched()) dropOwnDraft();
  save(); render();
  toast(liftName(pwLift(path[0], path[0] === 'lifts' ? path[1] : path[path.length - 1])) + ': ' + fmt(Math.round(old * 10) / 10) + ' → ' + fmt(r) + ' kg');
}

      <div class="seg" role="group" aria-label="Lengde på pausene">${REST_SCALE.map(([f, l]) => `<button data-a="restscale:${f}" aria-pressed="${(S.settings.restScale || 1) === f}">${l}</button>`).join('')}</div>

// Skjermen tegnes på nytt for hver endring. Fokus settes tilbake på samme knapp eller felt,
// så tastatur og skjermleser ikke havner øverst på siden etter hvert trykk.
function paint(html){
  const view = $('#view'), a = document.activeElement;
  const key = a && a !== view && view.contains(a)
    ? (a.id ? '#' + CSS.escape(a.id) : a.dataset.a ? `[data-a="${CSS.escape(a.dataset.a)}"]` : null) : null;
  const sel = key && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  view.innerHTML = html;
  const b = key && view.querySelector(key); if (!b) return;
  b.focus({preventScroll: true});
  if (sel) try { b.setSelectionRange(sel[0], sel[1]); } catch(e) {}
}

function render(){
  applyLook();
  let h = ui.storageOK ? '' : `<div class="warn">Lagring er ikke tilgjengelig her. Endringer forsvinner når siden lukkes.</div>`;
  h += vSyncAsk();   // skybackup: skyen og telefonen er endret hver for seg, brukeren må velge
  if (ui.plan) { const v = vPlan(); if (ui.plan) { paint(h + v); return; } }
  if (ui.detail === 'settings') h += vSettings();   // åpnes fra tannhjulet på I dag
  else if (ui.tab === 'today') h += vToday();

  if (ui.whl && ui.whl.bi === 'pp') { if (ui.whl.at === ui.tab + '/' + ui.detail) h += whlHTML(); else ui.whl = null; }
  paint(h);
  sxSheetPaint();
  exerciseSheetPaint();
  if (ui.whl && ui.whl.bi === 'pp') whlInit();
  const inChat = ui.tab === 'together' && /^c:/.test(ui.sxView || '');
  $('#view').classList.toggle('chat', inChat);

// Lyd når pausen er over (innstilling under Innstillinger). Lyden må låses opp i et trykk, derfor skjer det i startRest.
let audio = null;
function unlockAudio(force){
  if (!S.settings.sound && !force) return;   // force: metcon-klokka har sin egen lydinnstilling
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch(e) {}
}
function beep(){
  if (!S.settings.sound || !audio) return;
  try {
    [0, .18].forEach((d, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + d;
      o.frequency.value = i ? 1180 : 880;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .18);
    });
  } catch(e) {}
}
function startRest(sec){
  if (ckOn()) return;   // metcon-klokka styrer tiden, for eksempel i en EMOM med løft
  // Rund etter skalering: for eksempel 150 s × 0,75 = 112,5 s → 110 s (1:50).
  sec = Math.round((sec || 120) * (S.settings.restScale || 1) / 10) * 10; unlockAudio();
  ui.rest = {end: Date.now() + sec*1000, total: sec, done: false};
  updateRest();
}
// Etter siste sett i økta er det ingenting å hvile til, så da går det ingen pause
function restAfter(sec){
  if (S.draft.ex.some(e => e.sets.some(x => x.d == null))) startRest(sec);
  else { ui.rest = null; updateRest(); }
}
// Rødt de siste 10 sekundene, eller den siste femdelen hvis pausen er kortere enn 50 sekunder
const restWarn = total => Math.min(10, total * .2);
const mmss = s => Math.floor(s/60) + ':' + String(Math.floor(s % 60)).padStart(2,'0');
// Under pausen blir det store tallet i arket til klokka, med neste vekt ved siden av. Når pausen er over, står vekten der igjen.
function sheetClock(t){
  const n = $('#kgN'), u = $('#kgU'), stage = document.querySelector('.stage');
  if (!n || !u) { delete stage.dataset.clock; return; }
  // Neste vekt står stort ved siden av klokka, så du ser hva stanga skal ha mens du laster
  if (t) { stage.dataset.clock = '1'; n.textContent = t; u.innerHTML = `<span class="nx-l">Neste</span><b>${n.dataset.w}</b><span>${u.dataset.u}</span>`; }
  else { delete stage.dataset.clock; n.textContent = n.dataset.w; u.textContent = u.dataset.u; }
}
function updateTodayRest(){
  const controls = $('#todayRestControls'), stage = document.querySelector('.stage');
  stage.classList.toggle('inline-rest', !!controls);
  if (!controls) return;
  const resting = !!ui.rest;
  $('#todayRestAdd').hidden = !resting;
  $('#todayRestSkip').hidden = !resting;
}
function updateRest(){
  const el = $('#rest'), stage = document.querySelector('.stage');
  if (!ui.rest) { el.hidden = true; delete stage.dataset.rest; sheetClock(null); updateTodayRest(); return; }
  const left = (ui.rest.end - Date.now()) / 1000;
  if (left < -600) { ui.rest = null; updateRest(); return; }   // gi opp etter 10 minutter overtid
  let lvl, state;
  if (left > 0) { lvl = left / ui.rest.total; state = left <= restWarn(ui.rest.total) ? 'warn' : 'run'; }
  else {
    if (!ui.rest.done) {   // pausen er over: ett lyst blink og eventuelt lyd
      ui.rest.done = true; beep();
      const f = $('#restFlash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    }
    lvl = 0; state = 'over';   // overtid teller oppover i linjen
  }
  el.hidden = false;
  stage.dataset.rest = state;
  // Linjalen: lengden er tiden som er igjen. Neste sett står allerede som det store tallet i arket.
  stage.style.setProperty('--lvl', (lvl * 100).toFixed(2) + '%');
  $('#restB').textContent = left > 0 ? mmss(Math.ceil(left)) : '+' + mmss(-left);
  sheetClock(left > 0 ? mmss(Math.ceil(left)) : null);
  // Står klokka i arket, viser linjen nederst bare knappene, så tiden ikke står to steder
  $('#restL').textContent = left > 0 ? (stage.dataset.clock ? 'Pause' : 'av ' + mmss(ui.rest.total)) : 'Klar for neste sett';
  updateTodayRest();
}
setInterval(updateRest, 250);

let lock = null;
