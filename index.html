<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stanga">
<meta name="theme-color" content="#111317">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stanga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: én smal kolonne som et treningskort, fast fanelinje nederst.
   Mørk jernflate; skivefargene (25 rød, 20 blå, 15 gul, 10 grønn) brukes som betydning, ikke pynt. */
:root{
  --iron:#111317; --iron-2:#191C22; --iron-3:#232730; --line:#2E333C;
  --chalk:#ECEAE4; --chalk-2:#A4A8B1; --chalk-3:#6F747E;
  --accent:#4C86F0; --accent-ink:#08111F;
  --ok:#3FB872; --ok-ink:#06150C; --miss:#E5533F; --amrap:#EDBE3A;
  --p25:#D93A2F; --p20:#2F6FDB; --p15:#E3B42B; --p10:#2E9E5B; --p5:#E6E4DE; --p2:#B8413A; --p1:#A9AEB6;
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --body:'Barlow',-apple-system,system-ui,'Segoe UI',sans-serif;
  color-scheme:dark;
}
/* App-skall: bare innholdet scroller. Fanelinjen er en fast del av oppsettet, ikke position:fixed,
   så iOS ikke kan flytte den når sidehøyden endrer seg mellom faner. */
html{height:100%;box-sizing:border-box}
html,body{background:var(--iron);color:var(--chalk)}
body{height:100%;overflow:hidden;
  font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--iron);
  padding-top:env(safe-area-inset-top,0px);
  /* iOS oppgir av og til en altfor stor bunnsone i hjemskjerm-apper. 34 px er hjemmelinjen på iPhone. */
  padding-bottom:min(env(safe-area-inset-bottom,0px),34px)}
.stage{flex:1 1 auto;min-height:0;position:relative}
.scroller{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
button{font-family:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 104px;
  display:grid;gap:16px}

.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-2);margin:0}
h1{font:700 42px/.95 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:6px 0 0;text-wrap:balance}
h2{font:700 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-2);margin:8px 0 0}
p{margin:0}
.muted{color:var(--chalk-2)}
.small{font-size:14px}
.head{display:grid;gap:4px;padding-top:4px}

/* Knapper */
.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  font:700 19px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:17px 20px;width:100%;cursor:pointer}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:var(--iron-3);color:var(--chalk)}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1px var(--miss);color:var(--miss)}
.btn.sm{font-size:16px;padding:12px 14px;width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.link{appearance:none;background:none;border:0;color:var(--chalk-2);font:600 15px var(--body);padding:8px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-self:start}

/* Øvelseskort */
.ex{background:var(--iron-2);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ex-head>div{min-width:0}
.tag{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:6px}
.kg{font:700 36px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kg small{font-size:16px;color:var(--chalk-2);margin-left:3px;letter-spacing:.04em}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.cw{display:grid;justify-items:center;gap:4px}
.cw small{font-size:12px;color:var(--chalk-3);font-variant-numeric:tabular-nums}
.chip{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--chalk-3);
  font:700 23px/1 var(--display);font-variant-numeric:tabular-nums;cursor:pointer;position:relative;transition:transform .08s}
.chip:active{transform:scale(.93)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.chip.miss{border-color:var(--miss);color:var(--miss)}
.chip.am{border-style:dashed;border-color:var(--amrap)}
.chip.am.ok{border-style:solid;background:var(--amrap);border-color:var(--amrap);color:var(--accent-ink)}
.chip sup{position:absolute;top:7px;right:9px;font-size:13px}

.amrap{display:flex;align-items:center;gap:12px;background:var(--iron-3);border-radius:12px;padding:8px 8px 8px 14px}
.amrap span{flex:1;font-size:14px;color:var(--chalk-2)}
.amrap b{font:700 26px/1 var(--display);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.step{width:44px;height:44px;border-radius:10px;border:0;background:var(--iron-2);color:var(--chalk);font:600 24px/1 var(--body);cursor:pointer}

/* Skiver per side */
.platesrow{display:flex;align-items:center;gap:12px;min-height:30px;color:var(--chalk-2);font-size:13px;flex-wrap:wrap}
.plates{display:flex;align-items:center;gap:2px;height:32px;position:relative;padding-left:16px}
.plates::before{content:"";position:absolute;left:0;top:50%;width:16px;height:5px;margin-top:-2.5px;background:var(--chalk-3);border-radius:2px}
.pl{display:block;border-radius:2px}
.p25{width:9px;height:32px;background:var(--p25)} .p20{width:8px;height:32px;background:var(--p20)}
.p15{width:7px;height:32px;background:var(--p15)} .p10{width:6px;height:32px;background:var(--p10)}
.p5{width:5px;height:20px;background:var(--p5)} .p2{width:4px;height:15px;background:var(--p2)} .p1{width:3px;height:12px;background:var(--p1)}
.pl-txt{font-variant-numeric:tabular-nums}

/* Fullført-kort */
.done{background:var(--iron-3);border-radius:14px;padding:18px;display:grid;gap:12px}
.done .big{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.notes li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.notes li b{font-weight:600;min-width:7.5em}
.notes .up{color:var(--ok)} .notes .down{color:var(--miss)} .notes .same{color:var(--chalk-2)} .notes .stage{color:var(--amrap)}

/* Programkort */
.list{display:grid;gap:12px}
.card{appearance:none;text-align:left;width:100%;background:var(--iron-2);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--chalk);display:grid;gap:8px;cursor:pointer}
.card:active{background:var(--iron-3)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 12px/1 var(--body);letter-spacing:.04em;padding:6px 9px;border-radius:999px;background:var(--iron-3);color:var(--chalk-2)}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.box{background:var(--iron-2);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.day{background:var(--iron-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.day h4{margin:0;font:700 17px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.day div{font-size:14px;display:flex;justify-content:space-between;gap:8px}
.day div span{color:var(--chalk-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.day b{color:var(--accent);font-size:12px;margin-right:4px}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:500}
.inp{display:flex;align-items:center;gap:6px;color:var(--chalk-2)}
.inp input{width:92px;background:var(--iron);border:1px solid var(--line);border-radius:10px;color:var(--chalk);
  font:700 21px/1 var(--display);padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}

/* Logg */
.sess{background:var(--iron-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.sess .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sess .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.sess .ln>span:last-child{color:var(--chalk-2);text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.trend{display:grid;gap:4px}
.tr{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tr b{flex:1;font-weight:500}
.tr span{font-variant-numeric:tabular-nums;color:var(--chalk-2);font-size:14px;white-space:nowrap}
.tr svg{flex:none}

/* Mer */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 56px;border:0;border-radius:10px;padding:12px 0;background:var(--iron-3);color:var(--chalk);font:700 18px/1 var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:110px;background:var(--iron);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:16px/1.4 ui-monospace,Menlo,monospace;padding:10px;resize:vertical}
.warn{background:var(--iron-3);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--amrap)}

.empty{display:grid;gap:14px;padding:28px 0}
.empty .bar{height:6px;width:120px;background:var(--chalk-3);border-radius:3px;position:relative;margin:8px 0 6px 18px}
.empty .bar::before,.empty .bar::after{content:"";position:absolute;top:-17px;width:9px;height:40px;border-radius:2px;background:var(--p20)}
.empty .bar::before{left:6px;box-shadow:-11px 0 0 var(--p25)} .empty .bar::after{right:6px;box-shadow:11px 0 0 var(--p25)}

/* Pausetimer og faner */
.rest{position:absolute;left:0;right:0;z-index:21;bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest-in{max-width:528px;margin:0 auto 8px;background:var(--chalk);color:var(--iron);border-radius:12px;overflow:hidden;position:relative;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px}
.rest-in .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .25s linear}
.rest-in b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;min-width:3.2ch}
.rest-in span{flex:1;font-size:14px;font-weight:600}
.rest-in button{border:0;background:var(--iron);color:var(--chalk);border-radius:8px;padding:9px 12px;font:600 14px var(--body);cursor:pointer}
.tabs{flex:none;background:var(--iron);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;background:none;border:0;color:var(--chalk-3);font:600 12px/1 var(--body);letter-spacing:.03em;
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;cursor:pointer}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--chalk)}
.tab[aria-current="page"] svg{stroke:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:40;background:var(--chalk);color:var(--iron);font-weight:600;padding:10px 16px;border-radius:999px;font-size:14px}
select{background:var(--iron);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:500 16px var(--body);padding:9px 10px;width:58%;min-width:0}
.swapbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.swapbox>label,.swapbox>span.small{flex:1 1 100%}
.swapbox .inp{flex:1}
.swapbox .txt{flex:1 1 100%;background:var(--iron);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:500 16px var(--body);padding:10px 12px}
.chk{display:flex;align-items:center;gap:10px;color:var(--chalk-2)}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.bankctl{display:grid;gap:10px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.randlbl{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amrap);margin:0}
.quick2 .btn{font-size:17px}
.selrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.selrow select{width:100%;max-width:none;font-size:16px;padding:10px 8px}
.bankctl .txt,.wodbox .txt{width:100%;background:var(--iron);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:500 16px var(--body);padding:11px 12px}
.bankitem{appearance:none;text-align:left;width:100%;background:var(--iron-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--chalk);display:grid;gap:8px;cursor:pointer;font:inherit}
.bankitem:active{background:var(--iron-3)}
.bi-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bi-top b{font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.bi-top span{color:var(--amrap);font-weight:600;white-space:nowrap}
.bi-txt{white-space:pre-line;color:var(--chalk-2);font-size:14px;overflow-wrap:anywhere}
.wodtxt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.5 var(--body);color:var(--chalk)}
.wodbox{gap:10px;border-color:var(--amrap)}
.wodbox h2{font-size:20px}
.wodbox .top{display:flex;justify-content:space-between;align-items:center}
.prev{display:grid;gap:4px}
.prev .ln{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--chalk-2);font-variant-numeric:tabular-nums}
.sess-wod{display:grid;gap:4px}
.sess-wod p{font-size:15px}
.sess-wod .res{color:var(--amrap);font-weight:600}
.sess-wod summary{cursor:pointer;color:var(--chalk-2);font-size:13px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:-8px}
.quick{border:1px solid var(--line);background:var(--iron-2);color:var(--chalk);border-radius:999px;padding:10px 16px;font:600 14px var(--body);cursor:pointer}
.quick:active{background:var(--iron-3)}
.adj summary{cursor:pointer;color:var(--chalk-2);font-weight:600;padding:2px 0}
.adj[open] summary{margin-bottom:6px}
.notebox{gap:12px}
.notebox textarea{min-height:88px;font:16px/1.45 var(--body)}
.lbl{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-2)}
.tog{justify-self:start;border:1px solid var(--line);background:transparent;color:var(--chalk-2);border-radius:999px;padding:10px 16px;font:600 14px var(--body);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--amrap);border-color:var(--amrap);color:var(--accent-ink)}
.pill.mc{background:var(--amrap);color:var(--accent-ink);justify-self:start}
.sess-note{display:grid;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.sess-note p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.wu{font-size:14px;color:var(--chalk-2);font-variant-numeric:tabular-nums;margin:0}
.wu b{color:var(--chalk);font-weight:600;margin-right:8px}
.rpe{display:grid;gap:8px}
.rpe>span{font-size:14px;color:var(--chalk-2)}
.rpe .seg button{font-size:16px;padding:11px 4px;flex:1 1 30%}
.rpe .seg.num button{flex:1 1 30px;font-size:17px}
/* Sekundærøvelser i øktoversikten */
.day .xs{color:var(--chalk-2);font-size:13px}

/* Metcon-logg */
.mc-sum{display:flex;gap:16px}
.mc-sum>div{flex:1;display:grid;gap:2px}
.mc-sum b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.mc-sum span{font-size:13px;color:var(--chalk-2)}
.meter{height:6px;border-radius:3px;background:var(--iron-3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter i.over{background:var(--miss)}
.mc-form{display:grid;gap:10px;padding-top:4px}
.mc-type button{display:grid;gap:3px;padding:10px 8px;flex:1 1 45%;text-align:left}
.mc-type button b{font:700 16px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.mc-type button small{font:500 12px/1.25 var(--body);color:inherit;opacity:.75}
.x{appearance:none;border:0;background:none;color:var(--chalk-3);font:600 22px/1 var(--body);padding:4px 6px;cursor:pointer}
.warn-t{color:var(--amrap)} .ok-t{color:var(--ok)}

/* Valg om lett uke */
.dl .tr span{font-size:13px}
.crit{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--chalk-2)}

/* Programguide */
.guide-card{border-color:var(--accent)}
.guide{gap:12px}
.gk{display:grid;gap:3px}
.gk>span{font:600 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.gk p{font-size:15px}
.acc{gap:12px}
.acc summary{cursor:pointer;font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;list-style:none;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font:600 22px/1 var(--body);color:var(--chalk-2)}
.acc[open] summary::after{content:"−"}
.claims{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.claims li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.lvl{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:700 13px/1 var(--body);margin-top:1px}
.lvl-A{background:var(--ok);color:var(--ok-ink)}
.lvl-B{background:var(--accent);color:var(--accent-ink)}
.lvl-C{background:var(--amrap);color:var(--accent-ink)}
.lvl-H{background:var(--iron-3);color:var(--chalk);box-shadow:inset 0 0 0 1px var(--line)}
.refs{color:var(--chalk-3);font-size:13px}
.refs a,.reflist a{color:var(--chalk-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.reflist{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--chalk-2)}
.link.inl{padding:0;font-size:inherit;text-decoration:underline;display:inline}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<div class="stage">
  <div class="scroller" id="scroller"><main class="wrap" id="view"></main></div>
  <div class="rest" id="rest" hidden><div class="rest-in"><b id="restT">1:30</b><span id="restL">Pause</span><button data-a="skip">Hopp over</button><i class="fill" id="restF"></i></div></div>
</div>
<div class="toast" id="toast" hidden></div>
<nav class="tabs" aria-label="Faner"><div class="tabs-in">
  <button class="tab" data-a="tab:today"><svg viewBox="0 0 24 24"><path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/></svg>Økt</button>
  <button class="tab" data-a="tab:programs"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Programmer</button>

</div></nav>
</div>

<script>
/* =====================================================================
   STANGA – treningslogg med lokal lagring
   Tre lag:
   1) MALER   (PROGRAMS)  – programmene slik de er skrevet. Endres aldri.
   2) INSTANS (S.active)  – din kopi: vekter, trinn, hvor langt du har kommet.
   3) LOGG    (S.history) – det du faktisk løftet.
   ===================================================================== */

const KEY = 'stanga.v1';
const APP_VERSION = 18;   // øk sammen med CACHE i sw.js

const LIFTS = {
  squat:{n:'Knebøy',bar:1}, bench:{n:'Benkpress',bar:1}, row:{n:'Stangroing',bar:1},
  ohp:{n:'Militærpress',bar:1}, deadlift:{n:'Markløft',bar:1},
  pulldown:{n:'Nedtrekk'}, dbrow:{n:'Hantelroing'}, clean:{n:'Power clean',bar:1},
  // Alternativer: alt = hvilket løft de kan erstatte, r = omtrent hvor tungt det er i forhold til originalen
  frontsquat:{n:'Frontbøy',bar:1,alt:'squat',r:.82}, ssb:{n:'Safety bar-knebøy',bar:1,alt:'squat',r:.92}, pausesquat:{n:'Pauseknebøy',bar:1,alt:'squat',r:.88},
  boxsquat:{n:'Boksknebøy',bar:1,alt:'squat',r:.9}, temposquat:{n:'Tempoknebøy',bar:1,alt:'squat',r:.8},
  pausebench:{n:'Pausebenk',bar:1,alt:'bench',r:.93}, closegrip:{n:'Smal benkpress',bar:1,alt:'bench',r:.9}, incline:{n:'Skråbenk',bar:1,alt:'bench',r:.8},
  larsen:{n:'Larsen-press',bar:1,alt:'bench',r:.9}, spoto:{n:'Spoto-press',bar:1,alt:'bench',r:.9}, floorpress:{n:'Gulvpress',bar:1,alt:'bench',r:.9},
  sumo:{n:'Sumomarkløft',bar:1,alt:'deadlift',r:1}, trapbar:{n:'Trap bar-markløft',alt:'deadlift',r:1.05}, rdl:{n:'Rumensk markløft',bar:1,alt:'deadlift',r:.7},
  deficit:{n:'Underskuddsmarkløft',bar:1,alt:'deadlift',r:.9}, blockpull:{n:'Markløft fra blokk',bar:1,alt:'deadlift',r:1.05}, pausedl:{n:'Pausemarkløft',bar:1,alt:'deadlift',r:.85},
  pushpress:{n:'Push press',bar:1,alt:'ohp',r:1.2}, pushjerk:{n:'Push jerk',bar:1,alt:'ohp',r:1.25}, seatedpress:{n:'Sittende press',bar:1,alt:'ohp',r:.9}, zpress:{n:'Z-press',bar:1,alt:'ohp',r:.75},
  pendlay:{n:'Pendlay-roing',bar:1,alt:'row',r:.95}, sealrow:{n:'Sealroing',bar:1,alt:'row',r:.9}, yatesrow:{n:'Yates-roing',bar:1,alt:'row',r:1.05},
  squatclean:{n:'Clean',bar:1,alt:'clean',r:1.1}, hangsquatclean:{n:'Hang clean',bar:1,alt:'clean',r:1}, hangclean:{n:'Hang power clean',bar:1,alt:'clean',r:.92},
  blockclean:{n:'Power clean fra blokk',bar:1,alt:'clean',r:.97}, powersnatch:{n:'Power snatch',bar:1,alt:'clean',r:.78},
  // Trekk uten catch. Ingen alt, så det dukker ikke opp som erstatning for power clean.
  cleanpull:{n:'Clean pull',bar:1}
};
const ALTS = slot => Object.keys(LIFTS).filter(k => LIFTS[k].alt === slot);
const sw = (a, slot) => (a.swaps && a.swaps[slot]) || slot;   // hvilket løft ligger i plassen nå?

// GZCLP-trinn: [sett, reps]. Bommer du, går du ett trinn ned i reps.
const T1S = [[5,3],[6,2],[10,1]];
const T2S = [[3,10],[3,8],[3,6]];
// 5/3/1: [andel av treningsmaks, reps, maks-reps-sett?] for uke 1–4
const W531 = [
  [[.65,5],[.75,5],[.85,5,1]],
  [[.70,3],[.80,3],[.90,3,1]],
  [[.75,5],[.85,3],[.95,1,1]],
  [[.40,5],[.50,5],[.60,5]]
];

/* ---------- Strength & Power (12 uker) ----------
   RPE-tabell: andel av 1RM når du tar r reps og har (10 − RPE) reps i reserve.
   Indeks = reps + reps i reserve. Eksempel: 3 reps @ RPE 8 → 5 → 86,3 % av 1RM. */
const RTS = [1,.955,.922,.892,.863,.837,.811,.786,.762,.739,.707,.68];
function pctOf(reps, rpe){
  const r = Math.max(1, reps + (10 - rpe)), lo = Math.floor(r), hi = Math.ceil(r);
  const g = i => RTS[Math.min(i,12) - 1];
  return g(lo) + (g(hi) - g(lo)) * (r - lo);
}
const est1 = (w, reps, rpe) => w / pctOf(reps, rpe);   // estimert 1RM fra ett sett

// [sett, reps, andel av aktuell 1RM] for toppsett og backoff i hver fase
const SP = {
  phaseName: {p1:'Volum og grunnstyrke', d4:'Lett uke', p2:'Maksimal styrke', d8:'Lett uke', p3:'Toppstyrke', tap:'Taper', test:'Testuke'},
  // Sekundærøvelser: [løft, sett, reps, andel av løftets estimerte 1RM].
  // 1RM i sekundærløftet regnes fra hovedløftet med forholdstallet r i LIFTS (pausebenk ≈ 93 % av benk).
  // Gir benk og knebøy to eksponeringer i uka og gir power clean tunge trekk.
  extras: {
    bench: {},
    squat: {p1:[['pausebench',3,5,.76]], p2:[['closegrip',3,4,.81]], p3:[['pausebench',2,3,.81]], tap:[['pausebench',2,3,.70]]},
    clean: {p1:[['cleanpull',3,3,.90],['frontsquat',3,5,.76]], p2:[['cleanpull',3,3,1],['frontsquat',3,3,.84]],
            p3:[['cleanpull',2,2,1],['frontsquat',2,3,.82]], tap:[['frontsquat',2,2,.75]]}
  },
  base: {pausebench:'bench', closegrip:'bench', frontsquat:'squat', cleanpull:'clean'},
  // Uke 11: volumet halveres, intensiteten holdes. Ingen vektendring etter taperøktene.
  taper: {bench:{top:[1,1,.90], back:[2,3,.80]}, squat:{top:[1,1,.90], back:[2,2,.80]}, clean:{top:[3,1,.85]}},
  // Metcon-budsjett i minutter arbeid per 7 dager, per fase
  budget: {p1:50, d4:20, p2:40, d8:20, p3:25, tap:10, test:10},
  scheme: {
    bench: {p1:{top:[1,3,.82], back:[5,5,.73]}, p2:{top:[1,2,.88], back:[5,3,.80]}, p3:{top:[1,1,.91], back:[5,2,.82]}},
    squat: {p1:{top:[1,3,.82], back:[5,4,.73]}, p2:{top:[1,2,.88], back:[5,3,.80]}, p3:{top:[1,1,.91], back:[5,2,.82]}},
    clean: {p1:{top:[3,1,.80], back:[6,2,.70]}, p2:{top:[4,1,.85], back:[5,2,.72]}, p3:{top:[5,1,.88], back:[4,2,.75]}}
  },
  // Deload: omtrent halvparten av settene, 13 % lettere enn siste backoff-vekt i fasen før
  deload: {d4:{from:'p1', bench:[3,5], squat:[3,4], clean:[4,2]}, d8:{from:'p2', bench:[3,3], squat:[3,3], clean:[4,2]}}
};
/* ---------- Cube Method (10 uker) ----------
   Hver uke har hvert løft én rolle. Rollene roterer, så ingen to løft er tunge samme uke.
   Sett skrives som [andel av 1RM, reps, antall sett, maks reps i siste sett?] per bølge. */
const CUBE = {
  rot: [['heavy','expl','rep'], ['expl','rep','heavy'], ['rep','heavy','expl']],   // uke 1, 2, 3 i bølgen × dag
  tag: {heavy:'Tung', expl:'Eksplosiv', rep:'Reps', test:'Test'},
  rest: {heavy:180, expl:90, rep:150, test:240},
  sets: {
    heavy: [[[.8,2,5]], [[.85,2,3]], [[.9,1,1],[.925,1,1],[.95,1,1],[.8,3,1,1]]],
    expl:  [[[.6,3,8]], [[.65,2,6]], [[.7,2,5]]],
    rep:   [[[.7,8,3,1]], [[.8,6,3,1]], [[.85,3,3,1]]]
  },
  test: [[.9,1,1],[.975,1,1],[1.025,1,1]]
};
function cubeSets(list, max){
  const out = [];
  list.forEach(([pc,r,n,am]) => { for (let j = 0; j < n; j++) out.push({t:r, w:r25(max*pc), am: !!(am && j === n-1), d:null}); });
  return out;
}
function buildCube(p, a){
  const i = a.idx, wk = Math.floor(i/3) + 1, day = p.days[i % 3], slot = day.lift, L = sw(a, slot);
  const role = wk === 10 ? 'test' : CUBE.rot[(wk-1) % 3][i % 3], wave = Math.floor((wk-1)/3);
  const sets = cubeSets(role === 'test' ? CUBE.test : CUBE.sets[role][wave], a.e1rm[L]);
  const hint = role === 'expl' ? 'Flytt stanga så raskt du kan. Stopp settet hvis farten faller.'
             : role === 'test' ? 'Tre forsøk: åpning, andre og tredje. Juster vekten etter hvordan forrige løft gikk.' : '';
  return {programId:p.id, day:day.name, sub: wk === 10 ? 'Uke 10 av 10 · Test' : 'Uke ' + wk + ' av 10 · Bølge ' + (wave+1),
    ex:[{key:L, lift:L, slot, part:'cube', sp:1, rest:CUBE.rest[role], tag:CUBE.tag[role], hint, sets}], started:Date.now()};
}
function progressCube(p, a, s){
  const e = s.ex[0], name = liftName(e.lift), notes = [];
  if (e.tag === 'Test') {
    const ok = e.sets.filter(x => x.d >= 1);
    if (ok.length) {
      const best = Math.max(...ok.map(x => x.w)), old = a.e1rm[e.lift];
      a.e1rm[e.lift] = Math.max(best, old);
      notes.push({name, text: best > old ? 'Ny 1RM: ' + fmt(old) + ' → ' + fmt(best) + ' kg' : 'Beste løft ' + fmt(best) + ' kg, 1RM står på ' + fmt(old) + ' kg', kind: best > old ? 'up' : 'same'});
    }
    return notes;
  }
  const am = e.sets.find(x => x.am && x.d != null);
  if (am) notes.push({name, text: am.d + ' reps på ' + fmt(am.w) + ' kg i siste sett', kind: am.d >= am.t ? 'up' : 'same'});
  else if (e.sets.some(x => x.d != null)) notes.push({name, text:'Vektene følger prosentplanen', kind:'same'});
  return notes;
}

/* ---------- Juggernaut Method (16 uker, Chad Wesley Smith) ----------
   Fire bølger: 10-ere, 8-ere, 5-ere, 3-ere. Hver bølge: akkumulering, intensivering,
   realisering (test) og deload. Prosentene er av arbeidsmaks (90 % av 1RM).
   Sett skrives som [andel, reps, antall sett, maks reps?], samme format som Cube. */
const JUG = [
  {std:10, acc:[[.60,10,5]], int:[[.55,5,1],[.625,5,1],[.675,10,3]], real:[[.50,5,1],[.60,3,1],[.70,1,1],[.75,10,1,1]]},
  {std:8,  acc:[[.65,8,5]],  int:[[.60,3,1],[.675,3,1],[.725,8,3]],  real:[[.50,5,1],[.60,3,1],[.70,2,1],[.75,1,1],[.80,8,1,1]]},
  {std:5,  acc:[[.70,5,6]],  int:[[.65,2,1],[.725,2,1],[.775,5,4]],  real:[[.50,5,1],[.60,3,1],[.70,2,1],[.75,1,1],[.80,1,1],[.85,5,1,1]]},
  {std:3,  acc:[[.75,3,7]],  int:[[.70,1,1],[.775,1,1],[.825,3,5]],  real:[[.50,5,1],[.60,3,1],[.70,2,1],[.75,1,1],[.80,1,1],[.85,1,1],[.90,3,1,1]]}
];
const JUG_DELOAD = [[.40,5,1],[.50,5,1],[.60,5,1]];
const JUG_WAVE = ['10-ere', '8-ere', '5-ere', '3-ere'];
const JUG_PHASE = ['Akkumulering', 'Intensivering', 'Realisering', 'Deload'];
const jugInc = slot => (slot === 'squat' || slot === 'deadlift') ? 2.5 : 1.25;   // per ekstra rep

function buildJug(p, a){
  const i = a.idx, n = p.days.length, day = p.days[i % n], slot = day.lift, L = sw(a, slot);
  const week = Math.floor(i / n), wave = Math.min(3, Math.floor(week / 4)), phase = week % 4, W = JUG[wave];
  const list = phase === 0 ? W.acc : phase === 1 ? W.int : phase === 2 ? W.real : JUG_DELOAD;
  const hint = phase === 2 ? `Siste sett: så mange reps du klarer. Hver rep over ${W.std} øker arbeidsmaksen med ${fmt(jugInc(slot))} kg (maks 10 reps teller).`
             : phase === 0 && wave === 0 ? 'Lett start er meningen. Ikke øk vekten selv.' : '';
  return {programId:p.id, day:day.name, sub:`Bølge ${JUG_WAVE[wave]} · ${JUG_PHASE[phase]} · uke ${week + 1} av 16`,
    ex:[{key:L, lift:L, slot, tag:JUG_PHASE[phase], rest: phase === 2 ? 180 : phase === 3 ? 90 : 150, hint,
         sets: cubeSets(list, a.tm[L])}], started:Date.now()};
}
function progressJug(p, a, s){
  const e = s.ex[0], n = p.days.length, week = Math.floor(a.idx / n), wave = Math.min(3, Math.floor(week / 4));
  if (week % 4 !== 2) return [];
  const am = e.sets.find(x => x.am);
  if (!am || am.d == null) return [{name:liftName(e.lift), text:'Testsettet er ikke registrert. Arbeidsmaksen står stille.', kind:'same'}];
  const extra = Math.min(10, am.d - JUG[wave].std), old = a.tm[e.lift];
  if (extra <= 0) return [{name:liftName(e.lift), text:`${am.d} reps (mål ${JUG[wave].std}). Arbeidsmaksen står på ${fmt(old)} kg`, kind:'same'}];
  a.tm[e.lift] = old + extra * jugInc(e.slot);
  return [{name:liftName(e.lift), text:`${am.d} reps, ${extra} over målet: arbeidsmaks ${fmt(old)} → ${fmt(a.tm[e.lift])} kg`, kind:'up'}];
}

/* ---------- Bytte løft ----------
   Vekten lagres på LØFTET, ikke på plassen. Frontbøy får sin egen vekt, og knebøyvektene
   ligger urørt hvis du bytter tilbake. */
function refValue(p, a, L){
  if (p.prog === 'linear') return a.lifts[L] && a.lifts[L].w;
  if (p.prog === 'gzclp') return (a.lifts[L+'.T1'] || a.lifts[L+'.T2'] || {}).w;
  if (p.prog === '531' || p.prog === 'jugg') return a.tm[L];
  return a.e1rm && a.e1rm[L];
}
const refLabel = p => ({linear:'Arbeidsvekt', gzclp:'T1-vekt', '531':'Treningsmaks', jugg:'Arbeidsmaks'})[p.prog] || '1RM';
const ratio = L => LIFTS[L].r || 1;
const estFor = (p, a, from, to) => r25(refValue(p, a, from) / ratio(from) * ratio(to));
const slotsOf = p => [...new Set(p.days.flatMap(d => d.ex ? d.ex.map(e => e.lift) : [d.lift]))].filter(s => ALTS(s).length);

function doSwap(slot){
  const a = S.active, p = prog(a.programId), A = sw(a, slot);
  let B = ui.swapSel.lift;
  const W = parseFloat(String(($('#swW') || {}).value || '').replace(',', '.'));
  if (B === '__new') {
    const nm = String(($('#swName') || {}).value || '').replace(/[<>&"]/g, '').trim().slice(0, 40);
    if (!nm) { toast('Skriv inn et navn på øvelsen'); return; }
    if (!(W > 0)) { toast('Skriv inn en vekt for ' + nm.toLowerCase()); return; }
    const id = 'c_' + Date.now().toString(36);
    S.custom = S.custom || {};
    S.custom[id] = {n: nm, bar: ($('#swBar') || {}).checked ? 1 : 0, alt: slot};
    mergeCustom();
    B = ui.swapSel.lift = id;
  }
  if (refValue(p, a, B) == null) {
    if (!(W > 0)) { toast('Skriv inn en vekt for ' + liftName(B).toLowerCase()); return; }
    const k = W / refValue(p, a, A);
    Object.keys(a.lifts).forEach(key => {
      if (key !== A && !key.startsWith(A + '.')) return;
      const nk = B + key.slice(A.length), v = a.lifts[key];
      if (!a.lifts[nk]) a.lifts[nk] = Object.assign({}, v, {w: r25(v.w*k), fails:0, stage:0, last: v.last != null ? r25(v.last*k) : undefined});
    });
    if (p.prog === '531' || p.prog === 'jugg') a.tm[B] = r25(W);
    if (a.e1rm) { a.e1rm[B] = W; a.base[B] = W; }
  }
  a.swaps = a.swaps || {};
  if (B === slot) delete a.swaps[slot]; else a.swaps[slot] = B;
  const started = S.draft && S.draft.ex.some(e => e.sets.some(x => x.d != null));
  if (!started) S.draft = null;
  ui.swapSel = null; save(); render();
  toast(liftName(B) + (started ? ' gjelder fra neste økt' : ' er lagt inn'));
}

function swapRows(p, a){
  const slots = slotsOf(p);
  if (!slots.length) return '';
  return `<h3>Løft i programmet</h3><div class="box" style="gap:0">${slots.map(slot => {
    const cur = sw(a, slot), sel = ui.swapSel && ui.swapSel.slot === slot ? ui.swapSel.lift : cur;
    let h = `<div class="field"><label for="sw-${slot}">${liftName(slot)}</label>
      <select id="sw-${slot}" data-swap="${slot}">${[slot, ...ALTS(slot)].map(l => `<option value="${l}"${l === sel ? ' selected' : ''}>${liftName(l)}</option>`).join('')}
        <option value="__new"${sel === '__new' ? ' selected' : ''}>+ Egen øvelse …</option></select></div>`;
    if (sel === '__new') {
      h += `<div class="swapbox">
        <label for="swName" class="small">Navn på øvelsen</label>
        <input id="swName" class="txt" type="text" maxlength="40" placeholder="For eksempel hang snatch" autocomplete="off">
        <label class="chk small"><input id="swBar" type="checkbox" checked> Vanlig stang på 20 kg (viser skiver per side)</label>
        <label for="swW" class="small">${refLabel(p)} i øvelsen</label>
        <span class="inp"><input id="swW" type="text" inputmode="decimal" value="${fmt(refValue(p, a, cur))}">kg</span>
        <button class="btn sm" data-a="doswap:${slot}">Legg til</button>
        <span class="small muted">Øvelsen følger reglene for ${liftName(slot).toLowerCase()} i programmet.</span></div>`;
    } else if (sel !== cur) {
      h += refValue(p, a, sel) != null
        ? `<div class="swapbox"><span class="small muted">Vektene dine i ${liftName(sel).toLowerCase()} er lagret fra før.</span><button class="btn sm" data-a="doswap:${slot}">Bytt</button></div>`
        : `<div class="swapbox"><label for="swW" class="small">${refLabel(p)} i ${liftName(sel).toLowerCase()} (forslag ut fra ${liftName(cur).toLowerCase()})</label>
           <span class="inp"><input id="swW" type="text" inputmode="decimal" value="${fmt(estFor(p, a, cur, sel))}">kg</span><button class="btn sm" data-a="doswap:${slot}">Bytt</button></div>`;
    }
    return h;
  }).join('')}</div>
  <p class="muted small">Hvert løft har sin egen vekt. Bytter du tilbake, fortsetter du der du slapp.</p>`;
}

// Uke 4 og 8 er lette uker. Hopper du over en av dem, kjøres fasen før én uke til.
const spPhase = (wk, a) => {
  const skip = (a && a.skipDl) || {};
  if (wk <= 3) return 'p1';
  if (wk === 4) return skip.d4 ? 'p1' : 'd4';
  if (wk <= 7) return 'p2';
  if (wk === 8) return skip.d8 ? 'p2' : 'd8';
  if (wk <= 10) return 'p3';
  return wk === 11 ? 'tap' : 'test';
};
const spWeek = a => Math.floor(a.idx/3) + 1;

// 1RM i et sekundærløft, regnet fra hovedløftet i samme mønster
function extraMax(a, X){
  const M = sw(a, SP.base[X]);
  return a.e1rm[M] / ratio(M) * ratio(X);
}
function spExtraEx(a, slot, ph, opt){
  const list = (SP.extras[slot] || {})[opt && opt.from || ph] || [];
  return list.map(([X, n, r, pct]) => {
    const key = 'x.' + X + '.' + (opt && opt.from || ph);
    if (!a.lifts[key]) a.lifts[key] = {w: Math.max(20, r25(extraMax(a, X) * pct))};
    let w = a.lifts[key].w, sets = n, reps = r;
    if (opt && opt.light) { sets = Math.max(1, Math.round(n/2)); w = Math.max(20, r25(w * .9)); }
    if (ph === 'tap') w = Math.max(20, r25(extraMax(a, X) * pct));
    return {key, lift:X, slot:X, part: ph === 'tap' || (opt && opt.light) ? 'extra-fixed' : 'extra', sp:1, rest:150,
            rpe:null, tag:'Sekundær', hint: X === 'cleanpull' ? 'Trekk eksplosivt til full strekk. Ingen catch.' : '', sets: mk(sets, reps, w)};
  });
}

function buildSP(p, a){
  const i = a.idx, wk = spWeek(a), day = p.days[i % 3], slot = day.lift, L = sw(a, slot), pc = slot === 'clean';
  const ph = spPhase(wk, a), rest = pc ? 150 : 210, ex = [];
  const skipped = (wk === 4 || wk === 8) && ph[0] === 'p';
  if (ph[0] === 'p') {
    const sc = SP.scheme[slot][ph];
    ['top','back'].forEach(part => {
      const [n, r, pct] = sc[part], key = L + '.' + ph + '.' + part;
      if (!a.lifts[key]) a.lifts[key] = {w: r25(a.e1rm[L] * pct)};   // ny fase: start fra aktuell 1RM
      ex.push({key, lift:L, slot, part, sp:1, rest, rpe:null, q:null, cut:0,
               tag: part === 'back' ? 'Backoff' : (n > 1 ? 'Singler' : 'Toppsett'), sets: mk(n, r, a.lifts[key].w)});
    });
    ex.push(...spExtraEx(a, slot, ph));
  } else if (ph[0] === 'd') {
    const D = SP.deload[ph], src = a.lifts[L + '.' + D.from + '.back'];
    const base = src ? (src.last != null ? src.last : src.w) : r25(a.e1rm[L] * SP.scheme[slot][D.from].back[2]);
    ex.push({key:L+'.deload', lift:L, slot, part:'deload', sp:1, rest, tag:'Lett uke', sets: mk(D[slot][0], D[slot][1], Math.max(20, r25(base * .87)))});
    ex.push(...spExtraEx(a, slot, ph, {from: D.from, light: true}));
  } else if (ph === 'tap') {
    const T = SP.taper[slot];
    ex.push({key:L+'.taper', lift:L, slot, part:'taper', sp:1, rest, tag: pc ? 'Taper · singler' : 'Taper · toppsett', sets: mk(T.top[0], T.top[1], r25(a.e1rm[L] * T.top[2]))});
    if (T.back) ex.push({key:L+'.taper.b', lift:L, slot, part:'taper', sp:1, rest, tag:'Taper · backoff', sets: mk(T.back[0], T.back[1], r25(a.e1rm[L] * T.back[2]))});
    ex.push(...spExtraEx(a, slot, ph));
  } else {
    ex.push({key:L+'.test', lift:L, slot, part:'test', sp:1, rest, tag: pc ? 'Beste single' : 'Test 3RM',
             sets: mk(1, pc ? 1 : 3, r25(a.e1rm[L] * (pc ? .95 : .92)))});
  }
  return {programId:p.id, day: day.name, ph, wk,
          sub: 'Uke ' + wk + ' av 12 · ' + (skipped ? SP.phaseName[ph] + ' (ekstra uke)' : SP.phaseName[ph]), ex, started:Date.now()};
}

// Siste vurdering av toppsettet per hovedløft, og om estimert 1RM har holdt seg eller steget
function spReadiness(a){
  const p = prog('sp12');
  return p.days.map(d => {
    const L = sw(a, d.lift), hist = (a.e1log && a.e1log[L]) || [];
    const last = S.history.find(h => h.programId === 'sp12' && h.date >= a.startedAt &&
      h.ex.some(e => e.lift === L && /Toppsett|Singler/.test(e.tag || '')));
    const e = last && last.ex.find(e => e.lift === L && /Toppsett|Singler/.test(e.tag || ''));
    const eff = !e ? null : d.lift === 'clean' ? (e.q === 'god' ? 'raske og rene' : e.q === 'treg' ? 'tregere' : e.q === 'teknisk' ? 'teknikk sviktet' : null)
                                               : (e.rpe != null ? 'RPE ' + fmt(e.rpe) : null);
    const effOk = !e ? null : d.lift === 'clean' ? e.q === 'god' : (e.rpe != null && e.rpe <= 9);
    const trendOk = hist.length < 2 ? null : hist[hist.length-1] >= hist[Math.max(0, hist.length-3)] * .99;
    return {name: liftName(L), eff, effOk, trendOk};
  });
}

function progressSP(p, a, s){
  const notes = [];
  s.ex.forEach(e => {
    if (!e.sets.some(x => x.d != null)) return;
    const name = liftName(e.lift) + ' · ' + e.tag.toLowerCase();
    const used = e.sets[0].w, allHit = e.sets.every(x => x.d != null && x.d >= x.t);
    if (e.part === 'deload') { notes.push({name, text:'Lett uke, ingen endring', kind:'same'}); return; }
    if (e.part === 'taper' || e.part === 'extra-fixed') { notes.push({name, text: e.part === 'taper' ? 'Taper, ingen endring' : 'Lett variant, ingen endring', kind:'same'}); return; }
    if (e.part === 'extra') {
      // Sekundærøvelser skal ligge rundt RPE 6–7,5: litt lettere enn hovedløftet
      const st = a.lifts[e.key], r = e.rpe; let next = used, kind = 'same', why;
      if (!allHit) { next = used - 2.5; kind = 'down'; why = 'Ikke alle reps'; }
      else if (r == null) why = 'Ingen RPE registrert';
      else if (r <= 6) { next = used + 2.5; kind = 'up'; why = 'RPE ' + fmt(r); }
      else if (r <= 7.5) why = 'RPE ' + fmt(r) + ', på mål';
      else { next = used - 2.5; kind = 'down'; why = 'RPE ' + fmt(r) + ', for tungt for en sekundærøvelse'; }
      st.last = used; st.w = next = Math.max(20, next);
      notes.push({name, text: why + ': ' + (next === used ? 'samme vekt, ' + fmt(used) + ' kg' : fmt(used) + ' → ' + fmt(next) + ' kg'), kind});
      return;
    }

    if (e.part === 'test') {
      const x = e.sets[0];
      if (x.d > 0) {
        const est = e.slot === 'clean' ? x.w : est1(x.w, x.d, 10);
        a.e1rm[e.lift] = Math.round(est*10)/10;
        notes.push({name, text: e.slot === 'clean' ? 'Beste rene single: ' + fmt(x.w) + ' kg'
          : x.d + ' × ' + fmt(x.w) + ' kg. Estimert 1RM ' + fmt(Math.round(est*2)/2) + ' kg', kind:'up'});
      }
      return;
    }
    const st = a.lifts[e.key]; st.last = used;
    let next = used, kind = 'same', why;
    if (e.slot === 'clean') {
      if (!allHit || e.q === 'teknisk') { next = used - 2.5; kind = 'down'; why = allHit ? 'Teknikken sviktet' : 'Bom på reps'; }
      else if (e.q === 'god') {
        next = used + 2.5; kind = 'up'; why = 'Raske og rene løft';
        if (e.part === 'top' && used / .92 > a.e1rm[e.lift]) a.e1rm[e.lift] = r25(used / .92);
      }
      else if (e.q === 'treg') why = 'Farten falt';
      else why = 'Ingen vurdering registrert';
    } else {
      const r = e.rpe;
      if (!allHit) { next = used - 2.5; kind = 'down'; why = 'Ikke alle reps'; }
      else if (r == null) why = 'Ingen RPE registrert';
      else if (r <= 7) { next = used + (e.slot === 'squat' && r <= 6 ? 5 : 2.5); kind = 'up'; why = 'RPE ' + fmt(r); }
      else if (r <= 8.5) why = 'RPE ' + fmt(r) + ', på mål';
      else if (r <= 9) why = 'RPE 9, gjenta';
      else { next = used - 2.5; kind = 'down'; why = 'RPE ' + fmt(r); }
      if (e.part === 'top' && allHit && r != null) a.e1rm[e.lift] = Math.round(est1(used, e.sets[0].d, r)*10)/10;
    }
    st.w = next = Math.max(20, next);
    notes.push({name, text: why + ': ' + (next === used ? 'samme vekt, ' + fmt(used) + ' kg' : fmt(used) + ' → ' + fmt(next) + ' kg'), kind});
    // Logg estimert 1RM etter hvert toppsett, så appen kan se trenden før en lett uke
    if (e.part === 'top') {
      a.e1log = a.e1log || {};
      a.e1log[e.lift] = (a.e1log[e.lift] || []).concat(a.e1rm[e.lift]).slice(-8);
    }
  });
  return notes;
}

// Oppvarming (teller ikke som arbeidssett): stiger mot dagens første arbeidsvekt
function warmups(lift, W){
  const steps = lift === 'clean' ? [[0,5],[.4,3],[.55,2],[.7,1],[.8,1]] : [[0,10],[.45,6],[.65,4],[.8,2]];
  const out = [];
  steps.forEach(([f,r]) => {
    const w = Math.max(20, f ? r25(W*f) : 20);
    if (w >= W || (out.length && out[out.length-1][0] >= w)) return;
    out.push([w, r]);
  });
  return out;
}

function spExtras(e, ei){
  let h = `<div class="amrap"><span>Juster vekt etter dagsform</span>
    <button class="step" data-a="w:${ei}:-1" aria-label="2,5 kg lettere">−</button>
    <button class="step" data-a="w:${ei}:1" aria-label="2,5 kg tyngre">+</button></div>`;
  const all = e.sets.every(x => x.d != null);
  if (e.part === 'extra' && all) {
    h += `<div class="rpe"><span>RPE for ${liftName(e.lift).toLowerCase()} (mål 6–7,5)</span><div class="seg num">${
      [6,7,7.5,8,8.5,9,9.5,10].map(v => `<button data-a="rpe:${ei}:${v}" aria-pressed="${e.rpe === v}">${fmt(v)}</button>`).join('')}</div></div>`;
  }
  if ((e.part === 'top' || e.part === 'back') && all) {
    if (e.slot === 'clean') h +=`<div class="rpe"><span>Hvordan gikk løftene?</span><div class="seg">${
      [['god','Raske og rene'],['treg','Tregere'],['teknisk','Teknikk sviktet']].map(([v,l]) => `<button data-a="q:${ei}:${v}" aria-pressed="${e.q === v}">${l}</button>`).join('')}</div></div>`;
    else h += `<div class="rpe"><span>RPE for ${e.part === 'top' ? 'toppsettet' : 'backoff-settene'}</span><div class="seg num">${
      [6,7,7.5,8,8.5,9,9.5,10].map(v => `<button data-a="rpe:${ei}:${v}" aria-pressed="${e.rpe === v}">${fmt(v)}</button>`).join('')}</div></div>`;
  }
  if (e.part === 'back' && !all && (e.cut||0) < 2 && e.sets.length > 1 && e.sets[e.sets.length-1].d == null)
    h += `<button class="link" data-a="cut:${ei}">Kutt ett backoff-sett etter tung metcon</button>`;
  return h;
}

/* ---------- Hjelpere ---------- */
const $ = s => document.querySelector(s);
const r25 = x => Math.round(x/2.5)*2.5;
const fmt = n => (Math.round(n*100)/100).toLocaleString('nb-NO');
const prog = id => PROGRAMS.find(p => p.id === id);
const inc = (p, lift) => (p.inc && p.inc[lift]) || 2.5;
const liftName = l => LIFTS[l] ? LIFTS[l].n : l;
const keyLabel = k => { const [l,t] = k.split('.'); return liftName(l) + (t ? ' · ' + t : ''); };
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const dateFmt = t => new Date(t).toLocaleDateString('nb-NO',{weekday:'short',day:'numeric',month:'short'});

/* ---------- Lagring ---------- */
function fresh(){ return {v:1, active:null, draft:null, history:[], settings:{rest:90}, maxes:{}}; }
function load(){
  const d = fresh();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); return Object.assign(d, o, {settings:Object.assign(d.settings, o.settings||{})}); }
  } catch(e) {}
  return d;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); ui.storageOK = true; }
  catch(e) { ui.storageOK = false; }
}

S.maxes = S.maxes || {};

function mergeCustom(){
  Object.keys(LIFTS).filter(k => k.startsWith('c_')).forEach(k => delete LIFTS[k]);
  Object.assign(LIFTS, S.custom || {});
}

/* ---------- Motor: lag dagens økt fra mal + instans ---------- */
function mk(n, reps, w, lastAm){
  return Array.from({length:n}, (_,j) => ({t:reps, w, am: !!(lastAm && j === n-1), d:null}));
}
function buildSession(p, a){
  if (p.prog === 'sp12') return buildSP(p, a);
  if (p.prog === 'cube') return buildCube(p, a);
  if (p.prog === 'jugg') return buildJug(p, a);
  const i = a.idx, n = p.days.length, day = p.days[i % n];
  let ex = [], sub = 'Økt ' + (i+1);
  if (p.prog === 'linear') {
    ex = day.ex.map(e => { const L = sw(a, e.lift);
      return {key:L, lift:L, slot:e.lift, tag:'', sets: mk(e.sets, e.reps, a.lifts[L].w)}; });
  } else if (p.prog === 'gzclp') {
    ex = day.ex.map(e => {
      const L = sw(a, e.lift), key = L + '.' + e.tier, st = a.lifts[key]; let sets;
      if (e.tier === 'T1') { const [s,r] = T1S[st.stage]; sets = mk(s, r, st.w, true); }
      else if (e.tier === 'T2') { const [s,r] = T2S[st.stage]; sets = mk(s, r, st.w); }
      else sets = mk(3, 15, st.w, true);
      return {key, lift:L, slot:e.lift, tag:e.tier, sets};
    });
  } else {
    const L = sw(a, day.lift), wk = Math.floor(i/n) % 4, cyc = Math.floor(i/(n*4)) + 1, tm = a.tm[L];
    ex = [{key:L, lift:L, slot:day.lift, tag: wk === 3 ? 'Lett uke' : 'Hovedløft',
           sets: W531[wk].map(([pc,r,am]) => ({t:r, w:r25(tm*pc), am:!!am, d:null}))}];
    if (wk < 3) {
      if (p.fsl) { const pc = W531[wk][0][0]; ex.push({key:L+'.fsl', lift:L, slot:day.lift, tag:`FSL · ${Math.round(pc*100)} %`, sets: mk(5, 5, r25(tm*pc))}); }
      else ex.push({key:L+'.bbb', lift:L, slot:day.lift, tag:'BBB · 50 %', sets: mk(5, 10, r25(tm*.5))});
    }
    sub = 'Syklus ' + cyc + ' · Uke ' + (wk+1);
  }
  return {programId:p.id, day:day.name, sub, ex, started:Date.now()};
}

/* ---------- Motor: oppdater instansen etter en økt ---------- */
function progress(p, a, s){
  if (p.prog === 'sp12') return progressSP(p, a, s);
  if (p.prog === 'cube') return progressCube(p, a, s);
  if (p.prog === 'jugg') return progressJug(p, a, s);
  const notes = [];
  const hit = x => x.d != null && x.d >= x.t;
  const touched = e => e.sets.some(x => x.d != null);
  const note = (e, text, kind) => notes.push({name: keyLabel(e.key), text, kind});

  if (p.prog === 'linear') {
    s.ex.forEach(e => {
      if (!touched(e)) return;
      const st = a.lifts[e.key], old = st.w;
      if (e.sets.every(hit)) { st.w = old + inc(p, e.slot); st.fails = 0; note(e, fmt(old)+' → '+fmt(st.w)+' kg', 'up'); }
      else {
        st.fails = (st.fails||0) + 1;
        if (st.fails >= 3) { st.w = r25(old*.9); st.fails = 0; note(e, 'Ned 10 % til '+fmt(st.w)+' kg', 'down'); }
        else note(e, 'Samme vekt neste gang (bom '+st.fails+' av 3)', 'same');
      }
    });
  } else if (p.prog === 'gzclp') {
    s.ex.forEach(e => {
      if (!touched(e)) return;
      const st = a.lifts[e.key], old = st.w;
      if (e.tag === 'T3') {
        const last = e.sets[e.sets.length-1];
        if (last.d != null && last.d >= 25) { st.w = old + 2.5; note(e, fmt(old)+' → '+fmt(st.w)+' kg', 'up'); }
        else note(e, 'Samme vekt, mål: 25 reps i siste sett', 'same');
        return;
      }
      const S_ = e.tag === 'T1' ? T1S : T2S;
      if (e.sets.every(hit)) { st.w = old + inc(p, e.slot); note(e, fmt(old)+' → '+fmt(st.w)+' kg', 'up'); }
      else if (st.stage < 2) { st.stage++; const [ss,rr] = S_[st.stage]; note(e, 'Neste trinn: '+ss+'×'+rr+' på '+fmt(old)+' kg', 'stage'); }
      else { st.stage = 0; st.w = r25(old*.85); const [ss,rr] = S_[0]; note(e, 'Ny runde: '+ss+'×'+rr+' på '+fmt(st.w)+' kg', 'down'); }
    });
  } else {
    const per = p.days.length * 4;
    if ((a.idx + 1) % per === 0) {
      p.days.forEach(d => { const l = sw(a, d.lift), old = a.tm[l]; a.tm[l] = old + inc(p, d.lift);
        notes.push({name: liftName(l), text:'Treningsmaks '+fmt(old)+' → '+fmt(a.tm[l])+' kg', kind:'up'}); });
    } else {
      const amr = s.ex[0].sets.find(x => x.am);
      if (amr && amr.d != null) notes.push({name: liftName(s.ex[0].lift), text: amr.d+' reps på '+fmt(amr.w)+' kg i siste sett', kind: amr.d >= amr.t ? 'up' : 'same'});
    }
  }
  return notes;
}

function finish(){
  const p = prog(S.active.programId), s = S.draft;
  const notes = progress(p, S.active, s);
  const vol = s.ex.reduce((sum,e) => sum + e.sets.reduce((v,x) => v + (x.d||0)*x.w, 0), 0);
  S.history.unshift({date:Date.now(), programId:p.id, day:s.day, sub:s.sub, note:(s.note||'').trim(), metcon:!!(s.metcon || s.wod), mc: (s.metcon || s.wod) ? mcSaved(s.mc) : undefined,
    wod: s.wod ? {id:s.wod.id, navn:s.wod.navn, tekst:s.wod.tekst, resultat:(s.wod.resultat||'').trim()} : undefined,
    ex: s.ex.map(e => ({lift:e.lift, tag:e.tag, rpe:e.rpe, q:e.q, sets:e.sets.map(x => ({t:x.t, w:x.w, d:x.d}))}))});
  S.active.idx++;
  S.draft = null;
  ui.summary = {day:s.day, notes, vol};
  ui.rest = null; updateRest();
  save(); render(); toTop();
}

function activate(id){
  const p = prog(id), a = {programId:id, startedAt:Date.now(), idx:0, lifts:{}, tm:{}};
  if (p.prog === 'sp12' || p.prog === 'cube') { a.e1rm = {}; a.base = {}; }
  Object.keys(p.inputs).forEach((k,i) => {
    const el = $('#in-'+i); let v = parseFloat(String(el && el.value || '').replace(',', '.'));
    if (!isFinite(v) || v < 0) v = p.inputs[k];
    if (p.prog === '531' || p.prog === 'jugg') a.tm[k] = r25(v*.9);
    else if (a.e1rm) { a.e1rm[k] = v; a.base[k] = v; }
    else a.lifts[k] = {w:v, fails:0, stage:0};
  });
  // Husk maksløftene, så neste program fylles ut automatisk
  const num = el => { const v = parseFloat(String(el && el.value || '').replace(',', '.')); return v > 0 ? v : null; };
  if (p.orm) Object.keys(p.orm).forEach(l => { const v = num($('#orm-' + l)); if (v) S.maxes[l] = v; });
  else if (p.inputLabel === '1RM') Object.keys(p.inputs).forEach((k, i) => { const v = num($('#in-' + i)); if (v) S.maxes[k] = v; });
  S.active = a; S.draft = null;
  ui.detail = null; ui.summary = null; ui.tab = 'today';
  save(); render(); toTop(); toast(p.name+' er aktivert');
}

/* ---------- Skiver per side (20 kg stang) ---------- */
const PL = [[25,'p25'],[20,'p20'],[15,'p15'],[10,'p10'],[5,'p5'],[2.5,'p2'],[1.25,'p1']];
function plateHTML(w){
  let side = (w - 20) / 2;
  if (side <= 0) return '<span class="pl-txt">Bare stanga (20 kg)</span>';
  const out = [];
  for (const [kg,c] of PL) while (side >= kg - 1e-6) { out.push([kg,c]); side -= kg; }
  const txt = out.map(x => fmt(x[0])).join(' + ');
  return '<span class="plates" aria-hidden="true">' + out.map(([kg,c]) => '<i class="pl '+c+'"></i>').join('') +
         '</span><span class="pl-txt">'+txt+' per side</span>';
}

let BANK = null, bankErr = false;
function loadBank(){
  if (BANK || ui.bankLoading) return;

  fetch('okter.json').then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(d => { BANK = d.okter; ui.bankLoading = false;

/* Tilfeldig: solo-WOD, temaøkt eller blant filtrene. Hopper over økter gjort de siste 60 dagene. */
const THEMES = ['HYROX / X-RACE', 'Max Metcon', 'Basic', 'TriErg'];
const themeLabel = t => t === 'HYROX / X-RACE' ? 'HYROX' : t;
function poolFor(rp){
  if (rp.kind === 'solo') return BANK.filter(w => w.t === 'WOD' && !w.lag);
  if (rp.kind === 'theme') return BANK.filter(w => rp.theme ? w.t === rp.theme : THEMES.includes(w.t));
  return bankFilter();
}
function poolLabel(rp){
  if (rp.kind === 'solo') return 'Tilfeldig solo-metcon';
  if (rp.kind === 'theme') return 'Tilfeldig temaøkt' + (rp.theme ? ' · ' + themeLabel(rp.theme) : '');
  return 'Tilfeldig blant filtrene';
}
function pickRandom(rp){
  const pool = poolFor(rp);
  if (!pool.length) return null;
  const recent = new Set(S.history.filter(h => h.wod && Date.now() - h.date < 60 * 864e5).map(h => h.wod.id));
  const notSame = pool.filter(w => w.i !== ui.wod);
  const fresh = notSame.filter(w => !recent.has(w.i));
  const src = fresh.length ? fresh : notSame.length ? notSame : pool;
  return src[Math.floor(Math.random() * src.length)];
}
function showRandom(rp){
  const w = pickRandom(rp);
  if (!w) { toast('Ingen økter passer'); return; }
  ui.wod = w.i; ui.wodRand = true; ui.randPool = rp;
  render(); toTop();

function doneMap(){

  S.history.forEach(h => { if (h.wod && h.wod.id) (m[h.wod.id] = m[h.wod.id] || []).push(h); });

}
function bankFilter(){
  const f = ui.bf, q = (f.q || '').trim().toLowerCase(), fav = new Set(S.fav || []), done = doneMap();

    (!f.t || w.t === f.t) && (!f.f || w.f === f.f) && (!f.l || (w.l || 'Ukjent lengde') === f.l) &&

/* ---------- Metcon-belastning ----------
   Bygger på metcon-registreringen som finnes fra før: øktbanken, «Metcon i dag» og fri økt.
   Til hver metcon kan du legge inn type, minutter arbeid og RPE (1–10). Belastning = minutter × RPE (session RPE).
   Typen styrer rådene i Strength & Power: beintunge metcons og olympiske løft konkurrerer med knebøy
   og clean, og pressende gymnastikk konkurrerer med benk. */
const MC = {
  M:{n:'Kondisjon', d:'Sykkel, ro, ski, løp'},
  G:{n:'Gymnastikk', d:'Pull-ups, push-ups, HSPU, burpees'},
  L:{n:'Beintung', d:'Thrusters, wall balls, lunges, bokshopp'},
  O:{n:'Olympisk', d:'Cleans eller snatches for reps'}
};
const DAY = 864e5;
// Forslag ut fra teksten i økta. Rekkefølge: olympisk, beintung, gymnastikk, ellers kondisjon.
function mcGuess(text){
  const t = String(text || '').toLowerCase();
  if (/clean|snatch|c ?& ?j/.test(t)) return 'O';
  if (/thruster|wall ?ball|squat|lunge|box ?jump|step[- ]?up|deadlift|markløft|knebøy|utfall|bokshopp|pistol/.test(t)) return 'L';
  if (/push[- ]?up|hspu|handstand|pull[- ]?up|chin[- ]?up|toes[- ]?to[- ]?bar|t2b|burpee|\bdips?\b|muscle[- ]?up|ring row/.test(t)) return 'G';
  return 'M';
}
const mcOf = ctx => ctx === 'session' ? (S.draft.mc = S.draft.mc || {}) : (ui.freeMcData = ui.freeMcData || {});
const mcSaved = m => m && m.min > 0 ? {type: m.type || 'M', min: Math.round(+m.min), rpe: m.rpe || null} : undefined;
function mcWindow(from, to){
  const inWin = h => h.date > from && h.date <= to;
  const list = S.history.filter(h => h.mc && inWin(h));
  return {min: list.reduce((a,h) => a + h.mc.min, 0), load: list.reduce((a,h) => a + h.mc.min * (h.mc.rpe || 0), 0), n: list.length,
          unknown: S.history.filter(h => h.metcon && !h.mc && inWin(h)).length};
}
// Hvilke metcon-typer bør ikke ligge dagen før dette løftet?
const mcAvoid = slot => slot === 'squat' ? ['L'] : slot === 'clean' ? ['L','O'] : slot === 'bench' ? ['G'] : [];
const mcAdvice = {
  squat:'Neste styrkeøkt er knebøy. Unngå beintunge metcons dagen før.',
  clean:'Neste styrkeøkt er power clean. Unngå beintunge metcons og olympiske løft dagen før, og ta aldri metcon før clean samme dag.',
  bench:'Neste styrkeøkt er benk. Unngå mye push-ups og HSPU dagen før.'
};
const mcRecentConflict = slot => S.history.find(h => h.mc && Date.now() - h.date < 30*3600e3 && mcAvoid(slot).includes(h.mc.type));

function mcFields(ctx, mc){
  mc = mc || {};
  return `<div class="mc-form">
    <span class="lbl">Type metcon</span>
    <div class="seg mc-type">${Object.entries(MC).map(([k,v]) => `<button data-a="mct:${ctx}:${k}" aria-pressed="${mc.type === k}" aria-label="${v.n}: ${v.d}"><b>${v.n}</b><small>${v.d}</small></button>`).join('')}</div>
    <div class="field"><label for="mcMin-${ctx}">Minutter arbeid</label>
      <span class="inp"><input id="mcMin-${ctx}" data-mcmin="${ctx}" type="text" inputmode="numeric" value="${esc(mc.min || '')}" placeholder="12">min</span></div>
    <span class="lbl">Hvor hard var den? (RPE 1–10)</span>
    <div class="seg num">${[3,4,5,6,7,8,9,10].map(v => `<button data-a="mcr:${ctx}:${v}" aria-pressed="${mc.rpe === v}">${v}</button>`).join('')}</div>
    <p class="small muted">Brukes til ukebudsjettet for metcons. Uten minutter teller metconen ikke med.</p>
  </div>`;
}

function vMetconBudget(p, s){
  const now = Date.now(), cur = mcWindow(now - 7*DAY, now), prev = mcWindow(now - 14*DAY, now - 7*DAY);
  const ph = p.prog === 'sp12' && s ? s.ph : null, bud = ph ? SP.budget[ph] : null;
  if (!bud && !cur.n) return '';
  const slot = s && s.ex[0] && s.ex[0].slot;
  const grow = prev.load > 0 && cur.load > 0 ? Math.round((cur.load / prev.load - 1) * 100) : null;
  let h = `<section class="box">
    <span class="lbl">Metcons siste 7 dager</span>
    <div class="mc-sum"><div><b>${fmt(cur.min)}</b><span>min${bud ? ' av ' + bud + ' i budsjett' : ''}</span></div>
      <div><b>${fmt(cur.load)}</b><span>belastning${grow != null ? ' · ' + (grow > 0 ? '+' : '') + grow + ' % fra uka før' : ''}</span></div></div>`;
  if (bud) h += `<div class="meter" role="img" aria-label="${fmt(cur.min)} av ${bud} minutter"><i style="width:${Math.min(100, cur.min / bud * 100)}%" class="${cur.min > bud ? 'over' : ''}"></i></div>`;
  if (bud && cur.min > bud) h += `<p class="small warn-t">Over budsjettet for ${SP.phaseName[ph].toLowerCase()}. Kutt metcons før du kutter styrken.</p>`;
  else if (grow != null && grow > 15) h += `<p class="small warn-t">Belastningen er ${grow} % høyere enn uka før. Hold den flat en stund når styrken er prioritert.</p>`;
  if (cur.unknown) h += `<p class="small muted">${cur.unknown} ${cur.unknown === 1 ? 'metcon' : 'metcons'} uten minutter teller ikke med.</p>`;
  if (p.prog === 'sp12' && mcAdvice[slot]) h += `<p class="small muted">${mcAdvice[slot]}</p>`;
  return h + `</section>`;
}

      ${a.e1rm ? `<div class="box trend">${Object.keys(a.e1rm).map(l => `<div class="tr"><b>${liftName(l)}</b><span>${fmt(a.base[l])} → ${fmt(Math.round(a.e1rm[l]*2)/2)} kg</span></div>`).join('')}</div>
      <p class="muted small">Startverdi mot estimert 1RM nå.</p>` : ''}
      <button class="btn" data-a="tab:programs">Velg neste program</button>`;
  }
  const anyTouched = s.ex.some(e => e.sets.some(x => x.d != null));
  h += `<header class="head">
      <p class="eyebrow">${p.name} · ${s.sub}</p>
      <h1>${s.day}</h1>
      ${S.active.e1rm ? `<p class="muted small">${p.prog === 'sp12' ? 'Estimert 1RM' : '1RM'} ${liftName(s.ex[0].lift).toLowerCase()}: ${fmt(Math.round(S.active.e1rm[s.ex[0].lift]*2)/2)} kg</p>` : ''}
      <p class="muted small">Trykk på et sett når det er gjort. Trykk igjen for å trekke fra én rep.</p>
    </header>`;
  if (p.prog === 'sp12') {
    const c = mcRecentConflict(s.ex[0].slot);
    if (c && !anyTouched) h += `<div class="warn">Du logget en ${MC[c.mc.type].n.toLowerCase()} metcon for ${Math.max(1, Math.round((Date.now() - c.date)/3600e3))} timer siden. Forvent høyere RPE i dag, og kutt gjerne ett backoff-sett.</div>`;
    if ((s.ph === 'd4' || s.ph === 'd8') && !anyTouched && ui.keepDl !== s.ph) h += vDeloadChoice(s.ph);
  }
  s.ex.forEach((e,ei) => {
    const top = Math.max(...e.sets.map(x => x.w));
    const varies = new Set(e.sets.map(x => x.w)).size > 1;
    const amIdx = e.sets.findIndex(x => x.am && x.d != null);
    h += `<section class="ex">
      <div class="ex-head"><div>${e.tag ? `<span class="tag">${e.tag}</span>` : ''}<h2>${liftName(e.lift)}</h2></div>
        <div class="kg">${fmt(top)}<small>KG</small></div></div>
      ${LIFTS[e.lift].bar ? `<div class="platesrow">${plateHTML(top)}</div>` : ''}
      ${e.sp && ei === 0 ? (wu => wu.length ? `<p class="wu"><b>Oppvarming</b>${wu.map(([w,r]) => fmt(w)+'×'+r).join(' · ')}</p>` : '')(warmups(e.slot, e.sets[0].w)) : ''}
      ${e.hint ? `<p class="wu">${e.hint}</p>` : ''}
      <div class="chips">${e.sets.map((x,si) => {
        const st = x.d == null ? '' : (x.d >= x.t ? 'ok' : 'miss');
        const lbl = 'Sett '+(si+1)+': '+(x.d == null ? 'ikke gjort, mål '+x.t+' reps' : x.d+' reps')+(x.am ? ', så mange du klarer' : '');
        return `<div class="cw"><button class="chip ${st} ${x.am?'am':''}" data-a="set:${ei}:${si}" aria-label="${lbl}">${x.d == null ? x.t : x.d}${x.am ? '<sup>+</sup>' : ''}</button>${varies ? `<small>${fmt(x.w)}</small>` : ''}</div>`;
      }).join('')}</div>
      ${amIdx > -1 ? `<div class="amrap"><span>Siste sett, så mange du klarer</span>
        <button class="step" data-a="am:${ei}:${amIdx}:-1" aria-label="Én rep mindre">−</button>
        <b>${e.sets[amIdx].d}</b>
        <button class="step" data-a="am:${ei}:${amIdx}:1" aria-label="Én rep mer">+</button></div>` : ''}
      ${e.sp ? spExtras(e, ei) : ''}
    </section>`;
  });
  h += vMetconBudget(p, s);
  h += s.wod ? wodBox(s.wod, 'session') : quickPick('session');
  h += `<section class="box notebox">
      <label for="note" class="lbl">Notat</label>
      <textarea id="note" placeholder="For eksempel metcon etter økta, dagsform eller en teknikkdetalj">${esc(s.note)}</textarea>
      <button class="tog" data-a="metcon" aria-pressed="${!!s.metcon}">Metcon i dag</button>
      ${s.metcon || s.wod ? mcFields('session', s.mc) : ''}
    </section>`;
  h += `<button class="btn" data-a="finish" ${anyTouched ? '' : 'disabled'}>Fullfør økt</button>`;
  return h;
}

// Lett uke: vis tallene appen har, og la utøveren velge
function vDeloadChoice(ph){
  const rows = spReadiness(S.active);
  const mark = v => v == null ? '<span class="muted">–</span>' : v ? '<span class="ok-t">✓</span>' : '<span class="warn-t">✗</span>';
  const allOk = rows.every(r => r.effOk && r.trendOk);
  return `<section class="box dl">
    <h3 style="margin:0">Lett uke, eller én uke til?</h3>
    <p class="small">Forskningen tyder på at en fast lett uke ikke alltid trengs. Hopp bare over den hvis alle punktene stemmer.</p>
    <div class="trend">${rows.map(r => `<div class="tr"><b>${r.name}</b><span>${r.eff || 'ingen vurdering'}</span>${mark(r.effOk)}<span class="muted">1RM-trend</span>${mark(r.trendOk)}</div>`).join('')}</div>
    <ul class="small crit">
      <li>Estimert 1RM har stått stille eller steget de siste to ukene.</li>
      <li>Toppsettene har ligget på RPE 9 eller lavere, og clean har vært rask og ren.</li>
      <li>Du sover godt, føler deg uthvilt og har ingen smerter.</li>
    </ul>
    <p class="small ${allOk ? 'ok-t' : 'muted'}">${allOk ? 'Tallene i appen ser bra ut. Du avgjør punktet om søvn og smerter.' : 'Tallene peker mot å ta den lette uka.'}</p>
    <div class="row"><button class="btn ghost sm" data-a="keepdl:${ph}">Ta lett uke</button><button class="btn ghost sm" data-a="skipdl:${ph}">Hopp over</button></div>
  </section>`;
}

function dayLines(p, d){
  if (p.prog === 'cube') {
    const di = p.days.indexOf(d);
    return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
      ...['1 · 4 · 7','2 · 5 · 8','3 · 6 · 9'].map((u,k) => `<div>Uke ${u}<span>${CUBE.tag[CUBE.rot[k][di]]}</span></div>`),
      `<div>Uke 10<span>Test</span></div>`];
  }
  if (p.prog === 'sp12') {
    const sc = SP.scheme[d.lift], f = x => x[0] + '×' + x[1];
    const xs = [...new Set(Object.values(SP.extras[d.lift] || {}).flat().map(x => liftName(x[0]).toLowerCase()))];
    return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
      ...['p1','p2','p3'].map((ph,k) => `<div>Uke ${['1–3','5–7','9–10'][k]}<span>${f(sc[ph].top)} + ${f(sc[ph].back)}</span></div>`),
      `<div>Uke 4 og 8<span>Lett uke</span></div>`, `<div>Uke 11<span>Taper</span></div>`,
      `<div>Uke 12<span>${d.lift === 'clean' ? 'Beste single' : 'Test 3RM'}</span></div>`,
      ...(xs.length ? [`<div class="xs">+ ${xs.join(' og ')}</div>`] : [])];
  }
  if (p.prog === 'linear') return d.ex.map(e => `<div>${liftName(e.lift)}<span>${e.sets}×${e.reps}</span></div>`);
  if (p.prog === 'gzclp') return d.ex.map(e => `<div><span style="color:var(--chalk)"><b>${e.tier}</b>${liftName(e.lift)}</span><span>${e.tier==='T1'?'5×3+':e.tier==='T2'?'3×10':'3×15+'}</span></div>`);
  if (p.prog === 'jugg') return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
    ...JUG_WAVE.map((w, k) => `<div>Uke ${k*4+1}–${k*4+4}<span>${w}</span></div>`)];
  return [`<div>${liftName(d.lift)}<span>3 sett</span></div>`, `<div>${liftName(d.lift)}<span>${p.fsl ? 'FSL 5×5' : '5×10'}</span></div>`];
}

const lvl = l => `<span class="lvl lvl-${l}" title="Evidensnivå ${l}">${l}</span>`;
const refLink = k => { const r = REFS[k]; if (!r) return '';
  const url = r.doi ? 'https://doi.org/' + r.doi : 'https://pubmed.ncbi.nlm.nih.gov/' + r.pmid + '/';
  return `<a href="${url}" target="_blank" rel="noopener">${r.a}</a>`; };
const claim = ([text, l, refs]) => `<li>${lvl(l)}<span>${text}${refs.length ? ` <span class="refs">${refs.map(refLink).join(', ')}</span>` : ''}</span></li>`;
const refList = keys => { const u = [...new Set(keys)].filter(k => REFS[k]);
  return u.length ? `<ul class="reflist small">${u.map(k => `<li>${refLink(k)}. <i>${REFS[k].j}</i>. ${REFS[k].t}.</li>`).join('')}</ul>` : ''; };

function spark(vals){
  const w = 96, h = 28, min = Math.min(...vals), max = Math.max(...vals), rng = max - min || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*(w-6)+3, h-3-((v-min)/rng)*(h-6) ]);
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--chalk)"/></svg>`;
}

function vLog(){
  let h = `<header class="head"><p class="eyebrow">${S.history.length} økter</p><h1>Logg</h1></header>`;
  if (!S.history.length) return h + `<p class="muted">Øktene du fullfører havner her, med vekt, reps og notater.</p>`;
  const series = {};
  [...S.history].reverse().forEach(sess => sess.ex.forEach(e => {
    if (/BBB|FSL|T2|T3|Lett|Backoff|Deload|Sekundær|Taper/.test(e.tag || '')) return;
    const done = e.sets.filter(x => x.d > 0); if (!done.length) return;
    (series[e.lift] = series[e.lift] || []).push(Math.max(...done.map(x => x.w)));
  }));
  const rows = Object.entries(series).filter(([,v]) => v.length > 1);
  h += `<h3>Toppvekt per økt</h3>`;
  h += rows.length ? `<div class="box trend">${rows.map(([l,v]) => `<div class="tr"><b>${liftName(l)}</b>${spark(v)}<span>${fmt(v[0])} → ${fmt(v[v.length-1])} kg</span></div>`).join('')}</div>`
                   : `<p class="muted small">Kurvene dukker opp når du har logget samme løft to ganger.</p>`;
  const mcCount = S.history.filter(x => x.metcon).length;
  h += `<h3>Økter</h3>`;
  if (mcCount) h += `<div class="seg" role="group" aria-label="Filter">
      <button data-a="logf:all" aria-pressed="${ui.logF !== 'mc'}">Alle</button>
      <button data-a="logf:mc" aria-pressed="${ui.logF === 'mc'}">Med metcon (${mcCount})</button></div>`;
  const list = ui.logF === 'mc' ? S.history.filter(x => x.metcon) : S.history;
  h += list.slice(0, 60).map(sess => {
    const wodH = sess.wod ? `<div class="sess-wod"><p><b>${esc(sess.wod.navn)}</b>${sess.wod.resultat ? ` · <span class="res">${esc(sess.wod.resultat)}</span>` : ''}</p>
      <details><summary>Vis økta</summary><pre class="wodtxt">${esc(sess.wod.tekst)}</pre></details></div>` : '';
    const mcH = sess.mc && MC[sess.mc.type] ? `<span class="pill">${MC[sess.mc.type].n} · ${fmt(sess.mc.min)} min${sess.mc.rpe ? ' · RPE ' + sess.mc.rpe : ''}</span>` : '';
    const noteH = (sess.metcon || sess.note || sess.wod) ? `<div class="sess-note">${sess.metcon ? '<span class="pill mc">Metcon</span>' : ''}${mcH}${wodH}${sess.note ? `<p>${esc(sess.note)}</p>` : ''}</div>` : '';
    if (sess.free) return `<article class="sess">
      <div class="top"><h2 style="font-size:19px">${sess.wod ? 'Metcon' : 'Fri økt'}</h2><span class="muted small">${dateFmt(sess.date)}</span></div>
      ${noteH}</article>`;
    const p = prog(sess.programId);
    const vol = sess.ex.reduce((s,e) => s + e.sets.reduce((v,x) => v + (x.d||0)*x.w, 0), 0);
    return `<article class="sess">
      <div class="top"><h2 style="font-size:19px">${sess.day}</h2><span class="muted small">${dateFmt(sess.date)}</span></div>
      <p class="muted small">${p ? p.name : ''} · ${sess.sub} · ${fmt(Math.round(vol))} kg totalt</p>
      ${sess.ex.map(e => {
        const ws = [...new Set(e.sets.map(x => x.w))];
        const reps = e.sets.map(x => x.d == null ? '–' : x.d);
        const right = ws.length === 1 ? reps.join(' ') + ' × ' + fmt(ws[0]) + ' kg' : e.sets.map(x => (x.d == null ? '–' : x.d) + '×' + fmt(x.w)).join(' · ');
        return `<div class="ln"><span>${liftName(e.lift)}${e.tag ? ' <span class="muted">'+e.tag+(e.rpe != null ? ' · RPE '+fmt(e.rpe) : '')+'</span>' : ''}</span><span>${right}</span></div>`;
      }).join('')}
      ${noteH}
    </article>`;
  }).join('');
  return h;
}

// Måling til feilsøking: hva rapporterer telefonen om skjerm og trygge soner?
function diag(){
  try {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;bottom:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(d);
    const cs = getComputedStyle(d), t = Math.round(parseFloat(cs.paddingTop)), b = Math.round(parseFloat(cs.paddingBottom));
    d.remove();
    const app = document.querySelector('.app').getBoundingClientRect();
    return 'Skjerm ' + screen.height + ' · vindu ' + innerHeight + ' · app ' + Math.round(app.height) + ' · topp ' + t + ' · bunn ' + b + ' · justert ' + (ui.gapFix || 0);
  } catch(e) { return ''; }
}
