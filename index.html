function vMetconBudget(p, s){
  const now = Date.now(), cur = mcWindow(now - 7*DAY, now), prev = mcWindow(now - 14*DAY, now - 7*DAY);
  const ph = p.prog === 'sp12' && s ? s.ph : null, bud = ph ? SP.budget[ph] : null;
  if (!bud && !cur.n) return '';
  const slot = s && s.ex[0] && s.ex[0].slot;
  const grow = prev.load > 0 && cur.load > 0 ? Math.round((cur.load / prev.load - 1) * 100) : null;
  let h = `<section class="box">
    <span class="lbl">Metcons siste 7 dager</span>
    <div class="mc-sum"><div><b>${fmt(cur.min)}</b><span>min${bud ? ' av ' + bud + ' i budsjett' : ''}</span></div>
      <div><b>${fmt(cur.load)}</b><span>belastning${grow != null ? ' · ' + (grow > 0 ? '+' : '') + grow + ' % fra uka før' : ''}</span></div></div>`;
  if (bud) h += `<div class="meter" role="img" aria-label="${fmt(cur.min)} av ${bud} minutter"><i style="width:${Math.min(100, cur.min / bud * 100)}%" class="${cur.min > bud ? 'over' : ''}"></i></div>`;
  if (bud && cur.min > bud) h += `<p class="small warn-t">Over budsjettet for ${SP.phaseName[ph].toLowerCase()}. Kutt metcons før du kutter styrken.</p>`;
  else if (grow != null && grow > 15) h += `<p class="small warn-t">Belastningen er ${grow} % høyere enn uka før. Hold den flat en stund når styrken er prioritert.</p>`;
  if (cur.unknown) h += `<p class="small muted">${cur.unknown} ${cur.unknown === 1 ? 'metcon' : 'metcons'} uten minutter teller ikke med.</p>`;
  if (p.prog === 'sp12' && mcAdvice[slot]) h += `<p class="small muted">${mcAdvice[slot]}</p>`;
  return h + `</section>`;
}

/* ---------- Hele planen ----------
   Kjører programmet framover på en kopi av instansen, som om alle økter går som planlagt.
   Ekte data endres ikke. Fullførte økter hentes fra loggen. */
const PLAN_NOTE = {
  linear:'Planen viser vektene hvis du klarer alle reps hver gang. Bommer du, står vekten stille, og etter tre bom går den ned 10 %.',
  gzclp:'Planen viser vektene hvis du klarer alle reps hver gang. Bommer du, går du til neste trinn med samme vekt.',
  '531':'Treningsmaksen øker etter hver syklus på fire uker. Repsene i siste sett påvirker ikke planen.',
  jugg:'Arbeidsmaksen øker bare med reps over målet i testsettene. Planen viser vektene hvis du akkurat når målet, så de blir høyere hvis du tar flere reps.',
  cube:'Vektene er prosent av 1RM og endres ikke underveis. Uke 10 er test, og beste løft blir ny 1RM.',
  sp12:'Planen viser vektene hvis toppsett og backoff går på RPE 7 og clean er rask og ren. Da øker vekten 2,5 kg fra uke til uke. Ved RPE 7,5–9 står vekten stille. Når en ny fase starter, regnes vektene ut fra estimert 1RM.'
};
const planPer = p => ['531','jugg','cube','sp12'].includes(p.prog) ? p.days.length : (parseInt(p.perWeek) || 3);
function simulate(p, a0, n){
  const a = JSON.parse(JSON.stringify(a0)), out = [];
  while (out.length < n && !(p.total && a.idx >= p.total)) {
    const s = buildSession(p, a);
    out.push({idx: a.idx, s: JSON.parse(JSON.stringify(s))});
    s.ex.forEach(e => { e.sets.forEach(x => x.d = x.t); e.rpe = 7; e.q = 'god'; });
    progress(p, a, s);
    a.idx++;
  }
  return out;
}
// Sett med lik vekt og reps slås sammen: «5×5 · 80 kg». Fullførte sett viser repsene du faktisk tok hvis de avvek.
function setsLine(e, done){
  const g = [];
  e.sets.forEach(x => { const l = g[g.length-1];
    if (l && l.w === x.w && l.t === x.t && !!l.am === !!x.am) { l.n++; l.d.push(x.d); } else g.push({w:x.w, t:x.t, am:x.am, n:1, d:[x.d]}); });
  return g.map(x => done && x.d.some(d => d !== x.t)
    ? x.d.map(d => d == null ? '–' : d).join(', ') + ' × ' + fmt(x.w) + ' kg'
    : x.n + '×' + x.t + (x.am ? '+' : '') + ' · ' + fmt(x.w) + ' kg').join(' + ');
}
function vPlan(){
  const P = ui.plan, p = prog(P.id), a = P.active ? S.active : P.inst;
  if (!p || !a) { ui.plan = null; return ''; }
  const per = planPer(p);
  const N = p.total || Math.max(12 * per, a.idx + 4 * per);
  const doneH = P.active ? S.history.filter(h => h.programId === p.id && !h.free && h.date >= a.startedAt).reverse().slice(-a.idx) : [];
  const rows = doneH.map((h, k) => ({k, done:!h.skipped, skipped:!!h.skipped, day:h.day, sub:h.sub, ex:h.ex}));
  simulate(p, a, N - a.idx).forEach(f => {
    const s = P.active && f.idx === a.idx && S.draft ? S.draft : f.s;
    rows.push({k: f.idx, done:false, next: P.active && f.idx === a.idx, day:s.day, sub:s.sub, ex:s.ex});
  });
  const weeks = [];
  rows.forEach(r => { const w = Math.floor(r.k / per); (weeks[w] = weeks[w] || []).push(r); });
  return `<button class="link" data-a="planclose">‹ Tilbake</button>
    <header class="head"><p class="eyebrow">${p.name}</p><h1>Hele planen</h1>
      <p class="muted small">${PLAN_NOTE[p.prog] || ''}${P.active ? '' : ' Vektene er regnet ut fra tallene du har skrevet inn.'}${p.total ? '' : ' Programmet har ingen fast slutt, så planen viser 12 uker.'}</p></header>
    ${weeks.map((list, w) => list ? `<h3>Uke ${w + 1}</h3><div class="list">${list.map(r => {
      const m = r.ex[0];
      return `<details class="box acc plan-s${r.done || r.skipped ? ' done-s' : ''}${r.next ? ' next-s' : ''}"${r.next ? ' open' : ''}>
        <summary><span class="ps"><span class="ps-top"><b>${esc(r.day)}</b>${r.done ? '<span class="pill">✓ Gjort</span>' : r.skipped ? '<span class="pill">Hoppet over</span>' : r.next ? '<span class="pill on">Neste</span>' : ''}</span>
          ${r.sub && r.sub !== 'Uke ' + (w + 1) ? `<span class="small muted">${esc(r.sub)}</span>` : ''}
          <span class="small">${m ? liftName(m.lift) + ' · ' + setsLine(m, r.done) : ''}</span></span></summary>
        <div class="plan-ex">${r.ex.map(e => `<div class="ln"><span>${liftName(e.lift)}${e.tag ? ` <span class="muted">${e.tag}</span>` : ''}</span><span>${setsLine(e, r.done)}</span></div>`).join('')}</div>
      </details>`; }).join('')}</div>` : '').join('')}`;
}

/* ---------- Pete Plan (Pete Marston) ----------
   Tre-ukers rotasjon med seks økter per uke, kontrollert mot Pete Marstons egen tabell
   (machars.net/waspeteplan.htm). Kan slås av under Mer.
   off = målfart i sekunder per 500 m i forhold til 2K-farten (negativ = raskere).
   Progresjon (fra planen): snittet fra alle dragene i en intervalløkt blir målet neste gang samme økt kommer.
   Hard distanse: prøv å komme nær din beste tid. Rolige økter følger 2K-farten.
   «Tilpasset styrke» er vår egen tilpasning, ikke en del av Pete Plan: rolige økter 6 km og hard distanse 5 km. */
const PETE = [
  {kind:'speed',  d:[500,500,500,500,500,500,500,500], rest:[210], off:-2.5},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[2000,2000,2000,2000], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10},
  {kind:'speed',  d:[1000,1000,1000,1000], rest:[300], off:2},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[1500,1500,1500,1500,1500], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10},
  {kind:'speed',  d:[250,500,750,1000,750,500,250], rest:[90,180,270,360,270,180], off:-2},
  {kind:'steady', d:[15000], off:15},
  {kind:'steady', d:[8000],  off:12},
  {kind:'endur',  d:[3000,2500,2000], rest:[300], off:5},
  {kind:'steady', d:[15000], off:15},
  {kind:'hard',   d:[10000], off:10}
];
const PETE_KIND = {speed:'Fartsintervaller', steady:'Rolig distanse', endur:'Utholdenhetsintervaller', hard:'Hard distanse'};
const PETE_MACH = {row:'Ro', ski:'Ski', bike:'Sykkel'};
const PETE_REF = {row:'Romaskin, 2000 m', ski:'Ski, 2000 m', bike:'Sykkel, 4000 m'};
const peteOn = () => !!(S.settings.pete && S.settings.pete.on);
const distTxt = m => (m >= 10000 ? String(m).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : String(m)) + ' m';
const splitTxt = sec => { if (!(sec > 0)) return '–'; const t = Math.round(sec * 10) / 10, m = Math.floor(t / 60), r = t - m*60;
  return m + ':' + (r < 10 ? '0' : '') + (Math.round(r*10) % 10 ? r.toFixed(1) : String(Math.round(r))); };
// «1:52», «1:52.4» eller «1.52,4» → sekunder
function parseSplit(v){
  const m = String(v || '').trim().replace(',', '.').match(/^(\d{1,2})[:.](\d{1,2}(?:\.\d)?)$/);
  return m ? +m[1]*60 + +m[2] : null;
}
// Økta for posisjon pos, i valgt versjon og på valgt apparat. Sykkel: dobbel distanse, fart per 1000 m.
function peteSession(pos, ver, mach){
  const base = PETE[pos % PETE.length], bike = mach === 'bike';
  let d = base.d.slice();
  if (ver === 'str' && base.kind === 'steady') d = [6000];
  if (ver === 'str' && base.kind === 'hard') d = [5000];
  if (bike) d = d.map(x => x * 2);
  const same = d.every(x => x === d[0]);
  const name = d.length === 1 ? distTxt(d[0]) : same ? d.length + ' × ' + distTxt(d[0]) : d.join(' / ') + ' m';
  const rests = base.rest ? (base.rest.length === 1 ? Array(d.length - 1).fill(base.rest[0]) : base.rest) : [];
  const restTxt = !rests.length ? '' : new Set(rests).size === 1 ? mmss(rests[0]) + ' pause' : 'pauser ' + rests.map(mmss).join(', ');
  return {pos: pos % PETE.length, kind: base.kind, off: base.off, d, meters: d.reduce((a,b) => a+b, 0), rests, name, restTxt, bike};
}
/* Referansefart regnet begge veier.
   Framover: 2K-farten + tillegget for økta = målfart.
   Baklengs: snittfarten du rodde − tillegget = anslått 2K-fart nå.
   Bare intervalløkter og hard distanse gir anslag (rolige økter er ikke maks innsats).
   Brukes: medianen av de tre siste anslagene fra de siste seks ukene, per apparat.
   En testet 2K-tid du skriver inn går foran, helt til nyere anslag kommer.
   Alle farter er i sekunder per 500 m (på sykkel: per 500 sykkelmeter). */
const PETE_EST_DAYS = 42;
const median = a => { const b = a.slice().sort((x, y) => x - y), m = Math.floor(b.length / 2); return b.length % 2 ? b[m] : (b[m-1] + b[m]) / 2; };
function peteRef(mach){
  const set = S.settings.pete, tested = set.ref && set.ref[mach], testedAt = (set.refAt && set.refAt[mach]) || 0;
  const est = ((S.pete.est || {})[mach] || []).filter(e => Date.now() - e.t < PETE_EST_DAYS * DAY && e.t > testedAt).slice(-3);
  if (est.length) return {split: median(est.map(e => e.sec)), src:'est', n: est.length};
  if (tested) return {split: mach === 'bike' ? tested / 8 : tested / 4, src:'test'};
  return {split: null, src:'none'};
}
// Fart per 500 m → testtid (2000 m, sykkel 4000 m)
const refTime = (split, mach) => split * (mach === 'bike' ? 8 : 4);
const refLine = (mach) => { const r = peteRef(mach); if (!r.split) return '';
  const what = mach === 'bike' ? '4K' : '2K';
  return r.src === 'est' ? `Beregnet ${what}: ${splitTxt(refTime(r.split, mach))}, ${r.n === 1 ? 'fra siste økt' : 'fra dine siste ' + r.n + ' økter'}` : `Testet ${what}: ${splitTxt(refTime(r.split, mach))}`; };

// Målfart for økta, og hvor målet kommer fra
function peteTarget(ss, mach){
  const P = S.pete || {}, key = ss.pos + '|' + mach, pbKey = 'hard|' + mach + '|' + ss.meters;
  if ((ss.kind === 'speed' || ss.kind === 'endur') && P.targets && P.targets[key]) return {sec: P.targets[key], src:'ditt snitt sist'};
  if (ss.kind === 'hard' && P.pb && P.pb[pbKey]) return {sec: P.pb[pbKey], src:'din beste'};
  const r = peteRef(mach), what = mach === 'bike' ? '4K' : '2K';
  if (!r.split) return {sec: null, src:'mangler referansetid'};
  return {sec: r.split + ss.off, src: (r.src === 'est' ? 'beregnet ' : 'testet ') + what};
}
const paceTxt = (sec, bike) => sec ? (bike ? splitTxt(sec * 2) + ' /1000 m' : splitTxt(sec) + ' /500 m') : '–';
const peteWorkMin = (ss, t) => t.sec ? Math.round(ss.meters / 500 * t.sec / 60) : null;
// Tid per drag når alle dragene er like lange, eller total tid når økta er ett drag. Ellers null (pyramiden).
// Ved 500 m-drag (1000 m på sykkel) er tid per drag det samme som farten, så da vises den ikke.
const dragMeters = ss => ss.d.every(x => x === ss.d[0]) && ss.d[0] !== (ss.bike ? 1000 : 500) ? ss.d[0] : null;
const dragTime = (ss, sec) => { const m = dragMeters(ss); return m && sec ? m / 500 * sec : null; };
const dragLabel = ss => ss.d.length === 1 ? 'Total tid' : 'Tid per drag';
const peteNote = k => k === 'steady' ? 'Jevnt, ikke lett. Ro helst uten stopp.'
  : k === 'hard' ? 'Så hardt du klarer. Prøv å komme nær din beste tid.'
  : 'Fart som gjør at du klarer alle dragene. Siste drag tar du fullt ut. Snittet ditt blir målet neste gang denne økta kommer.' + (k === 'endur' ? ' Rundt 5K-fart.' : '');

// Resultatet du skrev inn → fart per 500 m. unit 'drag' = tid per drag eller total tid.
function peteResultSec(ss, pick){
  const v = parseSplit(pick.split); if (!v) return null;
  if (pick.unit === 'drag') { const m = dragMeters(ss); return m ? v / (m / 500) : null; }
  return ss.bike ? v / 2 : v;   // sykkel vises per 1000 m
}

// Kortet: viser neste økt i planen. ctx = 'session' (etter styrkeøkta) eller 'free' (fri økt).
// picked = valgt økt med felt for resultat.
function peteBox(ctx, picked){
  const set = S.settings.pete, mach = picked ? picked.mach : set.mach, ver = picked ? picked.ver : set.ver;
  const idx = picked ? picked.idx : (S.pete.idx || 0), ss = peteSession(idx, ver, mach), t = peteTarget(ss, mach);
  const wk = Math.floor(ss.pos / 6) + 1, day = ss.pos % 6 + 1, round = Math.floor(idx / PETE.length) + 1, min = peteWorkMin(ss, t);
  const ref = peteRef(mach), dt = dragTime(ss, t.sec), unit = picked && picked.unit === 'drag' && dragMeters(ss) ? 'drag' : 'split';
  const example = unit === 'drag' ? (dt ? splitTxt(dt) : '7:40') : (t.sec ? (ss.bike ? splitTxt(t.sec*2) : splitTxt(t.sec)) : '1:55');
  return `<section class="box pp-card${picked ? ' pp-picked' : ''}">
    <div class="pp-top"><span class="lbl">${picked ? 'Dagens Pete Plan' : 'Fortsett Pete Plan'}</span>
      ${picked ? `<button class="link" data-a="pp:rm:${ctx}">Fjern</button>` : `<span class="small muted">Runde ${round} · uke ${wk} · økt ${day} av 6</span>`}</div>
    ${picked ? '' : `<div class="pp-mach" role="group" aria-label="Apparat">${Object.entries(PETE_MACH).map(([k,v]) => `<button data-a="pp:mach:${k}" aria-pressed="${mach === k}">${v}</button>`).join('')}</div>`}
    <div><p class="small muted">${PETE_KIND[ss.kind]}${ss.restTxt ? ' · ' + ss.restTxt : ''}${picked ? ' · ' + PETE_MACH[mach] : ''}${ver === 'str' && (ss.kind === 'steady' || ss.kind === 'hard') ? ' · tilpasset styrke' : ''}</p><h2>${ss.name}</h2></div>
    <div class="pp-facts">
      <div><span>Målfart</span><b>${t.sec ? (ss.bike ? splitTxt(t.sec*2) : splitTxt(t.sec)) : '–'}</b><span>${ss.bike ? 'per 1000 m' : 'per 500 m'}</span></div>
      ${dt ? `<div><span>${ss.d.length === 1 ? 'Måltid' : 'Per drag'}</span><b>${splitTxt(dt)}</b><span>${ss.d.length === 1 ? 'totalt' : 'mål'}</span></div>` : ''}
      <div><span>Arbeid</span><b>${min != null ? min + ' min' : '–'}</b><span>ca.</span></div>
    </div>
    <p class="small muted">Mål fra ${t.src}${ref.split && !/testet|beregnet/.test(t.src) ? '. ' + refLine(mach) : ref.split ? ': ' + refLine(mach).replace(/^(Beregnet|Testet) [24]K: /, '') : ''}</p>
    ${!ref.split ? `<div class="field"><label for="ppRef-${ctx}">${PETE_REF[mach]}<small class="muted">Referansetid gir målfart</small></label>
      <span class="inp"><input id="ppRef-${ctx}" data-ppref="${mach}" type="text" inputmode="decimal" placeholder="${mach === 'bike' ? '6:40' : '7:20'}"></span></div>` : ''}
    <p class="small muted">${peteNote(ss.kind)}</p>
    ${picked ? `${dragMeters(ss) ? `<div class="seg pp-unit" role="group" aria-label="Hva skriver du inn?">
        <button data-a="pp:unit:${ctx}:split" aria-pressed="${unit === 'split'}">Snittfart</button>
        <button data-a="pp:unit:${ctx}:drag" aria-pressed="${unit === 'drag'}">${dragLabel(ss)}</button></div>` : ''}
      <div class="field"><label for="ppSplit-${ctx}">${unit === 'drag' ? (ss.d.length === 1 ? 'Total tid i dag' : 'Snittid per drag i dag') : 'Snittfart i dag'}<small class="muted">${unit === 'drag' ? 'minutter:sekunder' : (ss.bike ? 'per 1000 m' : 'per 500 m')}, f.eks. ${example}</small></label>
      <span class="inp"><input id="ppSplit-${ctx}" data-ppsplit="${ctx}" type="text" inputmode="decimal" value="${esc(picked.split || '')}"></span></div>`
      : `<button class="btn ghost" data-a="pp:pick:${ctx}">Velg denne økta</button>`}
  </section>`;
}
function petePick(ctx){
  const set = S.settings.pete, ss = peteSession(S.pete.idx || 0, set.ver, set.mach), t = peteTarget(ss, set.mach);
  const pick = {idx: S.pete.idx || 0, mach: set.mach, ver: set.ver, split: '', unit: 'split'};
  const mc = {type:'M', min: peteWorkMin(ss, t) || ''};
  if (ctx === 'session' && S.draft) { S.draft.pete = pick; S.draft.metcon = true; S.draft.mc = Object.assign(mc, S.draft.mc && S.draft.mc.rpe ? {rpe:S.draft.mc.rpe} : {}); save(); }
  else { ui.free = true; ui.freePete = pick; ui.freeMc = true; ui.freeMcData = mc; }
}
// Når økta er lagret: neste økt i rotasjonen, nytt mål og nytt 2K-anslag hvis resultat er registrert
function peteDone(pick){
  const ss = peteSession(pick.idx, pick.ver, pick.mach), sec = peteResultSec(ss, pick);
  S.pete = S.pete || {idx:0, targets:{}, pb:{}};
  S.pete.est = S.pete.est || {};
  if (sec && (ss.kind === 'speed' || ss.kind === 'endur')) S.pete.targets[ss.pos + '|' + pick.mach] = sec;
  if (sec && ss.kind === 'hard') { const k = 'hard|' + pick.mach + '|' + ss.meters; if (!S.pete.pb[k] || sec < S.pete.pb[k]) S.pete.pb[k] = sec; }
  if (sec && ss.kind !== 'steady') S.pete.est[pick.mach] = (S.pete.est[pick.mach] || []).concat({t: Date.now(), sec: sec - ss.off, pos: ss.pos}).slice(-10);
  if (pick.idx === (S.pete.idx || 0)) S.pete.idx = (S.pete.idx || 0) + 1;
  return {name: ss.name, kind: ss.kind, mach: pick.mach, split: sec || null, bike: ss.bike, pos: ss.pos, est: sec && ss.kind !== 'steady' ? sec - ss.off : null};
}

    const a = S.active;
    return h + `<header class="head"><p class="eyebrow">${p.name}</p><h1>Programmet er fullført</h1></header>
      ${a.e1rm ? `<div class="box trend">${Object.keys(a.e1rm).map(l => `<div class="tr"><b>${liftName(l)}</b><span>${fmt(a.base[l])} → ${fmt(Math.round(a.e1rm[l]*2)/2)} kg</span></div>`).join('')}</div>
      <p class="muted small">Startverdi mot estimert 1RM nå.</p>` : ''}
      <button class="btn" data-a="tab:programs">Velg neste program</button>`;
  }
  const anyTouched = s.ex.some(e => e.sets.some(x => x.d != null));
  const allDone = e => e.sets.every(x => x.d != null);
  const touched = e => e.sets.some(x => x.d != null) || !!(e.wuDone && e.wuDone.length);
  // Strength & Power spør om RPE eller kvalitet når settene er gjort. Kortet holdes åpent til det er svart.
  const asks = e => e.sp && allDone(e) && ((e.part === 'extra' && e.rpe == null) || ((e.part === 'top' || e.part === 'back') && (e.slot === 'clean' ? e.q == null : e.rpe == null)));
  const cur = s.ex.findIndex(e => !allDone(e) || asks(e));
  const setsLeft = s.ex.reduce((n, e) => n + e.sets.filter(x => x.d == null).length, 0);
  const mins = Math.floor((Date.now() - s.started) / 60000);
  h += `<header class="head">
      <p class="eyebrow">${p.name} · ${s.sub}</p>
      <div class="h-row"><h1>${s.day}</h1>${anyTouched ? `<span>${mins} min · ${setsLeft ? setsLeft + ' sett igjen' : 'alt gjort'}</span>` : ''}</div>
      <div class="prog" aria-label="${cur < 0 ? 'Alle øvelser er gjort' : 'Øvelse ' + (cur+1) + ' av ' + s.ex.length}">${s.ex.map(e => {
        const d = e.sets.filter(x => x.d != null).length;
        return `<i class="${d === e.sets.length ? 'full' : ''}"><b style="width:${Math.round(d / e.sets.length * 100)}%"></b></i>`; }).join('')}</div>
      ${S.active.e1rm ? `<p class="muted small">${p.prog === 'sp12' ? 'Estimert 1RM' : '1RM'} ${liftName(s.ex[0].lift).toLowerCase()}: ${fmt(Math.round(S.active.e1rm[s.ex[0].lift]*2)/2)} kg</p>` : ''}
    </header>`;
  if (p.prog === 'sp12') {
    const c = mcRecentConflict(s.ex[0].slot);
    if (c && !anyTouched) h += `<div class="warn">Du logget en ${MC[c.mc.type].n.toLowerCase()} metcon for ${Math.max(1, Math.round((Date.now() - c.date)/3600e3))} timer siden. Forvent høyere RPE i dag, og kutt gjerne ett backoff-sett.</div>`;
    if ((s.ph === 'd4' || s.ph === 'd8') && !anyTouched && ui.keepDl !== s.ph) h += vDeloadChoice(s.ph);
  }
  s.ex.forEach((e,ei) => {
    const top = Math.max(...e.sets.map(x => x.w));
    const k = s.started + '-' + ei, opened = !!(ui.exOpen && ui.exOpen[k]);
    const wk = wuKind(s, ei), wu = wk ? warmups(e.slot, e.sets[0].w, e.sets[0].t, wk) : [];
    // Ferdig øvelse blir én linje når du har begynt på en senere øvelse. Trykk for å åpne den igjen.
    if (!opened && cur !== ei && allDone(e) && !asks(e) && s.ex.slice(ei+1).some(touched)) {
      const hit = e.sets.every(x => x.d >= x.t);
      h += `<button class="ex-row" data-a="exopen:${k}" aria-label="${liftName(e.lift)}, ferdig: ${setsLine(e, true)}. Trykk for å åpne">
        <span class="ck ${hit ? '' : 'miss'}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${hit ? 'M5 12l5 5L20 7' : 'M12 7v6M12 17v.01'}"/></svg></span>
        <b>${liftName(e.lift)}</b><span>${setsLine(e, true)}</span></button>`;
      return;
    }
    // Øvelser som ikke er påbegynt etter den du holder på med, vises som én linje med navn og vekt
    if (!opened && cur > -1 && ei > cur && !touched(e)) {
      h += `<button class="ex-row ex-line" data-a="exopen:${k}" aria-label="${ei === cur + 1 ? 'Neste' : 'Senere'}: ${liftName(e.lift)}, ${setsLine(e)}. Trykk for å åpne">
        <small>${ei === cur + 1 ? 'Neste' : 'Senere'}</small><b>${liftName(e.lift)}</b><span>${fmt(top)} kg</span></button>`;
      return;
    }
    const now = ei === cur;
    // Ett tall om gangen: før arbeidssettene er i gang viser kortet neste oppvarmingssett som det store tallet
    const wuDone = e.wuDone || [], wuNext = wu.findIndex(([w, r]) => !wuDone.includes(w + 'x' + r));
    const warm = now && wuNext > -1 && !e.sets.some(x => x.d != null);
    const nextSi = now && !warm ? e.sets.findIndex(x => x.d == null) : -1;
    const varies = new Set(e.sets.map(x => x.w)).size > 1;
    const amIdx = e.sets.findIndex(x => x.am && x.d != null);
    const tag = warm ? `Oppvarming ${wuNext + 1} av ${wu.length}`
      : now ? (nextSi > -1 ? `Nå · sett ${nextSi+1} av ${e.sets.length}` : 'Nå') + (e.tag ? ' · ' + e.tag : '') : e.tag;
    const [bigW, bigR] = warm ? wu[wuNext] : [top, 0];
    h += `<section class="ex ${now ? 'now' : ''}">
      <div class="ex-head"><div>${tag ? `<span class="tag">${tag}</span>` : ''}<h2>${liftName(e.lift)}</h2></div>
        <div class="kg">${fmt(bigW)}<small>KG${bigR ? ' × ' + bigR : ''}</small></div></div>
      ${LIFTS[e.lift].bar ? `<div class="platesrow ${now ? 'platebox' : ''}">${plateHTML(bigW, now)}</div>` : ''}
      ${wu.length ? vWarmup(e, ei, wu, wuNext, warm) : ''}
      ${e.hint ? `<p class="wu">${e.hint}</p>` : ''}
      <div class="chips">${e.sets.map((x,si) => {
        const st = x.d == null ? (si === nextSi ? 'next' : '') : (x.d >= x.t ? 'ok' : 'miss');
        const lbl = 'Sett '+(si+1)+': '+(x.d == null ? 'ikke gjort, mål '+x.t+' reps' : x.d+' reps')+(x.am ? ', så mange du klarer' : '');
        return `<div class="cw"><button class="chip ${st} ${x.am?'am':''}" data-a="set:${ei}:${si}" aria-label="${lbl}">${x.d == null ? x.t : x.d}${x.am ? '<sup>+</sup>' : ''}</button>${varies ? `<small>${fmt(x.w)}</small>` : ''}</div>`;
      }).join('')}</div>
      ${amIdx > -1 ? `<div class="amrap"><span>Siste sett, så mange du klarer</span>
        <button class="step" data-a="am:${ei}:${amIdx}:-1" aria-label="Én rep mindre">−</button>
        <b>${e.sets[amIdx].d}</b>
        <button class="step" data-a="am:${ei}:${amIdx}:1" aria-label="Én rep mer">+</button></div>` : ''}
      ${(warm || (nextSi > -1 && !e.sets[nextSi].am)) ? '<p class="chip-hint">Trykk = gjort · trykk igjen = én rep mindre</p>' : ''}
      ${e.sp ? spExtras(e, ei) : ''}
    </section>`;
  });
  // Etter styrken: kondisjon, metcon og notat ligger bak én rad. En del med innhold står alltid åpen.
  const af = ui.after && ui.after.k === s.started ? ui.after : (ui.after = {k: s.started});
  const has = {cond: !!s.pete, mc: !!(s.wod || s.metcon), note: !!(s.note || '').trim()};
  const show = k => !!(af[k] || has[k]);
  const parts = [peteOn() || s.pete ? ['cond', 'Kondisjon'] : null, ['mc', 'Metcon'], ['note', 'Notat']].filter(Boolean);
  h += `<section class="box after"><span class="lbl">Etter styrken</span>
      <div class="after-add">${parts.map(([k, n]) => `<button class="tog" data-a="after:${k}" aria-pressed="${show(k)}">${show(k) ? n : '+ ' + n}</button>`).join('')}</div></section>`;
  if (show('cond')) h += peteBox('session', s.pete);
  if (show('mc')) {
    h += vMetconBudget(p, s);
    h += s.wod ? wodBox(s.wod, 'session') : s.pete ? '' : quickPick('session');
    h += `<section class="box"><button class="tog" data-a="metcon" aria-pressed="${!!s.metcon}">Metcon i dag</button>
      ${s.metcon || s.wod ? mcFields('session', s.mc) : ''}</section>`;
  }
  if (show('note')) h += `<section class="box notebox">
      <label for="note" class="lbl">Notat</label>
      <textarea id="note" placeholder="For eksempel dagsform eller en teknikkdetalj">${esc(s.note)}</textarea>
    </section>`;
  // Mangler det sett, sier appen hva som skjer med dem før økta lukkes
  if (ui.confirm === 'finish' && setsLeft) {
    const left = e => e.sets.filter(x => x.d == null).length;
    const cap = list => list.map((n, i) => i ? n.charAt(0).toLowerCase() + n.slice(1) : n);
    const part = s.ex.filter(e => left(e) && e.sets.some(x => x.d != null)), none = s.ex.filter(e => e.sets.every(x => x.d == null));
    const missing = cap([...part.map(e => liftName(e.lift) + ' (' + left(e) + ' sett)'), ...none.map(e => liftName(e.lift))]);
    // Lineære programmer og GZCLP: påbegynte løft med hull teller som bom, løft du ikke har rørt, står stille (se progress)
    let why = 'Settene lagres som ikke tatt i loggen.';
    if (p.prog === 'linear' || p.prog === 'gzclp') why = [part.length ? 'Løft med sett som mangler, regnes som bom.' : '',
      none.length ? listNo(cap(none.map(e => liftName(e.lift)))) + ' står på samme vekt neste gang.' : ''].join(' ');
    h += `<section class="box skipbox" aria-live="polite"><p><b>Fullføre med ${setsLeft} sett som ikke er logget?</b></p>
      <p class="small">Ikke logget: ${esc(listNo(missing))}. ${esc(why)}</p>
      <div class="row"><button class="btn sm" data-a="finish">Fullfør likevel</button><button class="btn ghost sm" data-a="cancel">Fortsett økta</button></div></section>`;
  } else h += `<button class="btn" data-a="${setsLeft ? 'confirm:finish' : 'finish'}" ${anyTouched ? '' : 'disabled'}>Fullfør økt</button>`;
  if (ui.confirm === 'skipday') {
    const a1 = JSON.parse(JSON.stringify(S.active)); a1.idx++;
    const next = p.total && a1.idx >= p.total ? null : buildSession(p, a1);
    const lifts = [...new Set(s.ex.map(e => liftName(e.lift)))].map((n, i) => i ? n.toLowerCase() : n);
    h += `<section class="box skipbox" aria-live="polite"><p><b>Hoppe over ${esc(s.day)}?</b></p>
      <p class="small">${listNo(lifts)} får ingen økning denne gangen, og vektene står som de er.${anyTouched ? ' Settene du har tatt i dag, lagres ikke.' : ''}${s.wod || s.pete ? ' Metconen du har valgt, lagres heller ikke.' : ''}
        ${next ? 'Neste økt blir ' + esc(next.day) + (next.sub && next.sub !== s.sub ? ' (' + esc(next.sub) + ')' : '') + '.' : 'Dette var siste økt i programmet.'}</p>
      <div class="row"><button class="btn danger sm" data-a="skipday">Ja, hopp over</button><button class="btn ghost sm" data-a="cancel">Avbryt</button></div></section>`;
  }
  h += `<div class="links"><button class="link" data-a="plan">Se planen</button><button class="link" data-a="free">Logg fri økt</button>${
    ui.confirm === 'skipday' ? '' : '<button class="link" data-a="confirm:skipday">Hopp over økta</button>'}</div>`;
  return h;
}

// Lett uke: vis tallene appen har, og la utøveren velge
function vDeloadChoice(ph){
  const rows = spReadiness(S.active);
  const mark = v => v == null ? '<span class="muted">–</span>' : v ? '<span class="ok-t">✓</span>' : '<span class="warn-t">✗</span>';
  const allOk = rows.every(r => r.effOk && r.trendOk);
  return `<section class="box dl">
    <h3 style="margin:0">Lett uke, eller én uke til?</h3>
    <p class="small">Forskningen tyder på at en fast lett uke ikke alltid trengs. Hopp bare over den hvis alle punktene stemmer.</p>
    <div class="trend">${rows.map(r => `<div class="tr"><b>${r.name}</b><span>${r.eff || 'ingen vurdering'}</span>${mark(r.effOk)}<span class="muted">1RM-trend</span>${mark(r.trendOk)}</div>`).join('')}</div>
    <ul class="small crit">
      <li>Estimert 1RM har stått stille eller steget de siste to ukene.</li>
      <li>Toppsettene har ligget på RPE 9 eller lavere, og clean har vært rask og ren.</li>
      <li>Du sover godt, føler deg uthvilt og har ingen smerter.</li>
    </ul>
    <p class="small ${allOk ? 'ok-t' : 'muted'}">${allOk ? 'Tallene i appen ser bra ut. Du avgjør punktet om søvn og smerter.' : 'Tallene peker mot å ta den lette uka.'}</p>
    <div class="row"><button class="btn ghost sm" data-a="keepdl:${ph}">Ta lett uke</button><button class="btn ghost sm" data-a="skipdl:${ph}">Hopp over</button></div>
  </section>`;
}

function dayLines(p, d){
  if (p.prog === 'cube') {
    const di = p.days.indexOf(d);
    return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
      ...['1 · 4 · 7','2 · 5 · 8','3 · 6 · 9'].map((u,k) => `<div>Uke ${u}<span>${CUBE.tag[CUBE.rot[k][di]]}</span></div>`),
      `<div>Uke 10<span>Test</span></div>`];
  }
  if (p.prog === 'sp12') {
    const sc = SP.scheme[d.lift], f = x => x[0] + '×' + x[1];
    const xs = [...new Set(Object.values(SP.extras[d.lift] || {}).flat().map(x => liftName(x[0]).toLowerCase()))];
    return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
      ...['p1','p2','p3'].map((ph,k) => `<div>Uke ${['1–3','5–7','9–10'][k]}<span>${f(sc[ph].top)} + ${f(sc[ph].back)}</span></div>`),
      `<div>Uke 4 og 8<span>Lett uke</span></div>`, `<div>Uke 11<span>Taper</span></div>`,
      `<div>Uke 12<span>${d.lift === 'clean' ? 'Beste single' : 'Test 3RM'}</span></div>`,
      ...(xs.length ? [`<div class="xs">+ ${xs.join(' og ')}</div>`] : [])];
  }
  if (p.prog === 'linear') return d.ex.map(e => `<div>${liftName(e.lift)}<span>${e.sets}×${e.reps}</span></div>`);
  if (p.prog === 'gzclp') return d.ex.map(e => `<div><span style="color:var(--chalk)"><b>${e.tier}</b>${liftName(e.lift)}</span><span>${e.tier==='T1'?'5×3+':e.tier==='T2'?'3×10':'3×15+'}</span></div>`);
  if (p.prog === 'jugg') return [`<div><span style="color:var(--chalk)">${liftName(d.lift)}</span></div>`,
    ...JUG_WAVE.map((w, k) => `<div>Uke ${k*4+1}–${k*4+4}<span>${w}</span></div>`)];
  return [`<div>${liftName(d.lift)}<span>3 sett</span></div>`, `<div>${liftName(d.lift)}<span>${p.fsl ? 'FSL 5×5' : '5×10'}</span></div>`];
}

const lvl = l => `<span class="lvl lvl-${l}" title="Evidensnivå ${l}">${l}</span>`;
const refLink = k => { const r = REFS[k]; if (!r) return '';
  const url = r.doi ? 'https://doi.org/' + r.doi : 'https://pubmed.ncbi.nlm.nih.gov/' + r.pmid + '/';
  return `<a href="${url}" target="_blank" rel="noopener">${r.a}</a>`; };
const claim = ([text, l, refs]) => `<li>${lvl(l)}<span>${text}${refs.length ? ` <span class="refs">${refs.map(refLink).join(', ')}</span>` : ''}</span></li>`;
const refList = keys => { const u = [...new Set(keys)].filter(k => REFS[k]);
  return u.length ? `<ul class="reflist small">${u.map(k => `<li>${refLink(k)}. <i>${REFS[k].j}</i>. ${REFS[k].t}.</li>`).join('')}</ul>` : ''; };

    <details class="box acc"><summary>Med metcons og kondisjon</summary><p class="small">${g.metcon}</p>${g.metconRefs && g.metconRefs.length ? `<p class="small refs">${g.metconRefs.map(refLink).join(', ')}</p>` : ''}</details>
    <details class="box acc"><summary>Vær obs på</summary><p class="small">${g.watch}</p></details>

function vActiveCard(){
  const a = S.active, p = prog(a.programId); if (!p) return '';
  const over = p.total && a.idx >= p.total;
  const next = over ? null : (S.draft || buildSession(p, JSON.parse(JSON.stringify(a))));
  const lifts = next ? [...new Map(next.ex.map(e => [e.lift, Math.max(...e.sets.map(x => x.w))])).entries()].slice(0, 3) : [];

      <div class="act-sub"><span>${p.total ? `${Math.min(a.idx, p.total)} av ${p.total} økter` : `${a.idx} økter fullført`}</span><span>${next ? 'Neste: ' + next.day : 'Fullført'}</span></div>

function spark(vals){
  const w = 72, h = 24, min = Math.min(...vals), max = Math.max(...vals), rng = max - min || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*(w-6)+3, h-3-((v-min)/rng)*(h-6) ]);
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--chalk)"/></svg>`;
}

// Fire uker, mandag først, med i dag markert
function vCalendar(){
  const day = 864e5, today = new Date(); today.setHours(0,0,0,0);
  const start = today.getTime() - ((today.getDay() + 6) % 7 + 21) * day;
  const cells = [];
  for (let i = 0; i < 28; i++) {
    const t0 = start + i * day, t1 = t0 + day, hs = S.history.filter(h => h.date >= t0 && h.date < t1);
    const st = hs.some(isStrength), mc = hs.some(isMetcon);
    const cls = st && mc ? 'both' : st ? 'st' : mc ? 'mc' : '';
    const lbl = new Date(t0).toLocaleDateString('nb-NO', {weekday:'long', day:'numeric', month:'long'}) + ': ' + (st && mc ? 'styrke og metcon' : st ? 'styrke' : mc ? 'metcon' : 'ingen økt');
    cells.push(`<i class="${cls}${t0 === today.getTime() ? ' today' : ''}${t0 > today.getTime() ? ' fut' : ''}" title="${lbl}"></i>`);
  }
  return `<div class="cal" role="img" aria-label="Treningsdager de siste fire ukene">${['M','T','O','T','F','L','S'].map(d => `<span>${d}</span>`).join('')}${cells.join('')}</div>
    <div class="cal-key"><span><i class="st"></i>Styrke</span><span><i class="mc"></i>Metcon</span><span><i class="both"></i>Begge</span></div>`;
}
function vLog(){
  let h = `<header class="head h-row"><div><p class="eyebrow">Siste 4 uker</p><h1>Logg</h1></div><button class="quick" data-a="free">+ Fri økt</button></header>`;
  if (!S.history.length) return h + `<p class="muted">Øktene du fullfører havner her, med vekt, reps og notater.</p>`;
  const now = Date.now(), last28 = S.history.filter(x => x.date > now - 28*864e5);
  const nSt = last28.filter(isStrength).length, nMc = last28.filter(isMetcon).length;
  h += `<section class="box">
      <div class="log-sum">
        <div><b>${nSt}</b><span>${nSt === 1 ? 'styrkeøkt' : 'styrkeøkter'}</span></div>
        <div><b class="${nMc ? 'warn-t' : ''}">${nMc}</b><span>${nMc === 1 ? 'metcon' : 'metcons'}</span></div>
        <div><b>${fmt(mcWindow(now - 7*864e5, now).min)}<small>min</small></b><span>kondisjon 7 d</span></div>
      </div>
      ${vCalendar()}
    </section>`;
  const series = {};
  [...S.history].reverse().forEach(sess => sess.ex.forEach(e => {
    if (/BBB|FSL|T2|T3|Lett|Backoff|Deload|Sekundær|Taper/.test(e.tag || '')) return;
    const done = e.sets.filter(x => x.d > 0); if (!done.length) return;
    (series[e.lift] = series[e.lift] || []).push(Math.max(...done.map(x => x.w)));
  }));
  const rows = Object.entries(series).filter(([,v]) => v.length > 1);
  h += rows.length ? `<section class="box trend"><h3 style="margin:2px 0 0">Toppvekt per økt</h3>${rows.map(([l,v]) => { const d = v[v.length-1] - v[0];
      return `<div class="tr"><b>${liftName(l)}</b>${spark(v)}<span class="tr-kg">${fmt(v[v.length-1])}</span><span class="tr-d ${d > 0 ? 'ok-t' : d < 0 ? 'miss-t' : ''}">${d > 0 ? '+' : ''}${d ? fmt(d) : '±0'}</span></div>`; }).join('')}</section>`
                   : `<p class="muted small">Kurvene dukker opp når du har logget samme løft to ganger.</p>`;

  const list = ui.logF === 'mc' ? S.history.filter(x => x.metcon) : S.history;
  h += list.slice(0, 60).map(sess => {
    const wodH = sess.wod ? `<div class="sess-wod"><p><b>${esc(sess.wod.navn)}</b>${sess.wod.resultat ? ` · <span class="res">${esc(sess.wod.resultat)}</span>` : ''}</p>
      <details><summary>Vis økta</summary><pre class="wodtxt">${esc(sess.wod.tekst)}</pre></details></div>` : '';
    const mcH = sess.mc && MC[sess.mc.type] ? `<span class="pill">${MC[sess.mc.type].n} · ${fmt(sess.mc.min)} min${sess.mc.rpe ? ' · RPE ' + sess.mc.rpe : ''}</span>` : '';
    const ppH = sess.pete ? `<div class="sess-wod"><p><b>Pete Plan · ${esc(sess.pete.name)}</b> · ${PETE_MACH[sess.pete.mach] || ''}${sess.pete.split ? ` · <span class="res">${paceTxt(sess.pete.split, sess.pete.bike)}</span>` : ''}</p></div>` : '';
    const noteH = (sess.metcon || sess.note || sess.wod || sess.pete) ? `<div class="sess-note">${sess.metcon ? '<span class="pill mc">Metcon</span>' : ''}${mcH}${ppH}${wodH}${sess.note ? `<p>${esc(sess.note)}</p>` : ''}</div>` : '';
    const d = new Date(sess.date), open = !!(ui.logOpen && ui.logOpen[sess.date]);
    const dateBox = `<span class="sess-d"><b>${d.getDate()}</b><small>${d.toLocaleDateString('nb-NO', {month:'short'}).replace('.', '')}</small></span>`;
    if (sess.skipped) { const ps = prog(sess.programId);
      return `<article class="sess skipped"><div class="sess-row">${dateBox}
        <span class="sess-t"><b>${esc(sess.day)}</b><small>Hoppet over${ps ? ' · ' + ps.name : ''}</small></span></div></article>`; }
    const p = sess.free ? null : prog(sess.programId);
    const title = sess.free ? (sess.pete ? 'Pete Plan' : sess.wod ? 'Metcon' : 'Fri økt') : sess.day;
    // Én linje per økt: løftene med toppvekt, eller hva den frie økta var. Trykk for detaljer.
    const sum = sess.free ? (sess.pete ? esc(sess.pete.name) : sess.wod ? esc(sess.wod.navn) : sess.note ? esc(sess.note.slice(0, 60)) : '')
      : [...new Map(sess.ex.map(e => [e.lift, Math.max(...e.sets.map(x => x.w))])).entries()].map(([l, w]) => liftName(l) + ' ' + fmt(w)).join(' · ');
    const vol = sess.free ? 0 : sess.ex.reduce((s,e) => s + e.sets.reduce((v,x) => v + (x.d||0)*x.w, 0), 0);
    const body = !open ? '' : sess.free ? noteH : `<p class="muted small">${p ? p.name : ''} · ${sess.sub} · ${fmt(Math.round(vol))} kg totalt</p>
      ${sess.ex.map(e => {
        const ws = [...new Set(e.sets.map(x => x.w))];
        const reps = e.sets.map(x => x.d == null ? '–' : x.d);
        const right = ws.length === 1 ? reps.join(' ') + ' × ' + fmt(ws[0]) + ' kg' : e.sets.map(x => (x.d == null ? '–' : x.d) + '×' + fmt(x.w)).join(' · ');
        return `<div class="ln"><span>${liftName(e.lift)}${e.tag ? ' <span class="muted">'+e.tag+(e.rpe != null ? ' · RPE '+fmt(e.rpe) : '')+'</span>' : ''}</span><span>${right}</span></div>`;
      }).join('')}
      ${noteH}`;
    return `<article class="sess ${open ? 'open' : ''}">
      <button class="sess-row" data-a="logopen:${sess.date}" aria-expanded="${open}" aria-label="${dateFmt(sess.date)}: ${title}">
        ${dateBox}
        <span class="sess-t"><b>${title}</b>${sum ? `<small>${sum}</small>` : ''}</span>
        ${isMetcon(sess) && !sess.free ? '<span class="pill mc">Metcon</span>' : ''}${chev}
      </button>
      ${body}
    </article>`;
  }).join('');
  return h;
}

/* ---------- Pausetimer, skjerm-på, toast ---------- */
// Lyd når pausen er over (innstilling under Mer). Lyden må låses opp i et trykk, derfor skjer det i startRest.
let audio = null;
function unlockAudio(){
  if (!S.settings.sound) return;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch(e) {}
}
function beep(){
  if (!S.settings.sound || !audio) return;
  try {
    [0, .18].forEach((d, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + d;
      o.frequency.value = i ? 1180 : 880;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .18);
    });
  } catch(e) {}
}
function startRest(sec){
  sec = Math.round((sec || 120) * (S.settings.restScale || 1)); unlockAudio();
  ui.rest = {end: Date.now() + sec*1000, total: sec, done: false, next: nextUp()};
  updateRest();
}
// Neste sett i økta, til linjen nederst i pausen: oppvarming først, så arbeidssett i rekkefølge
function nextUp(){
  const s = S.draft; if (!s) return '';
  for (let ei = 0; ei < s.ex.length; ei++) {
    const e = s.ex[ei], n = liftName(e.lift), started = e.sets.some(x => x.d != null);
    const wk = !started && wuKind(s, ei), done = e.wuDone || [];
    const w = wk ? warmups(e.slot, e.sets[0].w, e.sets[0].t, wk).find(([w, r]) => !done.includes(w + 'x' + r)) : null;
    if (w) return n + ' · oppvarming ' + w[1] + ' × ' + fmt(w[0]) + ' kg';
    const si = e.sets.findIndex(x => x.d == null);
    // Løftets navn bare når du bytter øvelse, så linjen holder seg kort
    if (si > -1) { const x = e.sets[si]; return (si ? '' : n + ' · ') + 'sett ' + (si+1) + ' · ' + x.t + (x.am ? '+' : '') + ' × ' + fmt(x.w) + ' kg'; }
  }
  return 'Alle sett er gjort';
}
// Gult de siste 10 sekundene, eller den siste femdelen hvis pausen er kortere enn 50 sekunder
const restWarn = total => Math.min(10, total * .2);
const mmss = s => Math.floor(s/60) + ':' + String(Math.floor(s % 60)).padStart(2,'0');
function updateRest(){
  const el = $('#rest'), stage = document.querySelector('.stage');
  if (!ui.rest) { el.hidden = true; delete stage.dataset.rest; return; }
  const left = (ui.rest.end - Date.now()) / 1000;
  if (left < -600) { ui.rest = null; updateRest(); return; }   // gi opp etter 10 minutter overtid
  let lvl, state;
  if (left > 0) { lvl = left / ui.rest.total; state = left <= restWarn(ui.rest.total) ? 'warn' : 'run'; }
  else {
    if (!ui.rest.done) {   // pausen er over: ett grønt blink og eventuelt lyd
      ui.rest.done = true; beep();
      const f = $('#restFlash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    }
    lvl = 0; state = 'over';   // overtid vises som tekst i linjen, ikke som et eget fargelag
  }
  el.hidden = false;
  stage.dataset.rest = state;
  stage.style.setProperty('--lvl', (lvl * 100).toFixed(2) + '%');

/* ---------- Trene sammen: konto, venner og timer i Supabase ----------
   Bare dette ligger i skyen: brukernavn, venner, timer, påmeldinger og tidsforslag. Treningsloggen blir på telefonen.
   Konto er valgfritt. Innlogging skjer med e-post og passord rett i appen, uten e-postbekreftelse.
   «Glemt passord» sender en kode på e-post (via Brevo). Koden og nytt passord skrives inn rett i appen.
   Tilgangen styres av reglene i databasen: du ser bare timene til venner. Nøkkelen under er den offentlige. */
const SB_URL = 'https://ueqteavqpityrmuczkoc.supabase.co', SB_KEY = 'sb_publishable_PqNVw0QF3nfnLnYN9VrcNg_nhNcay9O';
const AUTH_KEY = 'stanga.auth';
const FIXED_LEN = 2 * 3600e3;   // en time med fast tid regnes som to timer lang
let auth = (() => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || null; } catch(e) { return null; } })();
function saveAuth(a){ auth = a; try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch(e) {} }
const setSession = d => saveAuth({access_token:d.access_token, refresh_token:d.refresh_token,
  expires_at: d.expires_at || Math.floor(Date.now()/1000) + d.expires_in, user:{id:d.user.id, email:d.user.email}});

async function sbFetch(path, opt = {}){
  const h = Object.assign({apikey: SB_KEY, 'Content-Type': 'application/json'}, opt.headers);
  if (opt.auth !== false && auth) { await freshToken(); if (auth) h.Authorization = 'Bearer ' + auth.access_token; }
  const res = await fetch(SB_URL + path, {method: opt.method || 'GET', headers: h, cache: 'no-store',
    body: opt.body === undefined ? undefined : JSON.stringify(opt.body)});
  const txt = await res.text(); let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch(e) {}
  if (!res.ok) {
    const err = new Error((data && (data.msg || data.message || data.error_description)) || res.statusText || 'Feil fra serveren');
    err.status = res.status; err.code = data && (data.code || data.error_code); throw err;
  }
  return data;
}
// Tilgangsnøkkelen varer en time. Den fornyes like før den går ut.
let refreshing = null;
function freshToken(){
  if (!auth || auth.expires_at - 60 > Date.now()/1000) return Promise.resolve();
  refreshing = refreshing || sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', auth:false, body:{refresh_token: auth.refresh_token}})
    .then(setSession, e => { if (e.status === 400 || e.status === 401) { saveAuth(null); sxReset(); } throw e; })
    .finally(() => refreshing = null);
  return refreshing;
}
const db = (table, q, opt) => sbFetch('/rest/v1/' + table + (q ? '?' + q : ''), opt);
const rpc = (fn, body) => sbFetch('/rest/v1/rpc/' + fn, {method:'POST', body});
const inList = ids => 'in.(' + [...new Set(ids)].join(',') + ')';
const uid = () => auth && auth.user.id;

const SX = {loaded:false, loading:null, at:0, me:null, fr:[], ppl:{}, sess:[], part:[], prop:[], seenAt:0, prev:0, err:''};
const jwtBody = t => { try { const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(atob(b + '='.repeat((4 - b.length % 4) % 4))); } catch(e) { return {}; } };
(function sxFromLink(){

})();

function sxReset(){ Object.assign(SX, {loaded:false, at:0, me:null, fr:[], ppl:{}, sess:[], part:[], prop:[], seenAt:0, prev:0, err:''}); ui.sxView = 'list'; sxBadge(); }

// Hent alt Sammen-fanen trenger: profilen din, venner, kommende timer, påmeldinger, forslag og navnene på de involverte
function sxLoad(){
  if (!auth) return Promise.resolve();
  if (SX.loading) return SX.loading;
  SX.loading = (async () => {
    try {
      const me = uid();
      const [prof, fr, seen] = await Promise.all([
        db('profiles', 'select=id,username,display_name&id=eq.' + me),
        db('friendships', 'select=*'),
        db('seen', 'select=last_seen_at')]);
      SX.me = prof[0] || null;
      if (SX.me) {
        if (!seen.length) await db('seen', '', {method:'POST', body:{user_id: me}});
        SX.seenAt = seen.length ? Date.parse(seen[0].last_seen_at) : Date.now();
        const now = Date.now(), iso = t => new Date(t).toISOString();
        const sess = await db('sessions', 'select=*&order=starts_at&or=' +
          encodeURIComponent(`(ends_at.gte.${iso(now)},and(ends_at.is.null,starts_at.gte.${iso(now - FIXED_LEN)}))`));
        const ids = sess.map(s => s.id);
        const [part, prop] = ids.length ? await Promise.all([
          db('participants', 'select=*&session_id=' + inList(ids)),
          db('proposals', 'select=*&order=proposed_at&session_id=' + inList(ids))]) : [[], []];
        const people = [...fr.map(f => f.requester), ...fr.map(f => f.addressee), ...sess.map(s => s.owner),
          ...part.map(p => p.user_id), ...prop.map(p => p.user_id)].filter(x => x !== me);
        const ppl = people.length ? await db('profiles', 'select=id,username,display_name&id=' + inList(people)) : [];
        SX.ppl = Object.fromEntries(ppl.map(p => [p.id, p])); SX.ppl[me] = SX.me;
        Object.assign(SX, {fr, sess, part, prop});
      }
      SX.loaded = true; SX.err = ''; SX.at = Date.now();
    } catch(e) {
      SX.err = sxErr(e);
    } finally {
      SX.loading = null; sxBadge();
      if (ui.tab === 'together' && !isTyping()) render();
    }
  })();
  return SX.loading;
}

function sxErr(e){
  if (!navigator.onLine || /fetch|network|load failed/i.test(e.message || '')) return 'Ingen kontakt med serveren. Sjekk nettet og prøv igjen.';
  if (e.code === '23505') return 'Det finnes allerede.';
  if (e.status === 401 || e.status === 403 || e.code === '42501') return 'Du har ikke tilgang til dette.';
  return e.message || 'Noe gikk galt.';
}

const pad = n => String(n).padStart(2, '0');
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d; };
const dayDiff = t => Math.round((dayStart(t) - dayStart(Date.now())) / 864e5);
function dayLabel(t){
  const n = dayDiff(t); if (n === 0) return 'I dag'; if (n === 1) return 'I morgen';
  const s = new Date(t).toLocaleDateString('nb-NO', {weekday:'long', day:'numeric', month:'short'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const sxEnd = s => s.ends_at ? Date.parse(s.ends_at) : Date.parse(s.starts_at) + FIXED_LEN;

function av(id, sm){

// Forespørsler du ikke har svart på, står alltid her til du har svart.
function sxNews(since){
  const me = uid(), at = x => Date.parse(x.created_at), out = [];
  const mine = new Map(SX.sess.filter(s => s.owner === me).map(s => [s.id, s]));
  const sub = s => 'Din time ' + dayLabel(s.starts_at).toLowerCase() + ', ' + sxTime(s);
  SX.fr.forEach(f => {
    if (f.addressee === me && f.status === 'pending') out.push({at: at(f), who: f.requester, txt: 'vil legge deg til', sub: 'Venneforespørsel'});
    if (f.requester === me && f.status === 'accepted' && f.accepted_at && Date.parse(f.accepted_at) > since) out.push({at: Date.parse(f.accepted_at), who: f.addressee, txt: 'godtok forespørselen din', sub: 'Dere er venner nå'});
  });
  SX.prop.forEach(p => { const s = mine.get(p.session_id); if (s && at(p) > since) out.push({at: at(p), who: p.user_id, txt: 'foreslår ' + hm(p.proposed_at), sub: sub(s), sid: s.id}); });
  SX.part.forEach(p => { const s = mine.get(p.session_id); if (s && p.user_id !== me && at(p) > since) out.push({at: at(p), who: p.user_id, txt: 'meldte seg på', sub: sub(s), sid: s.id}); });
  SX.sess.forEach(s => { if (s.owner !== me && !s.cancelled_at && at(s) > since && sxEnd(s) > Date.now())
    out.push({at: at(s), who: s.owner, txt: 'la ut en time', sub: dayLabel(s.starts_at) + ', ' + sxTime(s), sid: s.id}); });
  return out.sort((a, b) => b.at - a.at);
}

async function sxSave(){
  const f = ui.sxForm, d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + f.day);
  const at = v => { if (!/^\d{1,2}:\d{2}/.test(v || '')) return null; const [h, m] = v.split(':').map(Number); const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
  const start = at(f.from), end = f.kind === 'window' ? at(f.to) : null;
  if (!start) throw new Error('Velg et klokkeslett.');
  if (f.kind === 'window' && (!end || end <= start)) throw new Error('Slutten av vinduet må være etter starten.');
  if ((end || new Date(+start + FIXED_LEN)) <= new Date()) throw new Error('Tidspunktet har allerede vært.');
  if (f.wk === 'bank' && !f.ref) throw new Error('Velg en metcon fra øktbanken, eller velg et annet alternativ.');
  if (f.wk === 'text' && !f.text.trim()) throw new Error('Skriv hva dere skal kjøre.');
  const body = {kind: f.kind, starts_at: start.toISOString(), ends_at: end ? end.toISOString() : null, place: f.place.trim() || null,
    workout_kind: f.wk, workout_ref: f.wk === 'bank' ? f.ref : null, workout_text: f.wk === 'text' ? f.text.trim() : null};
  if (f.id) await db('sessions', 'id=eq.' + f.id, {method:'PATCH', body});

  S.settings.sxPlace = body.place || ''; save();
  ui.sxView = f.id ? 's:' + f.id : 'list'; ui.sxForm = null;
}

// Logg inn eller lag konto med e-post og passord. Uten e-postbekreftelse får du en innlogging med en gang.
async function sxAuth(kind){
  const email = (($('#sxE') || {}).value || '').trim(), pw = ($('#sxP') || {}).value || '';
  ui.sxEmail = email;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { ui.sxMsg = 'Skriv en gyldig e-postadresse.'; render(); return; }
  if (kind === 'signup' ? pw.length < 8 : !pw) { ui.sxMsg = kind === 'signup' ? 'Passordet må ha minst 8 tegn.' : 'Skriv passordet ditt.'; render(); return; }
  ui.sxBusy = true; ui.sxMsg = ''; render();
  try {
    const d = await sbFetch(kind === 'signup' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password', {method:'POST', auth:false, body:{email, password: pw}});
    if (!d || !d.access_token) throw new Error('Kontoen er laget, men kan ikke brukes ennå. Prøv å logge inn.');
    setSession(d); ui.sxMode = 'login'; ui.sxBusy = false;
    toast(kind === 'signup' ? 'Kontoen er laget' : 'Du er logget inn');
    await sxOpen();
  } catch(e) {
    ui.sxMsg = e.code === 'user_already_exists' || /already registered/i.test(e.message) ? 'Det finnes allerede en konto med denne e-posten. Logg inn i stedet.'
      : e.code === 'invalid_credentials' || (kind === 'login' && e.status === 400) ? 'Feil e-post eller passord.'
      : e.code === 'weak_password' ? 'Passordet er for svakt. Bruk minst 8 tegn og gjerne både bokstaver og tall.'
      : e.status === 429 ? 'For mange forsøk. Vent litt og prøv igjen.' : sxErr(e);
  }
  ui.sxBusy = false; render();
}

// Glemt passord: koden fra e-posten gir en innlogging, og så lagres det nye passordet med en gang
async function sxResetPw(){
  const token = (($('#sxC') || {}).value || '').replace(/\D/g, ''), pw = ($('#sxP') || {}).value || '';
  if (token.length < 6) { ui.sxMsg = 'Skriv inn koden fra e-posten.'; render(); return; }
  if (pw.length < 8) { ui.sxMsg = 'Passordet må ha minst 8 tegn.'; render(); return; }
  ui.sxBusy = true; ui.sxMsg = ''; render();
  try {
    setSession(await sbFetch('/auth/v1/verify', {method:'POST', auth:false, body:{type:'recovery', email: ui.sxEmail, token}}));
  } catch(e) {
    ui.sxMsg = e.status === 400 || e.status === 403 ? 'Koden stemmer ikke eller har gått ut. Prøv igjen, eller send en ny kode.' : sxErr(e);
    ui.sxBusy = false; render(); return;
  }
  try {
    await sbFetch('/auth/v1/user', {method:'PUT', body:{password: pw}});

    ui.sxView = 'newpw';   // innlogget med koden, men passordet ble ikke lagret: prøv igjen på siden for nytt passord

/* ---------- Handlinger ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
  const [a, ...r] = b.dataset.a.split(':');
  switch (a) {
    case 'tab': ui.tab = r[0]; ui.detail = null; ui.plan = null; ui.confirm = null; ui.free = false; ui.bank = false; ui.wod = null;
      if (r[0] === 'together') { ui.sxView = 'list'; sxOpen(); }
      render(); toTop(); break;
    case 'open': ui.detail = r[0]; render(); toTop(); break;
    case 'back': ui.detail = null; render(); break;
    case 'activate': activate(r[0]); break;
    case 'set': {
      const ex = S.draft.ex[+r[0]], x = ex.sets[+r[1]];
      if (x.am) x.d = x.d == null ? x.t : null;
      else x.d = x.d == null ? x.t : (x.d > 0 ? x.d - 1 : null);
      if (x.d != null) startRest(ex.rest);
      save(); render(); wake(); break;
    }
    case 'am': { const x = S.draft.ex[+r[0]].sets[+r[1]]; x.d = Math.max(0, Math.min(99, x.d + (+r[2]))); save(); render(); break; }
    case 'rpe': S.draft.ex[+r[0]].rpe = +r[1]; save(); render(); break;
    case 'q': S.draft.ex[+r[0]].q = r[1]; save(); render(); break;
    case 'w': { const e = S.draft.ex[+r[0]]; e.sets.forEach(x => x.w = Math.max(20, x.w + 2.5*(+r[1]))); save(); render(); break; }
    case 'wu': {
      const e = S.draft.ex[+r[0]], k = r[1]; e.wuDone = e.wuDone || [];
      const j = e.wuDone.indexOf(k);
      if (j > -1) e.wuDone.splice(j, 1); else { e.wuDone.push(k); startRest(r[2] === '1' ? REST.warmupLast : REST.warmup); }
      save(); render(); wake(); break;
    }
    case 'cut': { const e = S.draft.ex[+r[0]]; if (e.sets.length > 1 && e.sets[e.sets.length-1].d == null) { e.sets.pop(); e.cut = (e.cut||0) + 1; } save(); render(); break; }
    case 'doswap': doSwap(r[0]); break;
    case 'plan': ui.plan = {id: S.active.programId, active: true}; render(); toTop(); break;
    case 'planprev': { const pp = prog(r[0]); ui.plan = {id: pp.id, active: false, inst: newInstance(pp)}; render(); toTop(); break; }
    case 'planclose': ui.plan = null; render(); toTop(); break;
    case 'metcon': S.draft.metcon = !S.draft.metcon; save(); render(); break;
    case 'after': { const af = ui.after = ui.after || {}; af[r[0]] = !af[r[0]]; render(); if (af[r[0]] && r[0] === 'note') $('#note').focus(); break; }
    case 'mct': mcOf(r[0]).type = r[1]; if (r[0] === 'session') save(); render(); break;
    case 'mcr': mcOf(r[0]).rpe = +r[1]; if (r[0] === 'session') save(); render(); break;
    case 'keepdl': ui.keepDl = r[0]; render(); break;
    case 'skipdl':
      S.active.skipDl = Object.assign({}, S.active.skipDl, {[r[0]]: true});
      S.draft = null; save(); render(); toTop(); toast('Lett uke hoppet over. Du kjører én uke til.'); break;
    case 'guide': ui.detail = 'guide'; render(); toTop(); break;
    case 'free': ui.tab = 'today'; ui.free = true; ui.freeNote = ui.freeNote || ''; render(); toTop(); break;
    case 'freecancel': ui.free = false; render(); break;
    case 'freemc': ui.freeMc = ui.freeMc === false; render(); break;
    case 'freesave': {
      const note = (ui.freeNote || '').trim(), mc = ui.freeMc !== false, w = ui.freeWod;
      const pp = ui.freePete;
      if (!note && !w && !pp) { toast('Velg en metcon eller skriv kort hva du gjorde'); break; }
      S.history.unshift({date:Date.now(), free:true, day:'Fri økt', sub:'', ex:[], note, metcon: mc || !!w || !!pp, mc: mc || w || pp ? mcSaved(ui.freeMcData) : undefined,
        wod: w ? {id:w.id, navn:w.navn, tekst:w.tekst, resultat:(w.resultat||'').trim()} : undefined,
        pete: pp ? peteDone(pp) : undefined});
      ui.free = false; ui.freeNote = ''; ui.freeMc = true; ui.freeWod = null; ui.freePete = null; ui.freeMcData = null; ui.tab = 'log'; ui.logF = 'all';
      save(); render(); toTop(); toast('Fri økt lagret');
      break;
    }
    case 'logf': ui.logF = r[0]; render(); break;
    case 'logopen': { const o = ui.logOpen = ui.logOpen || {}; o[r[0]] = !o[r[0]]; render(); break; }
    case 'progf': ui.progF = r[0] || ''; render(); break;
    case 'bank': openBank(r[0]); break;
    case 'bankclose': ui.bank = false; ui.wod = null; render(); toTop(); break;
    case 'bankretry': loadBank(); render(); break;
    case 'bankmore': ui.bankN = (ui.bankN || 30) + 30; $('#bankList').innerHTML = bankListHTML(); break;
    case 'bfl': ui.bf.lag = r[0] || ''; ui.bankN = 30; render(); break;
    case 'bft': ui.bf[r[0]] = !ui.bf[r[0]]; ui.bankN = 30; render(); break;
    case 'wod': ui.wod = r[0]; ui.wodRand = false; render(); toTop(); break;
    case 'wodback': ui.wod = null; ui.wodRand = false; render(); break;
    case 'wodrand': showRandom(ui.randPool || {kind:'filter'}); break;
    case 'themes': ui.showThemes = !ui.showThemes; render(); break;
    case 'rand': {
      const rp = r[0] === 'theme' ? {kind:'theme', theme: r[1] === 'all' ? null : THEMES[+r[1]]} : {kind:r[0]};
      showRandom(rp); break;
    }
    case 'qr': {
      openBank(r[0]);
      if (BANK) showRandom({kind:'solo'}); else ui.pendingRand = {kind:'solo'};
      break;
    }
    case 'fav': {
      S.fav = S.fav || []; const k = S.fav.indexOf(r[0]);
      if (k > -1) S.fav.splice(k, 1); else S.fav.push(r[0]);
      save(); render(); break;
    }
    case 'wodpick': {
      const w = BANK.find(x => x.i === r[0]); if (!w) break;
      const pick = {id:w.i, navn:wodTitle(w), tekst:w.x, resultat:''};
      const guess = {type: mcGuess(w.x + ' ' + (w.n || '')), min: w.m || ''};   // forslag, kan endres
      if (ui.bankFor === 'sx' && ui.sxForm) { ui.sxForm.wk = 'bank'; ui.sxForm.ref = w.i; }
      else if (ui.bankFor === 'session' && S.draft) { S.draft.wod = pick; S.draft.metcon = true; S.draft.mc = Object.assign(guess, S.draft.mc && S.draft.mc.min ? S.draft.mc : {}); save(); }
      else { ui.free = true; ui.freeWod = pick; ui.freeMc = true; ui.freeMcData = Object.assign(guess, ui.freeMcData && ui.freeMcData.min ? ui.freeMcData : {}); }
      ui.bank = false; ui.wod = null; ui.wodRand = false; render(); toTop(); toast(ui.bankFor === 'sx' ? 'Metcon lagt til timen' : 'Metcon valgt');
      break;
    }
    case 'pp': {
      const set = S.settings.pete, [cmd, arg] = r;
      if (cmd === 'mach') set.mach = arg;
      else if (cmd === 'ver') set.ver = arg;
      else if (cmd === 'toggle') { set.on = !set.on; toast(set.on ? 'Pete Plan vises i økta' : 'Pete Plan er skjult'); }
      else if (cmd === 'pick') { petePick(arg); toast('Pete Plan valgt'); }
      else if (cmd === 'unit') { const pk = arg === 'session' ? S.draft && S.draft.pete : ui.freePete; if (pk) { pk.unit = r[2]; pk.split = ''; } }
      else if (cmd === 'rm') { if (arg === 'session' && S.draft) { delete S.draft.pete; S.draft.metcon = false; } else { ui.freePete = null; } }
      else if (cmd === 'reset') { S.pete = {idx:0, targets:S.pete.targets || {}, pb:S.pete.pb || {}}; ui.confirm = null; toast('Planen starter på økt 1. Målene dine er beholdt.'); }
      save(); render(); break;
    }
    case 'wodrm':
      if (r[0] === 'session' && S.draft) { delete S.draft.wod; save(); } else ui.freeWod = null;
      render(); break;
    case 'finish': ui.confirm = null; finish(); break;
    case 'skipday': if (S.active && S.draft) skipSession(); break;
    case 'dismiss': ui.summary = null; render(); break;
    case 'skip': ui.rest = null; updateRest(); break;
    case 'sxmode': ui.sxMode = r[0]; ui.sxMsg = ''; ui.sxForgotSent = false; render(); break;
    case 'sxlogin': sxAuth('login'); break;
    case 'sxsignup': sxAuth('signup'); break;
    case 'sxforgot': sxForgot(); break;
    case 'sxresetpw': sxResetPw(); break;
    case 'sxnewpw': sxNewPw(); break;
    case 'sxuser': sxUser(); break;
    case 'sxretry': sxOpen(); render(); break;
    case 'sxview': ui.sxView = r.join(':'); ui.confirm = null; ui.sxRes = null; ui.sxQ = ''; render(); toTop(); break;
    case 'sxopen': ui.sxView = 's:' + r[0]; ui.confirm = null; render(); toTop(); break;
    case 'sxnew': sxFormInit(); ui.sxView = 'form'; render(); toTop(); break;
    case 'sxedit': { const s0 = SX.sess.find(x => x.id === r[0]); if (s0) { sxFormInit(s0); ui.sxView = 'form'; render(); toTop(); } break; }
    case 'sxf': ui.sxForm[r[0]] = r[0] === 'day' ? +r[1] : r[1]; render(); break;
    case 'sxbank': openBank('sx'); break;
    case 'sxsave': if (ui.sxBusy) break; ui.sxBusy = true; ui.sxMsg = ''; render();
      sxSave().then(() => { toast(ui.sxView === 'list' ? 'Timen er lagt ut' : 'Endringene er lagret'); return sxLoad(); })
        .catch(e => { ui.sxMsg = e.status || e.code ? sxErr(e) : e.message; })
        .finally(() => { ui.sxBusy = false; render(); toTop(); });
      break;
    case 'sxjoin': sxDo(() => db('participants', '', {method:'POST', body:{session_id: r[0]}}), 'Du er med'); break;
    case 'sxleave': sxDo(() => db('participants', 'session_id=eq.' + r[0] + '&user_id=eq.' + uid(), {method:'DELETE'}), 'Du er meldt av'); break;
    case 'sxprop': {
      const s0 = SX.sess.find(x => x.id === r[0]), t = ($('#sxPT') || {}).value, c = (($('#sxPC') || {}).value || '').trim();
      if (!s0 || !/^\d{1,2}:\d{2}/.test(t || '')) { toast('Velg et tidspunkt'); break; }
      const d0 = new Date(s0.starts_at), [hh, mm] = t.split(':').map(Number); d0.setHours(hh, mm, 0, 0);
      if (d0 < new Date(s0.starts_at)) d0.setDate(d0.getDate() + 1);   // vinduet går over midnatt
      if (d0 < new Date(s0.starts_at) || d0 > new Date(s0.ends_at)) { toast('Velg en tid mellom ' + sxTime(s0).replace('–', ' og ')); break; }
      sxDo(() => db('proposals', '', {method:'POST', body:{session_id: s0.id, proposed_at: d0.toISOString(), comment: c || null}}), 'Forslaget er sendt');
      break;
    }
    case 'sxunprop': sxDo(() => db('proposals', 'session_id=eq.' + r[0] + '&user_id=eq.' + uid(), {method:'DELETE'}), 'Forslaget er trukket'); break;
    case 'sxpick': sxDo(() => rpc('pick_proposal', {pid: r[0]}), 'Tidspunktet er valgt'); break;
    case 'sxcancel': sxDo(() => db('sessions', 'id=eq.' + r[0], {method:'PATCH', body:{cancelled_at: new Date().toISOString()}}), 'Timen er avlyst'); break;
    case 'sxdel': ui.sxView = 'list'; sxDo(() => db('sessions', 'id=eq.' + r[0], {method:'DELETE'}), 'Timen er slettet'); break;
    case 'sxadd': sxDo(() => db('friendships', '', {method:'POST', body:{addressee: r[0]}}), 'Forespørselen er sendt').then(() => { const el = $('#sxRes'); if (el) el.innerHTML = sxResHTML(); }); break;
    case 'sxaccept': sxDo(() => db('friendships', 'requester=eq.' + r[0] + '&addressee=eq.' + uid(), {method:'PATCH', body:{status:'accepted', accepted_at: new Date().toISOString()}}), 'Dere er venner nå'); break;
    case 'sxdecline': { const me = uid();
      sxDo(() => db('friendships', 'or=' + encodeURIComponent(`(and(requester.eq.${me},addressee.eq.${r[0]}),and(requester.eq.${r[0]},addressee.eq.${me}))`), {method:'DELETE'}));
      break; }
    case 'sxlogout': {
      const tok = auth && auth.access_token;
      if (tok) fetch(SB_URL + '/auth/v1/logout', {method:'POST', headers:{apikey: SB_KEY, Authorization: 'Bearer ' + tok}}).catch(() => {});
      saveAuth(null); sxReset(); ui.confirm = null; render(); toast('Du er logget ut'); break;
    }
    case 'sxdelacc': sxDo(async () => { await rpc('delete_account'); saveAuth(null); sxReset(); }, 'Kontoen er slettet'); break;
    case 'restadd': if (ui.rest) { const now = Date.now(); ui.rest.end = Math.max(ui.rest.end, now) + (+r[0])*1000; ui.rest.total = Math.max(ui.rest.total, (ui.rest.end - now)/1000); ui.rest.done = false; updateRest(); } break;
    case 'exopen': { const o = ui.exOpen = ui.exOpen || {}; o[r[0]] = !o[r[0]]; render(); break; }
    case 'restscale': S.settings.restScale = +r[0]; save(); render(); break;
    case 'sound': S.settings.sound = !S.settings.sound; save(); unlockAudio(); render(); if (S.settings.sound) { beep(); toast('Lyd er på'); } break;
    case 'confirm': ui.confirm = r.join(':'); render(); break;
    case 'cancel': ui.confirm = null; render(); break;
    case 'quit': S.active = null; S.draft = null; ui.summary = null; ui.confirm = null; save(); render(); toast('Programmet er avsluttet'); break;
    case 'reset': S = fresh(); mergeCustom(); ui.summary = null; ui.confirm = null; ui.exportText = ''; save(); ui.tab = 'programs'; render(); toast('Alle data er slettet'); break;
    case 'export': ui.exportText = JSON.stringify(S); render(); break;
    case 'copy': {
      const ta = $('#exportBox');
      const fallback = () => { ta.focus(); ta.select(); toast('Teksten er merket. Kopier den manuelt.'); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast('Kopiert'), fallback); } catch(e) { fallback(); }
      break;
    }
    case 'import': {
      try {
        const o = JSON.parse($('#importBox').value);
        if (!o || !Array.isArray(o.history)) throw 0;
        S = Object.assign(fresh(), o); mergeCustom(); save(); render(); toast(o.history.length + ' økter importert');
      } catch(e) { toast('Teksten ble ikke gjenkjent som en Stanga-eksport'); }
      break;
    }
  }
});

// Sammen: skjemafeltene for ny time lagres mens du skriver, så de overlever at skjermen tegnes på nytt
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.sxf && ui.sxForm && t.type !== 'radio') ui.sxForm[t.dataset.sxf] = t.value;
  if (t.id === 'sxQ') { ui.sxQ = t.value; sxSearch(t.value); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.sxf === 'wk' && ui.sxForm) { ui.sxForm.wk = t.value; render(); }
});

/* iOS gir av og til hjemskjerm-appen et vindu som slutter over skjermkanten.
   Da måler vi avstanden og strekker app-skallet ned til kanten. */
const isTyping = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
function fitViewport(){
  if (isTyping()) return;          // tastaturet er oppe: ikke mål nå
  try {
    const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    const portrait = innerHeight > innerWidth;
    const gap = Math.round(screen.height - innerHeight);
    const fix = standalone && portrait && gap > 0 && gap < 140 ? gap : 0;
    document.querySelector('.app').style.bottom = fix ? (-fix) + 'px' : '';
    ui.gapFix = fix;
  } catch(e) {}
}
let fitT;
function scheduleFit(ms){
  clearTimeout(fitT);
  fitT = setTimeout(() => { if (isTyping()) return; scrollTo(0, 0); fitViewport(); }, ms || 250);
}
fitViewport();
addEventListener('resize', () => scheduleFit());
if (window.visualViewport) visualViewport.addEventListener('resize', () => scheduleFit());
addEventListener('orientationchange', () => scheduleFit(400));
document.addEventListener('focusout', () => scheduleFit(350));   // tastaturet lukkes

document.addEventListener('input', ev => {
  if (ev.target.id === 'note' && S.draft) { S.draft.note = ev.target.value; save(); }
  else if (ev.target.dataset && ev.target.dataset.ppsplit) {
    const ctx = ev.target.dataset.ppsplit, pk = ctx === 'session' ? S.draft && S.draft.pete : ui.freePete;
    if (pk) { pk.split = ev.target.value; if (ctx === 'session') save(); }
  }
  else if (ev.target.dataset && ev.target.dataset.mcmin) {
    const ctx = ev.target.dataset.mcmin; if (ctx === 'session' && !S.draft) return;
    mcOf(ctx).min = ev.target.value.replace(/[^\d]/g, '').slice(0, 3); if (ctx === 'session') save();
  }
  else if (ev.target.id === 'freeNote') ui.freeNote = ev.target.value;
  else if (ev.target.dataset && ev.target.dataset.orm && ui.detail) {
    const p = prog(ui.detail), l = ev.target.dataset.orm, orm = parseFloat(String(ev.target.value).replace(',', '.'));
    if (!(orm > 0) || !p.derive) return;
    document.querySelectorAll('[data-key]').forEach(inp => {
      const k = inp.dataset.key; if (k.split('.')[0] !== l || inp.dataset.edited) return;
      const v = p.derive(k, orm); if (v != null) inp.value = fmt(v);
    });
  }
  else if (ev.target.dataset && ev.target.dataset.key) ev.target.dataset.edited = '1';
  else if (ev.target.id === 'wodRes') {
    if (ev.target.dataset.ctx === 'session' && S.draft && S.draft.wod) { S.draft.wod.resultat = ev.target.value; save(); }
    else if (ui.freeWod) ui.freeWod.resultat = ev.target.value;
  }
  else if (ev.target.id === 'bq') {
    clearTimeout(ui.bqT);
    ui.bqT = setTimeout(() => { ui.bf.q = ev.target.value; ui.bankN = 30; const el = $('#bankList'); if (el) el.innerHTML = bankListHTML(); }, 150);
  }
});

document.addEventListener('change', ev => {
  if (ev.target.dataset && ev.target.dataset.max) {
    const v = parseFloat(String(ev.target.value).replace(',', '.'));
    if (v > 0) { S.maxes[ev.target.dataset.max] = v; save(); toast('Lagret'); } else { ev.target.value = fmt(S.maxes[ev.target.dataset.max]); }
    return;
  }
  if (ev.target.dataset && ev.target.dataset.ppref) {
    const sec = parseSplit(ev.target.value), m = ev.target.dataset.ppref;
    if (sec && sec > 60) { S.settings.pete.ref[m] = sec; S.settings.pete.refAt = Object.assign({}, S.settings.pete.refAt, {[m]: Date.now()}); save(); render(); toast('Testet tid lagret. Den brukes til nyere økter gir et nytt anslag.'); }
    else if (ev.target.value.trim()) toast('Skriv tiden som minutter:sekunder, f.eks. 7:20');
    return;
  }
  if (ev.target.dataset && ev.target.dataset.bf) { ui.bf[ev.target.dataset.bf] = ev.target.value; ui.bankN = 30; render(); return; }
  const s = ev.target.closest('[data-swap]'); if (!s) return;
  ui.swapSel = {slot: s.dataset.swap, lift: s.value}; render();
});

render();

/* ---------- PWA: offline og varig lagring (virker når siden ligger på din egen nettadresse) ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // updateViaCache:'none': sjekk alltid sw.js direkte mot GitHub, ikke mot nettleserens lager
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {});
}

/* ---------- Ny versjon uten å skrive versjon i adressen ----------
   Når appen åpnes, hentes den alltid fra nettet (se sw.js). Men iPhone vekker ofte appen fra
   bakgrunnen uten å laste den på nytt. Derfor sjekker vi APP_VERSION på GitHub når appen kommer
   i forgrunnen, høyst én gang i minuttet. Er den høyere, laster appen seg selv på nytt.
   Det er trygt: alt du trykker eller skriver, lagres med en gang. Holder du på å skrive, venter vi. */
let lastCheck = 0, newVersion = 0;
async function checkUpdate(){
  if (location.protocol !== 'https:' || !navigator.onLine || Date.now() - lastCheck < 60e3) return;
  lastCheck = Date.now();
  try {
    const res = await fetch('./index.html', {cache:'no-cache'});
    if (!res.ok) return;
    const m = (await res.text()).match(/APP_VERSION = (\d+)/);
    if (m && +m[1] > APP_VERSION) { newVersion = +m[1]; reloadWhenIdle(); }
  } catch(e) {}
}
function reloadWhenIdle(){
  if (!newVersion || isTyping()) return;   // prøv igjen når tastaturet lukkes
  try { sessionStorage.setItem(KEY + '.from', String(APP_VERSION)); } catch(e) {}
  location.reload();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
// Sammen: hent nytt når appen åpnes og våkner (høyst hvert minutt), så tallet i fanen stemmer
if (auth) setTimeout(() => { sxLoad(); }, 400);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && auth && Date.now() - SX.at > 60000) { if (ui.tab === 'together') sxOpen(); else sxLoad(); } });
addEventListener('pageshow', e => { if (e.persisted) checkUpdate(); });
addEventListener('online', checkUpdate);
document.addEventListener('focusout', () => setTimeout(reloadWhenIdle, 400));
// Etter en oppdatering: si fra én gang
try {
  const from = +sessionStorage.getItem(KEY + '.from');
  sessionStorage.removeItem(KEY + '.from');
  if (from && from < APP_VERSION) setTimeout(() => toast('Stanga er oppdatert til versjon ' + APP_VERSION), 500);
} catch(e) {}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
